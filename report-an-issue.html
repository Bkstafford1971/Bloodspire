<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report an Issue - Bloodspire</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; max-width: 600px; margin: 40px auto; padding: 0 20px; background-color: #000; color: #d1d1d1; }
        h2 { font-family: 'Cinzel', serif; color: #a31616; text-transform: uppercase; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; color: #d4af37; }
        input, select, textarea { 
            padding: 10px; 
            background: #1a1a1a; 
            border: 1px solid #333; 
            color: #fff; 
            border-radius: 4px; 
        }
        .button { 
            background-color: #a31616; 
            color: white; 
            padding: 12px 20px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            border: none;
            text-transform: uppercase;
        }
        .button:hover { background-color: #d11a1a; }
        .note { font-style: italic; font-size: 0.85rem; color: #b0b0b0; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>Report an Issue</h2>
    <p class="note">Help improve Bloodspire. Your report will be reviewed, and updates will be posted in the Announcements section on the main page.</p>

    <!-- REPLACE THE URL BELOW WITH YOUR FORMSPREE ENDPOINT -->
    <form action="https://formspree.io/f/mrejqnqq" method="POST">
        
        <div class="form-group">
            <label>Manager Name</label>
            <input type="text" name="Manager Name" required>
        </div>

        <div class="form-group">
            <label>Team Name</label>
            <input type="text" name="Team Name" required>
        </div>

        <div class="form-group">
            <label>Warrior Name(s)</label>
            <input type="text" name="Warrior Names" required>
        </div>

        <div class="form-group">
            <label>Turn #</label>
            <input type="text" name="Turn Number" required>
        </div>

        <div class="form-group">
            <label>Submission Type</label>
            <select name="Submission Type" required>
                <option value="Bug">Bug</option>
                <option value="Feature Request">Feature Request</option>
            </select>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="Description" rows="4" placeholder="Describe what happened..." required></textarea>
        </div>

        <div class="form-group">
            <label>Expected Behavior</label>
            <textarea name="Expected Behavior" rows="3" placeholder="What should have happened?"></textarea>
        </div>

        <div class="form-group">
            <label>Screenshot or File Link</label>
            <input type="url" name="File Link" placeholder="Paste a link to your screenshot (e.g. Imgur)">
            <p style="font-size: 0.75rem; color: #888;">Note: Upload your image to a service like Imgur and paste the link here.</p>
        </div>

        <button type="submit" class="button">Submit Report</button>
    </form>

    <p style="margin-top: 30px;"><small><a href="index.html" style="color: #d4af37;">← Return to the Arena</a></small></p>

</body>
</html>
