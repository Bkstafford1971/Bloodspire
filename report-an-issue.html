<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report an Issue - Bloodspire</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .button { background-color: #2da44e; color: white; padding: 12px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block; }
        .button:hover { background-color: #2c974b; }
        .note { background-color: #f6f8fa; border-left: 5px solid #007bff; padding: 15px; margin: 20px 0; }
    </style>
</head>
<body>
    <h2>Report an Issue</h2>
    <p>Help improve the simulation by reporting bugs or suggesting features. No account is required.</p>

    <!-- UPDATE THE ACTION URL WITH YOUR FORMSPREE ENDPOINT -->
    <form action="https://formspree.io/f/YOUR_UNIQUE_ID" method="POST" style="display: flex; flex-direction: column; gap: 15px; max-width: 500px;">
        
        <label>Manager Name:
            <input type="text" name="manager_name" required style="width: 100%;">
        </label>

        <label>Team Name:
            <input type="text" name="team_name" required style="width: 100%;">
        </label>

        <label>Warrior Name(s):
            <input type="text" name="warrior_names" required style="width: 100%;">
        </label>

        <label>Turn #:
            <input type="number" name="turn_number" required style="width: 100%;">
        </label>

        <label>Submission Type:
            <select name="type" required style="width: 100%;">
                <option value="Bug">Bug</option>
                <option value="Feature Request">Feature Request</option>
            </select>
        </label>

        <label>Description:
            <textarea name="description" rows="4" required style="width: 100%;"></textarea>
        </label>

        <label>Expected Behavior:
            <textarea name="expected_behavior" rows="3" style="width: 100%;"></textarea>
        </label>

        <label>Link to Screenshot/File (Optional):
            <input type="url" name="file_link" placeholder="Paste a link to your screenshot" style="width: 100%;">
            <small>Note: Free form handlers usually require a link rather than a direct upload.</small>
        </label>

        <button type="submit" class="button">Submit Report</button>
    </form>

    <p><small><a href="index.html">← Return to the Game</a></small></p>
</body>
</html>
