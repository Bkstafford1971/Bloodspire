      if (!turns.length && S.newsletters === null) {
        body = '<div style="padding:20px; color:var(--text-dim);">Loading newsletters...</div>';
      } else if (!turns.length) {
        body = `<div style="padding:4px 8px; background:var(--bg); border-bottom:1px solid var(--mid); display:flex; align-items:center; gap:8px; flex-wrap:wrap;">${arenaSelect}</div>
          <div style="padding:20px; color:var(--text-dim);">No newsletters available yet.</div>`;
      } else {
        // Background refresh
        API.get('/api/newsletters').then(r => {
          const fresh = r.turns || [];
          const prev  = S.newsletters || [];
          const changed = fresh.length !== prev.length || fresh.some((t,i) => t !== prev[i]);
          if (!changed) return;
          const prevLatest = prev.length ? prev[prev.length - 1] : null;
          const latest     = fresh.length ? fresh[fresh.length - 1] : null;
          S.newsletters = fresh;
          if (latest && prevLatest !== null && latest > prevLatest) {
            S.newsletterTurn = latest; S.newsletterText = null; loadNewsletterTurn(latest);
          } else { refreshContent(); }
        });
        const opts = turns.map(t =>
          `<option value="${t}" ${t===cur?'selected':''}>Turn ${t}</option>`).join('');
        body = `
<div style="display:flex; flex-direction:column; height:100%;">
  <div style="padding:4px 8px; background:var(--bg); border-bottom:1px solid var(--mid);
              display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
    ${arenaSelect}
    <b class="label-turn" style="font-size:11px;">Turn:</b>
    <select onchange="loadNewsletterTurn(parseInt(this.value))" style="font-size:11px;">${opts}</select>
  </div>
  <div style="flex:1; overflow:auto;">
    ${text !== null
      ? `<pre class="nl-page" style="font-family:'Courier New',monospace; font-size:11px; line-height:1.5;
             white-space:pre-wrap; margin:0; padding:8px;"
         >${renderNewsletterText(text)}</pre>`
      : '<div style="padding:20px; color:var(--text-dim);">Loading...</div>'}
  </div>
</div>`;
      }
    } else {
      // Immortal arena newsletter: fetch from server
      const iturns = S.newsletterImmortalTurns;
      const itext  = S.newsletterText;
      const icur   = S.newsletterTurn;
      if (iturns === null) {
        // Kick off load
        loadImmortalNewsletterTurns(nlArena);
        body = `<div style="padding:4px 8px; background:var(--bg); border-bottom:1px solid var(--mid); display:flex; align-items:center; gap:8px;">${arenaSelect}</div>
          <div style="padding:20px; color:var(--text-dim);">Loading ${arenaNames[nlArena]} turns...</div>`;
      } else if (!iturns.length) {
        body = `<div style="padding:4px 8px; background:var(--bg); border-bottom:1px solid var(--mid); display:flex; align-items:center; gap:8px;">${arenaSelect}</div>
          <div style="padding:20px; color:var(--text-dim);">No turns have been run in the ${arenaNames[nlArena]} yet.</div>`;
      } else {
        const opts = iturns.map(t =>
          `<option value="${t}" ${t===icur?'selected':''}>Turn ${t}</option>`).join('');
        body = `
<div style="display:flex; flex-direction:column; height:100%;">
  <div style="padding:4px 8px; background:var(--bg); border-bottom:1px solid var(--mid);
              display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
    ${arenaSelect}
    <b class="label-turn" style="font-size:11px;">Turn:</b>
    <select onchange="loadImmortalNewsletterTurn('${nlArena}', parseInt(this.value))"
            style="font-size:11px;">${opts}</select>
  </div>
  <div style="flex:1; overflow:auto;">
    ${itext !== null
      ? `<pre class="nl-page" style="font-family:'Courier New',monospace; font-size:11px; line-height:1.5;
             white-space:pre-wrap; margin:0; padding:8px;"
         >${renderNewsletterText(itext)}</pre>`
      : '<div style="padding:20px; color:var(--text-dim);">Loading...</div>'}
  </div>
</div>`;
      }
    }
  }

  else if (activeTab === 'scouting') {
    body = buildScoutingTab();
  }

  else if (activeTab === 'legacy') {
    body = buildLegacyTab();
  }

  else if (activeTab === 'data_facts') {
    body = buildDataFactsTab();
  }

  else if (activeTab === 'new_team') {
    body = `<div style="padding:12px;">
      <p style="color:var(--text-dim); font-size:11px;">Use <b>Action → New Team</b> to create a team.</p>
      <button onclick="initCreateTeam()">+ New Team</button>
    </div>`;
  }

  return tabHtml + `<div class="tab-body" style="overflow:auto;">${body}</div>`;
}

function setMgrTab(tab) {
  S.mgrTab = tab;
  if (tab === 'scouting' && !S.scout.loaded) {
    loadScoutStatus();
  }
  if (tab === 'account' && S.league.managerId) {
    checkLeagueReset();
    loadLeagueSettings(); // Refresh league settings including last upload timestamp
  }
  if (tab === 'account' && S.legacyTeams === null) {
    _loadLegacyTeams().then(() => { if (S.mgrTab === 'account') refreshContent(); });
  }
  if (tab === 'newsletters') {
    // Always reset to Regular Arena so immortal newsletters never render half-loaded by default.
    S.newsletterArena = 'normal';
    S.newsletterImmortalTurns = null;
    S.newsletterTurn = null;
    S.newsletterText = null;
    // Ensure newsletter content is loaded when the tab is activated
    _ensureNewsletterContentLoadedForMgrTab().then(() => {
      if (S.mgrTab === 'newsletters') refreshContent(); // Re-render if still on this tab
    });
  }
  if (tab === 'legacy') {
    S.legacyTeams = null; // force reload each time the tab is opened
    _loadLegacyTeams().then(() => { if (S.mgrTab === 'legacy') refreshContent(); });
  }
  if (tab === 'data_facts') {
    S.dataFactsLoading = true;
    refreshContent();
    _loadManagerRecord().then(() => {
      S.dataFactsLoading = false;
      if (S.mgrTab === 'data_facts') refreshContent();
    }).catch(err => {
      console.error('Error loading manager record:', err);
      S.dataFactsLoading = false;
      S.managerRecord = { error: err.message };
      if (S.mgrTab === 'data_facts') refreshContent();
    });
  }
  refreshContent();
}

/* ============================================================
   LEGACY TAB
   ============================================================ */
async function _loadLegacyTeams() {
  const ids = await Store.listArchivedTeamIds();
  const teams = [];
  for (const tid of ids.slice().reverse()) { // newest (highest id) first
    const team = await Store.readArchivedTeam(tid);
    if (team) teams.push(team);
  }
  S.legacyTeams = teams;
}

function buildLegacyTab() {
  if (S.legacyTeams === null) {
    return '<div style="padding:20px; color:var(--text-dim);">Loading legacy teams...</div>';
  }
  if (!S.legacyTeams.length) {
    return `<div style="padding:12px; color:var(--text-dim);">
      <b>Legacy</b><br><br>No teams have been replaced yet.
    </div>`;
  }

  function warriorCard(w) {
    const rec  = `${w.wins||0}-${w.losses||0}-${w.kills||0}`;
    const inj  = formatInjuriesText(w.injuries).join('<br>') || '-';
    const skls = formatSkillsText(w.skills).join('<br>') || '-';
    const isDead      = w.is_dead;
    const isAscended  = w.ascended_to_monster;
    const label = isDead
      ? `<span style="color:var(--text-err);">✝ ${esc(w.name)}</span>`
      : isAscended
        ? `<span style="color:var(--b-asc);">👹 ${esc(w.name)}</span>`
        : `<span style="color:var(--text-dim);">⚔ ${esc(w.name)}</span>`;
    const statusLine = isDead
      ? `Slain by: <b>${esc(w.archived_killed_by||w.killed_by||'Unknown')}</b>`
      : isAscended
        ? `<b>Ascended to Monsterdom</b>`
        : `<b>Replaced</b>`;
    return `
<div class="group" style="margin:6px 4px; background:var(--row-alt-bg);">
  <span class="group-label">${label}</span>
  <div style="display:flex; gap:20px; font-size:11px; flex-wrap:wrap; padding-top:4px;">
    <div>
      <div style="color:var(--text-dim); margin-bottom:3px;">
        ${esc(w.race||'')} ${esc(w.gender||'')} &mdash; ${rec} (${w.total_fights||0} fights)<br>
        ${statusLine}
      </div>
      <table style="border-collapse:collapse; font-size:11px;">
        ${['strength','dexterity','constitution','intelligence','presence','size'].map(attr => {
          const deathVal = w[attr] != null ? w[attr] : '-';
          const baseVal  = (w.initial_stats && w.initial_stats[attr] != null) ? ` (${w.initial_stats[attr]})` : '';
          return `<tr><td style="padding:1px 6px; color:var(--text-dim); width:90px;">${capitalize(attr)}</td>
               <td style="padding:1px 6px; font-weight:bold;">${deathVal}${baseVal}</td></tr>`;
        }).join('')}
      </table>
    </div>
    <div>
      <div style="color:var(--text-dim); font-weight:bold; margin-bottom:3px;">Skills</div>
      <div style="color:var(--text); line-height:1.5;">${skls}</div>
    </div>
    <div>
      <div style="color:var(--text-dim); font-weight:bold; margin-bottom:3px;">Permanent Injuries</div>
      <div style="color:var(--text-err); line-height:1.5;">${inj}</div>
    </div>
  </div>
</div>`;
  }

  let sections = '';
  S.legacyTeams.forEach(team => {
    let tw=0, tl=0, tk=0;
    const allWarriors = [...(team.warriors||[]), ...(team.archived_warriors||[])].filter(Boolean);
    allWarriors.forEach(w => { tw+=w.wins||0; tl+=w.losses||0; tk+=w.kills||0; });

    // archived_warriors (fallen before dissolution) then warriors (active at dissolution)
    const fallen   = (team.archived_warriors||[]).filter(Boolean).slice().reverse();
    const atDeath  = (team.warriors||[]).filter(Boolean);
    const warriors = [...atDeath, ...fallen];

    let warriorCards = warriors.map(w => warriorCard(w)).join('');
    if (!warriorCards) warriorCards = '<div style="padding:6px; color:var(--text-faint);">No warrior records.</div>';

    sections += `
<div style="margin-bottom:12px;">
  <div style="font-weight:bold; font-size:12px; padding:4px 6px; background:var(--bg); color:var(--text); border:1px solid var(--mid); margin-bottom:2px;">
    ${esc(team.team_name)} &mdash; Career: ${tw}-${tl}-${tk}
  </div>
  ${warriorCards}
</div>`;
  });

  return `<div style="padding:6px;">
    <div style="font-weight:bold; margin-bottom:8px;">Legacy - Replaced Teams</div>
    ${sections}
  </div>`;
}

/* ============================================================
   DATA FACTS TAB
   ============================================================ */
async function _loadManagerRecord() {
  const acc = S.account || {};
  const managerName = acc.manager_name;

  if (!managerName) {
    S.managerRecord = { error: 'No manager name found' };
    return Promise.resolve();
  }

  if (!window.electronAPI || !window.electronAPI.getManagerRecord) {
    S.managerRecord = { error: 'Electron API not available. Please run this from the Bloodspire client.' };
    return Promise.resolve();
  }

  try {
    console.log('Fetching manager record for:', managerName);
    const result = await window.electronAPI.getManagerRecord(managerName);
    console.log('Got manager record:', result);
    S.managerRecord = result;
  } catch (err) {
    console.error('Error loading manager record:', err);
    S.managerRecord = { error: err.message };
  }
}

function buildDataFactsTab() {
  const acc = S.account || {};
  const managerName = acc.manager_name;
  const record = S.managerRecord || {};

  if (S.dataFactsLoading) {
    return '<div style="padding:20px; color:var(--text-dim);">Loading manager record...</div>';
  }

  if (record.error) {
    return `<div style="padding:20px;">
      <button onclick="refreshDataFacts()" style="margin-bottom:12px;">🔄 Retry</button>
      <div style="color:var(--text-err); font-size:12px;">Error: ${esc(record.error)}</div>
    </div>`;
  }

  if (!record.success) {
    return `<div style="padding:20px;">
      <button onclick="refreshDataFacts()" style="margin-bottom:12px;">🔄 Retry</button>
      <div style="color:var(--text-dim); font-size:12px;">Failed to load manager record.</div>
    </div>`;
  }

  const records = record.records || [];
  const raceRecords = record.race_records || [];
  const totals = record.totals || {};

  if (!S.expandedDataFactsSections) S.expandedDataFactsSections = {};

  let html = '<div style="padding:12px;">';
  html += '<div style="margin-bottom:12px;"><button onclick="refreshDataFacts()" style="padding:4px 12px;">🔄 Update Stats</button></div>';

  // Manager Records Section (Collapsible)
  const managerExpanded = S.expandedDataFactsSections.managers === true;
  html += '<div style="margin-bottom:20px; border:1px solid var(--mid); border-radius:3px; background:var(--input-bg);">';
  html += '<div style="padding:8px; cursor:pointer; background:var(--row-alt-bg); border-radius:3px 3px 0 0; display:flex; justify-content:space-between;"';
  html += ' onclick="toggleDataFactsSection(\'managers\')">';
  html += '<span style="font-weight:bold; font-size:11px; color:var(--text);">' + (managerExpanded ? '▼' : '▶') + ' ' + esc(managerName) + ' -- Record vs Manager</span>';
  html += '</div>';

  if (managerExpanded) {
    html += '<div style="padding:12px;"><table style="border-collapse:collapse; width:100%; font-size:11px;"><thead>';
    html += '<tr style="background:var(--row-alt-bg); border-bottom:1px solid var(--mid);"><th style="text-align:left; padding:4px 8px; width:35%; color:var(--text);">Opponent Manager</th>';
    html += '<th style="text-align:center; padding:4px 8px; width:12%; color:var(--text);">W</th><th style="text-align:center; padding:4px 8px; width:3%; color:var(--text);">-</th>';
    html += '<th style="text-align:center; padding:4px 8px; width:12%; color:var(--text);">L</th><th style="text-align:center; padding:4px 8px; width:3%; color:var(--text);">-</th>';
    html += '<th style="text-align:center; padding:4px 8px; width:12%; color:var(--text);">K</th><th style="text-align:center; padding:4px 8px; width:15%; color:var(--text);">Deaths</th></tr></thead><tbody>';

    for (const r of records) {
      html += '<tr style="border-bottom:1px solid var(--mid);"><td style="padding:4px 8px; color:var(--text);">' + esc(r.opponent) + '</td>';
      html += '<td style="text-align:center; padding:4px 8px; color:var(--text);">' + r.wins + '</td><td style="text-align:center; padding:4px 8px; color:var(--text);">-</td>';
      html += '<td style="text-align:center; padding:4px 8px; color:var(--text);">' + r.losses + '</td><td style="text-align:center; padding:4px 8px; color:var(--text);">-</td>';
      html += '<td style="text-align:center; padding:4px 8px; color:var(--text);">' + r.kills + '</td><td style="text-align:center; padding:4px 8px; color:var(--text);">' + r.deaths + '</td></tr>';
    }

    html += '<tr style="background:var(--row-alt-bg); border:1px solid var(--mid); font-weight:bold;"><td style="padding:4px 8px; color:var(--text);">TOTAL</td>';
    html += '<td style="text-align:center; padding:4px 8px; color:var(--text);">' + (totals.wins || 0) + '</td><td style="text-align:center; padding:4px 8px; color:var(--text);">-</td>';
    html += '<td style="text-align:center; padding:4px 8px; color:var(--text);">' + (totals.losses || 0) + '</td><td style="text-align:center; padding:4px 8px; color:var(--text);">-</td>';
    html += '<td style="text-align:center; padding:4px 8px; color:var(--text);">' + (totals.kills || 0) + '</td><td style="text-align:center; padding:4px 8px; color:var(--text);">' + (totals.deaths || 0) + '</td></tr>';
    html += '</tbody></table></div>';
  }
  html += '</div>';

  // Race Records Section (Collapsible)
  const racesExpanded = S.expandedDataFactsSections.races === true;
  html += '<div style="margin-bottom:20px; border:1px solid var(--mid); border-radius:3px; background:var(--input-bg);">';
  html += '<div style="padding:8px; cursor:pointer; background:var(--row-alt-bg); border-radius:3px 3px 0 0; display:flex; justify-content:space-between;"';
  html += ' onclick="toggleDataFactsSection(\'races\')">';
  html += '<span style="font-weight:bold; font-size:11px; color:var(--text);">' + (racesExpanded ? '▼' : '▶') + ' Performance by Warrior Race</span>';
  html += '</div>';

  if (racesExpanded) {
    html += '<div style="padding:12px;">';
    if (raceRecords.length === 0) {
      html += '<div style="color:var(--text-dim); font-size:11px;">No race-specific records available</div>';
    } else {
      html += buildRaceRecordsList(raceRecords);
    }
    html += '</div>';
  }
  html += '</div>';

  // Race vs Race Section (Collapsible)
  const raceVsRaceExpanded = S.expandedDataFactsSections.raceVsRace || false;
  const raceVsRaceData = record.race_vs_race || [];
  html += '<div style="margin-bottom:20px; border:1px solid var(--mid); border-radius:3px; background:var(--input-bg);">';
  html += '<div style="padding:8px; cursor:pointer; background:var(--row-alt-bg); border-radius:3px 3px 0 0; display:flex; justify-content:space-between;"';
  html += ' onclick="toggleDataFactsSection(\'raceVsRace\')">';
  html += '<span style="font-weight:bold; font-size:11px; color:var(--text);">' + (raceVsRaceExpanded ? '▼' : '▶') + ' Race vs Race Performance</span>';
  html += '</div>';

  if (raceVsRaceExpanded) {
    html += '<div style="padding:12px;">';
    if (raceVsRaceData.length === 0) {
      html += '<div style="color:var(--text-dim); font-size:11px;">No race vs race records available</div>';
    } else {
      html += buildRaceVsRaceList(raceVsRaceData);
    }
    html += '</div>';
  }
  html += '</div>';

  // Weapon Performance Section (Collapsible)
  const weaponExpanded = S.expandedDataFactsSections.weapons || false;
  const weaponData = record.weapon_records || [];
  // Career total = the same fights the weapon rows count (record.totals). The older
  // cumulative_record sums each team's turn_history, which is only kept for the last
  // 20 turns, so it undercounted long-running teams.
  const _tot = record.totals || {};
  const cumulativeRecord = { wins: _tot.wins || 0, losses: _tot.losses || 0, kills: _tot.kills || 0 };
  const cumulativeDisplay = cumulativeRecord.wins + '-' + cumulativeRecord.losses + '-' + cumulativeRecord.kills;
  html += '<div style="margin-bottom:20px; border:1px solid var(--mid); border-radius:3px; background:var(--input-bg);">';
  html += '<div style="padding:8px; cursor:pointer; background:var(--row-alt-bg); border-radius:3px 3px 0 0; display:flex; justify-content:space-between;"';
  html += ' onclick="toggleDataFactsSection(\'weapons\')">';
  html += '<span style="font-weight:bold; font-size:11px; color:var(--text);">' + (weaponExpanded ? '▼' : '▶') + ' Weapon Performance -- ' + cumulativeDisplay + ' (cumulative)</span>';
  html += '</div>';

  if (weaponExpanded) {
    html += '<div style="padding:12px;">';
    if (weaponData.length === 0) {
      html += '<div style="color:var(--text-dim); font-size:11px;">No weapon records available</div>';
    } else {
      html += buildWeaponRecordsList(weaponData);
    }
    html += '</div>';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

function toggleDataFactsSection(section) {
  if (!S.expandedDataFactsSections) S.expandedDataFactsSections = {};
  S.expandedDataFactsSections[section] = !S.expandedDataFactsSections[section];
  refreshContent();
}

function buildRaceRecordsList(raceRecords) {
  let html = '';
  for (const rec of raceRecords) {
    html += '<div style="padding:8px; border-bottom:1px solid var(--mid); display:flex; justify-content:space-between; align-items:center;">';
    html += '<span style="font-weight:bold; font-size:11px; color:var(--text);">' + esc(rec.race) + '</span>';
    html += '<span style="font-size:11px; color:var(--text-dim);">' + rec.wins + '-' + rec.losses + '-' + rec.kills + ' (' + rec.slain + ' slain)</span>';
    html += '</div>';
  }
  return html;
}

function buildRaceVsRaceList(raceVsRaceData) {
  if (!S.expandedRaceVsRace) S.expandedRaceVsRace = {};

  let html = '';
  for (const raceData of raceVsRaceData) {
    const race = raceData.race;
    const isExpanded = S.expandedRaceVsRace[race] || false;

    html += '<div style="margin-bottom:8px; border:1px solid var(--mid); border-radius:3px; background:var(--input-bg);">';
    html += '<div style="padding:8px; cursor:pointer; background:var(--row-alt-bg); display:flex; justify-content:space-between; align-items:center;"';
    html += ' onclick="toggleRaceVsRace(\'' + esc(race) + '\')">';
    html += '<span style="font-weight:bold; font-size:11px; color:var(--text);">' + (isExpanded ? '▼' : '▶') + ' ' + esc(race) + '</span>';
    html += '</div>';

    if (isExpanded) {
      html += '<div style="padding:8px; border-top:1px solid var(--mid);">';
      for (const matchup of raceData.matchups) {
        html += '<div style="padding:6px 8px; border-bottom:1px solid var(--mid); display:flex; justify-content:space-between; align-items:center; margin-left:12px;">';
        html += '<span style="font-size:11px; color:var(--text);">vs ' + esc(matchup.opponent_race) + '</span>';
        html += '<span style="font-size:11px; color:var(--text-dim);">' + matchup.wins + '-' + matchup.losses + '-' + matchup.kills + '</span>';
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  return html;
}

function toggleRaceVsRace(race) {
  if (!S.expandedRaceVsRace) S.expandedRaceVsRace = {};
  S.expandedRaceVsRace[race] = !S.expandedRaceVsRace[race];
  refreshContent();
}

function buildWeaponRecordsList(weaponRecords) {
  if (!S.expandedWeapons) S.expandedWeapons = {};
  if (!S.expandedRaces) S.expandedRaces = {};

  let html = '';
  for (const rec of weaponRecords) {
    const isUnknown = rec.weapon === 'Unknown';
    const weaponExpanded = S.expandedWeapons[rec.weapon] || false;
    const winRate = (rec.wins + rec.losses > 0) ? ((rec.wins / (rec.wins + rec.losses)) * 100).toFixed(1) : '0.0';
    const displayName = isUnknown ? 'Total Record' : rec.weapon;

    html += '<div style="margin-bottom:8px; border:1px solid var(--mid); border-radius:3px; background:var(--input-bg);">';

    if (isUnknown) {
      // Non-expandable Total Record
      html += '<div style="padding:8px; background:var(--row-alt-bg); display:flex; justify-content:space-between; align-items:center;">';
      html += '<span style="font-weight:bold; font-size:11px; color:var(--text);">' + displayName + '</span>';
      html += '<span style="font-size:11px; color:var(--text-dim);">' + rec.wins + '-' + rec.losses + '-' + rec.kills + ' (' + winRate + '%)</span>';
      html += '</div>';
    } else {
      // Expandable weapon entry
      html += '<div style="padding:8px; cursor:pointer; background:var(--row-alt-bg); display:flex; justify-content:space-between; align-items:center;"';
      html += ' onclick="toggleWeapon(\'' + esc(rec.weapon) + '\')">';
      html += '<span style="font-weight:bold; font-size:11px; color:var(--text);">' + (weaponExpanded ? '▼' : '▶') + ' ' + displayName + '</span>';
      html += '<span style="font-size:11px; color:var(--text-dim);">' + rec.wins + '-' + rec.losses + '-' + rec.kills + ' (' + winRate + '%)</span>';
      html += '</div>';

      if (weaponExpanded && rec.race_breakdown && rec.race_breakdown.length > 0) {
        html += '<div style="padding:8px; border-top:1px solid var(--mid);">';
        for (const raceRec of rec.race_breakdown) {
          const raceKey = rec.weapon + '|' + raceRec.race;
          const raceExpanded = S.expandedRaces[raceKey] || false;
          const raceWinRate = (raceRec.wins + raceRec.losses > 0) ? ((raceRec.wins / (raceRec.wins + raceRec.losses)) * 100).toFixed(1) : '0.0';

          html += '<div style="margin-bottom:6px; border:1px solid var(--mid); border-radius:2px; background:var(--row-alt-bg); margin-left:8px;">';
          html += '<div style="padding:6px 8px; cursor:pointer; background:var(--input-bg); display:flex; justify-content:space-between; align-items:center;"';
          html += ' onclick="toggleRaceInWeapon(\'' + esc(raceKey) + '\')">';
          html += '<span style="font-size:11px; color:var(--text);">' + (raceExpanded ? '▼' : '▶') + ' ' + esc(raceRec.race) + '</span>';
          html += '<span style="font-size:11px; color:var(--text-dim);">' + raceRec.wins + '-' + raceRec.losses + '-' + raceRec.kills + ' (' + raceWinRate + '%)</span>';
          html += '</div>';

          if (raceExpanded && raceRec.warrior_breakdown && raceRec.warrior_breakdown.length > 0) {
            html += '<div style="padding:6px 8px; border-top:1px solid var(--mid);">';
            for (const warriorRec of raceRec.warrior_breakdown) {
              const warriorWinRate = (warriorRec.wins + warriorRec.losses > 0) ? ((warriorRec.wins / (warriorRec.wins + warriorRec.losses)) * 100).toFixed(1) : '0.0';
              html += '<div style="padding:4px 8px; border-bottom:1px solid var(--mid); display:flex; justify-content:space-between; align-items:center; margin-left:12px;">';
              html += '<span style="font-size:10px; font-style:italic; color:var(--text);">' + esc(warriorRec.warrior) + '</span>';
              html += '<span style="font-size:10px; color:var(--text-dim);">' + warriorRec.wins + '-' + warriorRec.losses + '-' + warriorRec.kills + ' (' + warriorWinRate + '%)</span>';
              html += '</div>';
            }
            html += '</div>';
          }
          html += '</div>';
        }
        html += '</div>';
      }
    }
    html += '</div>';
  }
  return html;
}

function toggleWeapon(weapon) {
  if (!S.expandedWeapons) S.expandedWeapons = {};
  S.expandedWeapons[weapon] = !S.expandedWeapons[weapon];
  refreshContent();
}

function toggleRaceInWeapon(raceKey) {
  if (!S.expandedRaces) S.expandedRaces = {};
  S.expandedRaces[raceKey] = !S.expandedRaces[raceKey];
  refreshContent();
}

function refreshDataFacts() {
  S.dataFactsLoading = true;
  refreshContent();
  _loadManagerRecord().then(() => {
    S.dataFactsLoading = false;
    if (S.mgrTab === 'data_facts') refreshContent();
  });
}

/* ============================================================
   SCOUTING TAB
   ============================================================ */
function buildScoutingTab() {
  const sc   = S.scout;
  const acc  = S.account || {};
  const mid  = acc.id || 0;

  // Show open report view instead if one is active
  if (sc.report) {
    return buildScoutReport(sc.report);
  }

  // Trigger async loads if not yet fetched
  if (!sc.loaded) {
    loadScoutStatus();
    return '<div style="padding:20px; color:var(--text-dim);">Loading scouting status...</div>';
  }

  // ── Current selections ────────────────────────────────────────────────────
  let selRows = '';
  (sc.selections || []).forEach(entry => {
    const isConfirmed = entry.confirmed !== undefined ? entry.confirmed : true;
    const btn = isConfirmed
      ? `<span style="font-size:11px; color:var(--text-dim); font-style:italic;">🔒 Locked</span>`
      : `<button onclick='removeScout(${jsq(entry.warrior_name)})'
                style="color:var(--text-err); font-size:11px; padding:1px 6px; border-color:var(--b-asc) var(--b-injA) var(--b-injA) var(--b-asc);">✕ Remove</button>`;
    
    selRows += `
    <tr style="border-bottom:1px solid var(--line);">

      <td style="padding:4px 8px; color:var(--text-dim);">${esc(entry.team_name||'-')}</td>
      <td style="padding:4px 8px;">

  });

    selRows = `<tr><td colspan="3" style="padding:8px; color:var(--text-dim); font-style:italic;">
      No warriors selected for scouting this turn.</td></tr>`;
  }

  const slotsLeft = sc.slotsLeft ?? (3 - (sc.selections||[]).length);

  // ── Available targets ─────────────────────────────────────────────────────
  let targetsHtml = '';
  if (sc.targets === null) {
    // Not yet loaded - trigger load
    loadScoutTargets();
    targetsHtml = '<div style="padding:8px; color:var(--text-dim); font-style:italic;">Loading warriors...</div>';
  } else if (!sc.targets.length) {
    targetsHtml = '<div style="padding:8px; color:var(--text-dim); font-style:italic;">No warriors from other teams available.</div>';
  } else {
    const filter  = (sc.filterText || '').toLowerCase();
    const already = new Set((sc.selections||[]).map(e => e.warrior_name));
    const visible = sc.targets.filter(w =>
      !filter ||
      w.name.toLowerCase().includes(filter) ||
      w.team_name.toLowerCase().includes(filter)
    );
    // Same behavior as the Challenges tab: click a header to sort ascending, click it again
    // to go back to the default order (most fights first).
    const _sc = sc.sort;
    const _str = k => (a, b) => String(a[k] || '').localeCompare(String(b[k] || ''));
    if      (_sc === 'name')    visible.sort(_str('name'));
    else if (_sc === 'team')    visible.sort(_str('team_name'));
    else if (_sc === 'manager') visible.sort(_str('manager_name'));
    else if (_sc === 'race')    visible.sort(_str('race'));
    else if (_sc === 'record')  visible.sort((a, b) => (a.wins || 0) - (b.wins || 0));
    else if (_sc === 'fights')  visible.sort((a, b) => (a.total_fights || 0) - (b.total_fights || 0));
    else                        visible.sort((a, b) => b.total_fights - a.total_fights);
    let trows = '';
    visible.forEach(w => {
      const queued = already.has(w.name);
      let btn;
      if (queued) {
        btn = `<button disabled style="font-size:11px; padding:1px 6px; opacity:0.5;">Scouted</button>`;
      } else if (slotsLeft > 0) {
        btn = `<button onclick='addScout(${jsq(w.name)}, ${jsq(w.team_name)}, ${w.team_id})'
                       style="font-size:11px; padding:1px 6px;">+ Scout</button>`;
      } else {
        btn = `<button disabled style="font-size:11px; padding:1px 6px; opacity:0.5;" title="3 scouts used">Full</button>`;
      }
      trows += `
      <tr style="border-bottom:1px solid var(--line);">
        <td style="padding:3px 8px;">${esc(w.name)}</td>
        <td style="padding:3px 8px; color:var(--text-dim);">${esc(w.team_name)}</td>
        <td style="padding:3px 8px; color:var(--text-dim);">${esc(w.manager_name||'-')}</td>
        <td style="padding:3px 8px; color:var(--text-dim);">${esc(w.race)} ${esc(w.gender)}</td>
        <td style="padding:3px 8px; text-align:center;">${S.hideRecord ? '-' : `${w.wins}-${w.losses}-${w.kills}`}</td>
        <td style="padding:3px 8px; text-align:center;">${w.total_fights}</td>
        <td style="padding:3px 8px;">${btn}</td>
      </tr>`;
    });
    if (!trows) {
      trows = `<tr><td colspan="7" style="padding:8px; color:var(--text-faint); font-style:italic;">
        No warriors match the search filter.</td></tr>`;
    }
    targetsHtml = `
    <div style="margin-bottom:6px; display:flex; align-items:center; gap:6px;">
      <span style="font-size:11px;">Search:</span>
      <input type="text" value="${esc(sc.filterText||'')}" oninput="scoutFilter(this.value)"
             style="width:200px; font-size:11px;" placeholder="Name or team...">
      <span style="font-size:11px; color:var(--text-dim);">${visible.length} of ${sc.targets.length} warrior${sc.targets.length===1?'':'s'}</span>
    </div>
    <table style="border-collapse:collapse; width:100%; font-size:12px;">
      <thead>
        <tr style="border-bottom:2px solid var(--mid); color:var(--text-dim); font-size:11px;">
          <th style="padding:4px 8px; text-align:left; font-weight:600; cursor:pointer;" onclick="sortScout('name')">Name</th>
          <th style="padding:4px 8px; text-align:left; font-weight:600; cursor:pointer;" onclick="sortScout('team')">Team</th>
          <th style="padding:4px 8px; text-align:left; font-weight:600; cursor:pointer;" onclick="sortScout('manager')">Manager</th>
          <th style="padding:4px 8px; text-align:left; font-weight:600; cursor:pointer;" onclick="sortScout('race')">Race</th>
          <th style="padding:4px 8px; text-align:center; font-weight:600; cursor:pointer;" onclick="sortScout('record')">Record (W-L-K)</th>
          <th style="padding:4px 8px; text-align:center; font-weight:600; cursor:pointer;" onclick="sortScout('fights')">Fights</th>
          <th style="padding:4px 8px;"></th>
        </tr>
      </thead>
      <tbody>${trows}</tbody>
    </table>`;
  }

  return `
<div style="padding:12px; display:flex; flex-direction:column; gap:12px; overflow:auto; height:100%;">
  <div class="group" style="margin:0;">
    <span class="group-label">Scouting Assignments - ${slotsLeft} slot${slotsLeft===1?'':'s'} remaining this turn</span>
    <p style="font-size:11px; color:var(--text-dim); margin:4px 0 8px;">
      Select up to <b>3</b> opposing warriors to scout each turn. Your scout is dispatched immediately and the
      selection is locked, but the report itself isn't ready until the turn processes - check the Full Scouting
      Report section below after your next download. Scouting resets after the turn runs.
    </p>
    <table style="border-collapse:collapse; width:100%; font-size:12px;">
      <thead>
        <tr style="border-bottom:2px solid var(--mid); color:var(--text-dim); font-size:11px;">
          <th style="padding:4px 8px; text-align:left; font-weight:600;">Warrior</th>
          <th style="padding:4px 8px; text-align:left; font-weight:600;">Team</th>
          <th style="padding:4px 8px;"></th>
        </tr>
      </thead>
      <tbody>${selRows}</tbody>
    </table>
  </div>
  ${buildFullScoutingReportSection()}
  <div style="border:2px solid var(--mid); margin:0; flex:1; overflow:auto; background:var(--bg); display:flex; flex-direction:column;">
    <div style="padding:4px 8px 4px; font-weight:bold; font-size:11px; border-bottom:1px solid var(--mid); flex-shrink:0;">Available to Scout</div>
    <div style="overflow:auto; flex:1;">
      ${targetsHtml}
    </div>
  </div>
</div>`;
}

  const equip = [

  return `
<div style="padding:12px; overflow:auto; height:100%;">

    </p>
    <table style="border-collapse:collapse; font-size:12px;">${equip}</table>

function _renderScoutReportText(text) {
  // Split the plain-text report into styled HTML sections.
  // Section headers are ALL-CAPS lines (like "FIGHT OBSERVED", "TACTICAL RECOMMENDATION", etc.)
  const HEADER_RE = /^[A-Z][A-Z\s\-']+$/;
  const DIVIDER_RE = /^-{3,}$/;

  const lines = text.split('\n');
  let html = '<div style="font-family:\'Courier New\',monospace; font-size:11px; line-height:1.6; padding:4px 0;">';
  let inSection = false;

  for (let i = 0; i < lines.length; i++) {
    const raw  = lines[i];
    const trim = raw.trim();

    if (!trim) {
      html += '<div style="height:6px;"></div>';
      continue;
    }

    // Top-level report header lines (first 4 lines - name, filed-by, record)
    if (i < 5 && trim) {
      if (i === 0) {
        html += `<div style="font-size:13px; font-weight:bold; letter-spacing:1px; color:var(--scout-title); margin-bottom:4px;">${esc(trim)}</div>`;
      } else {
        html += `<div style="font-size:11px; color:var(--scout-meta); margin-bottom:2px;">${esc(trim)}</div>`;
      }
      continue;
    }

    // Divider lines - skip rendering
    if (DIVIDER_RE.test(trim)) continue;

    // ALL-CAPS section headings
    if (HEADER_RE.test(trim) && trim.length > 3) {
      html += `<div style="margin-top:10px; margin-bottom:3px; font-size:11px; font-weight:bold;
                            letter-spacing:0.5px; color:var(--scout-heading); border-bottom:1px solid var(--scout-rule);
                            padding-bottom:2px;">${esc(trim)}</div>`;
      continue;
    }

    // "THREAT LEVEL:" keyword - highlight it
    if (trim.startsWith('THREAT LEVEL:')) {
      const isHigh = trim.includes('HIGH');
      const isMod  = trim.includes('MODERATE');
      const color  = isHigh ? 'var(--scout-high)' : isMod ? 'var(--scout-mod)' : 'var(--scout-low)';
      html += `<div style="margin:4px 0; padding:4px 8px; background:${isHigh?'var(--scout-high-bg)':isMod?'var(--scout-mod-bg)':'var(--scout-low-bg)'};
                            border-left:3px solid ${color}; color:${color}; font-weight:bold; font-size:11px;">${esc(trim)}</div>`;
      continue;
    }

    // "Advisory:" / "Note:" / "Weapon note:" prefix lines
    if (/^(Advisory|Note|Weapon note):/i.test(trim)) {
      html += `<div style="margin:2px 0 2px 8px; color:var(--scout-note); font-style:italic; font-size:11px;">${esc(trim)}</div>`;
      continue;
    }

    // Indented lines (start with spaces/2+ spaces in original)
    if (raw.startsWith('  ') || raw.startsWith('\t')) {
      html += `<div style="margin:1px 0 1px 12px; color:var(--scout-indent); font-size:11px;">${esc(trim)}</div>`;
      continue;
    }

    // Closing signature lines ("- Name")
    if (trim.startsWith('-') || trim.startsWith('-')) {
      html += `<div style="margin-top:8px; color:var(--scout-meta); font-style:italic; font-size:11px;">${esc(trim)}</div>`;
      continue;
    }

    // Default paragraph line
    html += `<div style="margin:2px 0; color:var(--scout-text); font-size:11px;">${esc(trim)}</div>`;
  }

  html += '</div>';
  return html;
}

async function loadScoutStatus() {
  const mid = (S.account || {}).id || 0;
  if (!mid) return;
  try {
    const r = await API.get(`/api/scout/status?manager_id=${mid}`);
    if (r.success) {
      S.scout.loaded     = true;
      S.scout.slotsLeft  = r.slots_left;
      // selections from server now have full object structure with confirmed status
      S.scout.selections = (r.selections || []).map(sel => {
        if (typeof sel === 'string') {
          // Legacy support for string-only format
          return { warrior_name: sel, team_name: '', team_id: 0, confirmed: true };
        }
        return {
          warrior_name: sel.warrior_name || '',
          team_name: sel.team_name || '',
          team_id: sel.team_id || 0,
          confirmed: sel.confirmed !== undefined ? sel.confirmed : true
        };
      });
    }
  } catch(e) {}
  // Also load targets if not yet loaded
  if (S.scout.targets === null) {
    loadScoutTargets();
  } else {
    refreshContent();
  }
}

async function loadScoutTargets() {
  const mid = (S.account || {}).id || 0;
  if (!mid) return;
  const arena = S.selectedArena || 'normal';
  try {
    const r = await API.get(`/api/scout/targets?manager_id=${mid}&arena=${arena}`);
    if (r.success) {
      S.scout.targets = r.warriors || [];
      // Back-fill team names on selections now that we have target data
      S.scout.selections = S.scout.selections.map(sel => {
        const found = S.scout.targets.find(t => t.name === sel.warrior_name);
        return {
          warrior_name: sel.warrior_name,
          team_name: found ? found.team_name : sel.team_name,
          team_id: found ? found.team_id : sel.team_id,
          confirmed: sel.confirmed
        };
      });
    }
  } catch(e) { S.scout.targets = []; }
  refreshContent();
}

// Resolve the arena the currently-selected warrior actually fights in. Challenges
// (both the available-target list and the challenge submission) are scoped to this
// arena so a Soul Spire (veteran) warrior only sees/challenges Soul Spire warriors
// and an Elite Spire warrior only Elite Spire warriors. This can differ from
// S.selectedArena (e.g. a promoted warrior still shown in a normal roster slot), so
// it is derived from the warrior's own current_arena.
function challengeArenaForSelection() {
  const sel = S.sel || {};
  if (sel.type === 'immortal_warrior') {
    const iw = ((S.immortalWarriors || {})[S.selectedArena] || [])
      .find(x => x.team_id == sel.teamId && x.name === sel.warriorName);
    return (iw && iw.current_arena) || S.selectedArena || 'normal';
  }
  if (sel.type === 'warrior') {
    const team = S.teams[sel.teamId];
    const w = team && team.warriors ? team.warriors[sel.wIdx] : null;
    return (w && w.current_arena) || 'normal';
  }
  return S.selectedArena || 'normal';
}

async function loadChallengeTargets() {
  const mid    = (S.account || {}).id || 0;
  const teamId = S.sel.teamId || 0;
  const arena  = challengeArenaForSelection();
  const cacheKey = `bp_challenge_targets_${mid}_${arena}`;
  // Load the challenging warrior's own team (with its challenges map) so queued
  // challenges render. Immortal teams live in per-arena files and are never kept in
  // S.teams (which holds normal rosters only); normal teams come from S.teams/disk.
  try {
    if (arena === 'elite' || arena === 'veteran') {
      // The server's arena file is authoritative for queued challenges (it clears
      // them after each Spire turn, like the regular arena). Fetch it when online
      // and refresh the local copy; fall back to the local copy when offline.
      let fresh = null;
      const base = (S.serverUrl || '').replace(/\/+$/, '');
      if (base) {
        try {
          const tr = await fetch(`${base}/api/immortal_team?team_id=${teamId}&arena=${arena}`);
          const td = await tr.json();
          if (td.success && td.team && td.arena === arena) {
            fresh = td.team;
            await Store.writeArenaTeam(arena, fresh).catch(() => {});
          }
        } catch(_) { /* offline - use the local copy */ }
      }
      S.challengeTeam = fresh || await Store.readArenaTeam(arena, teamId).catch(() => null);
    } else {
      S.challengeTeam = S.teams[teamId] || await Store.readTeam(teamId).catch(() => null);
    }
  } catch(_) { S.challengeTeam = null; }
  try {
    const r = await API.get(`/api/challenge/targets?manager_id=${mid}&team_id=${teamId}&arena=${arena}`);
    console.log('[Challenge] Full API response:', r);
    if (r && r.success) {
      S.challengeTargets = r.warriors || [];
      S._eligibleChampionTiers = r.eligible_champion_tiers || [];
      S._challengeTargetsOffline = false;
      console.log(`[Challenge] Loaded ${S.challengeTargets.length} challenge targets`);
      try { localStorage.setItem(cacheKey, JSON.stringify({ warriors: S.challengeTargets, eligible_champion_tiers: S._eligibleChampionTiers })); } catch(_) {}
    } else {
      console.warn('[Challenge] API returned error:', r ? (r.error || 'unknown error') : 'null/undefined');
      _loadChallengeTargetsFromCache(cacheKey);
    }
  } catch(e) {
    console.error('[Challenge] Server offline, loading from cache:', e.message);
    _loadChallengeTargetsFromCache(cacheKey);
  }
  refreshContent();
}

function _loadChallengeTargetsFromCache(cacheKey) {
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const data = JSON.parse(cached);
      S.challengeTargets = data.warriors || [];
      S._eligibleChampionTiers = data.eligible_champion_tiers || [];
      S._challengeTargetsOffline = true;
    } else {
      S.challengeTargets = [];
      S._eligibleChampionTiers = [];
      S._challengeTargetsOffline = true;
    }
  } catch(_) {
    S.challengeTargets = [];
    S._eligibleChampionTiers = [];
    S._challengeTargetsOffline = true;
  }
}

async function addScout(warriorName, teamName, teamId) {
  const mid = (S.account || {}).id || 0;
  const arena = S.selectedArena || 'normal';
  // Add scout with immediate confirmation
  const r = await API.post('/api/scout/select', {
    manager_id: mid,
    warrior_name: warriorName,
    team_name: teamName,
    team_id: teamId,
    arena: arena
  });
  
  if (r.success) {
    // Update selections list
    S.scout.slotsLeft = r.slots_left;
    S.scout.selections = (r.selections || []).map(sel => ({
      warrior_name: sel.warrior_name || sel,
      team_name: sel.team_name || '',
      team_id: sel.team_id || 0,
      confirmed: sel.confirmed !== undefined ? sel.confirmed : true
    }));

    // No report to show yet - the scout is dispatched, but the report itself
    // only resolves once this turn is processed. Just refresh the assignments list.
    render();
  } else {
    alert('Could not add scout: ' + r.error);
  }
}

async function removeScout(warriorName) {
  const mid = (S.account || {}).id || 0;
  const selection = (S.scout.selections || []).find(s => s.warrior_name === warriorName);
  
  // Only allow removal of unconfirmed selections
  if (selection && selection.confirmed) {
    alert('Cannot remove a confirmed scout selection. Confirmed scouts are locked until the turn ends.');
    return;
  }
  
  const r = await API.post('/api/scout/remove', { manager_id: mid, warrior_name: warriorName });
  if (r.success) {
    S.scout.slotsLeft = r.slots_left;
    S.scout.selections = (r.selections || []).map(sel => ({
      warrior_name: sel.warrior_name || sel,
      team_name: sel.team_name || '',
      team_id: sel.team_id || 0,
      confirmed: sel.confirmed !== undefined ? sel.confirmed : true
    }));
    render();
  } else {
    alert('Could not remove scout: ' + r.error);
  }
}

function viewScoutReport(warriorName) {
  // Reports only exist once a turn has processed them - they ride along with
  // the last /api/results download rather than being fetched live.
  const report = (S.scout.reports || []).find(r => r.warrior_name === warriorName);
  if (!report) {
    alert('No scouting report available for this warrior yet. Reports appear after the turn processes.');
    return;
  }
  S.scout.report = report;
  render();
}

function closeScoutReport() {
  S.scout.report = null;
  render();
}

async function downloadScoutReport(warriorName) {
  const report = (S.scout.reports || []).find(r => r.warrior_name === warriorName) || S.scout.report;
  if (!report) return;
  const turn = S.league?.lastTurnRan || 0;
  const safeName = String(report.warrior_name || 'warrior').replace(/[^a-z0-9]+/gi, '_');
  const path = `scouting/turn_${String(turn).padStart(3, '0')}_${safeName}.txt`;
  try {
    await fsaWriteText(path, report.scout_report || '');
    const fullPath = `${baseDir}/${path}`;
    setMsg(`Scouting report saved to ${fullPath}`, 'ok');
    render();
    // Best-effort: open the file explorer with the saved file selected, so
    // the destination is obvious without the user having to go hunting for it.
    fsaShowInFolder(path);
  } catch(e) {
    alert('Could not save report: ' + e.message);
  }
}

function scoutFilter(text) {
  S.scout.filterText = text;
  render();
}

function sortScout(column) {
  S.scout.sort = S.scout.sort === column ? null : column;
  render();
}

function buildContent() {
  const { type, teamId, wIdx } = S.sel;

  if (!type) {
    return buildManagerPanel();
  }

  if (type === 'newsletter') {
    return buildNewsletterPanel();
  }

  if (type === 'team') {
    const team = S.teams[teamId];
    if (!team) return '<div style="padding:10px;">Loading...</div>';
    return buildTeamPanel(team);
  }

  if (type === 'warrior') {
    const team = S.teams[teamId];
    if (!team) return '<div style="padding:10px;">Loading...</div>';
    const w = team.warriors[wIdx];
    if (!w) return '<div style="padding:10px;">Empty slot.</div>';
    return buildWarriorPanel(team, w, wIdx);
  }

  if (type === 'immortal_warrior') {
    const sa = S.selectedArena || 'elite';
    const iw = ((S.immortalWarriors||{})[sa]||[]).find(w => w.team_id == teamId && w.name === S.sel.warriorName);
    if (!iw) return '<div style="padding:10px; color:var(--text-faint);">Warrior not found — click the arena tab to refresh.</div>';
    // Use cached local team if available; otherwise build a stub from warrior data
    const team = S.teams[teamId] || {
      team_id: teamId, team_name: iw.team_name,
      manager_name: iw.manager_name || '',
      warriors: [], archived_warriors: [],
    };
    return buildWarriorPanel(team, iw, null);
  }

  return '';
}

function buildTeamPanel(team) {
  const sa = S.selectedArena || 'normal';
  let totalW, totalL, totalD;
  if (sa !== 'normal') {
    // Aggregate from live immortal warrior data (standings.json via API) rather than
    // local team file which doesn't carry arena-specific win/loss fields.
    const arenaWs = ((S.immortalWarriors || {})[sa] || []).filter(w => w.team_id == team.team_id);
    totalW = arenaWs.reduce((s, w) => s + (w.arena_wins   || 0), 0);
    totalL = arenaWs.reduce((s, w) => s + (w.arena_losses || 0), 0);
    totalD = arenaWs.reduce((s, w) => s + (w.arena_kills  || 0), 0);
  } else {
    totalW = team.warriors.reduce((a,w)=>a+(w?w.wins:0),0)
           + (team.archived_warriors||[]).reduce((a,w)=>a+(w?w.wins||0:0),0);
    totalL = team.warriors.reduce((a,w)=>a+(w?w.losses:0),0)
           + (team.archived_warriors||[]).reduce((a,w)=>a+(w?w.losses||0:0),0);
    totalD = team.warriors.reduce((a,w)=>a+(w?w.kills||0:0),0)
           + (team.archived_warriors||[]).reduce((a,w)=>a+(w?w.kills||0:0),0);
  }
  const tid    = team.team_id;
  const rnt    = team.auto_upload_enabled;
  const canRun = hasFiveActiveWarriors(team);
  return `
<div style="padding:4px;">
  <div style="font-weight:bold; margin-bottom:6px; font-size:12px;">Team</div>
  <table style="border-collapse:collapse; width:100%; max-width:700px;">
    <tr>
      <td style="padding:3px 8px; width:90px;">Name</td>
      <td><input type="text" class="ro" value="${esc(team.team_name)}" style="width:320px;" readonly></td>
      <td style="padding:3px 8px; width:140px; text-align:right;" title="Last turn this team actively participated in">Last Turn Ran</td>
      <td><input type="text" class="ro" value="${esc(String(team.last_turn_ran || '-'))}" style="width:80px;" readonly></td>
    </tr>
    <tr>
      <td style="padding:3px 8px;">Record</td>
      <td><input type="text" class="ro" value="${S.hideRecord ? '-' : esc(totalW+'-'+totalL+'-'+totalD)}" style="width:320px;" readonly></td>
      <td style="padding:3px 8px; text-align:right;">Run This Turn</td>
      <td>
        <input type="checkbox" id="cb-rnt-${tid}" ${rnt && canRun ? 'checked' : ''}
               onchange="setRunNextTurn(${tid}, this.checked)" ${canRun ? '' : 'disabled'}
               style="margin:4px;"
               title="${canRun ? 'Include this team in Run All Teams / Upload All Teams' : 'Team must have 5 active warriors to run'}">
      </td>
    </tr>
    <tr>
      <td style="padding:3px 8px;">Team Number</td>
      <td><input type="text" class="ro" value="${esc(team.team_id)}" style="width:120px;" readonly></td>
      <td colspan="2" style="padding:3px 8px; text-align:right;">
        ${sa === 'normal' ? `<button onclick="confirmReplaceTeam(${tid})">↺ Replace Team</button>` : ''}
      </td>
    </tr>
  </table>
</div>`;
}

/* ============================================================
   WARRIOR PANEL - TABS
   ============================================================ */
function buildWarriorPanel(team, w, wIdx) {
  const isAscended = w.ascended_to_monster || false;
  const isDead = w.is_dead || false;
  // Always show all tabs regardless of death status - don't tip off the manager
  // that the warrior died until they read the fight narrative.
  // Immortal arenas (elite/veteran) suppress combat-management and graveyard tabs,
  // but only when viewed FROM the immortal arena panel (wIdx===null).
  // A promoted warrior still occupying a normal roster slot (wIdx is an integer)
  // needs the Replacement tab so the manager can roll up a new recruit.
  const wArena = w.current_arena || 'normal';
  const isImmortal = (wArena === 'elite' || wArena === 'veteran') && wIdx === null;
  const allTabs = ['Stats/Strats', 'Fight Options', 'Fights', 'Challenges', 'Replacement', 'The Crypts', 'Shady Pines'];
  const immortalHide = new Set(['Replacement', 'The Crypts', 'Shady Pines']);  // Fight Options now shown for immortals (taunts only)
  const tabs = isImmortal ? allTabs.filter(t => !immortalHide.has(t)) : allTabs;
  const tabMap = {
    'Stats/Strats':'stats', 'Fight Options':'fight', 'Fights':'fights',
    'Challenges':'challenges', 'Replacement':'replacement', 'The Crypts':'archives',
    'Shady Pines':'retired'
  };
  // If the current sub-tab is hidden for this arena, fall back to stats
  const allowedKeys = new Set(tabs.map(t => tabMap[t]));
  const activeTab = allowedKeys.has(S.wTab) ? S.wTab : 'stats';
  let tabsHtml = isImmortal
    ? `<div class="tabs" style="background:var(--lapis)">`
    : `<div class="tabs">`;
  tabs.forEach(t => {
    const key = tabMap[t];
    tabsHtml += `<div class="tab ${activeTab===key?'active':''}" onclick="setWTab('${key}')">${t}</div>`;
  });
  tabsHtml += `</div>`;

  let body = '';
  if      (activeTab === 'stats')       body = buildStatsTab(team, w, wIdx);
  else if (activeTab === 'fight') {
    // Immortal warriors: career summary and taunts only (no this-turn options, no retirement)
    body = buildFightOptionsTab(w, isImmortal);
  }
  else if (activeTab === 'fights')      body = buildFightsTab(w, wIdx);
  else if (activeTab === 'challenges')  body = buildChallengesTab(team, w, wIdx);
  else if (activeTab === 'replacement') body = buildReplacementTab(w);
  else if (activeTab === 'archives')    body = buildArchivesTab(team);
  else if (activeTab === 'retired')     body = buildRetiredTab(team);

  // Soul Spire warriors: show how many lives they have left above the tab content.
  let livesBanner = '';
  const _lv = isImmortal ? soulLives(w) : null;
  if (_lv) {
    const fallenNow = !!(w.soul_spire_final_death && w.is_dead);
    const msg = fallenNow
      ? 'Claimed by the land of the dead. This warrior has no lives left.'
      : _lv.left <= 1
        ? 'Last life. The next death in the Soul Spire is final.'
        : `${_lv.left} of ${_lv.max} lives remaining. A death costs one life, and the last death is final.`;
    livesBanner = `<div style="padding:5px 10px; border-bottom:1px solid var(--mid); font-size:11px; display:flex; align-items:center; gap:8px;
                  color:${(fallenNow || _lv.left <= 1) ? 'var(--text-err)' : 'var(--text)'};">
        <b>Soul Spire lives</b>${fallenNow ? '<span>☠</span>' : soulLivesHearts(_lv)}<span style="color:var(--text-dim);">${msg}</span>
      </div>`;
  }

  return tabsHtml + `<div class="tab-body" style="overflow:auto;">${livesBanner}${body}</div>`;
}

/* ---- Stats / Strats tab ---- */
/* Race colors for the fighter-card shield (one fixed color per race) */
const RACE_COLORS = {
  'Human':'#2f5f9e', 'Half-Orc':'#3f5f2a', 'Halfling':'#b9852a', 'Dwarf':'#9a3b22', 'Half-Elf':'#7a5aa8',

};
function raceColor(race) { return RACE_COLORS[race] || 'var(--sel)'; }

// Attribute flavor text ("Is of hefty strength"). The tables are a server rule,
// delivered with the game data; an older cached copy without them shows nothing.
function statDesc(attr, value) {
  const rows = S.gd && S.gd.stat_descriptions && S.gd.stat_descriptions[attr];
  if (!rows) return '';
  const hit = rows.find(([lo, hi]) => value >= lo && value <= hi);
  return hit ? hit[2] : '';
}

function buildStatsTab(team, w, wIdx) {
  // Guard: if game data hasn't loaded yet return a placeholder.
  // This prevents empty selects from firing scheduleAutoSave() on render
  // and overwriting the warrior's saved armor/weapons/trains/strategies.
  if (!S.gd) {
    if (!S._loadingGd) {
      S._loadingGd = true;
      API.get('/api/game_data').then(gd => {
        S._loadingGd = false;
        if (gd && !gd.error) { S.gd = gd; render(); }
      }).catch(() => { S._loadingGd = false; });
    }
    return '<div style="padding:20px;color:var(--text-dim);">Loading game data...</div>';
  }
  const gd = S.gd;
  // Height and weight are computed by the server and arrive with the warrior.
  const _hin = w.height_in, _wlbs = w.weight_lbs;
  const _hasBody = _hin != null && _wlbs != null;
  const ft = _hasBody ? Math.floor(_hin / 12) : 0, ins = _hasBody ? _hin % 12 : 0;

  // Stat rows
  const attrs = ['strength','dexterity','constitution','intelligence','presence','size'];
  let statRows = '';
  attrs.forEach(a => {
    const cur = w[a] || 0;
    const ini = (w.initial_stats && w.initial_stats[a]) ? w.initial_stats[a] : cur;
    const dv  = (cur !== ini) ? `${cur} (${ini})` : `${cur}`;
    statRows += `<tr>
      <td style="text-align:right; padding:1px 6px; min-width:90px;">${capitalize(a)}</td>
      <td style="padding:1px 4px;"><span class="stat-val" style="--pct:${Math.max(4, Math.min(100, Math.round(cur / 25 * 100)))}%">${esc(dv)}</span></td>
      <td style="padding:1px 4px 1px 8px; color:var(--text-dim); font-style:italic; font-size:11px; white-space:nowrap;">${esc(statDesc(a, cur))}</td>
    </tr>`;
  });

  // Equipment dropdowns - filter server list first to avoid duplicates
  const armor_opts = [...(gd.armor||[]).filter(a => a !== 'None'), 'None'];
  const helm_opts  = [...(gd.helms||[]).filter(h => h !== 'None'), 'None'];
  const wpn_opts   = (gd.weapons||[]).filter(w => w !== 'Open Hand');
  const cur_armor  = w.armor||'None';
  const cur_helm   = w.helm||'None';
  const cur_prim   = w.primary_weapon||'Open Hand';
  const cur_sec    = w.secondary_weapon||'Open Hand';
  const cur_bkp    = w.backup_weapon||'None';

  // Build grouped train options: Attributes | Skills | Weapons
  const attrTrains  = ['Strength','Dexterity','Constitution','Intelligence','Presence'];
  const skillTrains = ['Acrobatics','Bash','Brawl','Charge','Cleave','Disarm','Dodge','Feint','Initiative','Lunge','Parry','Riposte','Slash','Strike','Sweep','Throw'];
  const gdTrains    = (gd.train_skills||[]);
  const wpnTrains   = gdTrains.filter(t => !attrTrains.includes(t) && !skillTrains.includes(t));

  const t1 = (w.trains||[])[0]||'', t2 = (w.trains||[])[1]||'', t3 = (w.trains||[])[2]||'';

  function tOpts(val) {
    // Normalise stored key (e.g. "war_flail" → "War Flail") for comparison
    const norm = v => v.replace(/_/g,' ').replace(/\b\w/g, ch => ch.toUpperCase());

    // Migration: convert old "Francisca" to "Hand Axe" for matching
    let valNorm = norm(val);
    if (valNorm === 'Francisca' || val === 'francisca' || val === 'Francisca') {
      valNorm = 'Hand Axe';
    }

    const sel = v => {
      // Direct match
      if (v === val) return ' selected';
      // Normalized match
      const vNorm = norm(v);
      if (vNorm === valNorm) return ' selected';
      // Special case: match "Francisca" (old name) to "Hand Axe" (new name)
      if ((valNorm === 'Hand Axe' || val === 'francisca') && vNorm === 'Hand Axe') return ' selected';
      return '';
    };

    let h = '<option value="">-</option>';
    h += '<optgroup label="── Attributes ──">';
    attrTrains.forEach(a => { h += `<option value="${a}"${sel(a)}>${a}</option>`; });
    h += '</optgroup><optgroup label="── Skills ──">';
    skillTrains.forEach(s => { h += `<option value="${s}"${sel(s)}>${s}</option>`; });
    h += '</optgroup><optgroup label="── Weapons ──">';
    wpnTrains.forEach(wn => { h += `<option value="${wn}"${sel(wn)}>${wn}</option>`; });
    h += '</optgroup>';
    return h;
  }

  // Strategies
  const triggers = gd.triggers||[];
  const styles   = gd.styles||[];
  const aimPts   = gd.aim_points||[];
  const OC = 'onchange="scheduleAutoSave()"';

  // Determine which strategy array to display
  const challengeMode = w.challenge_strategy_enabled || false;
  const strats = challengeMode ? (w.challenge_strategies || []) : (w.strategies || []);

  // Separate Always/default row from numbered trigger rows
  const isDefaultTrigger = t => t === 'Always' || t === 'Always (Default Loop)';
  const numbered = strats.filter(s => !isDefaultTrigger(s.trigger));
  const always   = strats.find(s => isDefaultTrigger(s.trigger)) || {trigger:'Always (Default Loop)',style:'',activity:'',aim_point:'',defense_point:''};

  // Blank-first option list - blank = row inactive
  function stratOpts(items, val) {
    let h = '<option value=""></option>';
    items.forEach(it => { h += `<option value="${esc(it)}" ${it===val?'selected':''}>${esc(it)}</option>`; });
    return h;
  }
  // Blank-first 0-9 list for the Activity column (blank = defaults to 5)
  function activityOpts(val) {
    let h = '<option value=""></option>';
    for (let n = 0; n <= 9; n++) h += `<option value="${n}" ${String(val)===String(n)?'selected':''}>${n}</option>`;
    return h;
  }

  let stratRows = '';
  for (let i = 0; i < 5; i++) {
    const s = numbered[i] || { trigger:'', style:'', activity:'', aim_point:'', defense_point:'' };
    stratRows += `<tr>
      <td class="row-num">${i+1}</td>
      <td><select data-si="${i}" data-sf="trigger" ${OC}>${stratOpts(triggers, s.trigger)}</select></td>

      <td><select data-si="${i}" data-sf="aim_point" ${OC}>${stratOpts(aimPts, s.aim_point)}</select></td>
      <td><select data-si="${i}" data-sf="defense_point" ${OC}>${stratOpts(aimPts, s.defense_point)}</select></td>
    </tr>`;
  }
  // D row - "Always" trigger locked, cannot be changed
  stratRows += `<tr>
    <td class="row-num" style="font-weight:bold;">D</td>
    <td style="padding:2px 4px; background:var(--lt-gray); font-style:italic; color:var(--text-dim);">Always (Default Loop)</td>
    <td><select data-si="D" data-sf="style" ${OC}>${stratOpts(styles, always.style)}</select></td>
    <td style="text-align:center;"><select data-si="D" data-sf="activity" ${OC} style="width:44px;">${activityOpts(always.activity)}</select></td>
    <td><select data-si="D" data-sf="aim_point" ${OC}>${stratOpts(aimPts, always.aim_point)}</select></td>
    <td><select data-si="D" data-sf="defense_point" ${OC}>${stratOpts(aimPts, always.defense_point)}</select></td>
  </tr>`;

  // Skills and injuries - built from raw dicts so post-merge data is always current
  const skillsText = formatSkillsText(w.skills).join('\n') || '(none)';
  const injText    = formatInjuriesText(w.injuries).join('\n') || '(none)';

  // League-controlled extras that the fighter card does not show (name, race, record, popularity and streak live in the card)
  const _extras = [
    S.league.flags.show_luck_factor && w.luck!=null ? `<span>Luck: <b>${w.luck}</b>/30</span>` : '',
    S.league.flags.show_max_hp ? `<span>Max HP: <b>${w.max_hp ?? '?'}</b></span>` : '',
    S.league.flags.show_favorite_weapon && w.favorite_weapon ? `<span>Favorite: <b>${esc(w.favorite_weapon)}</b></span>` : '',
    (w.monster_kills||0)>0 ? `<span style="color:var(--warn); font-weight:bold;">⚔ Monsters Slain: <b>${w.monster_kills}</b></span>` : ''
  ].filter(Boolean);
  const extrasLine = _extras.length
    ? `<div style="font-size:10px; color:var(--text-dim); margin-bottom:4px; display:flex; gap:14px; justify-content:flex-end; padding-right:4px; flex-wrap:wrap;">${_extras.join('')}</div>`
    : '';

  // Modern skin: fighter card; classic skin: the original Warrior header table and summary line.
  const _cardHtml = `<!-- Fighter card (display only; the fields below remain the editable record) -->
<div class="fcard">
  <div class="fcrest" style="--race:${raceColor(w.race)}" title="${esc(w.race || '')}"><svg viewBox="0 0 44 50" aria-hidden="true"><path d="M22 1 41 8v18c0 13-9 20-19 23C12 46 3 39 3 26V8z" fill="var(--race)" stroke="var(--gold)" stroke-width="2"/><path d="M22 4.5 38 10.5v15.5c0 11-7.5 17-16 20C13.500 43 6 37 6 26V10.500z" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 33 30 15"/><path d="M26 15h4v4"/><path d="M30 33 14 15"/><path d="M18 15h-4v4"/></g></svg></div>

/* ---- Tier helpers (cut-offs come from the server's game data) ---- */
const TIER_ORDER = ['CHAMPION','ELITES','EXPERTS','VETERANS','ADEPTS','INITIATES','ROOKIES','RECRUITS'];
const TIER_LABELS = {
  CHAMPION:'Champion', ELITES:'Elite', EXPERTS:'Expert', VETERANS:'Veteran',
  ADEPTS:'Adept', INITIATES:'Initiate', ROOKIES:'Rookie', RECRUITS:'Recruit'
};
// Display names for the immortal arenas. Internal keys above are shared with the
// server (matchmaking); only the label changes. Singular, to match TIER_LABELS.
const SPIRE_TIER_LABELS = {
  elite: {
    CHAMPION:'Sovereign', ELITES:'Demigod', EXPERTS:'Titan', VETERANS:'Spirelord',
    ADEPTS:'Spireblade', INITIATES:'Spireguard', ROOKIES:'Spireborn', RECRUITS:'Newblood'
  },
  veteran: {
    CHAMPION:'Wraithlord', ELITES:'Deathlord', EXPERTS:'Soulreaver', VETERANS:'Soulwarden',
    ADEPTS:'Soulblade', INITIATES:'Soulguard', ROOKIES:'Soulbound', RECRUITS:'Newdead'
  }
};
function tierLabel(key, arena) {
  const spire = SPIRE_TIER_LABELS[arena];
  return (spire && spire[key]) || TIER_LABELS[key] || key;
}
function warriorTier(w) {
  if (w.is_champion) return 'CHAMPION';
  // The recognition cut-offs are a server rule, delivered with the game data.
  const t = S.gd && S.gd.tiers;
  if (!t) return 'RECRUITS';
  const rec = w.recognition || 0;
  for (const [min, tier] of t.thresholds) if (rec >= min) return tier;
  return t.lowest;
}
function canChallengeTier(challengerTier, targetTier) {
  if (targetTier === 'CHAMPION') return false; // champion path is separate
  const ci = TIER_ORDER.indexOf(challengerTier);
  const ti = TIER_ORDER.indexOf(targetTier);
  return ci - 1 <= ti && ti <= ci;
}
function canChallengeChampion(challengerTier) {
  return true; // Server enforces top 2 tiers dynamically
}
