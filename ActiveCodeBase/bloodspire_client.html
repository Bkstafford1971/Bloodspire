async function saveFightOption(field, value) {
  const {teamId, wIdx} = S.sel;
  if (teamId == null || wIdx == null) return;
  try {
    const r = await API.put('/api/warrior', {
      team_id: teamId, warrior_idx: wIdx,
      [field]: value,
    });
    if (r.success) {
      const w = S.teams[teamId]?.warriors?.[wIdx];
      if (w) w[field] = value;
      if (S.teams[teamId]) await Store.writeTeam(S.teams[teamId]);
      refreshTree();
    } else {
      alert('Could not save: ' + r.error);
    }
  } catch(e) { console.warn('saveFightOption:', e); }
}

async function saveImmortalRunFlag(arena, teamId, warriorName, checked) {
  try {
    const r = await API.put('/api/warrior', {
      team_id: teamId,
      warrior_name: warriorName,
      arena: arena,
      run_this_turn: checked,
    });
    if (r.success) {
      // Update local immortalWarriors cache so the tree re-renders correctly
      const list = (S.immortalWarriors || {})[arena] || [];
      const iw = list.find(w => w.name === warriorName && w.team_id == teamId);
      if (iw) iw.run_this_turn = checked;
      refreshTree();
    } else {
      alert('Could not save: ' + r.error);
    }
  } catch(e) { console.warn('saveImmortalRunFlag:', e); }
}

// Cache for taunt trigger options (fetched once per session)
let _tauntTriggerOptions = null;

async function getTauntTriggers() {
  if (!_tauntTriggerOptions) {
    try {
      const r = await API.get('/api/taunt_triggers');
      if (r.success) {
        _tauntTriggerOptions = r.triggers || {};
      }
    } catch(e) {
      console.warn('getTauntTriggers:', e);
      _tauntTriggerOptions = {};
    }
  }
  return _tauntTriggerOptions;
}

function buildTauntsJeersSection(w, teamId, wIdx, isImmortal) {
  if (!w) return '<div style="padding:12px; color:var(--text-faint);">Warrior not found.</div>';

  const taunts = w.taunts_jeers || {};
  const maxTaunts = 3;
  const entries = Object.entries(taunts);
  // Pad with empty slots up to maxTaunts
  while (entries.length < maxTaunts) {
    entries.push(["", ""]);
  }
  const triggerOptions = _tauntTriggerOptions || {};
  const triggerHTML = Object.entries(triggerOptions)
    .map(([key, label]) => `<option value="${key}">${esc(label)}</option>`)
    .join('');

  // A taunt is stored per trigger, so two slots sharing a trigger would overwrite each other.
  // Triggers already used by another slot are shown but cannot be picked again.
  const usedTriggers = new Set(entries.slice(0, maxTaunts).map(e => e[0]).filter(Boolean));

  const slots = entries.slice(0, maxTaunts)
    .map((entry, i) => {
      const [trigger, text] = entry;
      return `
    <div style="border:1px solid var(--mid); padding:8px; margin-bottom:8px; border-radius:3px;">
      <div style="font-weight:bold; font-size:10px; color:var(--text-dim); margin-bottom:4px;">Taunt ${i+1}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr 24px; gap:8px; margin-bottom:6px;">
        <select id="taunt-trigger-${i}" onchange="onTauntTriggerChange(${teamId}, ${wIdx}, ${i}, this.value, ${isImmortal}, ${jsq(trigger)})" style="font-size:10px;">
          <option value="" ${trigger === '' ? 'selected' : ''}>-- None --</option>
          ${Object.entries(triggerOptions)
            .filter(([key, label]) => key !== 'Always' && key !== 'Always (Default Loop)')
            .map(([key, label]) => {
              const inUse = usedTriggers.has(key) && key !== trigger;
              return `<option value="${key}" ${trigger === key ? 'selected' : ''} ${inUse ? 'disabled' : ''}>${esc(label)}${inUse ? ' (used in another slot)' : ''}</option>`;
            }).join('')}
        </select>
        <input type="text" id="taunt-text-${i}" placeholder="Your taunt text (max 200)" maxlength="200" value="${esc(text)}"
               onchange="onTauntTextChange(${teamId}, ${wIdx}, ${i}, this.value, ${isImmortal}, ${jsq(trigger)})"
               style="font-size:10px;">
        <button onclick="clearTaunt(${teamId}, ${wIdx}, ${i}, ${isImmortal}, ${jsq(trigger)})" style="padding:2px 4px; font-size:9px;">✕</button>
      </div>
      <div style="font-size:9px; color:var(--text-dim);">
        ${trigger ? `Fires when: <b>${esc(triggerOptions[trigger] || trigger)}</b>` : 'Not set'}
      </div>
    </div>`;
    }).join('');

  return `
<div style="padding:8px 0; font-size:10px; color:var(--text-dim); margin-bottom:8px;">
  Set up to 3 custom taunts to appear in fights when specific events occur. Leave blank to disable.
</div>
${slots}`;
}

// Resolve which warrior a taunt edit applies to, or null if the current
// selection no longer matches (e.g. the user navigated away mid-edit).
function _tauntIdentifier(teamId, wIdx, isImmortal) {
  if (teamId == null) return null;
  const identifier = { team_id: teamId };
  if (isImmortal) {
    const sel = S.sel;
    if (!sel || sel.type !== 'immortal_warrior') return null;
    identifier.warrior_name = sel.warriorName;
    identifier.arena = S.selectedArena || 'elite';
  } else {
    if (wIdx == null) return null;
    identifier.warrior_idx = wIdx;
  }
  return identifier;
}

// Push one {trigger: text} change and mirror it locally. An empty text
// removes the trigger - that is how the server's taunts_jeers_update
// contract expresses a delete. Returns false if the write failed.
async function _persistTaunt(identifier, teamId, wIdx, isImmortal, slotIdx, trigger, text) {
  if (!trigger) return true;   // nothing addressable to write
  const r = await API.put('/api/warrior', {
    ...identifier,
    taunts_jeers_update: { slot: slotIdx, trigger, text: text || "" },
  });
  if (!r || !r.success) {
    alert('Could not save taunt: ' + ((r && r.error) || 'unknown error'));
    return false;
  }
  const w = isImmortal
    ? (S.immortalWarriors || {})[S.selectedArena]?.find(x => x.name === S.sel.warriorName)
    : S.teams[teamId]?.warriors?.[wIdx];
  const _apply = (tw) => {
    if (!tw) return;
    if (!tw.taunts_jeers) tw.taunts_jeers = {};
    if (text) tw.taunts_jeers[trigger] = text;
    else delete tw.taunts_jeers[trigger];
  };
  _apply(w);
  // The server holds the taunt now. Mirror it into the local team files too, otherwise
  // the next login reloads the old local copy and a later upload overwrites the server's.
  try {
    if (isImmortal) {
      const wname = S.sel?.warriorName;
      const arena = S.selectedArena || 'elite';
      const _patchTeam = (t) => {
        let hit = false;
        for (const sec of ['warriors', 'archived_warriors']) {
          for (const tw of (t?.[sec] || [])) {
            if (tw && tw.name === wname) { _apply(tw); hit = true; }
          }
        }
        return hit;
      };
      const at = await Store.readArenaTeam(arena, teamId).catch(() => null);
      if (at && _patchTeam(at)) await Store.writeArenaTeam(arena, at);
      if (S.teams?.[teamId] && _patchTeam(S.teams[teamId])) await Store.writeTeam(S.teams[teamId]);
    } else if (S.teams?.[teamId]) {
      await Store.writeTeam(S.teams[teamId]);
    }
  } catch (e) { console.warn('_persistTaunt local mirror:', e); }
  return true;
}

// The trigger dropdown changed. taunts_jeers is keyed by trigger, so a slot
// with a trigger but no text yet cannot be represented in it: writing an
// empty text reads as a delete server-side, and the next render would snap
// the dropdown back to "-- None --". So while there is no text we only
// release the slot's old key and deliberately skip the re-render, leaving
// the user's selection standing in the DOM until they type the taunt.
async function onTauntTriggerChange(teamId, wIdx, slotIdx, trigger, isImmortal, prevTrigger) {
  const identifier = _tauntIdentifier(teamId, wIdx, isImmortal);
  if (!identifier) return;
  const text = (document.getElementById(`taunt-text-${slotIdx}`)?.value || '').trim();
  try {
    if (prevTrigger && prevTrigger !== trigger) {
      if (!await _persistTaunt(identifier, teamId, wIdx, isImmortal, slotIdx, prevTrigger, '')) return;
    }
    if (trigger && text) {
      if (!await _persistTaunt(identifier, teamId, wIdx, isImmortal, slotIdx, trigger, text)) return;
    }
    if (S.teams[teamId]) await Store.writeTeam(S.teams[teamId]);
    if (!trigger || text) render();
  } catch (e) { console.warn('onTauntTriggerChange:', e); }
}

// The taunt text changed. Here an empty box *is* a deliberate removal.
async function onTauntTextChange(teamId, wIdx, slotIdx, text, isImmortal, prevTrigger) {
  const identifier = _tauntIdentifier(teamId, wIdx, isImmortal);
  if (!identifier) return;
  const trigger = document.getElementById(`taunt-trigger-${slotIdx}`)?.value || '';
  if (!trigger) return;   // no trigger chosen yet - nothing to key the text on
  try {
    if (prevTrigger && prevTrigger !== trigger) {
      if (!await _persistTaunt(identifier, teamId, wIdx, isImmortal, slotIdx, prevTrigger, '')) return;
    }
    if (!await _persistTaunt(identifier, teamId, wIdx, isImmortal, slotIdx, trigger, (text || '').trim())) return;
    if (S.teams[teamId]) await Store.writeTeam(S.teams[teamId]);
    render();
  } catch (e) { console.warn('onTauntTextChange:', e); }
}

// The ✕ button - drop whatever this slot currently holds. Needs the slot's
// saved trigger, since that is the key the delete has to target.
async function clearTaunt(teamId, wIdx, slotIdx, isImmortal, prevTrigger) {
  const identifier = _tauntIdentifier(teamId, wIdx, isImmortal);
  if (!identifier) return;
  try {
    if (prevTrigger) {
      if (!await _persistTaunt(identifier, teamId, wIdx, isImmortal, slotIdx, prevTrigger, '')) return;
      if (S.teams[teamId]) await Store.writeTeam(S.teams[teamId]);
    }
    render();
  } catch (e) { console.warn('clearTaunt:', e); }
}
function buildFightsTab(w, wIdx = null) {
  const wArena = w.current_arena || 'normal';
  const isImmortalW = wArena === 'elite' || wArena === 'veteran';
  // Only apply immortal-arena defaults when viewing FROM the immortal arena slot.
  // A promoted warrior still occupying a normal team slot (wIdx !== null) should
  // show all fights so the manager can read their final regular-arena fight.
  const isImmortalSlot = isImmortalW && wIdx === null;
  const allHistory = (w.fight_history || []).slice().reverse(); // newest first

  // Determine which arenas this warrior has fights in
  const arenaSet = new Set(allHistory.map(h => h.arena || 'normal'));
  const hasMultipleArenas = arenaSet.size > 1;

  // Default filter: immortal slot view defaults to that arena; normal slot always shows all
  const defaultFilter = isImmortalSlot ? wArena : 'all';
  const activeFilter = S.wFightFilter != null ? S.wFightFilter : defaultFilter;

  const history = activeFilter === 'all'
    ? allHistory
    : allHistory.filter(h => (h.arena || 'normal') === activeFilter);

  // Sort fights by type priority: champion, monster, blood_challenge, challenge, rivalry, peasant, unknown
  const typeOrder = { 'champion': 0, 'monster': 1, 'blood_challenge': 2, 'challenge': 3, 'rivalry': 4, 'peasant': 5 };
  const getTypeOrder = (type) => typeOrder[type] !== undefined ? typeOrder[type] : 999;

  history.sort((a, b) => {
    const turnDiff = (b.turn || 0) - (a.turn || 0);
    if (turnDiff !== 0) return turnDiff;
    return getTypeOrder(a.fight_type) - getTypeOrder(b.fight_type);
  });

  // Build filter bar if warrior has fights in multiple arenas
  const arenaLabel = { 'normal': 'Regular Arena', 'veteran': 'Soul Spire', 'elite': 'Elite Spire' };
  let filterBar = '';
  if (hasMultipleArenas) {
    const btnStyle = (key) => {
      const active = activeFilter === key;
      return `style="padding:2px 8px; font-size:10px; cursor:pointer; margin-right:3px;
        background:${active ? 'var(--sel)' : 'var(--tab-inactive-bg)'}; color:${active ? 'var(--sel-tx)' : 'var(--text)'};
        border:1px solid ${active ? 'var(--sel-b)' : 'var(--text-faint)'}; border-radius:2px;"`;
    };
    const filters = ['all', ...Array.from(arenaSet).sort()];
    const btns = filters.map(f => {
      const lbl = f === 'all' ? 'All Fights' : (arenaLabel[f] || f);
      return `<button ${btnStyle(f)} onclick="S.wFightFilter=${jsq(f)};refreshContent();">${lbl}</button>`;
    }).join('');
    filterBar = `<div style="margin-bottom:6px;">${btns}</div>`;
  }

  if (!history.length) {
    const noFightMsg = isImmortalSlot
      ? `${esc(w.name)} has not fought in this arena yet.`
      : `${esc(w.name)} has not fought yet.`;
    return `<div style="padding:10px;">
      ${filterBar}
      <b>Fight History</b><br><br>
      <span style="color:var(--text-dim);">${noFightMsg}</span>
      ${S.hideRecord ? '' : `<br><br>Record: ${esc(fmtRecord(w))} (${w.total_fights||0} fights)`}
    </div>`;
  }
  let rows = '';
  history.forEach((h, i) => {
    const res = S.hideRecord ? '-' : (h.result ? h.result.toUpperCase() : '-');
    const resColor = S.hideRecord ? 'var(--text)' : (res==='WIN' ? 'var(--text-good)' : res==='LOSS' ? 'var(--text-err)' : 'var(--text)');
    const slainNote  = (!S.hideRecord && h.warrior_slain)  ? ' <b style="color:var(--text-err)">(SLAIN)</b>'  : '';
    const killedNote = (!S.hideRecord && h.opponent_slain) ? ' <b style="color:var(--text-good)">(KILLED)</b>' : '';
    const fid = h.fight_id;
    const hArena = h.arena || 'normal';
    const viewBtn = fid
      ? `<button class="sm" onclick="openNarrative(${fid},${h.turn||0},${jsq(hArena)})">View Fight</button>`
      : `<span style="color:var(--text-faint); font-size:10px;">no log</span>`;

    // Special styling for champion fights
    const isChampFight = h.fight_type === 'champion';
    const champStyle = isChampFight ? 'background:color-mix(in srgb, var(--warn) 10%, transparent); border-left:3px solid var(--warn);' : '';
    const killMark = !S.hideRecord && h.is_kill ? '<b style="color:var(--text-good)">☠</b>' : '';
    const opponentDisplay = `${esc(h.opponent_name)}${killedNote}`;

    // Challenge direction: fight_type tells us it was a (blood) challenge, and
    // challenger_name (the warrior who issued it) tells us who started it.
    // Older fights recorded before this field existed will show blank here.
    const isChallengeFight = h.fight_type === 'challenge' || h.fight_type === 'blood_challenge';
    const iChallenged  = isChallengeFight && h.challenger_name && h.challenger_name === w.name;
    const theyChallenged = isChallengeFight && h.challenger_name && h.challenger_name === h.opponent_name;
    const checkMark = '<b style="color:var(--text-good)">✓</b>';
    const myChallengeMark = iChallenged ? checkMark : '';
    const theirChallengeMark = theyChallenged ? checkMark : '';

    if (isChampFight) {
      rows += `<tr style="${champStyle} font-weight:bold;">
        <td style="padding:2px 6px; text-align:center;">${h.turn||'-'}</td>
        <td style="padding:2px 6px; color:var(--warn);">
          ★ CHAMPION FIGHT ★<br>${opponentDisplay}${slainNote}
        </td>
        <td style="padding:2px 6px; color:var(--text-dim);">${esc(h.opponent_manager_name||'-')}</td>
        <td style="padding:2px 6px; text-align:center;">${esc(h.opponent_race||'')}</td>
        <td style="padding:2px 6px; text-align:center; color:${resColor}; font-weight:bold;">${res}</td>
        <td style="padding:2px 6px; text-align:center;">${killMark}</td>
        <td style="padding:2px 6px; text-align:center;">${myChallengeMark}</td>
        <td style="padding:2px 6px; text-align:center;">${theirChallengeMark}</td>
        <td style="padding:2px 6px; text-align:center;">${h.minutes||'-'} min</td>
        <td style="padding:2px 6px;">${viewBtn}</td>
      </tr>`;
    } else {
      rows += `<tr style="${champStyle}">
        <td style="padding:2px 6px; text-align:center;">${h.turn||'-'}</td>
        <td style="padding:2px 6px;">${esc(h.opponent_name)}</td>
        <td style="padding:2px 6px; color:var(--text-dim);">${esc(h.opponent_manager_name||'-')}</td>
        <td style="padding:2px 6px; text-align:center;">${esc(h.opponent_race||'')}</td>
        <td style="padding:2px 6px; text-align:center; color:${resColor}; font-weight:bold;">${res}${slainNote}</td>
        <td style="padding:2px 6px; text-align:center;">${killMark}</td>
        <td style="padding:2px 6px; text-align:center;">${myChallengeMark}</td>
        <td style="padding:2px 6px; text-align:center;">${theirChallengeMark}</td>
        <td style="padding:2px 6px; text-align:center;">${h.minutes||'-'} min</td>
        <td style="padding:2px 6px;">${viewBtn}</td>
      </tr>`;
    }
  });
  const recStr = isImmortalSlot
    ? `${w.arena_wins||0}-${w.arena_losses||0}-${w.arena_kills||0} in ${wArena === 'veteran' ? 'Soul Spire' : 'Elite Spire'}`
    : `${esc(fmtRecord(w))} - ${w.total_fights||0} fights (W-L-K)`;
  return `
<div style="padding:6px;">
  ${filterBar}<div style="font-weight:bold; margin-bottom:6px;">Fight History - ${esc(w.name)}</div>
  ${S.hideRecord ? '' : `<div style="color:var(--text-dim); margin-bottom:6px;">Record: ${recStr}</div>`}
  <div style="overflow-x:auto;">
  <table class="grid" style="font-size:11px;">
    <thead>
      <tr>
        <th style="width:40px;">Turn</th>
        <th style="min-width:140px;">Opponent</th>
        <th style="width:120px;">Manager</th>
        <th style="width:80px;">Race</th>
        <th style="width:60px;">Result</th>
        <th style="width:45px;">Kill</th>
        <th style="width:50px;" title="You issued this challenge">Challenge</th>
        <th style="width:50px;" title="They challenged you">Challenged</th>
        <th style="width:60px;">Duration</th>
        <th style="width:80px;">Narrative</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>
  </div>
</div>`;
}
function buildChallengesTab(team, w, wIdx) {
  const myTier = warriorTier(w);
  // Challenges never cross arenas, so every tier shown here belongs to this warrior's arena
  const TL = key => tierLabel(key, w.current_arena || 'normal');

  // Current challenges queued for this warrior. Normal-arena warriors are keyed by
  // active-roster slot index; immortal-arena warriors (Elite/Soul Spire) have no
  // reliable slot and are keyed by name. Prefer the freshly-loaded challenge team
  // (immortal teams aren't kept in S.teams), falling back to the passed-in team.
  const chTeam = (S.challengeTeam && S.challengeTeam.team_id == team.team_id) ? S.challengeTeam : team;
  const pendingMap   = chTeam.challenges || {};
  const challengeKey = (wIdx === null || wIdx === undefined) ? w.name : wIdx;
  const myPending   = pendingMap[challengeKey] || pendingMap[w.name] || [];
  const slotsUsed   = myPending.length;
  const slotsLeft   = 3 - slotsUsed;

  // Blood challenges available for this team
  const activeBloodChallenges = (team.blood_challenges || []).filter(bc =>
    bc.status === "active" && bc.turns_remaining > 0
  );

  // Blood challenges this warrior has already been assigned to carry
  const bloodList = (team.blood_challenges || []).filter(bc =>
    bc.status === "active" && bc.challenger_name === w.name
  );

  // Collect eligible opponents from the server-provided target list (includes AI teams)
  if (S.challengeTargets === null) {
    return '<div style="padding:20px; color:var(--text-dim);">Loading challenge targets...</div>';
  }

  if (S.challengeTargets.length === 0) {
    const offlineMsg = S._challengeTargetsOffline
      ? 'Server offline and no cached roster available. Connect to the league server to load challenge targets.'
      : 'No challenge targets available. Make sure you are logged into the league server.';
    return `<div style="padding:20px; color:var(--text-faint);">${offlineMsg}</div>`;
  }

  const opponents = [];
  const eligible_champ_tiers = S._eligibleChampionTiers || [];

  for (const ow of S.challengeTargets) {
    const owTier = warriorTier(ow);

    // For Champion: only show if challenger is in the top 2 eligible tiers
    if (ow.is_champion) {
      if (eligible_champ_tiers.includes(myTier)) {
        opponents.push({
          name: ow.name, teamName: ow.team_name, managerName: ow.manager_name || '-',
          race: ow.race || '-',
          record: S.hideRecord ? '-' : `${ow.wins||0}-${ow.losses||0}-${ow.kills||0}`,
          fights: ow.total_fights || 0, tier: 'CHAMPION', isChampion: true,
          recognition: ow.recognition || 0,
        });
      }
    } else if (canChallengeTier(myTier, owTier)) {
      opponents.push({
        name: ow.name, teamName: ow.team_name, managerName: ow.manager_name || '-',
        race: ow.race || '-',
        record: S.hideRecord ? '-' : `${ow.wins||0}-${ow.losses||0}-${ow.kills||0}`,
        fights: ow.total_fights || 0, tier: owTier, isChampion: false,
        recognition: ow.recognition || 0,

  const allOpponents = opponents;

  // ── Pending challenges rows ──────────────────────────────────────────────

  myPending.forEach(target => {

          ✕ Remove
        </button>
      </td>
    </tr>`;
  });
  bloodList.forEach(bc => {
    const bcTarget = bc.target_name || '?';
    const bcDead   = bc.dead_warrior_name || '?';
    const bcTurns  = bc.turns_remaining || 0;
    pendingRows += `
    <tr style="background:var(--row-alt-bg);">
      <td style="padding:4px 8px; font-weight:bold; color:var(--text-err);">${esc(bcTarget)}</td>
      <td style="padding:4px 8px; color:var(--text-err); font-size:11px;">
        Blood Challenge (avenge ${esc(bcDead)}) &mdash; ${bcTurns} turn${bcTurns === 1 ? '' : 's'} left
      </td>
      <td style="padding:4px 8px;">
        <button onclick="selectBloodChallengeChampion(${jsq(bcTarget)}, '')"
                style="color:var(--text-err); font-size:11px; padding:1px 6px; border-color:var(--b-asc) var(--b-injA) var(--b-injA) var(--b-asc);">
          ✕ Clear
        </button>
      </td>
    </tr>`;
  });

  // ── Available opponents rows ─────────────────────────────────────────────
  let oppRows = '';
  if (allOpponents.length) {
    // Apply sorting if active for this warrior, otherwise use tier-ordered default
    const displayOpponents = applyChallengeSort(allOpponents);
    displayOpponents.forEach(op => {
      const alreadyQueued = myPending.includes(op.name);
      let btn;
      if (alreadyQueued) {
        btn = `<button disabled style="font-size:11px; padding:1px 6px; opacity:0.5;">Queued</button>`;

  const tierAboveLabel = tierAbove ? TL(tierAbove) : null;
  const rangeDesc = tierAboveLabel
    ? `${TL(myTier)} and ${tierAboveLabel} tier warriors`

  const pendingSection = (myPending.length || bloodList.length) ? `

  // Blood challenges not yet assigned - this warrior can volunteer to carry one

  const wArenaBC = (w.current_arena || 'normal');

      bcItems += `
      <div style="display:flex; align-items:center; justify-content:space-between;
                  padding:6px 10px; border-bottom:1px solid var(--mid); background:var(--row-alt-bg);">
        <div>
          <span style="font-weight:bold; font-size:13px; color:var(--text-err);">${esc(targetName)}</span>
          <span style="color:var(--text-err); font-size:11px; margin-left:10px;">
            killed ${esc(deadName)} &mdash; ${turnsLeft} turn${turnsLeft === 1 ? '' : 's'} left
          </span>
        </div>
        <button onclick="selectBloodChallengeChampion(${jsq(targetName)}, ${jsq(w.name)})"
                style="background:var(--text-err); color:#fff; font-size:11px; font-weight:bold;
                       padding:4px 12px; border:1px solid var(--text-err); cursor:pointer; white-space:nowrap;">
          Blood Challenge
        </button>
      </div>`;
    });

    bloodChallengesSection = `
  <div class="group" style="margin:0 0 12px;">
    <span class="group-label" style="color:var(--b-injA);">Blood Challenges</span>

  </div>`;
  }

  // Build avoid managers section (team-level)
  const avoidMgrs = (team.avoid_managers || []).filter(m => m != null && typeof m === 'string');
  const otherManagers = [];
  if (S.challengeTargets) {

      if (mn && !seen.has(mn.toLowerCase()) && !avoidMgrs.some(am => am && am.toLowerCase() === mn.toLowerCase())) {
        seen.add(mn.toLowerCase());
        otherManagers.push(mn);
      }

    otherManagers.sort((a, b) => {

      return aStr.localeCompare(bStr);

  }

  let avoidMgrRows = avoidMgrs.length > 0
    ? avoidMgrs.map(m => `
      <div style="padding:4px 8px; margin-bottom:4px; background:var(--row-alt-bg); border:1px solid var(--mid); border-radius:2px; display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--text);">
        <span>${esc(m)}</span>

      </div>`).join('')
    : '<div style="padding:4px 8px; color:var(--text-dim); font-style:italic; font-size:11px;">(none set)</div>';

  let avoidMgrDropdown = '';

        <select id="avoid-mgr-sel" onchange="handleAddAvoidManager()" style="width:180px; font-size:11px; background:var(--input-bg); color:var(--text); border:1px solid var(--mid);">
          <option value="">(select a manager)</option>

        </select>`;
    } else {
      avoidMgrDropdown = '<div style="color:var(--text-dim); font-style:italic; font-size:11px;">Loading managers...</div>';
    }

    avoidMgrDropdown = '<div style="color:var(--text-dim); font-style:italic; font-size:11px;">Maximum (2) already set</div>';
  }

  const avoidManagersSection = `
  <div class="group" style="margin:0 0 12px;">

    <p style="font-size:11px; color:var(--text-dim); margin:4px 0 8px;">

  const avoidableWarriors = (S.challengeTargets || [])
    .filter(ow => {

// Apply the server/local challenge response. Immortal teams (Elite/Soul Spire) must
// never be written into S.teams, which holds normal rosters only; the updated copy is
// kept in S.challengeTeam (and mirrored to the arena file by the API layer) so queued
// challenges render immediately.
function _applyChallengeResult(arena, teamId, team) {
  if (!team) return;
  if (arena === 'elite' || arena === 'veteran') {
    S.challengeTeam = team;
  } else {
    S.teams[teamId] = team;
    S.challengeTeam = team;
  }
}

async function addChallenge(warriorName, targetName) {
  const {teamId} = S.sel;
  if (teamId == null) return;
  const arena = challengeArenaForSelection();
  try {
    const r = await API.post('/api/team/challenge', {
      team_id: teamId, warrior_name: warriorName, target_name: targetName, action: 'add', arena,
    });
    if (r.success) {
      _applyChallengeResult(arena, teamId, r.team);
      render();
    } else {
      alert('Could not add challenge: ' + (r.error || 'Unknown error'));
      console.error('Challenge error:', r);
    }
  } catch (e) {
    alert('Challenge error: ' + e.message);
    console.error('Challenge exception:', e);
  }
}

// Challenge sorting state - stored per warrior
let S_challenge_sort = {}; // { "warrior_name": "column_name" }

// Resolve the selected warrior's name for either a normal roster selection or an
// immortal (Elite/Soul Spire) selection, so challenge sorting works in both.
function _selectedWarriorName() {
  const sel = S.sel || {};
  if (sel.type === 'immortal_warrior') return sel.warriorName || null;
  if (sel.type === 'warrior') {
    const team = S.teams[sel.teamId];
    const w = team && team.warriors ? team.warriors[sel.wIdx] : null;
    return w ? w.name : null;
  }
  return null;
}

function sortChallenges(column) {
  const wName = _selectedWarriorName();
  if (!wName) {
    console.log('No warrior context available');
    return;
  }

  // Get the current sort state for this warrior
  const currentSort = S_challenge_sort[wName];

  // If clicking the same column again, reset to default (tier-ordered)
  // Otherwise, set the new sort column
  if (currentSort === column) {
    delete S_challenge_sort[wName];
    console.log('Clearing sort for warrior:', wName);
  } else {
    S_challenge_sort[wName] = column;
    console.log('Setting sort for warrior:', wName, 'to column:', column);
  }

  // Re-render to apply the new sort
  render();
}

function applyChallengeSort(opponents) {
  const wName = _selectedWarriorName();
  if (!wName) return opponents;

  const sortColumn = S_challenge_sort[wName];

  console.log('applyChallengeSort for warrior:', wName, 'sortColumn:', sortColumn, 'opponents count:', opponents.length);

  // If no sort is active, return in original tier-ordered form
  if (!sortColumn) {
    console.log('No sort active, returning original order');
    return opponents;
  }

  // Clone the array so we don't modify the original
  const sorted = [...opponents];

  sorted.sort((a, b) => {
    let aVal, bVal;

    switch(sortColumn) {
      case 'name':
        aVal = a.name || '';
        bVal = b.name || '';
        break;
      case 'team':
        aVal = a.teamName || '';
        bVal = b.teamName || '';
        break;
      case 'manager':
        aVal = a.managerName || '';
        bVal = b.managerName || '';
        break;
      case 'race':
        aVal = a.race || '';
        bVal = b.race || '';
        break;
      case 'record':
        // Parse "W-L-K" format and sort by wins ascending
        const parseRecord = (rec) => {
          const parts = (rec || '0-0-0').split('-');
          return parseInt(parts[0]) || 0;
        };
        aVal = parseRecord(a.record);
        bVal = parseRecord(b.record);
        // Numeric sort, ascending
        return aVal - bVal;
      case 'tier':
        // Sort by tier level (by TIER_ORDER index)
        const aTierIdx = TIER_ORDER.indexOf(a.tier) >= 0 ? TIER_ORDER.indexOf(a.tier) : 999;
        const bTierIdx = TIER_ORDER.indexOf(b.tier) >= 0 ? TIER_ORDER.indexOf(b.tier) : 999;
        return aTierIdx - bTierIdx;
      case 'recognition':
        aVal = a.recognition || 0;
        bVal = b.recognition || 0;
        // Numeric sort, ascending
        return aVal - bVal;
      default:
        return 0;
    }

    // String sort, ascending
    if (typeof aVal === 'string') {
      return aVal.localeCompare(bVal);
    }
    return 0;
  });

  console.log('Sorted opponents:', sorted.map(o => o.name));
  return sorted;
}

function toggleArchiveExpand(contentId, caretId) {
  const content = document.getElementById(contentId);
  const caret = document.getElementById(caretId);
  if (content && caret) {

    content.style.display = isHidden ? 'block' : 'none';
    caret.textContent = isHidden ? '▼' : '▶';
  }
}

function buildReplacementTab(w) {

  // HideRecord spoiler gate: block Replacement until the player reads the fatal fight.
  if (w.is_dead && S.hideRecord && w.death_fight_id_unread) {
    return `<div style="padding:14px; color:var(--text-dim);">
      <b style="color:var(--text-err);">⚔ A Warrior Has Fallen</b><br><br>
      One of your warriors did not survive their last fight.<br><br>

  // Restore from localStorage if in-memory state was lost or doesn't match current warrior

  if (!S.replacement || S.replacement.teamId !== teamId || S.replacement.wIdx !== wIdx) {
    try {
      const key = _getReplacementKey(teamId, wIdx);
      const stored = localStorage.getItem(key);

  const rs     = S.replacement;
  const hasRs  = rs && rs.teamId === teamId && rs.wIdx === wIdx;

  // Transcended warrior (died and called to The Soul Spire)

        <b>${esc(w.name)}</b> has earned their place among the immortals and departed the regular arena.

        A replacement warrior slot is now available. Roll up a new recruit below.
      </p>
      <button onclick="initReplacement(${teamId}, ${wIdx})">Roll Up Replacement Warrior</button>

  if (w.ascended_to_monster && !hasRs) {

      <div style="font-weight:bold; color:var(--b-asc); margin-bottom:10px; font-size:12px; background:color-mix(in srgb, var(--b-asc) 10%, transparent); padding:8px; border-left:3px solid var(--b-asc);">

    const headerHtml = w.is_retired

  const buildHeaderIcon = w.is_retired ? '🏆' : '✝';

/* ============================================================
   REPLACEMENT ROLL-UP ACTIONS
   ============================================================ */

function clearReplacementCache(teamId, wIdx) {
  const key = _getReplacementKey(teamId, wIdx);
  try {
    localStorage.removeItem(key);
    S.replacement = null;
    setMsg('Cache cleared -- try again!', 'ok');
    refreshContent();
  } catch(_) {
    setMsg('Failed to clear cache', 'err');
  }
}

async function initReplacement(teamId, wIdx) {
  const r = await API.get(`/api/rollup_single?team_id=${teamId}&warrior_idx=${wIdx}`);
  if (!r || !r.base || !r.roll_id) {
    setMsg('Could not roll up a replacement: ' + (r?.error || 'check server connection'), 'err');
    render();
    return;
  }
  S.replacement = {
    teamId, wIdx,
    base    : r.base,
    roll_id : r.roll_id,        // issued by the server; it checks your stats against this
    adds    : {},
    name    : '',
    race    : 'Human',
    gender  : 'Male',
    rerolled: !!r.rerolled,     // the server allows exactly one re-roll
  };
  _rpPersist();
  refreshContent();
}

async function rpReroll() {
  if (!S.replacement || S.replacement.rerolled) return;
  if (!confirm('Re-roll your base stats? This is a one-time option - you will have to build from the new roll regardless of the result.')) return;
  const r = await API.get(`/api/rollup_single?team_id=${S.replacement.teamId}&warrior_idx=${S.replacement.wIdx}&reroll=1`);
  if (!r || !r.base || !r.roll_id) {
    setMsg('Could not re-roll: ' + (r?.error || 'check server connection'), 'err');
    render();
    return;
  }
  // Mark rerolled and reset everything except slot identity
  S.replacement.base     = r.base;
  S.replacement.roll_id  = r.roll_id;
  S.replacement.adds     = {};
  S.replacement.rerolled = true;
  _rpSync();
  _rpPersist();
  refreshContent();
}

function rpAdj(key, delta) {
  const rs  = S.replacement;
  if (!rs)  return;
  const bv  = rs.base[key] || 8;
  const cur = rs.adds[key] || 0;
  const cap = Math.min(7, 25 - bv);
  const ptsLeft = 16 - Object.values(rs.adds).reduce((a,v) => a+v, 0);
  if (delta > 0 && (cur >= cap || ptsLeft <= 0)) return;
  if (delta < 0 && cur <= 0) return;
  rs.adds[key] = cur + delta;
  _rpSync(); _rpPersist(); refreshContent();
}

function rpReset() {
  if (!S.replacement) return;
  S.replacement.adds = {};
  _rpSync(); _rpPersist(); refreshContent();
}

function _rpSync() {
  const rs = S.replacement; if (!rs) return;
  const n = el('rp-name');   if (n)  rs.name   = n.value.trim();
  const r = el('rp-race');   if (r)  rs.race   = r.value;
  const g = el('rp-gender'); if (g)  rs.gender = g.value;
}

function _rpPersist() {
  try {
    if (S.replacement) {
      const key = _getReplacementKey(S.replacement.teamId, S.replacement.wIdx);
      localStorage.setItem(key, JSON.stringify(S.replacement));
    }
  } catch(_) {}
}

async function rpSave(teamId, wIdx) {
  _rpSync();
  const rs = S.replacement;
  if (!rs) return;
  const nm = el('rp-name')?.value?.trim() || rs.name;
  if (!nm) { alert('Enter a name for the replacement warrior.'); return; }
  const adds = rs.adds || {};
  const base = rs.base;
  const body = {
    team_id: teamId, warrior_idx: wIdx, roll_id: rs.roll_id,
    name: nm.toUpperCase(), race: rs.race, gender: rs.gender,
    strength    : (base.strength     || 8) + (adds.strength     || 0),
    dexterity   : (base.dexterity    || 8) + (adds.dexterity    || 0),
    constitution: (base.constitution || 8) + (adds.constitution || 0),
    intelligence: (base.intelligence || 8) + (adds.intelligence || 0),
    presence    : (base.presence     || 8) + (adds.presence     || 0),
    size        : (base.size         || 8) + (adds.size         || 0),
  };
  try {
    const r = await API.post('/api/warrior/replace', body);
    if (r.success) {
      S.teams[teamId] = r.team;
      const key = _getReplacementKey(teamId, wIdx);
      S.replacement   = null;
      try { localStorage.removeItem(key); } catch(_) {}
      S.sel  = {type:'team', teamId};
      S.wTab = 'stats';
      setMsg('Replacement warrior saved - ' + nm + ' joins the team.', 'ok');
      render();
    } else {
      alert('Error: ' + r.error);
    }
  } catch(e) { alert('Connection error: ' + e.message); }
}

/* ============================================================
   LOGIN ACTIONS
   ============================================================ */
async function doLogin() {
  try {
    const name     = el('l-name')?.value?.trim();
    const pass     = el('l-pass')?.value;
    const remember = el('l-remember')?.checked !== false; // default true
    if (!name || !pass) { setMsg('Please enter your manager name and password.', 'err'); render(); return; }

    // In Electron mode, ensure folder is selected (localStorage may have been cleared)
    if (window.electronAPI && !baseDir) {
      try {
        setMsg('Selecting save folder...', ''); render();
        const folderPath = await window.electronAPI.selectFolder();
        if (!folderPath) {
          setMsg('Save folder selection is required to log in.', 'err'); render(); return;
        }
        baseDir = folderPath;
        localStorage.setItem('bloodspire_base_dir', folderPath);
        S.folderReady = true;
        S.msg = '';
      } catch (e) {
        setMsg('Could not access save folder: ' + (e.message || e), 'err'); render(); return;
      }
    }

    // Auto-restore folder access inline so the user doesn't need a separate click.
    if (!S.folderReady && !S.isLocalBackend) {
      try {
        setMsg('Restoring folder access...', ''); render();
        const h = await fsaGetOrPickFolder();
        S.folderHandle    = h;
        S.folderReady     = true;
        S.savedFolderName = h.name;
        // Reload settings from the now-accessible folder (server URL, etc.)
        try {
          const settings = await Store.readSettings();
          if (settings?.server_url) S.serverUrl = settings.server_url;
        } catch (_) {}
        S.msg = '';
      } catch (e) {
        if (e && e.name === 'AbortError') { S.msg = ''; render(); return; }
        setMsg('Could not access save folder: ' + (e.message || e), 'err'); render(); return;
      }
    }

    let r = await API.post('/api/account/login', { manager_name: name, password: pass });
    if (!r.success && /No account on this machine/i.test(r.error || '')) {
      r.error = `No readable account.json was found in your saves folder (${baseDir || 'none selected'}). ` +
                `Use "Change..." to pick the folder that directly contains account.json.`;
    }

    // If local auth fails and a server URL is set, try authenticating against
    // the league server so users can recover their account on a new machine.
    // Also try window.location.origin as a fallback - remote players connecting
    // via HTTP may have S.serverUrl set to localhost if it wasn't corrected.
    if (!r.success) {
      const candidateUrls = [...new Set([
        S.serverUrl,
        (window.location.protocol !== 'file:' ? window.location.origin : null),
      ].filter(Boolean))];
      if (!candidateUrls.length) { setMsg(r.error || 'Login failed.', 'err'); render(); return; }
      setMsg('No local account found - checking league server...', ''); render();
      try {
        let serverReg = null, base = '';
        for (const candidate of candidateUrls) {
          base = candidate.replace(/\/+$/, '');
          serverReg = await fetch(base + '/api/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ manager_name: name, password: pass }),
          }).then(res => res.json()).catch(() => null);
          if (serverReg?.success) { S.serverUrl = base; break; }
        }
        // /api/register returns the existing manager_id when name+password match

        if (!serverReg?.success) {
          setMsg(serverReg?.error || r.error || 'Login failed.', 'err'); render(); return;
        }

        // Credentials confirmed - download teams from server
        const teamsResp = await fetch(base + '/api/team/get_my_team', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ manager_id: serverReg.manager_id, password: pass }),
        }).then(res => res.json()).catch(() => ({ success: false, teams: [] }));

        // Bootstrap a fresh local account.json from the server data
        const salt    = randomHex(16);
        const pw_hash = await sha256Hex(salt + pass);
        const teamIds = [];
        if (teamsResp?.success && teamsResp.teams?.length) {
          for (const td of teamsResp.teams) {
            if (td.team_id == null) continue;
            await Store.writeTeam(td);
            teamIds.push(td.team_id);
          }
        }
        const account = {
          id:                 serverReg.manager_id,
          manager_name:       serverReg.manager_name || name,
          email:              '',
          salt,
          password_hash:      pw_hash,
          team_ids:           teamIds,
          run_next_turn:      {},
          remember,
          password_plaintext: remember ? pass : '',
        };
        await Store.writeAccount(account);
        S._accountCache = account;

        // Persist league connection
        const settings = await Store.readSettings();
        settings.server_url   = S.serverUrl;
        settings.manager_id   = serverReg.manager_id;
        settings.manager_name = serverReg.manager_name || name;
        settings.password     = pass;
        await Store.writeSettings(settings);
        S.league.url         = S.serverUrl;
        S.league.managerId   = serverReg.manager_id;
        S.league.managerName = serverReg.manager_name || name;
        S.league.password    = pass;
   S.league.lastTurnRan = 0; // Reset for new account

        await idbUpdateMeta({ managerName: name, serverUrl: S.serverUrl, // This will be replaced by _persistAccount
                              rememberMe: remember, password: remember ? pass : '' });

   // S.account.run_next_turn is deprecated, remove it
        S.account = { id: account.id, manager_name: account.manager_name,
                      email: '', team_ids: teamIds };
        S.savedRememberMe = remember;

        const tc = teamIds.length;
        const teamMsg = tc ? `${tc} team${tc > 1 ? 's' : ''} downloaded.`
                           : 'No teams on server yet - create your first team.';
        setMsg(`Account recovered from server. ${teamMsg}`, 'ok');
        S.view = 'main';
        await loadTeams();
        await loadLeagueSettings(); // This will refresh S.league.managerId etc.
        await processDeletedTeams(serverReg.deleted_teams, serverReg.manager_id);
        render();
        await checkLeagueResetOnLogin();
        return;
      } catch (srvErr) {
        setMsg(r.error || 'Login failed.', 'err'); render(); return;
      }
    }

    if (!r.success) { setMsg(r.error, 'err'); render(); return; }

    S.account = {
      id:           r.id,
      manager_name: r.manager_name,
      email:        r.email || '',
      team_ids:     [...new Set(r.team_ids)],
    }
    S.savedRememberMe = remember; // This will be replaced by _persistAccount

    // Persist remember-me choice to account.json
    const acc = await _ensureAccountLoaded();
    if (acc) {
      acc.remember           = remember;
      acc.password_plaintext = remember ? pass : '';
      await _persistAccount(acc);
    }
    // Update client metadata in IDB (survives browser restart) // This will be replaced by _persistAccount
    await idbUpdateMeta({
      managerName: name,
      serverUrl: S.serverUrl,
      rememberMe: remember,
      password: remember ? pass : '',
    });

    // Persist any server URL change from the login screen to settings.json
    const settings = await Store.readSettings();
    if (settings.server_url !== S.serverUrl) {
      settings.server_url = S.serverUrl;
      await Store.writeSettings(settings);
    }
    S.league.url = S.serverUrl;

    S.view = 'main'; S.msg = '';
    await loadTeams();
    await loadLeagueSettings();
    await _loadLegacyTeams();
    // Sync S.account.id with the league manager ID if they differ - the league // This will be replaced by _persistAccount
    // settings ID is server-authoritative; the local account.json may be stale.
    if (S.league.managerId && S.account && S.account.id !== S.league.managerId) {
      S.account.id = S.league.managerId;
      const _syncAcc = await _ensureAccountLoaded();
      if (_syncAcc) { _syncAcc.id = S.league.managerId; await _persistAccount(_syncAcc); }
    }
    render();
    await checkLeagueResetOnLogin(); // This will refresh S.league.managerId etc.
    await checkAndDisplayAnnouncements();
    // r.deleted_teams is never set by the local login handler - fetch from the
    // league server instead so admin-deleted teams are cleaned up on login.
    if (!S.league.password) S.league.password = pass;
    {
      const mid = S.league.managerId || r.id;
      let pendingDeleted = r.deleted_teams;
      if (mid && S.serverUrl && !pendingDeleted?.length) {
        try {
          const base = S.serverUrl.replace(/\/+$/, '');
          const delResp = await fetch(base + '/api/check_deleted_teams', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ manager_id: String(mid) }),
          }).then(res => res.json()).catch(() => null);
          if (delResp?.success) pendingDeleted = delResp.deleted_teams;
        } catch (_) {}
      }
      await processDeletedTeams(pendingDeleted, mid);
    }
  } catch (err) {
    setMsg('Error: ' + (err.message || err), 'err'); render();
  }
}

async function processDeletedTeams(deletedTeams, managerId) {
  if (!deletedTeams || deletedTeams.length === 0) return;

  // Only process teams that are still present in the local account.
  // If the team was already removed (e.g. handled on a previous login), skip
  // the alert but still acknowledge so the server clears its entries.
  const localIds = (S.account?.team_ids || []).map(Number);
  const pending = deletedTeams.filter(d => localIds.includes(Number(d.team_id)));

  if (!pending.length) {
    API.post('/api/acknowledge_deleted_teams', { manager_id: managerId, password: S.league.password }).catch(() => {});
    return;
  }

  let message = "The following teams have been deleted by the host:\n";
  const deletedIds = [];

  for (const deleted of pending) {
    const tid = deleted.team_id;
    const tname = deleted.team_name || `Team ${tid}`;
    message += `- ${tname} (ID: ${tid})\n`;
    deletedIds.push(tid);

    // Delete local team file
    try {
      await Store.deleteTeam(tid);
      console.log(`Client: Deleted local file for team ${tid}`);
    } catch (e) {
      console.error(`Client: Failed to delete local team file ${tid}:`, e);
    }
  }

  // Update S.account.team_ids and persist
  if (S.account && S.account.team_ids) {
    S.account.team_ids = S.account.team_ids.filter(id => !deletedIds.includes(id));
    await _persistAccount(S.account);
  }

  alert(message + "\nYour client will now be updated.");

  // Acknowledge deletion with the server
  await API.post('/api/acknowledge_deleted_teams', { manager_id: managerId, password: S.league.password });

  await loadTeams(); // This will refresh S.teams based on S.account.team_ids
  render();
}

async function doCreateAccount() {
  const name  = el('n-name')?.value?.trim()  || '';
  const email = el('n-email')?.value?.trim() || '';
  const pass  = el('n-pass')?.value          || '';
  const pass2 = el('n-pass2')?.value         || '';

  if (!name)          { setMsg('Manager name is required.', 'err'); render(); return; }
  if (!pass)          { setMsg('Password is required.', 'err'); render(); return; }
  if (pass.length < 4){ setMsg('Password must be at least 4 characters.', 'err'); render(); return; }
  if (pass !== pass2) { setMsg('Passwords do not match.', 'err'); render(); return; }

  try {
    // Step 1 - server-side uniqueness check
    const check = await API.post('/api/check_manager_name', { manager_name: name });
    if (!check || check.available === false) {
      setMsg(check?.error || 'That manager name is already taken. Pick another.', 'err');
      render(); return;
    }

    // Step 2 - register on the league server to get a unique account ID
    const reg = await API.post('/api/register', { manager_name: name, password: pass });
    if (!reg || !reg.success) {
      setMsg(reg?.error || 'Registration failed.', 'err'); render(); return;
    }

    // Step 3 - persist to FSA account.json with a locally-derived hash
    const salt = randomHex(16);
    const pw_hash = await sha256Hex(salt + pass);
    const account = {
      id:            reg.manager_id,
      manager_name:  reg.manager_name,
      email:         email,
      salt:          salt,
      password_hash: pw_hash,
      team_ids:      [],
      run_next_turn: {},
      remember:      true,
      password_plaintext: pass,
    };
    await Store.writeAccount(account);
    S._accountCache = account;
    S.account = { id: account.id, manager_name: account.manager_name, email, team_ids: [] };

    // Update client metadata
    await idbUpdateMeta({
      managerName: name,
      serverUrl: S.serverUrl,
      rememberMe: true,
      password: pass,
    });

    // Step 4 - persist league connection info so upload/download work right away
    const settings = await Store.readSettings();
    settings.server_url    = S.serverUrl;
    settings.manager_id    = reg.manager_id;
    settings.manager_name  = reg.manager_name;
    settings.password      = pass;
    settings.last_turn_ran = 0; // Reset for new account
    await Store.writeSettings(settings);
    S.league.url         = S.serverUrl;
    S.league.managerId   = reg.manager_id;
    S.league.managerName = reg.manager_name;
    S.league.password    = pass;

    S.view = 'main';
    S.msg  = '';
    render();

    // Step 5 - auto-download a fresh random team roll so the user is ready
    // to build their first team right away (matches the design the user described).
    initCreateTeam();
  } catch (err) {
    setMsg('Could not reach the league server: ' + (err.message || err), 'err'); render();
  }
}

/* ============================================================
   SAVE WARRIOR CHANGES
   ============================================================ */
async function doSaveWarrior() {
  // Snapshot the edit counter: if it changes while we await the save, the user
  // kept editing and we must NOT rebuild the DOM from this (now-stale) snapshot.
  const savingSeq = _editSeq;
  // Use _pendingWarrior if available (handles the case where S.sel moved
  // to a different warrior before the debounce fired).
  const src = _pendingWarrior || S.sel;
  const {teamId, wIdx} = src;
  const isImmortalSave = src.type === 'immortal_warrior' || (src.warriorName && wIdx == null);
  if (teamId == null || (wIdx == null && !isImmortalSave)) return;
  // Hard gate: if the stats-tab inputs aren't in the DOM (user moved to a
  // different sub-tab like Fights/Fight Options/Archives while an
  // auto-save timer was still pending), bail. Otherwise we'd read a bunch of
  // nulls and save `trains: []`, `armor: 'None'`, etc. - wiping the warrior's
  // equipment and training. The switch-warrior path calls flushSave() *before*
  // the DOM is rebuilt, so this guard doesn't interfere with that case.
  if (!el('sel-armor')) { console.debug('[save] skipped - stats-tab DOM not present'); return; }

  // Collect strategies - numbered rows only saved if trigger is set
  const strats = [];
  for (let i = 0; i < 5; i++) {
    const trigger = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="trigger"]`);
    if (!trigger || trigger === 'None') continue;
    const style    = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="style"]`)    || 'Strike';
    const actRaw   = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="activity"]`);
    const activity = (actRaw !== '' && actRaw !== null) ? parseInt(actRaw) : 5;
    const aim      = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="aim_point"]`)    || 'None';
    const def      = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="defense_point"]`) || 'None';
    strats.push({trigger, style, activity, aim_point:aim, defense_point:def});
  }
  // D row - trigger is always "Always (Default Loop)" regardless of DOM
  const dStyle    = getSelectVal('#strat-body select[data-si="D"][data-sf="style"]')    || 'Strike';
  const dActRaw   = getSelectVal('#strat-body select[data-si="D"][data-sf="activity"]');
  const dActivity = (dActRaw !== '' && dActRaw !== null) ? parseInt(dActRaw) : 5;
  const dAim      = getSelectVal('#strat-body select[data-si="D"][data-sf="aim_point"]')    || 'None';
  const dDef      = getSelectVal('#strat-body select[data-si="D"][data-sf="defense_point"]') || 'None';
  strats.push({trigger:'Always (Default Loop)', style:dStyle, activity:dActivity, aim_point:dAim, defense_point:dDef});

  // Training
  const trains = [
    getSelectVal('#sel-t1'), getSelectVal('#sel-t2'), getSelectVal('#sel-t3')
  ].filter(t => t && t !== '-');

  const w = isImmortalSave
    ? ((S.immortalWarriors||{})[S.selectedArena||'elite']||[]).find(iw => iw.name === (src.warriorName || S.sel.warriorName))
    : S.teams[teamId]?.warriors?.[wIdx];
  const challengeMode = w && w.challenge_strategy_enabled || false;

  const body = {
    team_id     : teamId,
    ...(isImmortalSave ? {warrior_name: src.warriorName || S.sel.warriorName, arena: S.selectedArena || 'elite'} : {warrior_idx: wIdx}),
    armor       : el('sel-armor')?.value||'None',
    helm        : el('sel-helm')?.value||'None',
    primary_weapon   : el('sel-prim')?.value||'Open Hand',
    secondary_weapon : el('sel-sec')?.value||'Open Hand',
    backup_weapon    : el('sel-bkp')?.value||'None',
    trains,
    challenge_strategy_enabled: challengeMode,
  };

  // Save strategies to the appropriate field based on challenge mode
  if (challengeMode) {
    body.challenge_strategies = strats;
  } else {
    body.strategies = strats;
  }

  try {
    const r = await API.put('/api/warrior', body);
    if (r.success) {
      _pendingWarrior = null;  // clear after successful save
      // Sync the saved data back into the local warrior copy before reloadTeam reads
      // the local file. The PUT saves to the server's saves/ dir, which may differ
      // from the client's baseDir (e.g. a replacement warrior exists only locally).
      if (!isImmortalSave && S.teams[teamId]?.warriors?.[wIdx] != null) {
        const _lw = S.teams[teamId].warriors[wIdx];
        const _syncFields = ['armor','helm','primary_weapon','secondary_weapon',
                             'backup_weapon','trains','strategies','challenge_strategies',
                             'challenge_strategy_enabled'];
        for (const _f of _syncFields) { if (_f in body) _lw[_f] = body[_f]; }
        await Store.writeTeam(S.teams[teamId]);
      }
      await reloadTeam(teamId);
      if (isImmortalSave) await fetchImmortalWarriors({ sync: false });
      // Only rebuild the editable DOM if the user hasn't edited again since this
      // save started (the rebuild would clobber the newer selection) AND the saved
      // warrior differs from what is already on screen. When they match, the
      // rebuild changes nothing visible but causes the lag/flicker on dropdowns.
      if (_editSeq === savingSeq && !_savedMatchesScreen(body, _savedWarrior(teamId, wIdx, isImmortalSave, src))) refreshContent();
    } else if (r.error && r.error.includes('slot is empty')) {
      // Warrior not yet uploaded to the server (newly created replacement).
      // Save locally so setup is preserved; it will reach the server on next upload.
      _pendingWarrior = null;
      await LocalAPI.put('/api/warrior', body);
      await reloadTeam(teamId);
      if (_editSeq === savingSeq && !_savedMatchesScreen(body, _savedWarrior(teamId, wIdx, isImmortalSave, src))) refreshContent();
    } else {
      alert('Save failed: ' + r.error);
    }
  } catch (err) {
    alert('Connection error: ' + err.message);
  }
}

// The warrior object as it stands after a save + reload (roster or Spire).
function _savedWarrior(teamId, wIdx, isImmortalSave, src) {
  if (isImmortalSave) {
    const name = src.warriorName || (S.sel && S.sel.warriorName);
    return ((S.immortalWarriors || {})[S.selectedArena || 'elite'] || []).find(iw => iw.name === name) || null;
  }
  return S.teams[teamId]?.warriors?.[wIdx] || null;
}

// True when the saved warrior holds exactly what the save request sent, i.e. what
// the user already sees on screen. Any missing or differing field returns false so
// the caller falls back to the old behaviour (rebuild from saved data).
function _savedMatchesScreen(body, w) {
  if (!w) return false;
  for (const f of ['armor', 'helm', 'primary_weapon', 'secondary_weapon', 'backup_weapon']) {
    if (w[f] !== body[f]) return false;
  }
  if (JSON.stringify(w.trains || []) !== JSON.stringify(body.trains)) return false;
  const sf = body.challenge_strategies ? 'challenge_strategies' : 'strategies';
  const a = w[sf], b = body[sf];
  if (!Array.isArray(a) || a.length !== b.length) return false;
  return b.every((s, i) => ['trigger', 'style', 'activity', 'aim_point', 'defense_point']
    .every(k => String(a[i] && a[i][k]) === String(s[k])));
}

function getSelectVal(selector) { const e = document.querySelector(selector); return e ? e.value : null; }
function getInputVal(selector)  { const e = document.querySelector(selector); return e ? e.value : null; }

async function toggleChallengeStrategy() {
  const checkbox = el('challenge-strat-toggle');
  if (!checkbox) return;
  const enabled = checkbox.checked;
  const {teamId, wIdx} = S.sel;
  const isImmortal = S.sel.type === 'immortal_warrior';
  if (teamId == null || (wIdx == null && !isImmortal)) return;

  if (_saveTimer) await flushSave();

  if (isImmortal) {
    // The arena is required: the server only patches the Spire snapshot (which
    // /api/immortal_warriors serves back) when it knows which arena to write to.
    const _arena = S.selectedArena || 'elite';
    const _iw = ((S.immortalWarriors || {})[_arena] || []).find(x => x.name === S.sel.warriorName);
    if (_iw) _iw.challenge_strategy_enabled = enabled;
    // Show the other strategy set right away; saving and re-syncing happen behind it.
    refreshContent();
    const _r = await API.put('/api/warrior', {
      team_id: teamId, warrior_name: S.sel.warriorName, arena: _arena,
      challenge_strategy_enabled: enabled,
    });
    if (_r && _r.success === false) {
      if (_iw) _iw.challenge_strategy_enabled = !enabled;
      refreshContent();
      alert('Could not save the challenge strategy setting: ' + (_r.error || 'unknown error'));
      return;
    }
    await fetchImmortalWarriors({ sync: false });
    return;
  }

  // Get a FRESH warrior reference after the flush (flushSave → doSaveWarrior
  // → reloadTeam may have replaced S.teams[teamId] with a new object).
  const w = S.teams[teamId] && S.teams[teamId].warriors[wIdx];
  if (!w) return;

  // Set in-memory flag on the current (non-orphaned) warrior object.
  w.challenge_strategy_enabled = enabled;
  // Show the other strategy set right away; saving and reloading happen behind it.
  refreshContent();

  // Write to local disk BEFORE API.put so that reloadTeam below reads the
  // updated value regardless of whether the PUT goes to a remote server
  // (online) or the local offline handler. Without this, reloadTeam reads the
  // stale local file and overwrites the in-memory update with false.
  if (S.teams[teamId]) await Store.writeTeam(S.teams[teamId]);

  // Persist the flag to the server copy as well.
  await API.put('/api/warrior', {
    team_id: teamId,
    warrior_idx: wIdx,
    challenge_strategy_enabled: enabled,
  });

  // Reload from disk so S.teams reflects what was just written.
  await reloadTeam(teamId);
}

// Debounced auto-save: any change schedules a save 550ms later.
// _pendingWarrior tracks which warrior the pending save belongs to,
// so navigation to a different warrior flushes the right data first.
let _saveTimer      = null;
let _pendingWarrior = null;  // {teamId, wIdx} of the pending save
// Monotonic edit counter. Every edit bumps it; doSaveWarrior captures the value
// at the start of its async save and, when it finishes, skips the DOM-rebuilding
// refresh if a newer edit arrived meanwhile. Without this, a save that was
// in-flight while the user kept editing (e.g. clicking "fill all" right after a
// dropdown change) rebuilds the selects from the older snapshot and wipes the
// newer edit. See the "blinks then disappears" fill-all race.
let _editSeq = 0;

function scheduleAutoSave() {
  _editSeq++;
  if (S.sel && S.sel.type === 'warrior') {
    _pendingWarrior = {teamId: S.sel.teamId, wIdx: S.sel.wIdx};
  } else if (S.sel && S.sel.type === 'immortal_warrior') {
    _pendingWarrior = {teamId: S.sel.teamId, wIdx: null, warriorName: S.sel.warriorName, type: 'immortal_warrior'};
  }
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(doSaveWarrior, 550);
}

function fillAllTrains(slot) {
  const val = el(`sel-t${slot}`)?.value;
  if (val === null || val === undefined) return;
  ['sel-t1', 'sel-t2', 'sel-t3'].forEach(id => {
    const s = el(id);
    if (s) s.value = val;
  });
  scheduleAutoSave();
}

// Flush any pending save immediately (called before navigation)
async function flushSave() {
  if (!_saveTimer) return;
  clearTimeout(_saveTimer);
  _saveTimer = null;
  await doSaveWarrior();
}

async function doSaveTemplate() {
  const name = el('template-name-input')?.value?.trim();
  if (!name) { alert('Please enter a template name'); return; }

  const w = S.sel && S.sel.type === 'warrior' ? S.teams[S.sel.teamId].warriors[S.sel.wIdx] : null;
  if (!w) { alert('No warrior selected'); return; }

  try {
    // Ensure directory exists
    const dirRes = await window.electronAPI.ensureDir(TEMPLATES_DIR);
    if (!dirRes.success) throw new Error('Failed to create templates directory');

    // Collect strategies (same logic as doSaveWarrior)
    const strats = [];
    for (let i = 0; i < 5; i++) {
      const trigger = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="trigger"]`);
      if (!trigger || trigger === 'None') continue;
      const style    = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="style"]`) || 'Strike';
      const actRaw   = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="activity"]`);
      const activity = (actRaw !== '' && actRaw !== null) ? parseInt(actRaw) : 5;
      const aim      = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="aim_point"]`) || 'None';
      const def      = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="defense_point"]`) || 'None';
      strats.push({trigger, style, activity, aim_point:aim, defense_point:def});
    }
    // D row
    const dStyle    = getSelectVal('#strat-body select[data-si="D"][data-sf="style"]') || 'Strike';
    const dActRaw   = getSelectVal('#strat-body select[data-si="D"][data-sf="activity"]');
    const dActivity = (dActRaw !== '' && dActRaw !== null) ? parseInt(dActRaw) : 5;
    const dAim      = getSelectVal('#strat-body select[data-si="D"][data-sf="aim_point"]') || 'None';
    const dDef      = getSelectVal('#strat-body select[data-si="D"][data-sf="defense_point"]') || 'None';
    strats.push({trigger:'Always (Default Loop)', style:dStyle, activity:dActivity, aim_point:dAim, defense_point:dDef});

    // Build template object
    const template = {
      name,
      armor: el('sel-armor')?.value || 'None',
      helm: el('sel-helm')?.value || 'None',
      primary_weapon: el('sel-prim')?.value || 'Open Hand',
      secondary_weapon: el('sel-sec')?.value || 'Open Hand',
      backup_weapon: el('sel-bkp')?.value || 'None',
      strategies: strats
    };

    // Write file
    const filePath = `${TEMPLATES_DIR}/${name}.json`;
    const writeRes = await window.electronAPI.writeJson(filePath, template);
    if (!writeRes.success) throw new Error('Failed to save template');

    el('save-template-modal').remove();
    alert(`Template "${name}" saved successfully!`);

    // Refresh dropdown if it's open
    updateTemplatesDropdown();
  } catch (err) {
    alert('Error saving template: ' + err.message);
  }
}

async function showTemplatesDropdown() {
  const btn = el('templates-btn');
  const dropdownId = 'templates-dropdown';
  const existing = el(dropdownId);

  if (existing) {
    existing.remove();
    return;
  }

  try {
    // Load templates list
    const listRes = await window.electronAPI.listDir(TEMPLATES_DIR);
    const templates = (listRes.success && listRes.files)
      ? listRes.files.filter(f => f.endsWith('.json')).map(f => f.slice(0, -5))
      : [];

    if (!btn) return;
    const rect = btn.getBoundingClientRect();

    // Build dropdown panel
    const dropdown = document.createElement('div');
    dropdown.id = dropdownId;
    dropdown.style.cssText = `position:fixed;top:${rect.bottom}px;left:${rect.left}px;
      background:var(--bg);border:1px solid var(--mid);z-index:8001;
      min-width:200px;max-width:300px;box-shadow:0 2px 8px rgba(0,0,0,0.3);`;

    // Save option
    const saveDiv = document.createElement('div');
    saveDiv.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--mid);cursor:pointer;font-size:11px;display:flex;align-items:center;';
    saveDiv.innerHTML = '💾 Save as Template';
    saveDiv.onclick = () => { dropdown.remove(); saveStrategyTemplate(); };
    dropdown.appendChild(saveDiv);

    // Templates list
    if (templates.length === 0) {
      const emptyDiv = document.createElement('div');
      emptyDiv.style.cssText = 'padding:6px 8px;font-size:11px;color:var(--text-faint);';
      emptyDiv.textContent = 'No templates saved';
      dropdown.appendChild(emptyDiv);
    } else {
      templates.forEach(tpl => {
        const tplDiv = document.createElement('div');
        tplDiv.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;';
        tplDiv.innerHTML = `<span>📂 ${esc(tpl)}</span>`;

        const actionSpan = document.createElement('span');
        actionSpan.style.cssText = 'display:flex;gap:4px;';

        // Load button
        const loadBtn = document.createElement('button');
        loadBtn.style.cssText = 'min-width:0;width:50px;height:18px;font-size:10px;padding:0;background:var(--bg);border:1px solid var(--mid);cursor:pointer;';
        loadBtn.textContent = 'Load';
        loadBtn.onclick = (e) => { e.stopPropagation(); dropdown.remove(); loadTemplate(tpl); };
        actionSpan.appendChild(loadBtn);

        // Delete button
        const delBtn = document.createElement('button');
        delBtn.style.cssText = 'min-width:0;width:20px;height:18px;font-size:9px;padding:0;background:var(--bg);border:1px solid var(--mid);cursor:pointer;color:var(--warn);font-weight:bold;';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => { e.stopPropagation(); deleteTemplate(tpl); };
        actionSpan.appendChild(delBtn);

        tplDiv.appendChild(actionSpan);
        dropdown.appendChild(tplDiv);
      });
    }

    document.body.appendChild(dropdown);

    // Close dropdown when clicking outside
    const closeHandler = (e) => {
      if (!dropdown.contains(e.target) && e.target !== btn) {
        dropdown.remove();
        document.removeEventListener('click', closeHandler);
      }
    };
    setTimeout(() => document.addEventListener('click', closeHandler), 0);
  } catch (err) {
    alert('Error loading templates: ' + err.message);
  }
}

  const dropdown = el('templates-dropdown');

async function applyTemplate(template) {
  if (!template || !template.strategies) {
    alert('Invalid template');
    return;
  }

  try {
    const includeGear = el('load-template-gear')?.checked ?? true;

    // Apply gear if checked
    if (includeGear) {
      const setSelect = (id, val) => {
        const elem = el(id);
        if (elem) elem.value = val || 'None';
      };
      setSelect('sel-armor', template.armor);
      setSelect('sel-helm', template.helm);
      setSelect('sel-prim', template.primary_weapon);
      setSelect('sel-sec', template.secondary_weapon);
      setSelect('sel-bkp', template.backup_weapon);
    }

    // Apply strategies - separate into numbered rows and D row
    const isDefaultTrigger = t => t === 'Always' || t === 'Always (Default Loop)';
    const dRow = template.strategies.find(s => isDefaultTrigger(s.trigger));
    const numRows = template.strategies.filter(s => !isDefaultTrigger(s.trigger));

    // Apply numbered rows (0-4)
    for (let i = 0; i < 5; i++) {
      const s = numRows[i] || { trigger:'', style:'', activity:'', aim_point:'', defense_point:'' };

      const setSelect = (selector, val) => {
        const elem = document.querySelector(selector);
        if (elem) elem.value = val || '';
      };

      setSelect(`#strat-body select[data-si="${i}"][data-sf="trigger"]`, s.trigger);
      setSelect(`#strat-body select[data-si="${i}"][data-sf="style"]`, s.style);
      setSelect(`#strat-body select[data-si="${i}"][data-sf="activity"]`, s.activity);
      setSelect(`#strat-body select[data-si="${i}"][data-sf="aim_point"]`, s.aim_point);
      setSelect(`#strat-body select[data-si="${i}"][data-sf="defense_point"]`, s.defense_point);
    }

    // Apply D row
    if (dRow) {
      const setSelect = (selector, val) => {
        const elem = document.querySelector(selector);
        if (elem) elem.value = val || '';
      };

      setSelect('#strat-body select[data-si="D"][data-sf="style"]', dRow.style);
      setSelect('#strat-body select[data-si="D"][data-sf="activity"]', dRow.activity);
      setSelect('#strat-body select[data-si="D"][data-sf="aim_point"]', dRow.aim_point);
      setSelect('#strat-body select[data-si="D"][data-sf="defense_point"]', dRow.defense_point);
    }

    el('load-template-modal').remove();
    scheduleAutoSave();
  } catch (err) {
    alert('Error applying template: ' + err.message);
  }
}

async function deleteTemplate(templateName) {
  if (!confirm(`Delete template "${templateName}"?`)) return;

  try {
    const delRes = await window.electronAPI.deleteFile(`${TEMPLATES_DIR}/${templateName}.json`);
    if (!delRes.success) throw new Error('Failed to delete template');
    updateTemplatesDropdown();
  } catch (err) {
    alert('Error deleting template: ' + err.message);
  }
}
