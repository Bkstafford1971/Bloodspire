/* ============================================================
   API - dual-layer router
   ============================================================
   Calls to league-server endpoints use the configured S.serverUrl.
   Calls that used to hit gui_server are now handled locally by the
   LocalAPI table, which talks to the FSA-backed Store.

   Call sites in the rest of the file continue to use the same
   path strings they used against gui_server, so most UI code is
   untouched - only the routing changes. */

// Paths that are still served by the league server (remote). Everything
// else routed through API.* is handled locally via LocalAPI.
const REMOTE_GETS  = new Set([
  // '/api/game_data' is handled by LocalAPI (cache-first, remote fallback)
  '/api/flags',
  '/api/status',
  '/api/standings',
  '/api/fight_log',
  '/api/latest_newsletter',
  '/api/progress',
]);
// Note: /api/taunt_triggers is intentionally NOT in REMOTE_GETS. Like
// /api/game_data it is handled by LocalAPI remote-first with a cache
// fallback, so the dropdown still populates when the league server was
// unreachable at startup.
// Note: /api/newsletter?turn=N is intentionally NOT in REMOTE_GETS. It
// reads the local FSA cache written by doLeagueDownloadAll - that way
// users can still open old newsletters offline. The live download from
// the league server happens inline in doLeagueDownloadAll via direct fetch.
// Note: /api/rollup and /api/rollup_single are *POST* endpoints on the
// league server but older call sites use API.get(). The translator in
// API.get() below sends them as POSTs - do not add them to REMOTE_GETS
// or the GET branch will intercept first and the server returns 404.
const REMOTE_POSTS = new Set([
  '/api/check_manager_name',
  '/api/register',
  '/api/team/create',
  '/api/upload',
  '/api/team/withdraw',
  '/api/league/check_reset',
  '/api/league/acknowledge_reset',
]);

const REMOTE_PUTS = new Set([
  '/api/warrior',
]);

function _splitPath(pathWithQs) {
  const i = pathWithQs.indexOf('?');
  if (i < 0) return [pathWithQs, ''];
  return [pathWithQs.slice(0, i), pathWithQs.slice(i + 1)];
}
function _parseQS(qs) {
  const out = {};
  if (!qs) return out;
  for (const part of qs.split('&')) {
    if (!part) continue;
    const eq = part.indexOf('=');
    if (eq < 0) out[decodeURIComponent(part)] = '';
    else out[decodeURIComponent(part.slice(0, eq))] = decodeURIComponent(part.slice(eq + 1));
  }
  return out;
}
async function _remoteFetch(method, path, body, overrideBase, _attempt = 0) {
  let base = (overrideBase || S.serverUrl || '').trim();
  if (!base) {
    return { success: false, error: 'Server URL is empty. Enter it on the login screen.' };
  }
  if (!/^https?:\/\//i.test(base)) {
    return { success: false, error: `Server URL "${base}" is missing http:// or https:// - fix it on the login screen.` };
  }
  const url = base.replace(/\/+$/,'') + path;
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), 20000); // 20-second timeout
  const opts = { method, headers: {}, signal: ctrl.signal };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.headers['Accept'] = 'application/json';
    // Tell the server which client this is (in the body, not a header, so old servers' CORS rules still allow it).
    const _vb = (body && typeof body === 'object' && !Array.isArray(body) && !('client_version' in body)) ? { ...body, client_version: CLIENT_VERSION } : body;
    opts.body = JSON.stringify(_vb);
  }
  console.log(`[API Request] ${method} ${url}`, body);
  let r;
  try {
    r = await fetch(url, opts);
    clearTimeout(tid);
  } catch (e) {
    clearTimeout(tid);
    if (e.name === 'AbortError') throw new Error(`Request to ${url} timed out.`);
    throw new Error(`Could not reach ${url} - ${e.message || e}.`);
  }

  // Handle server-side crashes (502/503/504) before parsing JSON
  if (!r.ok && r.status >= 500) {
    const text = await r.text().catch(() => '');
    console.error(`[Server Error ${r.status}]`, text);
    return { success: false, error: `Server Error (HTTP ${r.status}) - The Arena server is currently unable to process this request.` };
  }

  try {
    const j = await r.json();
    // The server received a body it could not parse (bytes damaged in transit). The same request
    // normally goes through on a retry, so resend it automatically a couple of times.
    if (j && j.code === 'unreadable_body' && _attempt < 2) {
      await new Promise(res => setTimeout(res, 800 * (_attempt + 1)));
      return await _remoteFetch(method, path, body, overrideBase, _attempt + 1);
    }
    return j;
  }
  catch (e) { return { success: false, error: `Non-JSON response (HTTP ${r.status}) from ${url}` }; }
}

const API = {
  async get(path) {
    const [p, qs] = _splitPath(path);
    if (REMOTE_GETS.has(p)) {
      // Forward GET to the league server (still a GET there)
      return await _remoteFetch('GET', path);
    }
    // /api/rollup and /api/rollup_single are POSTs on the league server
    // but older call sites used .get(...). Translate.
    // The server issues (and remembers) every roll, so it needs to know who is asking.
    if (p === '/api/rollup' || p === '/api/rollup_single') {
      return await _remoteFetch('POST', p, {
        ..._parseQS(qs),
        manager_id: S.league.managerId || (S.account && S.account.id) || '',
        password  : S.league.password || '',
      });
    }
    return await LocalAPI.get(p, _parseQS(qs));
  },
  async post(path, body) {
    const [p] = _splitPath(path);
    if (REMOTE_POSTS.has(p)) return await _remoteFetch('POST', p, body);
    return await LocalAPI.post(p, body || {});
  },
  async put(path, body) {
    const [p] = _splitPath(path);
    // The server only changes a team for its own manager, so every call says who is asking.
    if (REMOTE_PUTS.has(p)) return await _remoteFetch('PUT', p, {
      ...body,
      manager_id: S.league.managerId || (S.account && S.account.id) || '',
      password  : S.league.password || '',
    });
    return await LocalAPI.put(p, body || {});
  },
};

/* ============================================================
   LocalAPI - FSA-backed handlers for former gui_server paths
   ============================================================ */
async function _ensureAccountLoaded() {
  if (S._accountCache && S._accountCache.manager_name) return S._accountCache;
  const a = await Store.readAccount();
  // readAccount() gives {} when account.json is missing or unreadable. That is not an
  // account: caching it made every login fail with 'Manager name does not match' until
  // the app was restarted, even after the player picked the right folder.
  if (a && a.manager_name) { S._accountCache = a; return a; }
  S._accountCache = null;
  return null;
}
async function _persistAccount(acc) {
  S._accountCache = acc;
  await Store.writeAccount(acc);
}

const LocalAPI = {
  async get(path, qs) {
    // ── Game data - server-first (always fetch fresh to get updates) ────────
    if (path === '/api/game_data') {
      try {
        // Always try to fetch fresh from server first
        const fresh = await _remoteFetch('GET', '/api/game_data');
        if (fresh && !fresh.error) {
          await Store.writeGameData(fresh);
          return fresh;
        }
      } catch (err) {
        // If server fetch fails, try cache as fallback
      }
      // Fallback to cache if server unavailable
      const cached = await Store.readGameData();
      return cached || {};
    }

    // ── Taunt/jeer trigger list (remote-first, cached game_data fallback) ─
    if (path === '/api/taunt_triggers') {
      try {
        const fresh = await _remoteFetch('GET', '/api/taunt_triggers');
        if (fresh && fresh.success && fresh.triggers) return fresh;
      } catch (err) {
        // Server unreachable - derive the list from cached game data below.
      }
      // The server builds this from strategy.ALL_STRATEGY_TRIGGERS, which is
      // game_data's trigger list minus the "None" sentinel plus "Always".
      // Deriving it here keeps the dropdown usable offline.
      const gd = await Store.readGameData();
      const base = (gd && Array.isArray(gd.triggers)) ? gd.triggers : [];
      if (!base.length) return { success: false, error: 'No cached trigger list available' };
      const list = ['Always', ...base.filter(t => t && t !== 'None' && t !== 'Always')];
      return { success: true, triggers: Object.fromEntries(list.map(t => [t, t])) };
    }

    // ── Session / account info (read-side) ───────────────────────────────
    if (path === '/api/session') {
      const a = await _ensureAccountLoaded();
      if (!a) return {};
      return {
        manager_name: a.manager_name || '',
        password    : a.remember ? (a.password_plaintext || '') : '',
        pw_stored   : '',
      };
    }

    if (path === '/api/account') {
      const a = await _ensureAccountLoaded();
      if (!a) return { success: false, error: 'Account not found.' };
      return { success: true, account: a };
    }

    // ── Team lookup ──────────────────────────────────────────────────────
    if (path === '/api/team') {
      const tid = parseInt(qs.id || '0', 10);
      const { team } = await _readTeamAnyFolder(tid);
      if (!team) return { success: false, error: 'Team not found.' };
      return { success: true, team };
    }

    // ── Newsletters (local cache of downloaded newsletters) ──────────────
    if (path === '/api/newsletters') {
      return { turns: await Store.listNewsletterTurns() };
    }
    if (path === '/api/newsletter') {
      // Local cached newsletter written by doLeagueDownloadAll. The UI
      // historically reads the `text` field (from the old gui_server shape);
      // the league server uses `newsletter`. Return both so any reader works.
      const turn = parseInt(qs.turn || '0', 10);
      const content = await Store.readNewsletter(turn);
      return {
        success:    !!content,
        turn,
        text:       content || '',
        newsletter: content || '',
      };
    }
    if (path === '/api/league/latest_newsletter') {
      return await _remoteFetch('GET', '/api/latest_newsletter');
    }

    // ── League settings (FSA-backed) ─────────────────────────────────────
    if (path === '/api/league_settings') {
      const s = await Store.readSettings();
      return {
        url         : s.server_url      || S.serverUrl || DEFAULT_SERVER_URL,
        managerId   : s.manager_id      || '',
        managerName : s.manager_name    || '',
        password    : s.password        || '',
        lastUpload  : s.last_upload     || '',
        lastDownload: s.last_download   || '',
        lastTurnRan : s.last_turn_ran   || 0,
        scoutReports: s.scout_reports   || [],
      };
    }

    if (path === '/api/fight/narrative') {
      const fightId = parseInt(qs.id || '0', 10);
      const turn    = parseInt(qs.turn || '0', 10);
      const arena   = qs.arena || 'normal';
      if (!fightId) return { success: false, error: 'Fight id required.' };
      const narrative = await Store.readFightLog(fightId, turn, arena);
      if (!narrative) return { success: false, error: 'Fight log not found.' };
      return { success: true, narrative, fight_id: fightId };
    }

    // ── Scout / Challenge targets - forwarded to the league server, with
    //    the current manager's password auto-injected from league settings.
    if (path === '/api/scout/status') {
      const mid   = qs.manager_id || S.league.managerId || '';
      const pw    = encodeURIComponent(S.league.password || '');
      const arena = qs.arena || (S.selectedArena || 'normal');
      return await _remoteFetch('GET',
        `/api/scout/status?manager_id=${encodeURIComponent(mid)}&password=${pw}&arena=${arena}`);
    }
    if (path === '/api/scout/targets') {
      const mid   = qs.manager_id || S.league.managerId || '';
      const pw    = encodeURIComponent(S.league.password || '');
      const arena = qs.arena || (S.selectedArena || 'normal');
      return await _remoteFetch('GET',
        `/api/scout/targets?manager_id=${encodeURIComponent(mid)}&password=${pw}&arena=${arena}`);
    }
    if (path === '/api/scout/report') {
      const mid   = qs.manager_id   || S.league.managerId || '';
      const wname = qs.warrior_name || '';
      const pw    = encodeURIComponent(S.league.password || '');
      return await _remoteFetch('GET',
        `/api/scout/report?manager_id=${encodeURIComponent(mid)}` +
        `&password=${pw}&warrior_name=${encodeURIComponent(wname)}`);
    }
    if (path === '/api/challenge/targets') {
      const mid   = qs.manager_id || S.league.managerId || '';
      const tid   = qs.team_id    || '';
      const pw    = encodeURIComponent(S.league.password || '');
      const arena = qs.arena || (S.selectedArena || 'normal');
      return await _remoteFetch('GET',
        `/api/challenge/targets?manager_id=${encodeURIComponent(mid)}` +
        `&password=${pw}&team_id=${encodeURIComponent(tid)}&arena=${arena}`);
    }

    // ── Progress (local stub - no local turn runner any more) ────────────
    if (path === '/api/progress') return { running: false, done: 0, total: 0, message: '' };

    return { success: false, error: `Unknown local GET ${path}` };
  },

  async post(path, body) {
    // ── Session save - persist login credentials locally ────────────────
    if (path === '/api/session/save') {
      const a = (await _ensureAccountLoaded()) || {};
      a.manager_name       = body.manager_name || a.manager_name || '';
      a.remember           = !!body.password;
      a.password_plaintext = body.password || '';
      await _persistAccount(a);
      return { success: true };
    }

    // ── League settings save ─────────────────────────────────────────────
    if (path === '/api/league_settings') {
      const s = await Store.readSettings();
      if (body.url)          s.server_url    = body.url;
      if (body.managerId)    s.manager_id    = body.managerId;
      if (body.managerName)  s.manager_name  = body.managerName;
      if (body.password)     s.password      = body.password;
      if (body.lastUpload)   s.last_upload   = body.lastUpload;
      if (body.lastDownload) s.last_download = body.lastDownload;
      if (body.lastTurnRan !== undefined) s.last_turn_ran = body.lastTurnRan;
      // Explicit undefined check (not truthiness) - an empty array is a valid,
      // intentional value here (clearing reports on a turn with no new scouting).
      if (body.scoutReports !== undefined) s.scout_reports = body.scoutReports;
      await Store.writeSettings(s);
      if (body.url) S.serverUrl = body.url;
      return { success: true };
    }

    // ── Apply league results (merge + save locally) ──────────────────────
    if (path === '/api/apply_league_results') {
      const tid    = parseInt(body.team_id || 0, 10);
      const result = body.result || {};
      const local  = await Store.readTeam(tid);
      if (!local) return { success: false, error: 'Local team not found.' };
      const merged = mergeResults(local, result, { rerun: !!body.rerun });
      // When HideRecord is on, tag newly-slain warriors so the Replacement tab
      // stays locked until the player opens the fatal fight narrative.
      if (S.hideRecord) {
        const bouts = Array.isArray(result.bouts) ? result.bouts : [];
        for (const b of bouts) {
          if (b.warrior_slain && b.fight_id && b.warrior_name) {
            const w = (merged.warriors || []).find(w => w && w.name === b.warrior_name);
            if (w && w.is_dead) w.death_fight_id_unread = b.fight_id;
          }
        }
      }
      await Store.writeTeam(merged);
      // Also persist the raw result for audit.
      if (result.turn) await Store.writeTurnResult(result.turn, result);
      // Build a bout summary the UI expects
      const bouts = Array.isArray(result.bouts) ? result.bouts : [];
      return { success: true, team: merged, bouts, turn_number: result.turn || 0 };
    }

    // ── Save a newsletter locally after it's downloaded ──────────────────
    if (path === '/api/newsletter/save') {
      const turn = parseInt(body.turn || 0, 10);
      await Store.writeNewsletter(turn, body.text || '');
      return { success: true };
    }

    // ── Team / warrior / scout mutations on local team files ─────────────
    const teamMutators = new Set([
      '/api/team/run_next_turn',
      '/api/team/remove',
      '/api/team/replace',
      '/api/team/blood_challenge',
      '/api/team/avoid_manager',
      '/api/warrior/avoid_warrior',
      '/api/warrior/replace',
      '/api/account/swap_team',
    ]);
    if (teamMutators.has(path)) {
      return await LocalAPI._teamMutation(path, body);
    }

    // ── Account create is handled entirely by doCreateAccount ────────────
    // (still forwards via API.post above). Kept here as a safety stub.
    if (path === '/api/account/create') {
      return { success: false, error: 'Account creation is handled by the new flow - this path is deprecated.' };
    }

    // ── Account login - local-only verification ──────────────────────────
    if (path === '/api/account/login') {
      const a = await _ensureAccountLoaded();
      if (!a) return { success: false, error: 'No account on this machine. Create one first.' };
      const name = (body.manager_name || '').trim();
      const pass = body.password || '';
      if (name.toUpperCase() !== (a.manager_name || '').toUpperCase()) {
        return { success: false, error: 'Manager name does not match the local account.' };
      }
      const hash = await sha256Hex((a.salt || '') + pass);
      if (hash !== (a.password_hash || '')) {
        return { success: false, error: 'Wrong password.' };
      }
      return {
        success:       true,
        id:            a.id,
        manager_name:  a.manager_name,
        email:         a.email || '',
        team_ids:      a.team_ids || [],
        run_next_turn: a.run_next_turn || {},
      };
    }

    // ── Scout select / remove - forwarded to the league server with password.
    if (path === '/api/scout/select' || path === '/api/scout/remove') {
      const mid = body.manager_id || S.league.managerId || '';
      const pw = S.league.password || '';
      console.log(`[Scout POST] mid=${mid}, pw_present=${!!pw}, path=${path}`);
      return await _remoteFetch('POST', path, {
        manager_id:   mid,
        password:     pw,
        warrior_name: body.warrior_name || '',
        team_name:    body.team_name    || '',
        team_id:      body.team_id      || 0,
        arena:        body.arena        || S.selectedArena || 'normal',
      });
    }
    // /api/scout/confirm isn't currently wired to a UI button (selections are
    // auto-confirmed on select); stub it with a success for safety.
    if (path === '/api/scout/confirm') return { success: true };

    // ── Team challenges ──────────────────────────────────────────────────
    //  Regular arena: handled locally and uploaded with the team (original
    //  behaviour). Immortal arenas (Elite/Soul Spire): the team lives only in
    //  the server's arena-specific files and is never uploaded, so the challenge
    //  must be written on the server directly.
    if (path === '/api/team/challenge') {
      const chArena = body.arena || S.selectedArena || 'normal';

      if (chArena === 'elite' || chArena === 'veteran') {
        const mid = body.manager_id || S.league.managerId || '';
        const pw = S.league.password || '';
        const response = await _remoteFetch('POST', path, {
          manager_id:   mid,
          password:     pw,
          team_id:      body.team_id      || 0,
          warrior_name: body.warrior_name || '',
          target_name:  body.target_name  || '',
          action:       body.action       || 'add',
          arena:        chArena,
        });
        // Mirror the server's updated team into the local arena cache.
        if (response && response.success && response.team) {
          try { await Store.writeArenaTeam(chArena, response.team); }
          catch (_e) { /* cache mirror is best-effort */ }
        }
        return response;
      }

      // Regular arena: store the challenge in the local team file (keyed by the
      // warrior's active-roster slot index) and let the normal upload carry it.
      const team = await Store.readTeam(parseInt(body.team_id, 10));
      if (!team) return { success: false, error: 'Team not found.' };
      team.challenges = team.challenges || {};
      let slotIndex = -1;
      for (let i = 0; i < (team.warriors || []).length; i++) {
        if (team.warriors[i] && team.warriors[i].name === body.warrior_name) {
          slotIndex = i;
          break;
        }
      }
      if (slotIndex === -1) {
        return { success: false, error: `Warrior "${body.warrior_name}" not found in team.` };
      }
      const list = team.challenges[slotIndex] || [];
      if (body.action === 'remove') {
        team.challenges[slotIndex] = list.filter(t => t !== body.target_name);
      } else {
        if (!list.includes(body.target_name)) list.push(body.target_name);
        team.challenges[slotIndex] = list;
      }
      await Store.writeTeam(team);
      return { success: true, team };
    }

    // ── Removed features (no-ops for legacy UI paths) ────────────────────
    if (path === '/api/turn/run' || path === '/api/run_all_turns') {
      return { success: false, error: 'Local turn running has been removed. Use Upload to send your team to the arena.' };
    }
    if (path === '/api/full_reset') {
      return { success: false, error: 'Full reset removed - delete your saved folder manually to reset.' };
    }
    if (path === '/api/league/upload_one') {
      // Upload a single team to the league server. Called by "Upload All".
      const tid  = parseInt(body.team_id, 10);
      // Use in-memory team if available so challenge_strategy_enabled and other
      // recently-toggled flags are included even if a disk write is still in flight.
      let team = (S.teams && S.teams[tid])
        ? JSON.parse(JSON.stringify(S.teams[tid]))
        : await Store.readTeam(tid);
      if (!team) return { success: false, team_id: tid, error: 'Team not found locally.' };
      try {
        const url = (body.league_url || S.serverUrl).replace(/\/+$/,'');
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 15000);
        let r;
        try {
          // Ensure all warriors have equipment defaults before uploading
          if (team.warriors && Array.isArray(team.warriors)) {
            team.warriors = team.warriors.map(w => {
              if (!w) return w;
              return {
                ...w,
                armor: w.armor || 'None',
                helm: w.helm || 'None',
                primary_weapon: w.primary_weapon || 'Open Hand',
                secondary_weapon: w.secondary_weapon || 'Open Hand',
                backup_weapon: w.backup_weapon || null,
              };
            });
          }
          r = await fetch(url + '/api/upload', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
              manager_id: body.league_manager_id,
              password:   body.password,
              client_version: CLIENT_VERSION,
              team:       team,
            }),
            signal: ctrl.signal,
          });
        } finally {
          clearTimeout(timer);
        }
        const d = await r.json();
        if (d.success) return { success: true, team_id: tid, team_name: team.team_name, turn: d.turn };
        return { success: false, team_id: tid, team_name: team.team_name, error: d.error || 'upload failed' };
      } catch (e) {
        const msg = e.name === 'AbortError' ? 'Server did not respond (timed out)' : (e.message || 'network error');
        return { success: false, team_id: tid, team_name: team.team_name, error: msg };
      }
    }

    return { success: false, error: `Unknown local POST ${path}` };
  },

  async put(path, body) {
    if (path === '/api/warrior') {
      const tid = parseInt(body.team_id, 10);
      const idx = parseInt(body.warrior_idx, 10);
      const { team, arena: teamArena } = await _readTeamAnyFolder(tid);
      if (!team) return { success: false, error: 'Team not found.' };
      const _writeBack = async (t) => {
        if (teamArena === 'elite' || teamArena === 'veteran') {
          await Store.writeArenaTeam(teamArena, t);
        } else {
          await Store.writeTeam(t);
        }
      };
      // Immortal warrior path -- identified by warrior_name in archived_warriors
      if (body.warrior_name && body.warrior_idx == null) {
        const archIdx = (team.archived_warriors || []).findIndex(aw => aw && aw.name === body.warrior_name);
        if (archIdx < 0) return { success: false, error: 'Immortal warrior not found.' };
        const aw = team.archived_warriors[archIdx];
        for (const field of ['armor','helm','primary_weapon','secondary_weapon','backup_weapon','blood_cry']) {
          if (field in body) { aw[field] = body[field] === 'None' ? null : body[field]; }
        }
        if ('challenge_strategy_enabled' in body) aw.challenge_strategy_enabled = !!body.challenge_strategy_enabled;
        if (Array.isArray(body.trains)) {
          aw.trains = body.trains.filter(t => t && t !== '-').map(t => t.toLowerCase().replace(/ /g,'_').replace(/&/g,'and')).slice(0, 3);
        }
        const _mapStrat = sd => ({ trigger: sd.trigger, style: sd.style||'Strike',
          activity: parseInt(sd.activity??5,10), aim_point: sd.aim_point||'None', defense_point: sd.defense_point||'None' });
        if (Array.isArray(body.strategies)) {
          aw.strategies = body.strategies.filter(sd => sd.trigger).map(_mapStrat);
          if (!aw.strategies.length) aw.strategies = [{trigger:'Always (Default Loop)',style:'Strike',activity:5,aim_point:'None',defense_point:'None'}];
        }
        if (Array.isArray(body.challenge_strategies)) {
          aw.challenge_strategies = body.challenge_strategies.filter(sd => sd.trigger).map(_mapStrat);
        }
        await _writeBack(team);
        return { success: true, warrior: aw, team };
      }
      const w = team.warriors[idx];
      if (!w) return { success: false, error: 'Warrior slot empty.' };
      for (const field of ['armor','helm','primary_weapon','secondary_weapon','backup_weapon','blood_cry']) {
        if (field in body) {
          let v = body[field];
          if (v === 'None') v = null;
          w[field] = v;
        }
      }
      if ('want_monster_fight' in body) w.want_monster_fight = !!body.want_monster_fight;
      if ('want_retire'        in body) w.want_retire        = !!body.want_retire;
      if ('challenge_strategy_enabled' in body) w.challenge_strategy_enabled = !!body.challenge_strategy_enabled;
      if (Array.isArray(body.trains)) {
        // Migrate old weapon names (e.g., "Francisca" -> "Hand Axe" / "hand_axe")
        const trainsNormalized = body.trains
          .filter(t => t && t !== '-')
          .map(t => {
            const normalized = t.toLowerCase().replace(/ /g, '_').replace(/&/g, 'and');
            // Migration: old "francisca" display name -> new format
            if (normalized === 'francisca') return 'hand_axe';
            return normalized;
          })
          .slice(0, 3);
        w.trains = trainsNormalized;
      }
      if (Array.isArray(body.strategies)) {
        w.strategies = [];
        for (const sd of body.strategies) {
          if (!sd.trigger) continue;
          w.strategies.push({
            trigger      : sd.trigger,
            style        : sd.style || 'Strike',
            activity     : parseInt(sd.activity ?? 5, 10),
            aim_point    : sd.aim_point || 'None',
            defense_point: sd.defense_point || 'None',
          });
        }
        if (!w.strategies.length) {
          w.strategies = [{
            trigger: 'Always (Default Loop)', style: 'Strike',
            activity: 5, aim_point: 'None', defense_point: 'None',
          }];
        }
      }
      if (Array.isArray(body.challenge_strategies)) {
        w.challenge_strategies = [];
        for (const sd of body.challenge_strategies) {
          if (!sd.trigger) continue;
          w.challenge_strategies.push({
            trigger      : sd.trigger,
            style        : sd.style || 'Strike',
            activity     : parseInt(sd.activity ?? 5, 10),
            aim_point    : sd.aim_point || 'None',
            defense_point: sd.defense_point || 'None',
          });
        }
      }
      await _writeBack(team);
      return { success: true, warrior: w, team };
    }
    return { success: false, error: `Unknown local PUT ${path}` };
  },

  // ── Helpers for team-level mutations (all edit the team JSON) ──────────
  async _teamMutation(path, body) {
    const acc = await _ensureAccountLoaded();
    if (!acc) return { success: false, error: 'No account loaded.' };

    if (path === '/api/team/run_next_turn') {
      // This API call is now handled by directly updating the team's auto_upload_enabled flag
      const team = await Store.readTeam(parseInt(body.team_id, 10));
      if (!team) return { success: false, error: 'Team not found.' };

      // Prevent enabling if team doesn't have 5 active warriors
      if (body.value && !hasFiveActiveWarriors(team)) {
        return { success: false, error: 'Team must have 5 active warriors to run this turn.' };
      }

      team.auto_upload_enabled = !!body.value;
      await Store.writeTeam(team);
      return { success: true, team };
    }
    if (path === '/api/team/remove') {
      const tid = parseInt(body.team_id, 10);
      acc.team_ids = (acc.team_ids || []).filter(id => id !== tid);
      if (acc.run_next_turn) delete acc.run_next_turn[String(tid)];
      await _persistAccount(acc);
      await Store.deleteTeam(tid);
      return { success: true };
    }
    if (path === '/api/team/replace') {
      // Archive the old team by renaming to an archive path, then the
      // client starts a new-team flow in the freed slot.
      const tid = parseInt(body.old_team_id, 10);
      const old = await Store.readTeam(tid);
      if (old) {
        // Keep an archive copy so the history isn't lost.
        await fsaWriteJSON(`archives/team_${String(tid).padStart(4,'0')}.json`, old);
      }
      return { success: true, new_team_id: null };
    }
    if (path === '/api/account/swap_team') {
      const oldId = parseInt(body.old_team_id, 10);
      const newId = parseInt(body.new_team_id, 10);
      acc.team_ids = (acc.team_ids || []).map(id => id === oldId ? newId : id);
      if (acc.run_next_turn && acc.run_next_turn[String(oldId)] !== undefined) {
        acc.run_next_turn[String(newId)] = acc.run_next_turn[String(oldId)];
        delete acc.run_next_turn[String(oldId)];
      }
      await _persistAccount(acc);
      await Store.deleteTeam(oldId);
      return { success: true };
    }
    if (path === '/api/team/blood_challenge') {
      const team = await Store.readTeam(parseInt(body.team_id, 10));
      if (!team) return { success: false, error: 'Team not found.' };
      team.blood_challenges = team.blood_challenges || [];
      const bc = team.blood_challenges.find(c =>
        c.target_name === body.target_name && c.status === 'active'
      );
      if (!bc) return { success: false, error: 'Blood challenge not found.' };
      bc.challenger_name = body.challenger_name || null;
      await Store.writeTeam(team);
      return { success: true, team };
    }
    if (path === '/api/team/avoid_manager') {
      const team = await Store.readTeam(parseInt(body.team_id, 10));
      if (!team) return { success: false, error: 'Team not found.' };
      team.avoid_managers = team.avoid_managers || [];
      if (body.action === 'remove') {
        team.avoid_managers = team.avoid_managers.filter(m => m !== body.manager_name);
      } else if (team.avoid_managers.length < 2) {
        if (!team.avoid_managers.includes(body.manager_name)) {
          team.avoid_managers.push(body.manager_name);
        }
      }
      await Store.writeTeam(team);
      return { success: true, team };
    }
    if (path === '/api/warrior/avoid_warrior') {
      const team = await Store.readTeam(parseInt(body.team_id, 10));
      if (!team) return { success: false, error: 'Team not found.' };
      // Find warrior by name if warrior_idx not provided
      let w;
      if (body.warrior_idx != null) {
        w = team.warriors[parseInt(body.warrior_idx, 10)];
      } else if (body.warrior_name) {
        w = team.warriors.find(wr => wr && wr.name === body.warrior_name);
      }
      if (!w) return { success: false, error: 'Warrior not found.' };
      const avoidTargetName = body.avoid_warrior_name || body.target_name;
      w.avoid_warriors = w.avoid_warriors || [];
      if (body.action === 'remove') {
        w.avoid_warriors = w.avoid_warriors.filter(n => n !== avoidTargetName);
      } else if (avoidTargetName && !w.avoid_warriors.includes(avoidTargetName)) {
        w.avoid_warriors.push(avoidTargetName);
      }
      await Store.writeTeam(team);
      return { success: true, team };
    }
    if (path === '/api/warrior/replace') {
      const team = await Store.readTeam(parseInt(body.team_id, 10));
      if (!team) return { success: false, error: 'Team not found.' };
      const idx = parseInt(body.warrior_idx, 10);
      // The server builds the warrior: it checks the stats against the roll it issued,
      // rolls luck itself and records the replacement. We only store what it returns.
      const sr = await _remoteFetch('POST', '/api/warrior/replace', {
        ...body,
        manager_id: S.league.managerId || (S.account && S.account.id) || '',
        password  : S.league.password || '',
      });
      if (!sr || !sr.success || !sr.warrior) {
        return { success: false, error: (sr && sr.error) || 'The server did not accept this replacement.' };
      }
      const w = sr.warrior;
      // Archive the old warrior first, if any. Tag retirees AND ascended warriors
      // separately from the dead so they land on the Shady Pines tab instead of
      // The Crypts - neither of them actually died.
      const old = team.warriors[idx];
      if (old) {
        team.archived_warriors = team.archived_warriors || [];
        if (old.is_retired || old.ascended_to_monster) old.archived_retired = true;
        if (old.is_promoted) old.archived_promoted = true;
        team.archived_warriors.push(old);
      }
      team.warriors[idx] = w;
      // Clear auto-upload so the manager must manually re-check "Run This Turn"
      // after replacing a warrior. Prevents the checkbox from auto-checking when
      // the team becomes full again.
      team.auto_upload_enabled = false;
      await Store.writeTeam(team);
      return { success: true, team, warrior: w };
    }
    return { success: false, error: `Unhandled team mutation ${path}` };
  },
};

/* ============================================================
   UTILITIES
   ============================================================ */

const _SKILL_LABELS = {
  1: 'Has Novice Skill ({n}) in {s}',
  2: 'Has Some Skill ({n}) in {s}',
  3: 'Is Skilled ({n}) in {s}',
  4: 'Has Good Skill ({n}) in {s}',
  5: 'Is Very Skilled ({n}) in {s}',
  6: 'Has Excellent Skill ({n}) in {s}',
  7: 'Has Expert Skill ({n}) in {s}',
  8: 'Has Incredible Skill ({n}) in {s}',
  9: 'Is a Master ({n}) in {s}',
};
const _INJURY_DESCS = {
  1:'Annoying', 2:'Bothersome', 3:'Irritating', 4:'Troublesome',
  5:'Painful',  6:'Dreadful',   7:'Incapacitating', 8:'Devastating', 9:'Fatal',
};
const _INJURY_LOCS = ['head','chest','abdomen','primary_arm','secondary_arm','primary_leg','secondary_leg'];

function formatSkillsText(skills) {
  const lines = [];
  for (const [key, level] of Object.entries(skills || {}).sort((a,b) => a[0].localeCompare(b[0]))) {
    if (!level) continue;
    let name = key.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    // Migration: convert old "Francisca" display name to "Hand Axe"
    if (name === 'Francisca') name = 'Hand Axe';
    const tpl  = _SKILL_LABELS[level] || 'Has Skill Level ({n}) in {s}';
    lines.push(tpl.replace('{n}', level).replace('{s}', name));
  }
  return lines;
}

function formatInjuriesText(injuries) {
  const lines = [];
  for (const loc of _INJURY_LOCS) {
    const level = (injuries || {})[loc] || 0;
    if (!level) continue;
    const desc    = _INJURY_DESCS[level] || `Level ${level}`;
    const article = /^[aeiou]/i.test(desc) ? 'an' : 'a';
    const display = loc.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    lines.push(`Has ${article} ${desc} (${level}) wound to the ${display}`);
  }
  return lines;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// jsq(v): JSON-stringify v and HTML-entity-encode both ' and " so the result can
// be safely embedded inside either single- or double-quoted HTML onclick attributes.
// The browser decodes &quot; → " and &#39; → ' before executing the JS.
function jsq(v) { return JSON.stringify(v).replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }
function el(id) { return document.getElementById(id); }

// ---- View menu: zoom, reload, exit ----------------------------------------------------------
// Zoom uses CSS zoom on the page (Neutralino has no webview zoom call). Stored per machine.
const ZOOM_MIN = 60, ZOOM_MAX = 200, ZOOM_STEP = 10;
let _zoomPct = 100;
function getZoom() { return _zoomPct; }
function setZoom(pct) {
  pct = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(pct / ZOOM_STEP) * ZOOM_STEP));
  _zoomPct = pct;
  document.documentElement.style.zoom = (pct / 100);
  try { localStorage.setItem('bp_zoom', String(pct)); } catch (e) { /* just won't be remembered */ }
  const lbl = el('zoom-pct'); if (lbl) lbl.textContent = pct;
}
function zoomIn()    { setZoom(_zoomPct + ZOOM_STEP); }
function zoomOut()   { setZoom(_zoomPct - ZOOM_STEP); }
function zoomReset() { setZoom(100); }
function initZoom() {
  let v = 100;
  try { v = parseInt(localStorage.getItem('bp_zoom') || '100', 10) || 100; } catch (e) {}
  setZoom(v);
}
function reloadApp() {
  if ((typeof ProgressUI !== 'undefined' && ProgressUI.el) || document.getElementById('dl-progress-modal')) {
    if (!confirm('A transfer is in progress. Reload anyway?')) return;
  }
  try { sessionStorage.setItem('bp_reload_login', '1'); } catch (e) {}
  location.reload();
}
// After a Reload App, log straight back in when the password is saved (Remember me on).
async function _maybeAutoLoginAfterReload() {
  let flag = null;
  try { flag = sessionStorage.getItem('bp_reload_login'); sessionStorage.removeItem('bp_reload_login'); } catch (e) {}
  if (!flag) return;
  if (S.view !== 'login' || !S.savedRememberMe || !S.savedPassword || !S.savedManagerName) return;

}
async function exitApp() {

  try { window.close(); } catch (e) {}
}
document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key;
  if (k === '+' || k === '=') { e.preventDefault(); zoomIn(); }
  else if (k === '-' || k === '_') { e.preventDefault(); zoomOut(); }
  else if (k === '0') { e.preventDefault(); zoomReset(); }
  else if ((k === 'r' || k === 'R') && !e.shiftKey) { e.preventDefault(); reloadApp(); }
});
document.addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  if (e.deltaY < 0) zoomIn(); else if (e.deltaY > 0) zoomOut();
}, { passive: false });

function isClassic() { return document.documentElement.classList.contains('skin-classic'); }
function toggleSkin() {

function setTheme(theme) {
  S.theme = theme;
  localStorage.setItem('bp_theme', theme);
  applyTheme(theme);

}

function applyTheme(theme) {
  const root = document.documentElement;

  if (theme === 'dark') {
    root.classList.add('dark-mode');
  } else if (theme === 'auto') {
    // Check system preference
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      root.classList.add('dark-mode');
    } else {
      root.classList.remove('dark-mode');
    }
  } else {
    // Light mode (default)
    root.classList.remove('dark-mode');
  }
}

function initializeTheme() {
  const savedTheme = localStorage.getItem('bp_theme') || 'light';
  S.theme = savedTheme;
  applyTheme(savedTheme);

  // Listen for system theme changes if in auto mode
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (S.theme === 'auto') {
        applyTheme('auto');
        render();
      }
    });
  }
}

async function refreshGameDataFromServer() {
  try {
    // Delete old cached game_data.json
    await Store.deleteGameData?.();

    // Fetch fresh game_data from server
    const fresh = await API.get('/api/game_data');

    if (fresh && !fresh.error) {
      // Cache the fresh data
      await Store.writeGameData(fresh);
      alert('✓ Game data refreshed successfully!\n\nThe latest game configuration has been downloaded and cached.');
      // Optionally reload the page so dropdowns update with latest data
      setTimeout(() => location.reload(), 500);
    } else {
      alert('✗ Error refreshing game data.\n\nServer returned: ' + (fresh?.error || 'Unknown error'));
    }
  } catch (err) {
    alert('✗ Failed to refresh game data.\n\nError: ' + err.message + '\n\nMake sure the server is running and you have internet connection.');
    console.error('refreshGameDataFromServer error:', err);
  }
}

function hasFiveActiveWarriors(team) {
  if (!team || !team.warriors || team.warriors.length !== 5) {
    console.log('Team validation failed:', { 
      hasTeam: !!team, 
      warriorCount: team?.warriors?.length 
    });
    return false;
  }
  
  const activeCount = team.warriors.filter(w => w && !w.is_dead && !w.ascended_to_monster && !w.is_promoted && !w.is_retired).length;
  const result = activeCount === 5;
  
  if (!result) {
    console.log(`Team ${team.team_name} has ${activeCount}/5 active warriors (dead/ascended warriors need replacement)`);
  }
  
  return result;
}

// The progress dialog function
function _showUploadProgress(steps, currentIdx, error) {
  const old = document.getElementById('ul-progress-modal');
  if (old) old.remove();

  const allDone = currentIdx >= steps.length && !error;
  const hasFailed = !!error;

  let rows = '';
  steps.forEach((label, i) => {
    let icon, color;
    if (hasFailed && i === currentIdx) {
      icon = '✗'; color = 'var(--text-err)';
    } else if (i < currentIdx || allDone) {
      icon = '✓'; color = 'var(--text-good)';
    } else if (i === currentIdx) {
      icon = '⟳'; color = 'var(--warn)';
    } else {
      icon = '☐'; color = 'var(--text-faint)';
    }
    rows += `<tr>
      <td style="padding:3px 8px; color:${color}; font-size:13px;">${icon}</td>
      <td style="padding:3px 4px; font-size:12px; color:${i <= currentIdx || allDone ? 'var(--text)' : 'var(--text-faint)'};">${esc(label)}</td>
    </tr>`;
  });

  const footer = hasFailed
    ? `<div style="color:var(--text-err);font-size:11px;margin-bottom:8px;padding:0 12px;">${esc(error)}</div>`
    : allDone
    ? `<div style="color:var(--text-good);font-size:12px;font-weight:bold;margin-bottom:8px;">
         <span style="font-size:16px;">✔</span> Completed Successfully
       </div>`
    : `<div style="color:var(--text-dim);font-size:11px;margin-bottom:8px;">Uploading teams to arena...</div>`;

  const showOk = allDone || hasFailed;

  const modal = document.createElement('div');
  modal.id = 'ul-progress-modal';
  modal.style.cssText = `position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.45);z-index:9999;display:flex;
    align-items:center;justify-content:center;`;
  modal.innerHTML = `
  <div style="background:var(--bg);border:2px solid var(--mid);border-radius:4px;
              min-width:260px;max-width:360px;box-shadow:4px 4px 12px rgba(0,0,0,0.4);
              font-family:sans-serif;">
    <div style="background:var(--title);color:var(--title-tx);padding:6px 12px;font-weight:bold;font-size:13px;
                border-radius:2px 2px 0 0;">
      BLOODSPIRE - Uploading Teams
    </div>
    <div style="padding:12px 8px 4px;">
      <table style="border-collapse:collapse;width:100%;">${rows}</table>
    </div>
    <div style="text-align:center;padding:8px 0 4px;">
      ${footer}
      ${showOk ? `<button onclick="document.getElementById('ul-progress-modal').remove()"
                   style="min-width:80px;margin-top:4px;">OK</button>` : ''}
    </div>
  </div>`;
  document.body.appendChild(modal);
}

// autofocus on innerHTML-injected elements is silently ignored by Electron/Chromium.
// The IPC call triggers a blur→focus cycle in the main process so Windows sends
// WM_SETFOCUS (establishing OS keyboard routing), then resolves so we can safely
// call element.focus() knowing keystrokes will actually reach it.
function _focusAutofocusEl() {
  const target = document.querySelector('[autofocus]');
  if (!target) return;
  if (window.electronAPI?.focusWindow) {
    window.electronAPI.focusWindow().then(() => target.focus());
  } else {
    target.focus();
  }
}

function render() {
  const app = el('app');
  clearTimeout(_saveTimer);
  _saveTimer = null;
  if      (S.view === 'folder_pick') app.innerHTML = buildFolderPick();
  else if (S.view === 'login')       app.innerHTML = buildLogin();
  else if (S.view === 'main')        app.innerHTML = buildMain();
  else if (S.view === 'create_team') app.innerHTML = buildCreateTeam();
  else if (S.view === 'turn_results') app.innerHTML = buildTurnResults();
  // Narrative overlay is appended on top, not a full re-render
  if (S.narrative) showNarrativeOverlay(); else hideNarrativeOverlay();
  attachEvents();
  _focusAutofocusEl();
}

/* Roster line icons (inline SVG, drawn with currentColor so they follow the theme and the selected row) */
// Soul Spire lives: a warrior can die in the Soul Spire until they run out of lives, and the
// last death is permanent. Returns {left, max} for a Soul Spire warrior, otherwise null.
// The server sends soul_lives_left / soul_lives_max; the fallback covers locally cached data.
function soulLives(iw) {
  if (!iw || (iw.current_arena || '') !== 'veteran') return null;
  const max  = iw.soul_lives_max != null ? iw.soul_lives_max : 2;
  const left = iw.soul_lives_left != null ? iw.soul_lives_left
                                          : Math.max(0, max - (iw.soul_spire_deaths || 0));
  return { left, max };
}
function soulLivesHearts(lv) {
  if (!lv) return '';
  const hearts = lv.max <= 6 ? '♥'.repeat(lv.left) + '♡'.repeat(Math.max(0, lv.max - lv.left)) : `♥×${lv.left}`;
  const tip = lv.left === 1 ? 'Last life - the next death in the Soul Spire is final'
            : `${lv.left} of ${lv.max} lives remaining in the Soul Spire`;
  const color = lv.left <= 1 ? 'var(--text-err)' : 'var(--text-dim)';
  return `<span title="${tip}" style="font-size:10px; margin-left:4px; color:${color}; letter-spacing:1px;">${hearts}</span>`;
}

function treeIcon(name) {
  if (isClassic()) {
    return { flag:'⚑', standard:'⚔', swords:'⚔', fighter:'👤', warrior:'👤', splat:'💀', skull:'☠', horns:'👹', star:'✦', trophy:'🏆' }[name] || '';
  }
  const P = {
    flag:    '<path d="M6 21V4"/><path d="M6 4h11l-2.5 4 2.5 4H6"/>',
    swords:  '<path d="M5 19 19 5"/><path d="M14 5h5v5"/><path d="M5 5l14 14"/><path d="M10 5H5v5"/>',
    warrior: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-7 8-7s8 2.5 8 7"/>',
    skull:   '<path d="M5 12a7 7 0 0 1 14 0v3l-2 1v3H7v-3l-2-1z"/><circle cx="9.5" cy="12" r="1.2"/><circle cx="14.5" cy="12" r="1.2"/><path d="M10 19v-2.5"/><path d="M14 19v-2.5"/>',
    trophy:  '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4v2a3 3 0 0 0 4 3"/><path d="M16 6h4v2a3 3 0 0 1-4 3"/><path d="M12 13v4"/><path d="M8 20h8"/><path d="M10 17h4"/>',
    horns:   '<path d="M5 4c0 3 1 4.5 3 6"/><path d="M19 4c0 3-1 4.5-3 6"/><path d="M7 10h10v5a5 5 0 0 1-10 0z"/><path d="M10 14h.01"/><path d="M14 14h.01"/>',
    star:    '<path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',
    standard:'<path d="M12 2v20"/><path d="M5.500 5.500h13"/><path d="M7 5.500v10l2.500-2 2.500 2 2.500-2 2.500 2v-10"/><path d="M9 22h6"/>',
    // Living warrior: a small armed fighter (solid body, outlined shield, raised sword)
    fighter: '<g fill="currentColor" stroke="none"><circle cx="11.600" cy="4.500" r="2.700"/><path d="M8.400 7.600h6.400c.7 0 1.100.5 1.100 1.200l.5 6.300H6.900l.4-6.300c0-.7.5-1.200 1.100-1.200z"/><path d="M7.300 15.600h3.600l-.2 6.600H7.800zM12.600 15.600h3.600l-.5 6.600h-2.900z"/></g><path d="M1.800 8.600h6.200v5c0 2.300-1.700 3.600-3.100 4.300C3.500 17.200 1.800 15.900 1.800 13.600z" stroke-width="1.700"/><path d="M20.800 2 17.600 11M15.800 9.600l4.200 2.200" stroke-width="2"/>',
    // Slain warrior: blood splatter
    splat:   '<g class="splat" fill="currentColor" stroke="none"><path d="M12 2.500c.9 2.600 2.500 3.300 4.700 2.800-.6 2.100.4 3.700 2.700 4.700-2 1.200-2.300 2.900-1.400 5-2.100-.3-3.400.7-4 2.900-1.200-1.700-3-2.100-5.100-1.300.3-2.100-.7-3.600-2.800-4.400 1.900-1.100 2.500-2.800 1.800-4.900 2.300.4 3.600-.6 3.900-2.800z"/><circle cx="4.200" cy="5" r="1.300"/><circle cx="20.200" cy="19.500" r="1.400"/><circle cx="5" cy="19" r="1"/><circle cx="20" cy="4.500" r=".9"/></g>'
  };
  return `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[name] || ''}</svg>`;
}

function buildTree() {
  if (!S.account) return '<div id="tree-panel"></div>';
  const sa = S.selectedArena || 'normal';
  const arenaLabels = { normal: 'Regular', elite: 'Elite', veteran: 'Soul' };
  const arenaCls = { normal: 'active', elite: 'active-elite', veteran: 'active-veteran' };
  const vtabs = `<div class="arena-vtabs">
  ${['normal','elite','veteran'].map(a =>
    `<div class="arena-vtab${sa===a?' '+arenaCls[a]:''}" onclick="selectArena('${a}')" title="${
      {normal:"The Agony Amphitheatre",elite:"The Elite Spire",veteran:"The Soul Spire"}[a]
    }">${arenaLabels[a]}</div>`
  ).join('')}
</div>`;
  let h = `<div id="tree-panel">${vtabs}<div class="tree-scroll">`;

  // Manager row (shown in all modes)
  const mSel = S.sel.type === 'manager' ? 'sel' : '';
  h += `<div class="tree-row tree-mgr ${mSel}" id="tr-mgr"
             onclick="treeSelectManager()" style="cursor:default;">
    <span class="tree-exp"> </span>
    <span class="tree-ico">${treeIcon('flag')}</span>
    <span class="tree-lbl">${esc(S.account.manager_name)}</span>
  </div>`;

  if (sa === 'normal') {
    // ── Regular arena: show only this manager's teams ──
    for (const tid of S.account.team_ids) {
      const team = S.teams[tid];
      if (!team) continue;
      const expanded = S.expanded[tid] !== false;
      const tSel = (S.sel.type === 'team' && S.sel.teamId == tid) ? 'sel' : '';
      h += `<div class="tree-row ${tSel}" id="tr-t-${tid}"
                 onclick="treeSelectTeam(${tid})" style="padding-left:18px; cursor:default;">
        <span class="tree-exp" onclick="event.stopPropagation(); treeToggle(${tid})"
              style="cursor:pointer; padding:0 4px;">${expanded ? '▼' : '▶'}</span>
        <span class="tree-ico">${treeIcon('standard')}</span>
        <span class="tree-lbl">${esc(team.team_name)}</span>
      </div>`;

      if (expanded) {
        (team.warriors || []).forEach((w, idx) => {
          if (!w) return;
          // Only show warriors in the normal arena (promoted warriors still shown until replaced)
          if ((w.current_arena || 'normal') !== 'normal' && !w.is_promoted) return;
          const wSel      = (S.sel.type === 'warrior' && S.sel.teamId == tid && S.sel.wIdx == idx) ? 'sel' : '';
          const isDead     = w.is_dead || false;
          const isRetired  = w.is_retired || false;
          const isAscended = w.ascended_to_monster || false;
          const isPromoted = w.is_promoted || false;

          const injLevels   = w.injury_levels || {};
          const injCount    = Object.values(injLevels).filter(v => v > 0).length;
          const hasSevere   = Object.values(injLevels).some(v => v >= 5);
          const injBadge    = injCount >= 3
            ? `<span title="${injCount} permanent injuries" style="color:${hasSevere?'var(--b-injA)':'var(--b-injB)'};
               font-size:10px; margin-left:3px;">[${injCount}⚕]</span>`
            : '';

          const streak = w.streak || 0;
          const streakBadge = S.hideRecord ? '' : streak >= 3
            ? `<span style="color:var(--text-good);font-size:9px;margin-left:3px;">W${streak}🔥</span>`
            : streak <= -3
            ? `<span style="color:var(--text-err);font-size:9px;margin-left:3px;">L${Math.abs(streak)}❄</span>`
            : '';

          const flagBadge = w.want_monster_fight
            ? `<span title="Queued for Monster fight" style="font-size:10px;margin-left:3px;">☠</span>`
            : w.want_retire
            ? `<span title="Retirement pending" style="font-size:10px;margin-left:3px;">🏆</span>`
            : '';

          const isTranscended = isPromoted && (w.current_arena || 'normal') === 'veteran';
          const isElitePromo  = isPromoted && (w.current_arena || 'normal') === 'elite';
          const deadStyle  = ((isDead && !S.hideRecord) || isRetired || isPromoted) ? 'opacity:0.55; font-style:italic;' : '';
          const deadIcon   = treeIcon(isAscended ? 'horns' : isTranscended ? 'skull' : isElitePromo ? 'star' : (isDead && !S.hideRecord ? 'splat' : isRetired ? 'trophy' : 'fighter'));
          const deadBadge  = isAscended
            ? `<span class="badge-ascended" title="Ascended to Monsterdom on The Monsters roster - replacement needed">👹 ASCENDED</span>`
            : isTranscended
            ? `<span class="badge-transcended" title="Fell in battle and transcended to The Soul Spire - replacement needed">☠ TRANSCENDED</span>`
            : isElitePromo
            ? `<span class="badge-promoted" title="Promoted to The Elite Spire - replacement needed">✦ PROMOTED</span>`
            : (isDead && !S.hideRecord)
            ? `<span title="Slain by ${esc(w.killed_by||'unknown')} - replacement needed"
                 style="color:var(--text-err);font-size:10px;margin-left:4px;">✝</span>`
            : isRetired
            ? `<span class="badge-retired" title="Retired - replacement needed">🏆 RETIRED</span>`
            : '';

          h += `<div class="tree-row ${wSel}" id="tr-w-${tid}-${idx}"
                     onclick="treeSelectWarrior(${tid}, ${idx})"
                     style="padding-left:38px; cursor:default; ${deadStyle}">
            <span class="tree-exp"> </span>
            <span class="tree-ico">${deadIcon}</span>
            <span class="tree-lbl">${esc(w.name)}${deadBadge}${injBadge}${streakBadge}${flagBadge}</span>
          </div>`;
        });
      }
    }
  } else {
    // ── Immortal arena: show only this manager's teams/warriors ──
    const arenaIcon  = treeIcon(sa === 'elite' ? 'star' : 'skull');
    const arenaClass = sa === 'elite' ? 'arena-elite' : 'arena-veteran';
    const arenaLabel = sa === 'elite' ? 'Elite Spire' : 'Soul Spire';
    // Upload/Download action bar for this arena
    h += `<div style="display:flex;gap:4px;padding:4px 8px;border-bottom:1px solid var(--mid);background:var(--lt-gray);">
      <button onclick="doImmortalUpload('${sa}')"
        style="flex:1;font-size:10px;padding:2px 4px;cursor:pointer;"
        title="Upload your ${arenaLabel} team stats to the server">↑ Upload</button>
      <button onclick="doImmortalDownload('${sa}')"
        style="flex:1;font-size:10px;padding:2px 4px;cursor:pointer;"
        title="Download ${arenaLabel} results and newsletter">↺ Download</button>
    </div>`;
    const allArenaWarriors = ((S.immortalWarriors || {})[sa] || []);
    // Filter by manager_name from the server registry (case-insensitive)
    const myMgrName = (S.league.managerName || S.account?.manager_name || '').toLowerCase();
    const arenaWarriors = myMgrName
      ? allArenaWarriors.filter(w => (w.manager_name || '').toLowerCase() === myMgrName)
      : allArenaWarriors;

    if (arenaWarriors.length === 0) {
      h += `<div style="padding:8px 14px; color:var(--text-dim); font-size:11px;">
        No warriors in this arena yet.<br>
        <span style="font-size:10px;">Waiting for server data…</span>
      </div>`;
    } else {
      // Group warriors by team, sorted by team name
      const teamGroups = {};
      for (const iw of arenaWarriors) {
        const tid = String(iw.team_id);
        if (!teamGroups[tid]) teamGroups[tid] = { team_name: iw.team_name, warriors: [] };
        teamGroups[tid].warriors.push(iw);
      }
      const sortedTeams = Object.entries(teamGroups)
        .sort(([,a],[,b]) => a.team_name.localeCompare(b.team_name));

      for (const [tidStr, tdata] of sortedTeams) {
        const tid = parseInt(tidStr, 10);
        const expanded = S.expanded[tid] !== false;
        const tSel = (S.sel.type === 'team' && S.sel.teamId == tid) ? 'sel' : '';
        h += `<div class="tree-row ${tSel}" id="tr-t-${tid}"
                   onclick="treeSelectTeam(${tid})" style="padding-left:18px; cursor:default;">
          <span class="tree-exp" onclick="event.stopPropagation(); treeToggle(${tid})"
                style="cursor:pointer; padding:0 4px;">${expanded ? '▼' : '▶'}</span>
          <span class="tree-ico ${arenaClass}">${arenaIcon}</span>
          <span class="tree-lbl">${esc(tdata.team_name)}</span>
        </div>`;

        if (expanded) {
          for (const iw of tdata.warriors) {
            const aw = iw.arena_wins   != null ? iw.arena_wins   : 0;
            const al = iw.arena_losses != null ? iw.arena_losses : 0;
            const ak = iw.arena_kills  != null ? iw.arena_kills  : 0;
            const rec = `${aw}W/${al}L/${ak}K`;
            const iwSel = (S.sel.type === 'immortal_warrior' && S.sel.teamId == tid && S.sel.warriorName === iw.name) ? 'sel' : '';
            // Selected rows get their colour from .tree-row.sel, so only tint when unselected
            const iwCls = iwSel ? '' : ` ${arenaClass}`;
            const runThis = iw.run_this_turn !== false;
            // Took the final Soul Spire death: stays listed, grayed out, until the next
            // upload or the next turn's download clears them.
            const fallen = !!(iw.soul_spire_final_death && iw.is_dead);
            const sittingOut = !runThis && !fallen;
            const sittingStyle = fallen ? ' opacity:0.45; font-style:italic;'
              : sittingOut ? ' opacity:0.45; text-decoration:line-through;' : '';
            h += `<div class="tree-row ${iwSel}" onclick="treeSelectImmortalWarrior(${tid}, ${jsq(iw.name)})"
                       style="padding-left:38px; cursor:default; display:flex; align-items:center;">
              <span class="tree-exp"> </span>
              <span class="tree-ico${iwCls}">${fallen ? treeIcon('skull') : arenaIcon}</span>
              <span class="tree-lbl${iwCls}" title="${fallen ? 'Claimed by the land of the dead - leaves this list after your next upload' : rec}" style="flex:1;${sittingStyle}">${esc(iw.name)}
                ${fallen ? '' : soulLivesHearts(soulLives(iw))}
                ${S.hideRecord ? '' : `<span style="font-size:10px; color:var(--text-dim); margin-left:4px;">${rec}</span>`}
                ${fallen ? `<span style="color:var(--text-err);font-size:10px;margin-left:4px;">☠ FALLEN</span>` : ''}
                ${sittingOut ? `<span style="font-size:10px; color:var(--warn); margin-left:4px;">(sitting out)</span>` : ''}
              </span>
              ${fallen ? '' : `<span style="margin-left:auto; padding-right:6px; white-space:nowrap; font-size:10px; color:var(--text-dim);"
                    title="Run this turn -- uncheck to sit this warrior out">
                <input type="checkbox" ${runThis ? 'checked' : ''} style="cursor:pointer; vertical-align:middle;"
                  onclick="event.stopPropagation();"
                  onchange="event.stopPropagation(); saveImmortalRunFlag(${jsq(sa)}, ${tid}, ${jsq(iw.name)}, this.checked)">
              </span>`}
            </div>`;
          }
        }
      }
    }
  }

  h += `</div></div>`;
  return h;
}

function selectArena(arena) {
  if (S.selectedArena === arena) {
    // Already on this arena — still refresh immortal warrior data in case a turn just ran
    if (arena !== 'normal') fetchImmortalWarriors().then(() => { refreshTree(); refreshContent(); });
    return;
  }
  S.selectedArena = arena;
  if (arena !== 'normal') fetchImmortalWarriors().then(() => { refreshTree(); refreshContent(); });
  // Clear warrior selection if it belongs to a different arena
  if (S.sel.type === 'warrior') {
    const team = S.teams[S.sel.teamId];
    if (team) {
      const w = team.warriors[S.sel.wIdx];
      if (w && (w.current_arena || 'normal') !== arena) {
        S.sel = { type: null };
        S.wTab = 'stats';
      }
    }
  }
  if (S.sel.type === 'immortal_warrior' && arena === 'normal') {
    S.sel = { type: null };
    S.wTab = 'stats';
  }
  // Clear team selection if no warriors in new arena for that team
  if (S.sel.type === 'team') {
    const team = S.teams[S.sel.teamId];
    if (team) {
      const hasWarrior = (team.warriors || []).some(
        w => w && (w.current_arena || 'normal') === arena);
      if (!hasWarrior) S.sel = { type: null };

  S.challengeTargets = null;

  S.scout.loaded = false;
  S.scout.targets = null;
  S.scout.selections = [];
  S.scout.slotsLeft = 3;
  refreshTree();
  refreshContent();
}

function switchNewsletterArena(arena) {
  S.newsletterArena = arena;
  if (arena === 'normal') {

    S.newsletterTurn = S.newsletters?.length
      ? S.newsletters[S.newsletters.length - 1] : null;

    S.newsletterImmortalTurns = null;

}

// Build the Spire warrior lists from the locally cached arena team files, in the
// same shape /api/immortal_warriors returns. Used whenever the server is unreachable
// so the Spire tree, stats and fight history stay available offline.
async function _immortalWarriorsFromLocal() {
  const out = { elite: [], veteran: [] };
  for (const arena of ['elite', 'veteran']) {
    const files = await fsaListDir(`${arena}/teams`).catch(() => []);
    for (const f of files) {
      if (!/^team_\d+\.json$/.test(f)) continue;
      const team = await fsaReadJSON(`${arena}/teams/${f}`).catch(() => null);
      if (!team) continue;
      const add = (w, archived) => {
        if (!w || typeof w !== 'object') return;
        // A warrior who just took the final Soul Spire death stays listed (grayed out).
        if (!w.soul_spire_final_death && (archived ? (w.is_dead ?? true) : w.is_dead)) return;
        if ((w.current_arena || arena) !== arena) return;
        const af = (w.fight_history || []).filter(h => (h.arena || 'normal') === arena);
        out[arena].push({
          ...w,
          team_name:    team.team_name,
          team_id:      team.team_id,
          manager_name: team.manager_name || '',
          arena_wins:   af.filter(h => h.result === 'win').length,
          arena_losses: af.filter(h => h.result === 'loss').length,
          arena_kills:  af.filter(h => h.is_kill).length,
        });
      };
      for (const w of (team.warriors || [])) add(w, false);
      for (const w of (team.archived_warriors || [])) add(w, true);
    }
  }
  return out;
}

// sync:false refreshes only the warrior list (one request) - for saves, where the full
// sync of team files, fight results and newsletters would add several seconds.
async function fetchImmortalWarriors({ sync = true } = {}) {
  const base = (S.serverUrl || '').replace(/\/+$/, '');
  const useLocal = async () => {
    try { S.immortalWarriors = await _immortalWarriorsFromLocal(); } catch(_le) { /* nothing cached */ }
  };
  // Show the locally saved Spire warriors straight away (e.g. right after login) instead of an
  // empty tree while the server list downloads; the server data then replaces them.
  if (!S.immortalWarriors?.elite?.length && !S.immortalWarriors?.veteran?.length) {
    await useLocal();
    if (typeof refreshTree === 'function') { try { refreshTree(); } catch(_e) {} }
  }
  if (!base) { await useLocal(); return; }
  try {
    const r = await fetch(`${base}/api/immortal_warriors`);
    const d = await r.json();
    if (!d.success) { await useLocal(); return; }
    S.immortalWarriors = { elite: d.elite || [], veteran: d.veteran || [] };
    if (!sync) return;
    try { await _syncImmortalTeamsLocally(base); } catch(_te) { /* non-fatal */ }
    // Sync fight result files for both arenas so fight logs are available offline.
    // Fetch available turn list first, then pull any turns we don't have locally.
    for (const _arena of ['elite', 'veteran']) {
      try {
        const _nr = await fetch(`${base}/api/arena_newsletters?arena=${_arena}`);
        const _nd = await _nr.json();
        const _turns = _nd.turns || [];
        if (_turns.length) {
          await _syncImmortalResultsLocally(base, _arena, _turns);
          await _syncImmortalNewslettersLocally(base, _arena, _turns);
        }
      } catch(_e) { /* non-fatal */ }
    }
  } catch(e) {
    // Server unreachable - show the locally cached Spire data instead.
    await useLocal();
  }
}

async function _syncImmortalTeamsLocally(base) {
  const myMgrName = (S.league?.managerName || S.account?.manager_name || '').toLowerCase();
  if (!myMgrName) return;

  // One entry per (team, arena): a team can have warriors in both Spires, and each
  // Spire keeps its own copy of the team file, so both copies must be saved.
  const myTeamArenas = new Map();
  for (const arena of ['elite', 'veteran']) {
    for (const w of (S.immortalWarriors?.[arena] || [])) {
      if (w.team_id == null || (w.manager_name || '').toLowerCase() !== myMgrName) continue;
      myTeamArenas.set(`${w.team_id}|${arena}`, { tid: w.team_id, arena });
    }
  }
  for (const { tid, arena } of myTeamArenas.values()) {
    // Refresh the local arena copy every sync (current stats + arena fight history) so the
    // Spire tree, stats and fights are available offline and never go stale after a turn.
    // Never read arena data into S.teams -- arena files contain only veteran/elite warriors.
    try {
      const tr = await fetch(`${base}/api/immortal_team?team_id=${tid}&arena=${arena}`);
      const td = await tr.json();
      if (td.success && td.team && td.arena === arena) {
        await Store.writeArenaTeam(arena, td.team);
      }
    } catch(e) { /* non-fatal - keep the existing local copy */ }

    // Populate S.teams from the normal-arena file (teams/) if not already set.
    // This is the only safe source for S.teams -- arena subfolder files have a
    // different warrior set and must never overwrite the normal-arena view.
    if (!S.teams?.[tid]) {
      const normalTeam = await Store.readTeam(tid).catch(() => null);
      if (normalTeam) {
        if (!S.teams) S.teams = {};
        S.teams[tid] = normalTeam;
      }
    }
  }
}

async function _syncImmortalResultsLocally(base, arena, turns) {
  if (!turns || !turns.length) return;
  const mid = S.league?.managerId || '';
  const pw  = S.league?.password || '';

  // Build set of turns we already have at least one result file for locally
  const existingFiles = await fsaListDir(`${arena}/results`).catch(() => []);
  const haveTurns = new Set(
    existingFiles.map(f => {
      const m = f.match(/_turn_(\d+)\.json$/);
      return m ? parseInt(m[1], 10) : null;
    }).filter(n => n !== null)
  );

  // Always re-download the last 5 turns: the server may re-run recent turns,
  // changing fight IDs. Old cache would then have wrong IDs, breaking local lookup.
  const alwaysRefresh = new Set(turns.slice(-5));

  let saved = 0;
  for (const turn of turns) {
    if (!alwaysRefresh.has(turn) && haveTurns.has(turn)) continue; // older cached turns: skip

    try {
      // The server only returns this manager's own result files (they contain strategy
      // tables), and requires the league password just like the regular results download.
      if (!mid || !pw) continue;
      const qs = `arena=${arena}&turn=${turn}&manager_id=${encodeURIComponent(mid)}&password=${encodeURIComponent(pw)}`;
      const r = await fetch(`${base}/api/immortal_result?${qs}`);
      if (!r.ok) continue;
      const d = await r.json();
      if (!d.success) continue;
      const mine = new Set();
      for (const res of (d.results || [])) {
        const tid = res.team_id;
        if (!tid) continue;
        mine.add(`team_${String(tid).padStart(4,'0')}_turn_${String(turn).padStart(3,'0')}.json`);
        await Store.writeArenaResult(arena, tid, turn, res);

        // Merge fight history from result into team file so warrior records are updated
        try {
          const teamPath = `${arena}/teams/team_${String(tid).padStart(4,'0')}.json`;
          const team = await Store.readArenaTeam(arena, tid).catch(() => null);
          if (team && res.fight_history) {
            // Build a map of existing fight_ids to avoid duplicates
            const existingFightIds = new Set();
            for (const w of (team.warriors || [])) {
              for (const h of (w.fight_history || [])) {
                if (h.fight_id) existingFightIds.add(h.fight_id);
              }
            }
            // Merge new fights into warriors
            for (const w of (team.warriors || [])) {
              const resWarrior = (res.warriors || []).find(rw => rw.name === w.name);
              if (resWarrior && resWarrior.fight_history) {
                for (const newFight of resWarrior.fight_history) {
                  if (!existingFightIds.has(newFight.fight_id)) {
                    w.fight_history = w.fight_history || [];
                    w.fight_history.push(newFight);
                    existingFightIds.add(newFight.fight_id);
                  }
                }
              }
            }
            await Store.writeArenaTeam(arena, team);
          }
        } catch(e) { /* non-fatal -- just keep cached result file */ }
        saved++;
      }
      // Remove other teams' result files saved for this turn by older clients, which
      // were sent every team's file.
      const suffix = `_turn_${String(turn).padStart(3,'0')}.json`;
      for (const f of existingFiles) {
        if (f.startsWith('team_') && f.endsWith(suffix) && !mine.has(f)) {
          await fsaDeleteFile(`${arena}/results/${f}`).catch(() => {});
        }
      }
    } catch(e) { /* non-fatal -- server may be offline */ }
  }
  return saved;
}

async function _syncImmortalNewslettersLocally(base, arena, turns) {
  if (!turns || !turns.length) return;
  const existingTurns = new Set(await Store.listArenaNewsletterTurns(arena).catch(() => []));
  const alwaysRefresh = new Set(turns.slice(-5)); // always refresh last 5 turns in case server regenerated them
  let saved = 0;
  for (const turn of turns) {
    if (!alwaysRefresh.has(turn) && existingTurns.has(turn)) continue;
    try {
      const r = await fetch(`${base}/api/arena_newsletter?arena=${arena}&turn=${turn}`);
      if (!r.ok) { console.error(`Newsletter fetch failed for ${arena} turn ${turn}: HTTP ${r.status}`); continue; }
      const d = await r.json();
      if (!d.success || !d.content) { console.error(`Newsletter response missing content for ${arena} turn ${turn}:`, d); continue; }
      await Store.writeArenaNewsletter(arena, turn, d.content);
      saved++;
    } catch(e) { console.error(`Newsletter sync error for ${arena} turn ${turn}:`, e.message); }
  }
  return saved;
}

async function loadImmortalNewsletterTurns(arena) {
  try {
    const r = await fetch(`${S.serverUrl || ''}/api/arena_newsletters?arena=${arena}`);
    const d = await r.json();
    S.newsletterImmortalTurns = d.turns || [];
  } catch(e) {
    // Server offline -- fall back to locally cached newsletters
    S.newsletterImmortalTurns = await Store.listArenaNewsletterTurns(arena).catch(() => []);
  }
  if (S.newsletterImmortalTurns.length) {
    const latest = S.newsletterImmortalTurns[S.newsletterImmortalTurns.length - 1];
    await loadImmortalNewsletterTurn(arena, latest);
  } else {
    refreshContent();
  }
}

async function loadImmortalNewsletterTurn(arena, turn) {
  S.newsletterTurn = turn;
  S.newsletterText = null;
  refreshContent();
  try {
    const r = await fetch(
      `${S.serverUrl || ''}/api/arena_newsletter?arena=${arena}&turn=${turn}`);
    const d = await r.json();
    S.newsletterText = d.content || '(empty)';
  } catch(e) {
    // Server offline -- try local cache
    const cached = await Store.readArenaNewsletter(arena, turn).catch(() => null);
    S.newsletterText = cached || '(Newsletter not available offline -- download while connected to save it locally.)';
  }
  refreshContent();
}
