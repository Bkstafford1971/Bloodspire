   CREATE TEAM ACTIONS (ELECTRON UPDATED)
   ============================================================ */
async function initCreateTeam(isReplacing) {
  S.view = 'create_team';
  render();

  try {
    if (!S.gd) { 
      const r = await API.get('/api/game_data'); 
      if (r && !r.error) S.gd = r; 
    }
    // Restore from localStorage if in-memory state was lost (e.g. page reload).
    // This prevents players from refreshing the page to get a new set of stat rolls.
    if (!S.ct) {
      try {
        const stored = localStorage.getItem(_ROLLUP_KEY);
        if (stored) S.ct = JSON.parse(stored);
        // Rolls saved by an older client carry no server roll_id and cannot be used.
        // The server hands back the same rolls it issued, so nothing is lost by refetching.
        if (S.ct && !(S.ct.warriors || []).every(w => w && w.roll_id)) S.ct = null;
      } catch(_) {}
    }

    if (!S.ct) {
      const r = await API.get('/api/rollup');
      if (!r || r.error || !r.rolls) {
        setMsg('Failed to fetch warrior rollups: ' + (r?.error || 'Check server connection'), 'err');
        S.view = 'main';
        S.replacingTeam = null;
        render();
        return;
      }
      S.ct = {
        teamName : '',
        sel      : 0,
        warriors : r.rolls.map((base, i) => ({ base, roll_id: (r.roll_ids || [])[i], name:'', race:'Human', gender:'Male' })),
        adds     : r.rolls.map(() => ({ strength:0, dexterity:0, constitution:0, intelligence:0, presence:0, size:0 })),
        saved    : [false, false, false, false, false],
      };
      // Persist so cancel + page reload doesn't allow a fresh re-roll
      try { localStorage.setItem(_ROLLUP_KEY, JSON.stringify(S.ct)); } catch(_) {}
    }
    S.msg  = '';
  } catch (err) {
    setMsg('Network error: ' + (err.message || 'Check server connection'), 'err');
    S.view = 'main';
    S.replacingTeam = null;
  }
  render();
}

function ctAdjust(key, delta) {
  const ct  = S.ct;
  const i   = ct.sel;
  const cur = ct.adds[i][key] || 0;
  const base= ct.warriors[i].base[key];
  const cap = Math.min(7, 25 - base);
  const ptsUsed = ATTR_KEYS.reduce((a,k) => a + (ct.adds[i][k]||0), 0);
  const ptsLeft = 16 - ptsUsed;

  if (delta > 0 && (cur >= cap || ptsLeft <= 0)) return;
  if (delta < 0 && cur <= 0) return;

  ct.adds[i][key] = cur + delta;
  const nEl = el('ct-wname');
  if (nEl) ct.warriors[i].name = nEl.value;
  render();
}

function doCtReset() {
  const i = S.ct.sel;
  ATTR_KEYS.forEach(k => { S.ct.adds[i][k] = 0; });
  render();
}

function doCtSaveWarrior() {
  const ct = S.ct;
  if (!ct) return;
  const i = ct.sel;
  const rEl  = el('ct-wrace');    if (rEl)  ct.warriors[i].race   = rEl.value;
  const gEl  = el('ct-wgender'); if (gEl)  ct.warriors[i].gender = gEl.value;
  const gNEl = el(`ct-name-${i}`); if (gNEl) ct.warriors[i].name = gNEl.value;
  const nEl  = el('ct-wname');    if (nEl)  ct.warriors[i].name = nEl.value;
  
  // Validate name is not empty
  if (!ct.warriors[i].name || ct.warriors[i].name.trim() === '') {
    alert('Please enter a warrior name before saving.');
    return;
  }
  
  if (!ct.saved) ct.saved = [false,false,false,false,false];
  ct.saved[i] = true;
  render();
}

async function doSaveTeam() {
  const tNameEl = el('ct-team-name');
  if (tNameEl) S.ct.teamName = tNameEl.value.trim();

  doCtSaveWarrior(); 
  const ct = S.ct;

  for (let i = 0; i < 5; i++) {
    const gNEl = el(`ct-name-${i}`);
    if (gNEl) ct.warriors[i].name = gNEl.value.trim();
  }

  const tName = (ct.teamName || '').trim();
  if (!tName) { setMsg('Please enter a team name.', 'err'); render(); return; }
  if (tName.length > 25) { setMsg('Team name must be 25 characters or fewer.', 'err'); render(); return; }

  for (let i = 0; i < 5; i++) {
    const nm = (ct.warriors[i].name||'').trim();
    if (!nm) {
      setMsg(`Warrior ${i+1} needs a name. Click that row and enter one.`, 'err');
      S.ct.sel = i;
      render(); return;
    }
    if (nm.length > 25) {
      setMsg(`Warrior ${i+1}'s name must be 25 characters or fewer.`, 'err');
      S.ct.sel = i;
      render(); return;
    }
  }

  const warriors = ct.warriors.map((w, i) => {
    const a = ct.adds[i] || {};
    return {
      roll_id     : w.roll_id,
      name        : w.name.toUpperCase(),
      race        : w.race,
      gender      : w.gender,
      strength    : w.base.strength    + (a.strength||0),
      dexterity   : w.base.dexterity   + (a.dexterity||0),
      constitution: w.base.constitution+ (a.constitution||0),
      intelligence: w.base.intelligence+ (a.intelligence||0),
      presence    : w.base.presence    + (a.presence||0),
      size        : w.base.size        + (a.size||0),
      armor           : w.armor || 'None',
      helm            : w.helm || 'None',
      primary_weapon  : w.primary_weapon || 'Open Hand',
      secondary_weapon: w.secondary_weapon || 'Open Hand',
      backup_weapon   : w.backup_weapon || null,
    };
  });

  try {
    const r = await API.post('/api/team/create', {
      manager_id  : S.league.managerId || S.account.id,
      password    : S.league.password || '',
      manager_name: S.account.manager_name,
      team_name   : tName,
      warriors,
    });
    
    if (!r.success) { 
        setMsg(r.error || 'Could not create team.', 'err'); 
        render(); 
        return; 
    }

    // Propagate auto-upload from the replaced team so the new team uploads next turn
    const autoUpload = S.replacingTeam ? !!S.replacingTeam.auto_upload : true;
    r.team.auto_upload_enabled = autoUpload;

    // 1. Ensure the 'teams' directory exists before writing
    // If the folder is missing, Store.writeTeam will fail
    await Store.writeTeam(r.team);

    // 2. Load and update the local account file
    let acc = await Store.readAccount();
    if (!acc || !acc.manager_name) acc = JSON.parse(JSON.stringify(S.account));
    
    acc.team_ids = acc.team_ids || [];

    if (S.replacingTeam) {
      const rt = S.replacingTeam;
      const idx = acc.team_ids.indexOf(rt.old_team_id);
      
      if (idx !== -1) acc.team_ids[idx] = r.team_id;
      else acc.team_ids.push(r.team_id);
      
      // Archive + withdraw the old team now that the replacement exists (must run
      // before the old team's file is deleted, since it copies that file to archives/).
      await finalizeTeamReplacement(rt.old_team_id);
      delete S.teams[rt.old_team_id];
      // Clean up the physical file[cite: 2]
      await Store.deleteTeam(rt.old_team_id);
      
      const sidx = S.account.team_ids.indexOf(rt.old_team_id);
      if (sidx !== -1) S.account.team_ids[sidx] = r.team_id;
      else S.account.team_ids.push(r.team_id);
      
      S.replacingTeam = null;
    } else {
      if (!acc.team_ids.includes(r.team_id)) acc.team_ids.push(r.team_id);
      if (!S.account.team_ids.includes(r.team_id)) S.account.team_ids.push(r.team_id);
    }

    // 3. Persist account and update Global State[cite: 2]
    await Store.writeAccount(acc);
    S.account = acc; 

    // 4. Synchronize memory for immediate strategy editing and uploading[cite: 2]
    S.teams[r.team_id] = r.team;
    S.team = r.team; 
    S.expanded[r.team_id] = true;
    S.sel = { type:'team', teamId: r.team_id };
    
    S.view = 'main';
    S.ct = null;
    try { localStorage.removeItem(_ROLLUP_KEY); } catch(_) {}

    let successMsg = 'Team created and saved locally.';
    if (S.league.managerId) {
      successMsg += ' Remember to click "Action -> Upload" to enter this team into the Arena!';
    }
    setMsg(successMsg, 'ok');
    render();
  } catch (err) {
    // If you see this, the file system failed[cite: 2]
    console.error("Critical Save Error:", err);
    setMsg('Local save failed: ' + (err.message || err), 'err'); 
    render();
  }
}

function _damageClass(text) {
  const t = text.toLowerCase();
  // Light - superficial, grazes, nicks, barely connects
  if (/superficial|shallow|barely|minor|skim|kisses|merely|beads|sting|prick|lightly|scrapes|nicks|glances|slap|little real harm|little more than|little effect/.test(t))
    return 'nar-damage-light';
  // Heavy - horrific, savage, bone-breaking, devastating
  if (/horrific|terrible|savage|gruesome|brutal|devastating|shattering|violently|gaping|ghastly|erupts|sprays wildly|impales|skewered|ragged|bone-|nearly severing|nearly takes|wide open|ruin|pulps/.test(t))
    return 'nar-damage-heavy';
  // Default - medium
  return 'nar-damage-medium';
}

function narrativeToHtml(text) {
  // The narrative has 3 === separators:
  //   ===1 … ===2  →  matchup header  (NAME vs NAME / team / race)
  //   ===2 … ===3  →  prose + strategy table
  //   after ===3   →  blow-by-blow fight narrative
  const lines = text.split('\n');
  const out   = [];
  let sepCount    = 0;
  let matchupDone = false;
  let inStrat     = false;  // inside the strategy <table>

  // Column positions detected dynamically from the TRIGGER header line.
  // This handles both old saves (32-char trigger column) and new (42-char).
  let _cols = null;

  function detectCols(hdr) {
    const fs  = hdr.indexOf('FIGHTING STYLE');
    const lv  = hdr.indexOf('LEVEL', fs + 14); // skip past 'FIGHTING STY…'
    const aim = hdr.indexOf('AIMING POINT');
    const def = hdr.indexOf('DEFENSE POINT');
    _cols = { fs, lv, aim, def };
  }

  function parseStrat(ln) {
    if (!_cols) return { trigger: ln, style: '', level: '', aim: '', def: '' };
    const { fs, lv, aim, def } = _cols;
    return {
      trigger: ln.slice(0, fs).trim(),
      style:   ln.slice(fs, lv).trim(),
      level:   ln.slice(lv, aim - 2).trim(),  // level is 5 chars; -2 skips the 2-space gap
      aim:     ln.slice(aim, def).trim(),
      def:     ln.slice(def).trim(),
    };
  }

  function closeStrat() {
    if (inStrat) { out.push('</tbody></table>'); inStrat = false; }
  }

  for (const ln of lines) {
    // === separator ─────────────────────────────────────────────────
    if (/^={5,}/.test(ln)) {
      closeStrat();
      sepCount++;
      out.push('<div class="nar-sep"></div>');
      if (sepCount === 1) matchupDone = false;
      continue;
    }

    // ── Section 1: matchup header (===1 … ===2) ────────────────────
    if (sepCount === 1) {
      if (!matchupDone) {
        if (!ln.trim()) { matchupDone = true; out.push('<div style="height:8px"></div>'); continue; }
        const vsIdx = ln.indexOf('   vs   ');
        if (vsIdx >= 0) {
          const L = ln.slice(0, vsIdx).trim();
          const R = ln.slice(vsIdx + 8).trim();

          // Detect line type: warrior name, record, team, manager, or race
          const isRecord = /^\d+[-–]\d+[-–]\d+$/.test(L);
          const isTeam = /^TEAM:\s*/i.test(L);
          const isManager = /^MANAGER:\s*/i.test(L);

          if (isRecord) {
            // Record line - bold + larger
            out.push(`<div class="nar-row"><span class="nar-col-l"><span class="nar-wrec">${esc(L)}</span></span><span class="nar-col-vs"></span><span class="nar-col-r"><span class="nar-wrec">${esc(R)}</span></span></div>`);
          } else if (isTeam || isManager) {
            // Team/Manager lines - bold
            const fw = p => `<strong>${esc(p)}</strong>`;
            out.push(`<div class="nar-row"><span class="nar-col-l">${fw(L)}</span><span class="nar-col-vs"></span><span class="nar-col-r">${fw(R)}</span></div>`);
          } else if (/^[A-Z][A-Z\s']+$/.test(L) || L.includes("'")) {
            // Warrior name line - bold + larger
            out.push(`<div class="nar-row" style="margin:6px 0"><span class="nar-col-l"><span class="nar-wname">${esc(L)}</span></span><span class="nar-col-vs">vs</span><span class="nar-col-r"><span class="nar-wname">${esc(R)}</span></span></div>`);
          } else {
            // Race / other lines - normal formatting
            out.push(`<div class="nar-row"><span class="nar-col-l"><strong>${esc(L)}</strong></span><span class="nar-col-vs"></span><span class="nar-col-r"><strong>${esc(R)}</strong></span></div>`);
          }
        } else {
          out.push(`<div class="nar-line">${esc(ln)}</div>`);
        }
      }
      continue;
    }

    // ── Section 2: prose + strategy table (===2 … ===3) ───────────
    if (sepCount === 2) {
      if (/^-{5,}/.test(ln)) continue; // skip the --- under TRIGGER header

      if (!ln.trim()) { closeStrat(); out.push('<div style="height:6px"></div>'); continue; }

      // Strategy table header - detect column positions first, then parse
      if (/^TRIGGER\s/.test(ln.trim())) {
        detectCols(ln);
        const c = parseStrat(ln);
        inStrat = true;
        out.push(
          `<table class="nar-strat-tbl"><thead><tr>` +
          `<th class="nar-st-trig">${esc(c.trigger)}</th>` +
          `<th class="nar-st-style">${esc(c.style)}</th>` +
          `<th class="nar-st-level">${esc(c.level)}</th>` +
          `<th class="nar-st-aim">${esc(c.aim)}</th>` +
          `<th>${esc(c.def)}</th>` +
          `</tr></thead><tbody>`
        );
        continue;
      }

      // Strategy data rows
      if (inStrat) {
        const c = parseStrat(ln);
        out.push(
          `<tr>` +
          `<td class="nar-st-trig">${esc(c.trigger)}</td>` +
          `<td class="nar-st-style">${esc(c.style)}</td>` +
          `<td class="nar-st-level">${esc(c.level)}</td>` +
          `<td class="nar-st-aim">${esc(c.aim)}</td>` +
          `<td>${esc(c.def)}</td>` +
          `</tr>`
        );
        continue;
      }

      // Prose lines - bold warrior name prefix + any ALL-CAPS items (armor, weapons)
      const pm = ln.match(/^([A-Z][A-Z ']{2,}?)(\s+(?:is |weighs |Has |enters |fights |has |wears |carries |[A-Z][a-z]))/);
      if (pm) {
        const name = pm[1];
        const rest = ln.slice(name.length);
        const restHtml = esc(rest).replace(/\b([A-Z]{2,}(?:[-\s][A-Z]{2,})*)\b/g, '<strong>$1</strong>');
        out.push(`<div class="nar-prose"><strong>${esc(name)}</strong>${restHtml}</div>`);
      } else {
        out.push(`<div class="nar-prose">${esc(ln)}</div>`);
      }
      continue;
    }

    // ── Section 3: fight narrative (after ===3) ────────────────────
    if (sepCount >= 3) {
      if (/^\*\*\*.*\*\*\*$/.test(ln))                                         { out.push(`<div class="nar-event">${esc(ln)}</div>`);   continue; }
      if (/^MINUTE\s+\d+/.test(ln.trim()))                                      { out.push(`<div class="nar-minute">${esc(ln)}</div>`);  continue; }
      if (/SLAIN/.test(ln) || /collapses/i.test(ln)) { out.push(`<div class="nar-line">${esc(ln)}</div>`);   continue; }
      if (/wins/i.test(ln) && (/judge/i.test(ln) || /victory/i.test(ln)))      { out.push(`<div class="nar-win">${esc(ln)}</div>`);     continue; }
      if (/has trained in/i.test(ln) || /observed/i.test(ln))                   { out.push(`<div class="nar-training">${esc(ln)}</div>`); continue; }
      if (/switches to strategy/i.test(ln))                                     { out.push(`<div class="nar-strategy">${esc(ln)}</div>`); continue; }
      if (/^\s+HP/.test(ln) || /HP:/.test(ln) || /damage/i.test(ln))           { out.push(`<div class="nar-line">${esc(ln)}</div>`);      continue; }
      if (!ln.trim())                                                            { out.push('<br>');                                       continue; }
      // Damage result lines arrive with 3 leading spaces from narrative.py
      if (/^   \S/.test(ln))                                                    { out.push(`<div class="nar-damage-indent">${esc(ln.trim())}</div>`); continue; }
      out.push(`<div class="nar-line">${esc(ln)}</div>`);
    }
  }
  closeStrat();
  return out.join('');
}

    <div id="nar-resize-se" style="position:absolute; bottom:0; right:0; width:8px; height:8px; cursor:se-resize; z-index:10;"></div>
  </div>`;

  el('nar-body').innerHTML = narrativeToHtml(t.text || '');

  // Initialize dragging and resizing
  _initNarrativeWindowHandlers();
}

function _initNarrativeWindowHandlers() {
  const win = el('nar-window');
  const titleBar = el('nar-title');
  if (!win || !titleBar) return;

  let isDragging = false;
  let isResizing = false;
  let resizeEdge = null;
  let startX, startY, startLeft, startTop, startWidth, startHeight;

  // Dragging
  titleBar.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    startLeft = win.offsetLeft;
    startTop = win.offsetTop;
  });

  // Resizing - handle all resize zones
  ['n', 's', 'e', 'w', 'nw', 'ne', 'sw', 'se'].forEach(edge => {
    const handle = el(`nar-resize-${edge}`);
    if (handle) {
      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isResizing = true;
        resizeEdge = edge;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = win.offsetLeft;
        startTop = win.offsetTop;
        startWidth = win.offsetWidth;
        startHeight = win.offsetHeight;
      });
    }
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging && !isResizing) return;

    if (isDragging) {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      win.style.left = (startLeft + dx) + 'px';
      win.style.top = Math.max(0, startTop + dy) + 'px';
    }

    if (isResizing) {
      const minW = 300, minH = 200;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      // Top resize
      if (resizeEdge.includes('n')) {
        const newTop = startTop + dy;
        const newHeight = startHeight - dy;
        if (newHeight > minH && newTop >= 0) {
          win.style.top = newTop + 'px';
          win.style.height = newHeight + 'px';
        }
      }
      // Bottom resize
      if (resizeEdge.includes('s')) {
        const newHeight = startHeight + dy;
        if (newHeight > minH) {
          win.style.height = newHeight + 'px';
        }
      }
      // Left resize
      if (resizeEdge.includes('w')) {
        const newLeft = startLeft + dx;
        const newWidth = startWidth - dx;
        if (newWidth > minW && newLeft >= 0) {
          win.style.left = newLeft + 'px';
          win.style.width = newWidth + 'px';
        }
      }
      // Right resize
      if (resizeEdge.includes('e')) {
        const newWidth = startWidth + dx;
        if (newWidth > minW) {
          win.style.width = newWidth + 'px';
        }
      }
    }
  });

  document.addEventListener('mouseup', () => {
    if (isDragging || isResizing) {
      // Save the current window state
      S.narrativeWindowState = {
        width: win.offsetWidth,
        height: win.offsetHeight,
        left: win.offsetLeft,
        top: win.offsetTop
      };
      isDragging = false;
      isResizing = false;
      resizeEdge = null;
    }
  });
}

function hideNarrativeOverlay() {
  const ov = el('narrative-overlay');
  if (ov) ov.style.display = 'none';
}

async function openNarrative(fightId, turnNum, arena = 'normal') {
  // 1. Try local save first (fights/ folder, results/ folder, and elite/veteran results/)
  try {
    const r = await API.get(`/api/fight/narrative?id=${fightId}&turn=${turnNum || 0}&arena=${arena}`);
    if (r.success) {
      S.narrative = { text: r.narrative, title: `Fight #${fightId}` };
      showNarrativeOverlay();
      await _unlockDeathFight(fightId);
      return;
    }
  } catch(e) {}

  // 2. Fetch from league server (pass arena so immortal fights resolve to the right directory)
  if (turnNum) {
    try {
      const base = (S.serverUrl || '').replace(/\/+$/, '');
      if (base) {
        let qs = `turn=${turnNum}&fight_id=${fightId}&arena=${arena}`;
        const lg = S.league;
        if (lg?.managerId) qs += `&manager_id=${encodeURIComponent(lg.managerId)}`;
        if (lg?.password)  qs += `&password=${encodeURIComponent(lg.password)}`;
        const resp = await fetch(`${base}/api/fight_log?${qs}`);
        const d = await resp.json();
        if (d.success) {
          S.narrative = { text: d.narrative, title: `Fight #${fightId} (Turn ${turnNum})` };
          showNarrativeOverlay();
          await _unlockDeathFight(fightId);
          return;
        }
      }
    } catch(e) {}
  }

  alert('Fight log not available. The narrative may not have been saved for this fight.');
}

async function _unlockDeathFight(fightId) {
  // If this fight killed one of the player's warriors and HideRecord is on,
  // clear the gate flag now that they've read it and unlock the Replacement tab.
  const tid = S.sel?.teamId;
  const team = tid != null ? S.teams[tid] : null;
  if (!team) return;
  let changed = false;
  for (const w of team.warriors || []) {
    if (w && w.death_fight_id_unread === fightId) {
      delete w.death_fight_id_unread;
      changed = true;
    }
  }
  if (changed) {
    await Store.writeTeam(team);
    S.teams[tid] = team;
    // Switch to Replacement tab now that the gate is lifted
    S.wTab = 'replacement';
    render();
  }
}

function closeNarrative() {
  S.narrative = null;
  hideNarrativeOverlay();
}

      S.newsletters = null;     // invalidate newsletter cache
      S.newsletterText = null;  // force fresh load on next view
      S.turnResults = r;

      S.scout.loaded     = false;
      S.scout.selections = [];

      S.scout.targets    = null;

// Convert ANSI escape sequences in newsletter text to HTML spans so
// bold/colored markers render properly inside a <pre> block. Everything
// outside an ANSI sequence is HTML-escaped to keep the output safe.
function renderNewsletterText(text) {
  if (text == null) return '';
  const ansiRe = /\x1b\[([0-9;]*)m/g;
  let out = '';
  let last = 0;
  let openSpan = false;
  let m;
  while ((m = ansiRe.exec(text)) !== null) {
    out += esc(text.slice(last, m.index));
    if (openSpan) { out += '</span>'; openSpan = false; }
    const codes = m[1].split(';').filter(Boolean);
    if (codes.length && !(codes.length === 1 && codes[0] === '0')) {
      const styles = [];
      // Colors are applied via CSS classes (not inline hex) so dark mode can
      // override them -- e.g. red headers use the brighter --text-err in dark.
      let cls = '';
      if (codes.includes('1')) styles.push('font-weight:bold');
      if (codes.includes('31')) cls = 'nl-c-red';
      else if (codes.includes('32')) cls = 'nl-c-green';
      else if (codes.includes('33')) cls = 'nl-c-yellow';
      else if (codes.includes('34')) cls = 'nl-c-blue';
      else if (codes.includes('35')) cls = 'nl-c-magenta';
      else if (codes.includes('36')) cls = 'nl-c-cyan';
      // Codes 98/99/998/999 are private markers (not real ANSI colors) used
      // only for newsletter headers, so they render larger (and, for 998/999,
      // centered as a block) without affecting the same bold-red code used
      // inline for manager names in tables.
      if (codes.includes('99')) styles.push('font-size:1.15em');
      if (codes.includes('98')) styles.push('font-size:calc(1em + 6px)');
      if (codes.includes('998')) styles.push('font-size:calc(1em + 3px)', 'display:block', 'text-align:center', 'line-height:1.2');
      if (codes.includes('999')) styles.push('font-size:calc(1em + 12px)', 'display:block', 'text-align:center', 'line-height:1.2');
      if (styles.length || cls) {
        out += `<span${cls ? ` class="${cls}"` : ''}${styles.length ? ` style="${styles.join(';')}"` : ''}>`;
        openSpan = true;
      }
    }
    last = ansiRe.lastIndex;
  }
  out += esc(text.slice(last));
  if (openSpan) out += '</span>';
  return out;
}

// Open a web link in the user's default browser. The renderer can't navigate
// to external sites without replacing the app, so this goes via the main process.
async function openExternalLink(url) {
  try {
    const r = await window.electronAPI.openExternal(url);
    if (!r || !r.success) {
      setMsg('Could not open link: ' + ((r && r.error) || 'unknown error'), 'err');
      render();
    }
  } catch (e) {
    setMsg('Could not open link: ' + e.message, 'err');
    render();
  }
}

// Open the guide. Prefers a previously saved offline copy; otherwise opens
// the live version in the browser.
async function openPlayersGuide() {
  try {
    if (await window.electronAPI.fileExists(GUIDE_FILE)) {
      const r = await window.electronAPI.openSavedFile(GUIDE_FILE);
      if (r && r.success) return;
    }
  } catch (_) { /* fall through to the online copy */ }
  openExternalLink(GUIDE_URL);
}

// Save the guide with every screenshot embedded as a data URI so it reads
// correctly with no connection. The work happens in the main process because
// the screenshots' CORS policy blocks fetching them from the renderer.
async function savePlayersGuideOffline() {
  setMsg('Downloading players guide and embedding images - this may take a moment...', 'ok');
  render();
  try {
    const r = await window.electronAPI.downloadGuide();
    if (!r || !r.success) {
      setMsg('Could not save guide: ' + ((r && r.error) || 'unknown error'), 'err');
      render();
      return;
    }
    const mb = (r.bytes / 1048576).toFixed(1);
    let msg = `Guide saved for offline use - ${r.embedded}/${r.total} images embedded (${mb} MB).`;
    if (r.failed && r.failed.length) {
      msg += ` ${r.failed.length} image(s) could not be fetched.`;
      console.warn('Guide images that failed:', r.failed);
    }
    setMsg(msg, r.failed && r.failed.length ? 'err' : 'ok');
    render();
    if (confirm(`${msg}\n\nSaved to:\n${r.path}\n\nOpen it now?`)) {
      await window.electronAPI.openSavedFile(GUIDE_FILE);
    }
  } catch (e) {
    setMsg('Could not save guide: ' + e.message, 'err');
    render();
  }
}

async function redownloadNewsletter() {
  console.log('redownloadNewsletter called');
  const lg = S.league;
  console.log('League settings:', { url: lg?.url, managerId: lg?.managerId });

  if (!lg.url || !lg.managerId) {
    setMsg('Configure league settings first (league URL and manager ID required).', 'err');
    return;
  }

  setMsg('Redownloading newsletter from league server...', 'ok');
  render();
  try {
    // Get the current turn from league settings/config
    console.log('Fetching league settings to get current turn...');
    const settingsResp = await API.get('/api/league_settings');
    console.log('League settings response:', settingsResp);

    // Try to get the turn from account/game state
    let latestTurn = S.league.lastTurnRan || null;
    console.log('Last turn ran from league state:', latestTurn);

    if (!latestTurn) {
      setMsg('Unable to determine current turn. Run a turn or download results first.', 'err');
      return;
    }

    console.log('Latest turn:', latestTurn);

    // Fetch the newsletter for this turn from the league server
    const nlUrl = `${lg.url}/api/newsletter?turn=${latestTurn}`;
    console.log('Fetching from:', nlUrl);
    const nlRes = await fetch(nlUrl);
    console.log('Fetch response status:', nlRes.status);
    const nlData = await nlRes.json();
    console.log('Newsletter data:', nlData);

    if (!nlData.success || !nlData.newsletter) {
      setMsg('Failed to redownload newsletter: ' + (nlData.error || 'Newsletter not available'), 'err');
      return;
    }

    // Save it locally via the API endpoint
    const saveResp = await API.post('/api/newsletter/save', {
      turn: latestTurn,
      text: nlData.newsletter
    });

    if (!saveResp.success) {
      setMsg('Failed to save newsletter: ' + (saveResp.error || 'Unknown error'), 'err');
      return;
    }

    // Clear cache and open newsletter view
    S.newsletters = null;
    S.newsletterText = null;
    S.newsletterTurn = latestTurn;
    setMsg('Newsletter redownloaded and saved successfully.', 'ok');

    // Open the newsletter panel
    await openNewsletter();
  } catch(e) {
    setMsg('Error redownloading newsletter: ' + e.message, 'err');
  }
}

async function openNewsletter() {
  S.sel = {type:'newsletter'};
  S.wTab = 'stats';
  // Always re-fetch the list so newly produced turns appear
  const prevList = S.newsletters || [];
  const r = await API.get('/api/newsletters');
  S.newsletters = r.turns || [];
  const latest = S.newsletters.length ? S.newsletters[S.newsletters.length - 1] : null;
  const prevLatest = prevList.length ? prevList[prevList.length - 1] : null;
  // If a newer turn exists, or nothing is selected, jump to latest
  if (latest && (!S.newsletterTurn || (prevLatest !== null && latest > prevLatest))) {
    S.newsletterTurn = latest;
    S.newsletterText = null;
  }
  if (S.newsletterTurn && !S.newsletterText) {
    await loadNewsletterTurn(S.newsletterTurn);
  }
  refreshContent();
}

async function loadNewsletterTurn(turn) {
  S.newsletterTurn = turn;
  S.newsletterText = null;
  refreshContent();   // show loading state
  const r = await API.get('/api/newsletter?turn=' + turn);
  if (r.success) {
    S.newsletterText = r.text;
  } else {
    S.newsletterText = '(Newsletter not available for turn ' + turn + ')';
  }
  refreshContent();
}

function buildNewsletterPanel() {
  const turns = S.newsletters || [];
  const cur   = S.newsletterTurn;
  const text  = S.newsletterText;

  // Turn selector
  const opts = turns.map(t =>
    `<option value="${t}" ${t===cur?'selected':''}>Turn ${t}</option>`
  ).join('');

  const selector = turns.length
    ? `<select onchange="loadNewsletterTurn(parseInt(this.value))" style="font-size:11px;">${opts}</select>`
    : `<span style="color:var(--text-faint);font-size:11px;">No newsletters yet - run a turn first.</span>`;

  let body = '';
  if (!turns.length) {
    body = '<div style="padding:20px; color:var(--text-dim); font-size:11px;">No newsletters available yet. Run a turn or download results first.</div>';
  } else if (text !== null) {
    body = `<pre class="nl-page" style="font-family:Courier New,monospace; font-size:11px; line-height:1.5;
                   white-space:pre-wrap; word-wrap:break-word; margin:0; padding:8px;
                   overflow:auto; max-height:calc(100vh - 120px);"
       >${renderNewsletterText(text)}</pre>`;
  } else {
    body = '<div style="padding:20px; color:var(--text-dim); font-size:11px;">Loading...</div>';
  }

  return `
<div style="display:flex; flex-direction:column; height:100%; overflow:hidden;">
  <div style="padding:4px 8px; background:var(--bg); border-bottom:1px solid var(--mid);
              display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
    <b style="font-size:11px;">📜 Arena Newsletter</b>
    ${selector}
    <button style="margin-left:auto; font-size:11px;" onclick="openNewsletter()">↺ Refresh</button>
    <button style="font-size:11px;" onclick="S.sel={type:null};refreshContent()">✕ Close</button>
  </div>
  <div style="flex:1; overflow:auto;">
    ${body}
  </div>
</div>`;
}

async function loadLeagueSettings() {
  try {
    const r = await API.get('/api/league_settings');
    // LocalAPI returns a flat object {url, managerId, managerName, password, ...}
    // (no success/settings wrapper) - update S.league field-by-field.
    if (r) {
      if (r.url)          S.league.url         = r.url;
      if (r.managerId)    S.league.managerId   = r.managerId;
      if (r.managerName)  S.league.managerName = r.managerName;
      if (r.password)     S.league.password    = r.password;
      if (r.lastUpload)   S.league.lastUpload  = r.lastUpload;
      if (r.lastDownload) S.league.lastDownload = r.lastDownload;
      if (r.lastTurnRan)  S.league.lastTurnRan  = r.lastTurnRan;
      if (r.scoutReports) S.scout.reports       = r.scoutReports;
    }
    
    // Fetch feature flags and last upload timestamp from league server if connected
    if (S.league.url && S.league.managerId) {
      // Fetch feature flags (public, no auth needed)
      try {
        const flagResp = await fetch(S.league.url + '/api/flags');
        if (flagResp.ok) {
          const flagData = await flagResp.json();
          if (flagData.success) {
            S.league.flags = {
              show_favorite_weapon: flagData.show_favorite_weapon || false,
              show_luck_factor:     flagData.show_luck_factor     || false,
              show_max_hp:          flagData.show_max_hp          || false,
            };
            refreshContent();
          }
        }
      } catch(e) { /* silent */ }

      try {
        const statusResp = await fetch(S.league.url + '/api/status');
        if (statusResp.ok) {
          const statusData = await statusResp.json();
          if (statusData.managers) {
            const mgr = statusData.managers.find(m => m.manager_id === S.league.managerId);
            if (mgr && mgr.last_upload_timestamp) {
              // Convert timestamp string (YYYY-MM-DD HH:MM:SS) to toLocaleString() format
              try {
                const uploadDate = new Date(mgr.last_upload_timestamp.replace(' ', 'T'));
                S.league.lastUpload = uploadDate.toLocaleString();
              } catch(e) {
                S.league.lastUpload = mgr.last_upload_timestamp; // fallback to raw string
              }
            }
          }
        }
      } catch(e) { /* silent - don't interrupt if status fetch fails */ }
    }
  } catch(e) {}
  // Pre-load immortal warrior data so Dead Grounds / Elite Spire tabs are ready
  // (falls back to the local cache when there is no server connection).
  fetchImmortalWarriors().then(() => refreshTree());
}

async function doSaveLeagueSettings() {
  const url  = (el('lm-url')?.value  || '').trim().replace(/\/+$/, '');
  const name = (el('lm-name')?.value || '').trim();
  const pw   = (el('lm-pw')?.value   || '').trim();
  if (!url)  { _leagueMsg('Server URL is required.', 'err'); return; }
  if (!name) { _leagueMsg('Manager name is required.', 'err'); return; }

  // First-time: auto-register with the league server before saving
  if (!S.league.managerId) {
    if (!pw) { _leagueMsg('Password is required for first-time registration.', 'err'); return; }
    _leagueMsg('Registering with league server...', 'ok');
    try {
      const r = await fetch(url + '/api/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({manager_name: name, password: pw})
      });
      const d = await r.json();
      if (!d.success) { _leagueMsg('Registration failed: ' + d.error, 'err'); return; }
      S.league.managerId   = d.manager_id;
      S.league.managerName = d.manager_name;
      S.league.password    = pw;
      S.league.url         = url;
    } catch(e) { _leagueMsg('Could not reach league server: ' + e.message, 'err'); return; }
  } else {
    S.league.url         = url;
    S.league.managerName = name;
    if (pw) S.league.password = pw;
  }

  // Save to local file so it survives page reload
  try {
    await API.post('/api/league_settings', {
      manager_name: S.account?.manager_name || S.league.managerName || '',
      url,
      managerId  : S.league.managerId,
      managerName: S.league.managerName,
      password   : S.league.password || '',
    });
    _leagueMsg(
      S.league.managerId
        ? '✓ Registered as ' + S.league.managerName + ' - settings saved.'
        : 'Settings saved.',
      'ok'
    );
    setTimeout(() => { el('league-modal')?.remove(); render(); }, 900);
  } catch(e) { _leagueMsg('Could not save settings: ' + e.message, 'err'); }
}

async function doLeagueUpload(teamId) {
  // Flush any pending warrior save so challenge strategies are persisted before upload
  await flushSave();

  const lg = S.league;

  // 1. Validation: Ensure required settings exist before attempting connection
  if (!lg.url || !lg.managerId) {
    setMsg('Configure league settings first (Action → League Settings).', 'err');
    render();
    return;
  }

  // 2. Security: Ensure password is present or prompted
  const pw = lg.password || prompt('League password:');
  if (!pw) return;
  lg.password = pw;

  setMsg('Reading local team data...', 'ok'); 
  render();

  try {
    // 3. Use in-memory team state as the upload source so that fields like
    // challenge_strategy_enabled always reflect what the user configured in
    // the current session, even if an async disk write is still in flight.
    // Fall back to disk only when the team isn't loaded in memory.
    let teamData = null;
    if (S.teams && S.teams[teamId]) {
      teamData = JSON.parse(JSON.stringify(S.teams[teamId]));
    } else {
      teamData = await Store.readTeam(teamId);
    }

    if (!teamData || !teamData.warriors || teamData.warriors.length === 0) {
      setMsg('Upload aborted: No warrior data found in local file.', 'err');
      render();
      return;
    }

    setMsg('Connecting to Arena server...', 'ok'); 
    render();

    // 4. URL Sanitization: Remove trailing slashes to prevent malformed API paths
    const baseUrl = lg.url.endsWith('/') ? lg.url.slice(0, -1) : lg.url;
    
    // 5. Network Request: Send the bundle to the server
    const r = await fetch(`${baseUrl}/api/upload`, {
      method: 'POST', 
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        manager_id: lg.managerId, 
        password: pw, 
        client_version: CLIENT_VERSION,
        team: teamData 
      })
    });

    if (!r.ok) throw new Error(`Server returned status ${r.status}`);

    const d = await r.json();
    
    if (d.success) {
      // 6. Update Client State: Track the successful upload locally
      lg.uploaded = true;
      lg.lastUpload = new Date().toLocaleString();
      
      await API.post('/api/league_settings', {
        manager_name: S.account?.manager_name || lg.managerName || '',
        url: lg.url, 
        managerId: lg.managerId, 
        managerName: lg.managerName, 
        password: lg.password,
        lastUpload: lg.lastUpload, 
        lastDownload: lg.lastDownload, 
        lastTurnRan: lg.lastTurnRan,
      });
      
      setMsg('✓ Success! Your roster is now live in the Arena.', 'ok');
    } else { 
      setMsg('Server Error: ' + (d.error || 'The server rejected the data.'), 'err'); 
    }
  } catch(e) { 
    setMsg('Connection Failed: Check your League URL and server status.', 'err'); 
    console.error("Upload failure details:", e);
  }
  
  render();
}

async function doImmortalUpload(arena) {
  await flushSave();
  const lg = S.league;
  const arenaLabel = arena === 'elite' ? 'Elite Spire' : 'Soul Spire';
  if (!lg.url || !lg.managerId) {
    setMsg('Configure league settings first.', 'err'); render(); return;
  }
  const baseUrl = lg.url.replace(/\/$/, '');

  // Find teams that have my warriors in this arena
  const arenaWarriors = (S.immortalWarriors || {})[arena] || [];
  const myMgrName = (lg.managerName || S.account?.manager_name || '').toLowerCase();
  const myWarriors = myMgrName
    ? arenaWarriors.filter(w => (w.manager_name || '').toLowerCase() === myMgrName)
    : arenaWarriors;
  const myTeamIds = [...new Set(myWarriors.map(w => w.team_id))];

  if (!myTeamIds.length) {
    setMsg(`No warriors in ${arenaLabel} to upload.`, 'err'); render(); return;
  }

  // Build step list — one step per team, same pattern as regular upload
  const steps = [
    'Checking server connection',
    ...myTeamIds.map(tid => {
      const t = S.teams?.[tid];
      return `Uploading ${t?.team_name || `Team ${tid}`}`;
    }),
    'Refreshing arena data',
  ];

  _showUploadProgress(steps, 0, null);
  let currentStep = 0;

  // Step 0 — verify server reachable
  try {
    const ping = await fetch(`${baseUrl}/api/status`);
    if (!ping.ok) throw new Error(`Server returned ${ping.status}`);
  } catch (e) {
    _showUploadProgress(steps, currentStep, `Cannot reach server: ${e.message}`); return;
  }
  _showUploadProgress(steps, ++currentStep, null);
  await new Promise(res => setTimeout(res, 40));

  // One step per team
  const errors = [];
  for (const tid of myTeamIds) {
    try {
      let teamData = (S.teams && S.teams[tid])
        ? JSON.parse(JSON.stringify(S.teams[tid]))
        : await Store.readArenaTeam(arena, tid).catch(() => null)
          || await Store.readTeam(tid).catch(() => null);
      if (!teamData) throw new Error('No local team data');

      // Merge server-authoritative gear/trains from S.immortalWarriors into upload.
      // do_PUT updates the server snapshot directly but not the local S.teams copy,
      // so without this merge the upload would overwrite server changes with stale local data.
      const _iws = ((S.immortalWarriors || {})[arena] || []).filter(w => w.team_id == tid);
      if (_iws.length && Array.isArray(teamData.archived_warriors)) {
        const _gf = ['trains', 'armor', 'helm', 'primary_weapon', 'secondary_weapon',
                     'backup_weapon', 'strategies', 'challenge_strategies', 'challenge_strategy_enabled',
                     'taunts_jeers', 'blood_cry'];
        for (const aw of teamData.archived_warriors) {
          const iw = _iws.find(w => w.name === aw.name);
          if (iw) { for (const f of _gf) { if (f in iw) aw[f] = iw[f]; } }
        }
      }

      const r = await fetch(`${baseUrl}/api/immortal_upload`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          arena,
          team_id:      tid,
          team:         teamData,
          manager_id:   lg.managerId || S.account?.id || '',
          password:     lg.password || '',
          manager_name: lg.managerName || S.account?.manager_name || '',
        })
      });
      const d = await r.json();
      console.log('[BP] immortal upload ' + arena + ' team ' + tid + ' result:', d);
      if (!d.success) errors.push(`${teamData.team_name || `Team ${tid}`}: ${d.error || 'failed'}`);
    } catch (e) {
      console.error('[BP] immortal upload ' + arena + ' team ' + tid + ' failed:', e);
      errors.push(`Team ${tid}: ${e.message}`);
    }
    if (errors.length) {
      _showUploadProgress(steps, currentStep, errors[errors.length - 1]); return;
    }
    _showUploadProgress(steps, ++currentStep, null);
    await new Promise(res => setTimeout(res, 40));
  }

  // Final step — refresh warrior data from server
  try {
    await fetchImmortalWarriors();
    refreshTree();
  } catch (_) {}
  _showUploadProgress(steps, ++currentStep, null);
}

async function doImmortalDownload(arena) {
  const lg = S.league;
  const arenaLabel = arena === 'elite' ? 'Elite Spire' : 'Soul Spire';
  if (!lg.url) { setMsg('Configure league settings first.', 'err'); render(); return; }
  const baseUrl = lg.url.replace(/\/$/, '');

  const steps = [
    'Locating server',
    'Connecting to server',
    'Fetching arena warriors',
    'Saving team & fight data locally',
    'Fetching newsletter',
    'Finalising',
  ];

  _showDownloadProgress(steps, 0, null);
  let currentStep = 0;

  // Step 0 — locate server
  _showDownloadProgress(steps, ++currentStep, null);
  await new Promise(res => setTimeout(res, 40));

  // Step 1 — connect / ping
  try {
    const ping = await fetch(`${baseUrl}/api/status`);
    if (!ping.ok) throw new Error(`Server returned ${ping.status}`);
  } catch (e) {
    _showDownloadProgress(steps, currentStep, `Cannot reach server: ${e.message}`); return;
  }
  _showDownloadProgress(steps, ++currentStep, null);
  await new Promise(res => setTimeout(res, 40));

  // Step 2 — fetch arena warriors
  try {
    const r = await fetch(`${baseUrl}/api/immortal_warriors`);
    const d = await r.json();
    if (d.success) S.immortalWarriors = { elite: d.elite || [], veteran: d.veteran || [] };
    else throw new Error(d.error || 'Failed to fetch warriors');
  } catch (e) {
    _showDownloadProgress(steps, currentStep, `Warrior fetch failed: ${e.message}`); return;
  }
  _showDownloadProgress(steps, ++currentStep, null);
  await new Promise(res => setTimeout(res, 40));

  // Step 3 — save team files + all fight result files locally so data is available offline
  let turns = [];
  let savedResults = 0;
  try {
    // Sync team files for the manager's own warriors
    await _syncImmortalTeamsLocally(baseUrl);

    // Fetch turn list and save result files (fight logs) for each turn not yet cached
    const nr = await fetch(`${baseUrl}/api/arena_newsletters?arena=${arena}`);
    const nd = await nr.json();
    turns = nd.turns || [];
    S.newsletterImmortalTurns = turns;
    if (turns.length) {
      savedResults = await _syncImmortalResultsLocally(baseUrl, arena, turns) || 0;
      const savedNewsletters = await _syncImmortalNewslettersLocally(baseUrl, arena, turns) || 0;
      console.log(`[immortal sync] ${arena}: ${savedResults} result files, ${savedNewsletters} newsletters saved`);
    }
  } catch (e) {
    console.warn('Result sync failed:', e.message);
  }
  const latestTurn = turns.length ? turns[turns.length - 1] : null;
  _showDownloadProgress(steps, ++currentStep, null);
  await new Promise(res => setTimeout(res, 40));

  // Step 4 — fetch newsletter text and save locally
  if (latestTurn !== null) {
    try {
      const r = await fetch(`${baseUrl}/api/arena_newsletter?arena=${arena}&turn=${latestTurn}`);
      const d = await r.json();
      if (d.success) {
        S.newsletter = d.newsletter || '';
        S.newsletterArena = arena;
        S.newsletterTurn  = latestTurn;
      }
    } catch (e) {
      _showDownloadProgress(steps, currentStep, `Newsletter fetch failed: ${e.message}`); return;
    }
  }
  _showDownloadProgress(steps, ++currentStep, null);
  await new Promise(res => setTimeout(res, 40));

  // Step 5 — finalise: switch to arena tab and refresh
  selectArena(arena);
  refreshTree();
  refreshContent();
  _showDownloadProgress(steps, ++currentStep, null);
  if (savedResults > 0) {
    const arenaLabel2 = arena === 'elite' ? 'Elite Spire' : 'Soul Spire';
    setMsg(`${arenaLabel2} download complete. Fight logs for ${savedResults} bout(s) saved locally for offline viewing.`, 'ok');
  }
}

async function doLeagueDownloadAll() {
  const lg = S.league;
  if (!lg.url || !lg.managerId) { setMsg('Configure league settings first.', 'err'); return; }
  const pw = lg.password || prompt('League password:');
  if (!pw) return;
  lg.password = pw;

  _showDownloadProgress(_DL_STEPS, 0, null);
  const tick = (i) => _showDownloadProgress(_DL_STEPS, i, null);
  const fail = (msg, i) => _showDownloadProgress(_DL_STEPS, i, msg);

  try {
    // ── Step 1-2: Connect directly to league server from the browser ──────
    // This bypasses the Python proxy entirely - no urllib timeout possible.
    tick(1); await new Promise(r => setTimeout(r, 60));
    tick(2); await new Promise(r => setTimeout(r, 60));
    tick(3); // Authenticating + fetching

    const resultsUrl = `${lg.url}/api/results` +
      `?manager_id=${encodeURIComponent(lg.managerId)}` +
      `&password=${encodeURIComponent(pw)}`;

    let resultsResp;
    try {
      const ctrl = new AbortController();
      const tmo  = setTimeout(() => ctrl.abort(), 120000); // 2 min timeout
      const res  = await fetch(resultsUrl, {signal: ctrl.signal});
      clearTimeout(tmo);
      resultsResp = await res.json();
    } catch(e) {
      const msg = e.name === 'AbortError'
        ? 'League server did not respond within 2 minutes. Is the turn still running? Try again shortly.'
        : 'Could not reach league server: ' + e.message;
      fail(msg, 3); return;
    }
    if (!resultsResp.success) {
      fail(resultsResp.error || 'Server returned an error.', 3); return;
    }

    if (resultsResp.already_current) {
      _showDownloadProgress(_DL_STEPS, _DL_STEPS.length, null);
      const dlModal = document.getElementById('dl-progress-modal');
      if (dlModal) {
        const footer = dlModal.querySelector('div[style*="color:var(--text-good)"]') || dlModal.querySelector('div[style*="color:var(--text-dim)"]');
        if (footer) footer.textContent = `Turn ${resultsResp.turn} already downloaded - nothing new to apply.`;
      }
      return;
    }

    // CHANGE: The server now backfills every turn missed since the last download
    // (e.g. away for several turns while auto-carry kept the team playing), returned
    // oldest-first in resultsResp.turns. Fall back to a single-turn list built from
    // the old top-level fields so this still works against an older server response.
    const turnsToProcess = (resultsResp.turns && resultsResp.turns.length)
      ? [...resultsResp.turns].sort((a, b) => a.turn - b.turn)
      : [{
          turn: resultsResp.turn,
          results: resultsResp.results || (resultsResp.result ? [resultsResp.result] : []),
          has_newsletter: resultsResp.has_newsletter,
        }];

    if (!turnsToProcess.some(t => (t.results && t.results.length) || t.has_newsletter)) {
      fail('No results returned from server.', 3); return;
    }

    // ── Step 4: Apply each turn's results locally, oldest first ───────────
    // Results must be applied in turn order since team state (HP, injuries,
    // deaths) compounds across turns.
    tick(4);
    const applied = []; const missed = [];
    let collectedScoutReports = [];
    let newsletterSaved = false;
    const turnNum = turnsToProcess[turnsToProcess.length - 1].turn; // latest turn processed

    // Build local name→id map from known teams
    const nameToId = {};
    Object.values(S.teams || {}).forEach(t => {
      if (t && t.team_name) nameToId[t.team_name.toLowerCase()] = t.team_id;
    });

    for (const turnEntry of turnsToProcess) {
      const teamResults = turnEntry.results || [];
      // Scout reports only ever live for one turn, so each turn's reports replace
      // (not merge with) the previous turn's - only the last turn's survive below.
      const turnScoutReports = [];
      const seenScoutWarriors = new Set();  // dedup: a multi-team manager's scout_reports are
                                             // attached to every one of their team result files

      for (const result of teamResults) {
        // Match by team_id first, then team_name
        let localTid = null;
        const serverTid = result.team_id;
        const knownIds  = S.account?.team_ids || Object.keys(S.teams||{}).map(Number);
        if (serverTid && knownIds.includes(Number(serverTid))) {
          localTid = Number(serverTid);
        } else {
          localTid = nameToId[(result.team_name||'').toLowerCase()] || null;
        }

        if (!localTid) {
          missed.push(`Turn ${turnEntry.turn}: ${result.team_name || 'Unknown'}`);
          continue;
        }

        if (Array.isArray(result.scout_reports) && result.scout_reports.length) {
          for (const rep of result.scout_reports) {
            if (!seenScoutWarriors.has(rep.warrior_name)) {
              seenScoutWarriors.add(rep.warrior_name);
              turnScoutReports.push(rep);
            }
          }
        }

        const app = await API.post('/api/apply_league_results', {
          team_id: localTid, result, rerun: !!S._pendingRerun,
        });
        if (app.success) {
          console.log(`Successfully applied turn ${turnEntry.turn} results for team ${localTid}`);
          S.teams[localTid] = app.team;
          applied.push({ team_id: localTid, team_name: result.team_name || '?',
                         turn: turnEntry.turn, bouts: app.bouts, team: app.team });
        } else {
          missed.push(`Turn ${turnEntry.turn}: ${result.team_name || '?'}: ${app.error || '?'}`);
        }
      }
      collectedScoutReports = turnScoutReports;

      // ── Fetch this turn's newsletter directly from league server ────────
      if (turnEntry.has_newsletter) {
        try {
          const nlUrl  = `${lg.url}/api/newsletter?turn=${turnEntry.turn}`;
          const nlRes  = await fetch(nlUrl);
          const nlData = await nlRes.json();
          if (nlData.success && nlData.newsletter) {
            await API.post('/api/newsletter/save', { turn: turnEntry.turn, text: nlData.newsletter });
            newsletterSaved = true;
          }
        } catch(e) {
          console.warn(`Newsletter fetch failed for turn ${turnEntry.turn}:`, e.message);
        }
      }
    }
    if (newsletterSaved) {
      S.newsletters = null; S.newsletterText = null; S.newsletterTurn = null;
    }

    tick(5); await new Promise(r => setTimeout(r, 50)); // Saving fight data
    tick(6); await new Promise(r => setTimeout(r, 50)); // Fetching newsletter(s) - done above per turn
    tick(7); await new Promise(r => setTimeout(r, 50)); // Finalising

    if (!applied.length && !turnsToProcess.some(t => t.has_newsletter)) {
      fail('No results matched your local teams.' +
           (missed.length ? ' Unmatched: ' + missed.join(', ') : '') +
           '  Upload your teams first, then ask the host to run the turn.', 3);
      return;
    }

    _showDownloadProgress(_DL_STEPS, _DL_STEPS.length, null);

    // Turns downloaded - invalidate scout and challenge caches so they refresh with updated warrior records.
    S.scout.loaded     = false;
    S.scout.selections = [];
    S.scout.slotsLeft  = 3;
    S.scout.targets    = null;
    S.scout.report     = null;
    S.scout.reports    = collectedScoutReports;
    S.challengeTargets = null;  // Clear challenge targets cache to show updated warrior fight records

    const uniqueNames = [...new Set(applied.map(a => a.team_name))].join(', ');
    const turnLabel = turnsToProcess.length > 1
      ? `Turns ${turnsToProcess[0].turn}-${turnNum}`
      : `Turn ${turnNum}`;
    const warn   = missed.length ? `  (${missed.length} unmatched: ${missed.join(', ')})` : '';
    const nlNote = newsletterSaved ? '  Newsletter(s) ready.' : '';
    setMsg(`✓ ${turnLabel} downloaded for ${uniqueNames}${warn}${nlNote}`, 'ok');

    // Record download timestamp and turn number
    const lg2 = S.league;
    lg2.lastDownload = new Date().toLocaleString();
    lg2.lastTurnRan  = turnNum;
    await API.post('/api/league_settings', {
      manager_name: S.account?.manager_name || lg2.managerName || '',
      url: lg2.url, managerId: lg2.managerId, managerName: lg2.managerName, password: lg2.password,
      lastUpload: lg2.lastUpload, lastDownload: lg2.lastDownload, lastTurnRan: lg2.lastTurnRan,
      scoutReports: collectedScoutReports,
    });

    if (applied.length >= 1) {
      S.sel  = {type: 'team', teamId: applied[0].team_id};
      S.wTab = 'fights';
      await processDeletedTeams(resultsResp.deleted_teams, lg.managerId);
    }
    render();

  } catch(e) {
    fail('Unexpected error: ' + e.message, 1);
  }
}

// Direct, full overwrite of every team this manager owns from the server's
// authoritative copy -- unlike Download/apply_league_results (which MERGES new
// turn results into the local save and only has anything to do once a new turn
// has actually run), this always pulls current server state, bypassing any
// local cache. For when the local save has drifted from the server (a missed
// sync, a host-side data correction) and there's no new turn to trigger a
// normal download.
async function resyncMyTeamsFromServer() {
  const lg = S.league;
  if (!lg.url || !lg.managerId) { setMsg('Configure league settings first.', 'err'); return; }
  const pw = lg.password || prompt('League password:');
  if (!pw) return;
  lg.password = pw;

  if (!confirm('This overwrites your locally saved teams with the server\'s current data. '
             + 'Any local equipment/training/strategy edits not yet uploaded will be lost. Continue?')) return;

  setMsg('Resyncing teams from server...', '');
  render();
  try {
    const r = await fetch(`${lg.url.replace(/\/$/, '')}/api/team/get_my_team`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ manager_id: lg.managerId, password: pw }),
    }).then(res => res.json());

    if (!r.success) { setMsg('Resync failed: ' + (r.error || 'unknown error'), 'err'); render(); return; }

    let count = 0;
    for (const td of (r.teams || [])) {
      if (td.team_id == null) continue;
      await Store.writeTeam(td);
      S.teams[td.team_id] = td;
      count++;
    }
    setMsg(`Resynced ${count} team${count === 1 ? '' : 's'} from server.`, 'ok');
    refreshTree();
    refreshContent();
    render();
  } catch (e) {
    setMsg('Resync failed: ' + e.message, 'err');
    render();
  }
}

async function setRunNextTurn(teamId, value) {
  const r = await API.post('/api/team/run_next_turn', {
    manager_id: S.account?.id, team_id: teamId, value
  });
  if (!r.success || !r.team) {
    // Show error if checkbox couldn't be enabled
    alert('✗ Cannot run this turn: ' + (r.error || 'Unknown error'));
    // Uncheck the box since the operation failed
    const checkbox = document.getElementById(`cb-rnt-${teamId}`);
    if (checkbox) checkbox.checked = false;
    return;
  }

  S.teams[teamId] = r.team;
  // Refresh account tab summary if visible
  if (S.mgrTab === 'account') refreshContent();

  // The toggle above only writes local state. The arena builds each turn from
  // the uploaded team file, so the flag has no effect until the server has it --
  // push the team now so unchecking really does keep it out of the next turn.
  const lg = S.league || {};
  if (!lg.url || !lg.managerId || !lg.password) {
    setMsg('Saved locally. Upload this team for "Run This Turn" to take effect.', 'err');
    render();
    return;
  }
  const up = await API.post('/api/league/upload_one', {
    team_id: teamId,
    league_url: lg.url,
    league_manager_id: lg.managerId,
    password: lg.password,
  });
  if (up.success) {
    setMsg(value ? 'Team set to run next turn.' : 'Team set to sit out next turn.', 'ok');
  } else {
    setMsg(`Saved locally, but the arena was not updated (${up.error || 'upload failed'}). `
           + 'Upload this team to apply it.', 'err');
  }
  render();
}

async function confirmReplaceTeam(teamId) {
  const team = S.teams[teamId];
  const tname = team ? team.team_name : `Team ${teamId}`;
  const wasRunning = team ? !!team.auto_upload_enabled : true;

  if (!confirm(`Replace "${tname}"?\n\nAll current warriors will be archived.\nYou will create a new team in this slot.`)) return;
  
  // Nothing is archived, withdrawn or switched off here: that all happens in
  // finalizeTeamReplacement() once "Save Replacement" succeeds, so cancelling the
  // new-team screen leaves the original team completely untouched.
  S.ct = null;
  try { localStorage.removeItem(_ROLLUP_KEY); } catch(_) {} // force fresh rollups for replacement

  S.replacingTeam = {
    old_team_id: teamId,
    new_team_id: null,
    manager_id: S.account.id,
    auto_upload: wasRunning
  };
  setMsg('', '');

  // Start creating a new team as replacement
  initCreateTeam();
}

// Runs only after the replacement team has been saved: archive the old team, stop it
// running, and withdraw it from the league server.
async function finalizeTeamReplacement(teamId) {
  const oldTeam = S.teams[teamId] || await Store.readTeam(teamId);
  if (oldTeam) {
    await API.post('/api/team/replace', { manager_id: S.account.id, old_team_id: teamId });
  }

  if (S.runNextTurn) delete S.runNextTurn[teamId];
  try {
    await API.post('/api/team/run_next_turn', {
      manager_id: S.account.id,
      team_id: teamId,
      value: false,
    });
  } catch (e) { console.warn('run_next_turn reset error:', e); }

  // Withdraw the old team from the league server. If credentials are missing
  // or the call fails, leave the archive un-flagged so uploadAllTeams retries it later.
  if (S.league.url && S.league.managerId && S.league.password) {
    try {
      const wr = await API.post('/api/team/withdraw', {
        manager_id: Number(S.league.managerId),
        password:   S.league.password,
        team_id:    Number(teamId)
      });
      if (wr.success) {
        const arch = await Store.readArchivedTeam(teamId);
        if (arch) {
          arch.withdrawn_from_league = true;
          await Store.writeArchivedTeam(teamId, arch);
        }
      } else {
        console.warn('League withdraw failed:', wr.error);
      }
    } catch (e) { console.warn('Withdraw error:', e); }
  }
  S.legacyTeams = null; // invalidate so Legacy tab reloads on next visit
}


async function runAllTeams() {
  const ids = (S.account?.team_ids || []).filter(tid => S.runNextTurn[tid] !== false);
  if (!ids.length) { setMsg('No teams have "Run This Turn" checked.', 'err'); return; }
  setMsg(`Running ${ids.length} team(s)...`, 'ok'); render();
  const r = await API.post('/api/run_all_turns', {
    manager_id: S.account.id,
    team_ids: ids,
  });
  if (!r.success) { setMsg('Error: ' + r.error, 'err'); return; }
  // Reload all teams
  for (const res of r.results || []) {
    if (res.success) {
      const t = await API.get('/api/team?id=' + res.team_id);
      if (t.success) {
        S.teams[res.team_id] = t.team;
        // Clear challenges after turn completes (prevents autopilot grinding)
        if (S.teams[res.team_id].challenges) {
          S.teams[res.team_id].challenges = {};
        }
      }
    }
  }
  const wins  = (r.results||[]).reduce((a,x)=>a+(x.bouts||[]).filter(b=>b.result==='WIN').length,0);
  const total = (r.results||[]).reduce((a,x)=>a+(x.bouts||[]).length,0);
  setMsg(`Turn ${r.turn_number} complete - ${wins}W/${total-wins}L across ${ids.length} team(s).`, 'ok');
  S.sel = {type: null};
  S.scout.loaded     = false;
  S.scout.selections = [];
  S.scout.slotsLeft  = 3;
  S.scout.targets    = null;
  S.scout.report     = null;
  render();
}

async function checkLeagueResetOnLogin() {
  if (!S.league.managerId || !S.league.url) return;
  if (document.getElementById('league-reset-modal') || document.getElementById('league-rerun-modal')) return;
  try {
    const r = await API.post('/api/league/check_reset', { manager_id: S.league.managerId });
    if (!r.success) return; // silent on error - don't block login
    if (r.reset_detected) {
      _showLeagueResetModal(r.server_reset_count, { blocking: true });
    } else if (r.rerun_detected) {
      _showLeagueRerunModal(r.rerun_turn, r.rerun_count);
    }
  } catch(e) { /* silent - server may be unreachable */ }
}

async function checkLeagueReset() {
  if (!S.league.managerId || !S.league.url) return;
  if (document.getElementById('league-reset-modal') || document.getElementById('league-rerun-modal')) return;
  try {
    const r = await API.post('/api/league/check_reset', { manager_id: S.league.managerId });
    if (!r.success) {
      _leagueMsg('Reset check: ' + (r.error || 'unknown error'), 'err');
      return;
    }
    if (r.reset_detected) {
      _showLeagueResetModal(r.server_reset_count, { blocking: true });
    } else if (r.rerun_detected) {
      _showLeagueRerunModal(r.rerun_turn, r.rerun_count);
    } else {
      _leagueMsg('Server sync OK - no reset or rerun pending.', 'ok');
      setTimeout(() => { const m = el('lm-msg'); if (m) m.style.display = 'none'; }, 3000);
    }
  } catch(e) {
    _leagueMsg('Reset check failed: ' + e.message, 'err');
  }
}

async function checkAndDisplayAnnouncements() {
  try {
    const url = (S.serverUrl || window.location.origin) + '/api/announcements';
    const r = await fetch(url);
    if (!r.ok) return;
    const d = await r.json();
    if (!d.success || !d.announcements || d.announcements.length === 0) return;

    // Check localStorage for dismissed announcements
    const dismissedKey = 'bloodspire_dismissed_announcements';
    let dismissed = [];
    try {
      dismissed = JSON.parse(localStorage.getItem(dismissedKey) || '[]');
    } catch (e) { dismissed = []; }

    // Find first announcement that hasn't been dismissed
    for (const ann of d.announcements) {
      if (dismissed.includes(ann.id)) continue;

      // Show announcement modal
      showAnnouncementModal(ann, dismissedKey, dismissed);
      return; // Show only one at a time
    }
  } catch (e) {
    // Silent failure - don't block login if announcement fetch fails
  }
}

function showAnnouncementModal(ann, dismissedKey, dismissed) {
  const modal = document.createElement('div');
  modal.id = 'announcement-modal';
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:9000;display:flex;align-items:center;justify-content:center;';

  const closeBtn = document.createElement('button');
  closeBtn.textContent = 'OK';
  closeBtn.style.cssText = 'background:var(--sel);color:#fff;border:1px solid var(--sel-b);padding:6px 16px;cursor:pointer;font-size:13px';
  closeBtn.onclick = () => {
    // Mark as dismissed
    dismissed.push(ann.id);
    localStorage.setItem(dismissedKey, JSON.stringify(dismissed));
    modal.remove();
  };

  let linkHtml = '';
  if (ann.url) {
    linkHtml = `<div style="margin-top:12px;"><a href="${ann.url}" target="_blank" style="color:var(--text-info);text-decoration:underline;font-weight:bold;">Click here to download</a></div>`;
  }

  modal.innerHTML = `
    <div style="background:var(--bg);border:2px solid var(--text-good);border-radius:6px;padding:24px;min-width:400px;max-width:550px;box-shadow:0 4px 30px rgba(0,0,0,.6);">
      <div style="font-weight:bold;font-size:15px;color:var(--text-good);margin-bottom:14px;">${ann.title}</div>
      <div style="font-size:13px;color:var(--text);margin-bottom:16px;line-height:1.6;white-space:pre-wrap;">${ann.message}</div>
      ${linkHtml}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        ${linkHtml ? `<button style="background:var(--bg);border:1px solid var(--mid);padding:6px 16px;cursor:pointer" onclick="document.getElementById('announcement-modal').remove()">Later</button>` : ''}
        <button id="btn-announcement-ok" style="background:var(--ok-solid);color:#fff;border:1px solid var(--ok-solid);padding:6px 16px;cursor:pointer;font-size:13px">OK</button>
      </div>
    </div>`;

  document.body.appendChild(modal);
  document.getElementById('btn-announcement-ok').onclick = closeBtn.onclick;
}

function _showLeagueResetModal(serverResetCount, opts = {}) {
  const blocking = opts.blocking || false;
  const modal = document.createElement('div');
  modal.id = 'league-reset-modal';
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:8500;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML = `
    <div style="background:var(--bg);border:2px solid var(--warn);border-radius:6px;padding:20px;min-width:360px;max-width:480px;box-shadow:0 4px 20px rgba(0,0,0,.5);">
      <div style="font-weight:bold;font-size:14px;color:var(--warn);margin-bottom:12px;">&#9888; League Arena Has Been Reset to Turn 1</div>
      <div style="font-size:12px;color:var(--text);margin-bottom:6px;line-height:1.6;">
        The league server has been reset to start a new season. You must sync your local records before continuing.
      </div>
      <div style="font-size:11px;background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:4px;padding:8px 10px;margin-bottom:14px;line-height:1.7;">
        <strong>Normal Arena (reverted to Turn 1):</strong> Your normal arena teams will be wiped<br>
        <strong>Elite Spire &amp; Soul Spire:</strong> <span style="color:var(--text-good);font-weight:bold;">✓ Fully preserved</span> with all stats and fight history<br>
        <strong>Available to download:</strong> Complete fight archives for your elite/soul spire warriors
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        ${!blocking ? `<button onclick="document.getElementById('league-reset-modal').remove()">Dismiss</button>` : ''}
        <button id="btn-apply-reset" onclick="applyLeagueReset(${serverResetCount})"
                style="background:var(--warn-solid);color:#fff;border-color:var(--warn-solid);">Clear My Records &amp; Sync</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

async function applyLeagueReset(serverResetCount) {
  const btn = document.getElementById('btn-apply-reset');
  if (btn) { btn.disabled = true; btn.textContent = 'Resetting...'; }
  const pw = S.league.password || '';
  const r = await API.post('/api/league/acknowledge_reset', {
    manager_id: S.league.managerId,
    password: pw,
    server_reset_count: serverResetCount,
    type: 'reset',
  });
  if (!r.success) {
    if (btn) { btn.disabled = false; btn.textContent = 'Clear My Records & Sync'; }
    setMsg('Reset error: ' + r.error, 'err'); render(); return;
  }
  document.getElementById('league-reset-modal')?.remove();

  // Clear all newsletter caches (regular and immortal arenas start fresh after reset)
  await Store.clearNewsletters().catch(() => {});
  S.newsletters = null; S.newsletterText = null; S.newsletterTurn = null;
  S.newsletterImmortalTurns = []; S.newsletterImmortalText = null;

  if (r.full_reset) {
    // Full wipe: manager no longer exists on server - clear local league identity
    S.league.managerId   = null;
    S.league.managerName = null;
    await API.post('/api/league_settings', { managerId: '', managerName: '' });
    // Close League Settings modal so when the user reopens it they see "Register & Save"
    el('league-modal')?.remove();
    setMsg('Arena fully reset. Open League Settings and click Register & Save to rejoin.', 'ok');
  } else {
    // Clear ALL local teams first (normal and elite/veteran)
    try {
      if (S.teams) {
        for (const teamId of Object.keys(S.teams)) {
          await Store.deleteTeam(parseInt(teamId, 10)).catch(() => {});
        }
        S.teams = {};
      }
    } catch(e) { /* non-fatal */ }

    // Clear all normal arena result files (fight logs)
    try {
      const resultFiles = await fsaListDir('results');
      for (const filename of resultFiles) {
        if (filename.startsWith('team_') && filename.endsWith('.json') && !filename.includes('archived')) {
          await fsaDeleteFile(`results/${filename}`).catch(() => {});
        }
      }
    } catch(e) { /* non-fatal */ }

    // Clear archived/legacy teams
    try {
      const archIds = await Store.listArchivedTeamIds();
      for (const aid of archIds) {
        await fsaDeleteFile(`archives/team_${String(aid).padStart(4,'0')}.json`).catch(() => {});
      }
    } catch(e) { /* non-fatal */ }
    S.legacyTeams = [];

    // Restore elite/veteran teams from server response into their proper arena folders.
    // Determine arena from warriors' current_arena field; fall back to 'elite'.
    // Do NOT set S.teams here -- arena files have only veteran/elite warriors and would
    // poison the normal-arena tree. S.teams is repopulated by loadTeams() on next login.
    if (Array.isArray(r.teams) && r.teams.length) {
      for (const { team_id, team } of r.teams) {
        const warriors = (team.warriors || []).concat(team.archived_warriors || []);
        const arena = (warriors.find(w => w.current_arena)?.current_arena) || 'elite';
        await Store.writeArenaTeam(arena, team);
      }
    }

    // Clear lastTurnRan; reset account team_ids to empty (normal arena starts fresh)
    S.league.lastTurnRan = 0;
    await API.post('/api/league_settings', { lastTurnRan: 0 });
    if (S.account) {
      S.account.team_ids = [];
      await _persistAccount(S.account);
      S._accountCache = null;
    }

    // Auto-restore fight archives from Elite/Soul Spire warriors
    try {
      const archivesResp = await API.post('/api/league/list_archives', {
        manager_id: S.league.managerId
      });
      if (archivesResp.success && archivesResp.archives && archivesResp.archives.length > 0) {
        setMsg('Restoring fight history for your Elite Spire and Soul Spire eligible warriors. This may take a minute or two.', 'ok');
        // Automatically restore all archives
        const restoreResult = await _restoreAllArchives(archivesResp.archives);
        if (restoreResult.success) {
          // Format detailed team summary
          const teamSummary = restoreResult.restoredTeams
            .map(t => `${t.name} (${t.fights} fights)`)
            .join(', ');
          setMsg(`Records reverted to Turn 1. Restored ${restoreResult.fightsRestored} fights:\n${teamSummary}\n\nReady to fight!`, 'ok');
        } else {
          // Show error with retry option
          _showArchiveRestorationError(archivesResp.archives, restoreResult.error);
        }
      } else {
        setMsg('Records reverted to Turn 1 - ready to fight! Your Elite/Soul Spire teams are preserved.', 'ok');
      }
    } catch(e) {
      setMsg('Records reverted to Turn 1 - ready to fight! Your Elite/Soul Spire teams are preserved.', 'ok');
    }
  }
  // Reload account data so team_ids is updated from server
  await loadLeagueSettings().catch(() => {});
  render();
}

async function downloadArchive(filename) {
  try {
    const r = await API.post('/api/league/download_archive', {
      manager_id: S.league.managerId,
      filename: filename
    });

    if (!r.success) {
      setMsg('Download failed: ' + r.error, 'err');
      return;
    }

    // Convert archive object to JSON string and trigger download
    const jsonStr = JSON.stringify(r.archive, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    setMsg('Archive downloaded: ' + filename, 'ok');
  } catch(e) {
    setMsg('Download error: ' + e.message, 'err');
  }
}

async function _restoreAllArchives(archives) {
  let archivesRestored = 0;
  let fightsRestored = 0;
  const restoredTeams = [];

  for (const archiveMeta of archives) {
    try {
      // Download archive
      const r = await API.post('/api/league/download_archive', {
        manager_id: S.league.managerId,
        filename: archiveMeta.filename
      });

      if (!r.success) {
        console.warn(`Failed to download archive ${archiveMeta.filename}:`, r.error);
        continue;
      }

      // Restore fights to local storage
      const archive = r.archive;
      const teamId = archive.export_metadata.team_id;
      const teamName = archive.export_metadata.team_name;

      // Save fights as results file format
      const resultFile = {
        team_id: teamId,
        team_name: teamName,
        turn: 1, // Archive turn (use 1 for reference)
        fight_logs: {}
      };

      // Convert fights array to fight_logs object keyed by fight ID
      if (Array.isArray(archive.warriors)) {
        for (const warrior of archive.warriors) {
          if (Array.isArray(warrior.fights)) {
            for (const fight of warrior.fights) {
              const fightId = String(fight.fight_id || fight.turn);
              resultFile.fight_logs[fightId] = fight;
            }
          }
        }
      }

      // Save to results folder using filename with team and archive date
      const timestamp = archive.export_metadata.created_at.substring(0, 10).replace(/-/g, '');
      const resultFilename = `team_${String(teamId).padStart(4, '0')}_archived_${timestamp}.json`;
      await fsaWriteJSON(`results/${resultFilename}`, resultFile);

      const fightCount = Object.keys(resultFile.fight_logs).length;
      restoredTeams.push({ name: teamName, fights: fightCount });
      archivesRestored++;
      fightsRestored += fightCount;
    } catch (e) {
      console.warn(`Error restoring archive ${archiveMeta.filename}:`, e);
    }
  }

  if (archivesRestored > 0) {
    return { success: true, archivesRestored, fightsRestored, restoredTeams };
  } else {
    return { success: false, error: 'Failed to restore any archives', archivesRestored: 0, fightsRestored: 0, restoredTeams: [] };
  }
}
