async function checkLeagueResetOnLogin() {
  if (!S.league.managerId || !S.league.url) return;
  if (document.getElementById('league-reset-modal') || document.getElementById('league-rerun-modal')) return;
  try {
    const r = await API.post('/api/league/check_reset', { manager_id: S.league.managerId });
    if (!r.success) return; // silent on error - don't block login
    if (r.reset_detected) {
      _showLeagueResetModal(r.server_reset_count, { blocking: true });
    } else if (r.rerun_detected) {
      _showLeagueRerunModal(r.rerun_turn, r.rerun_count);
    }
  } catch(e) { /* silent - server may be unreachable */ }
}

async function checkLeagueReset() {
  if (!S.league.managerId || !S.league.url) return;
  if (document.getElementById('league-reset-modal') || document.getElementById('league-rerun-modal')) return;
  try {
    const r = await API.post('/api/league/check_reset', { manager_id: S.league.managerId });
    if (!r.success) {
      _leagueMsg('Reset check: ' + (r.error || 'unknown error'), 'err');
      return;
    }
    if (r.reset_detected) {
      _showLeagueResetModal(r.server_reset_count, { blocking: true });
    } else if (r.rerun_detected) {
      _showLeagueRerunModal(r.rerun_turn, r.rerun_count);
    } else {
      _leagueMsg('Server sync OK - no reset or rerun pending.', 'ok');
      setTimeout(() => { const m = el('lm-msg'); if (m) m.style.display = 'none'; }, 3000);
    }
  } catch(e) {
    _leagueMsg('Reset check failed: ' + e.message, 'err');
  }
}

function _showLeagueResetModal(serverResetCount, opts = {}) {
  const blocking = opts.blocking || false;
  const modal = document.createElement('div');
  modal.id = 'league-reset-modal';
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:8500;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML = `
    <div style="background:var(--bg);border:2px solid #c60;border-radius:6px;padding:20px;min-width:360px;max-width:480px;box-shadow:0 4px 20px rgba(0,0,0,.5);">
      <div style="font-weight:bold;font-size:14px;color:#c60;margin-bottom:12px;">&#9888; League Arena Has Been Reset to Turn 1</div>
      <div style="font-size:12px;color:#444;margin-bottom:6px;line-height:1.6;">
        The league server has been reset to start a new season. You must sync your local records before continuing.
      </div>
      <div style="font-size:11px;background:#fff8f0;border:1px solid #e8c080;border-radius:4px;padding:8px 10px;margin-bottom:14px;line-height:1.7;">
        <strong>Will be reverted:</strong> wins, losses, kills, fight history, skills, attribute gains, injuries<br>
        <strong>Will be kept:</strong> your warriors (at their Turn 1 stats), gear, and strategies
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        ${!blocking ? `<button onclick="document.getElementById('league-reset-modal').remove()">Dismiss</button>` : ''}
        <button id="btn-apply-reset" onclick="applyLeagueReset(${serverResetCount})"
                style="background:#c60;color:#fff;border-color:#a50;">Clear My Records &amp; Sync</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function applyLeagueReset(serverResetCount) {
  const btn = document.getElementById('btn-apply-reset');
  if (btn) { btn.disabled = true; btn.textContent = 'Resetting...'; }
  const pw = S.league.password || '';
  const r = await API.post('/api/league/acknowledge_reset', {
    manager_id: S.league.managerId,
    password: pw,
    server_reset_count: serverResetCount,
    type: 'reset',
  });
  if (!r.success) {
    if (btn) { btn.disabled = false; btn.textContent = 'Clear My Records & Sync'; }
    setMsg('Reset error: ' + r.error, 'err'); render(); return;
  }
  document.getElementById('league-reset-modal')?.remove();

  // Clear stale newsletter cache - server only has current-season newsletters
  await Store.clearNewsletters().catch(() => {});
  S.newsletters = null; S.newsletterText = null; S.newsletterTurn = null;

  if (r.full_reset) {
    // Full wipe: manager no longer exists on server - clear local league identity
    S.league.managerId   = null;
    S.league.managerName = null;
    await API.post('/api/league_settings', { managerId: '', managerName: '' });
    // Close League Settings modal so when the user reopens it they see "Register & Save"
    el('league-modal')?.remove();
    setMsg('Arena fully reset. Open League Settings and click Register & Save to rejoin.', 'ok');
  } else {
    // Progress reset: apply the server-reverted team state locally
    if (Array.isArray(r.teams) && r.teams.length) {
      for (const { team_id, team } of r.teams) {
        await Store.writeTeam(team);
        if (S.teams) S.teams[team_id] = team;
      }
    }
    // Clear archived/legacy teams - they contribute to the manager record calculation
    // and must not survive a revert-to-turn-1.
    try {
      const archIds = await Store.listArchivedTeamIds();
      for (const aid of archIds) {
        await fsaDeleteFile(`archives/team_${String(aid).padStart(4,'0')}.json`).catch(() => {});
      }
    } catch(e) { /* non-fatal */ }
    S.legacyTeams = [];
    setMsg('Records reverted to Turn 1 - ready to fight! Download results to get the new newsletter.', 'ok');
  }
  render();
}

function _showLeagueRerunModal(rerunTurn, rerunCount) {
  const modal = document.createElement('div');
  modal.id = 'league-rerun-modal';
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:8500;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML = `
    <div style="background:var(--bg);border:2px solid #06a;border-radius:6px;padding:20px;min-width:360px;max-width:480px;box-shadow:0 4px 20px rgba(0,0,0,.5);">
      <div style="font-weight:bold;font-size:14px;color:#06a;margin-bottom:12px;">↺ Turn ${rerunTurn} Was Re-Run</div>
      <div style="font-size:12px;color:#444;margin-bottom:6px;line-height:1.6;">
        The host re-ran turn ${rerunTurn}. Fight outcomes and training results may differ from the initial run.
      </div>
      <div style="font-size:11px;background:#f0f6ff;border:1px solid #80b0e0;border-radius:4px;padding:8px 10px;margin-bottom:14px;line-height:1.7;">
        <strong>What changed:</strong> fight results, skills learned, and attribute gains for turn ${rerunTurn} have been recalculated.<br>
        <strong>Action needed:</strong> Download your updated results to apply the correct post-turn state.
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="document.getElementById('league-rerun-modal').remove()">Dismiss</button>
        <button id="btn-apply-rerun" onclick="applyLeagueRerun(${rerunTurn}, ${rerunCount})"
                style="background:#06a;color:#fff;border-color:#048;">Download New Results</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function applyLeagueRerun(rerunTurn, rerunCount) {
  const btn = document.getElementById('btn-apply-rerun');
  if (btn) { btn.disabled = true; btn.textContent = 'Acknowledging...'; }
  const pw = S.league.password || '';
  const r  = await API.post('/api/league/acknowledge_reset', {
    manager_id:  S.league.managerId,
    password:    pw,
    type:        'rerun',
    rerun_count: rerunCount,
  });
  document.getElementById('league-rerun-modal')?.remove();
  if (!r.success) { setMsg('Error: ' + r.error, 'err'); render(); return; }
  // Download results with rerun flag so skills/attrs are server-authoritative
  S._pendingRerun = true;
  await doLeagueDownloadAll();
  S._pendingRerun = false;
}

/* ============================================================
   UPLOAD ALL TEAMS TO ARENA
   ============================================================ */

async function uploadAllTeams() {
  // Flush any pending warrior save so challenge strategies are persisted before upload
  await flushSave();

  const lg = S.league;

  console.log('UploadAllTeams called', { url: lg.url, managerId: lg.managerId });

  // 1. Validate league settings
  if (!lg.url || !lg.managerId) {
    setMsg('Configure league settings first (Action → League Settings).', 'err');
    render();
    return;
  }

  // 2. Ensure folder is selected (for Electron)
  if (!baseDir && !S.isLocalBackend) {
    setMsg('Please select your Bloodspire folder first...', 'ok');
    render();
    
    const folder = await window.electronAPI.selectFolder();
    if (!folder) {
      setMsg('Folder selection cancelled. Upload aborted.', 'err');
      render();
      return;
    }
    baseDir = folder;
    localStorage.setItem('bloodspire_base_dir', folder);
    S.folderReady = true;
  }

  // 3. Get password (prompt if not saved)
  const pw = lg.password || prompt('Enter your league password:');
  if (!pw) {
    setMsg('Password required for upload.', 'err');
    render();
    return;
  }
  lg.password = pw;

  // 4. Get team IDs from account and check each team's status
  const accountIds = S.account?.team_ids || [];
  console.log('Account team IDs:', accountIds);
  console.log('Teams object:', S.teams);
  
  const ids = [];
  for (const tid of accountIds) {
    const t = S.teams[tid];
    if (!t) {
      console.log(`Team ${tid} not loaded yet, attempting to load...`);
      await reloadTeam(tid);
    }
    
    const team = S.teams[tid];
    if (!team) {
      console.log(`Team ${tid} still not available after reload`);
      continue;
    }
    
    const hasActive = hasFiveActiveWarriors(team);
    const isEnabled = team.auto_upload_enabled;
    
    console.log(`Team ${tid} (${team.team_name}): active=${hasActive}, auto_upload=${isEnabled}`);
    
    if (hasActive && isEnabled) {
      ids.push(tid);
    } else {
      if (!hasActive) {
        console.log(`  ❌ Skipping: Doesn't have 5 active warriors`);
        // Count dead warriors
        const deadCount = team.warriors.filter(w => w && (w.is_dead || w.ascended_to_monster)).length;
        console.log(`     Dead/Ascended warriors: ${deadCount}`);
      }
      if (!isEnabled) {
        console.log(`  ❌ Skipping: Auto-upload not enabled (check the "Run This Turn" checkbox on team panel)`);
      }
    }
  }

  // Teams in the account that have "Run This Turn" unchecked need an explicit
  // withdrawal request so the server removes any auto-carry file from a prior turn.
  const withdrawIds = [];
  for (const tid of accountIds) {
    const t = S.teams[tid];
    if (t && !t.auto_upload_enabled) withdrawIds.push(tid);
  }

  // Check for any legacy teams that need to be withdrawn
  let archivedIds = [];
  try { archivedIds = await Store.listArchivedTeamIds(); } catch(e) {}
  const cleanupQueue = [];
  for (const aid of archivedIds) {
    const arch = await Store.readArchivedTeam(aid);
    if (arch && !arch.withdrawn_from_league) cleanupQueue.push(aid);
  }

  if (!ids.length && !cleanupQueue.length && !withdrawIds.length) {
    let message = 'No teams are ready for upload.\n\n';
    message += 'Requirements:\n';
    message += '• Team must have 5 alive warriors (no dead or ascended)\n';
    message += '• "Run This Turn" checkbox must be checked on the team panel\n\n';
    message += 'Check your dead warriors in the tree view (💀 icons) and replace them via the Replacement tab.';
    alert(message);
    setMsg('No teams ready: Need 5 alive warriors AND "Run This Turn" checked', 'err');
    render();
    return;
  }

  setMsg('Connecting to league server...', 'ok');
  render();

  // 5. Build step list for progress dialog (Cleanup + Uploads + Auto-Carry Withdrawals)
  const steps = [];
  cleanupQueue.forEach(aid => steps.push(`Withdrawing replaced Team ${aid}`));
  ids.forEach(tid => {
    const t = S.teams?.[tid];
    steps.push(`Uploading ${(t && t.team_name) ? t.team_name : `Team ${tid}`}`);
  });
  withdrawIds.forEach(tid => {
    const t = S.teams?.[tid];
    steps.push(`Removing ${(t && t.team_name) ? t.team_name : `Team ${tid}`} from queue`);
  });

  _showUploadProgress(steps, 0, null);

  const uploaded = [];
  const errors = [];
  const withdrawn = [];
  const autoWithdrawn = [];

  // 6a. Perform Cleanups first
  let currentStep = 0;
  for (const aid of cleanupQueue) {
    _showUploadProgress(steps, currentStep++, null);
    const arch = await Store.readArchivedTeam(aid);
    try {
      const wr = await API.post('/api/team/withdraw', {
        manager_id: Number(lg.managerId),
        password:   pw,
        team_id:    Number(aid)
      });
      if (wr.success) {
        arch.withdrawn_from_league = true;
        await Store.writeArchivedTeam(aid, arch);
        withdrawn.push({ name: arch.team_name || `Team ${aid}`, success: true });
      } else {
        withdrawn.push({ name: arch.team_name || `Team ${aid}`, success: false, error: wr.error });
      }
    } catch (e) {
      withdrawn.push({ name: arch.team_name || `Team ${aid}`, success: false, error: e.message });
    }
    await new Promise(res => setTimeout(res, 50));
  }

  // 6b. Upload each team
  for (let i = 0; i < ids.length; i++) {
    _showUploadProgress(steps, currentStep++, null);
    const tid = ids[i];
    const team = S.teams[tid];
    
    if (!team) {
      errors.push({ 
        team_id: tid, 
        team_name: `Team ${tid}`,
        error: 'Team data not found' 
      });
      continue;
    }
    
    try {
      console.log(`Uploading team ${tid}: ${team.team_name}`);
      
      // Send to league server
      const baseUrl = lg.url.replace(/\/+$/, '');
      const response = await fetch(`${baseUrl}/api/upload`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          manager_id: lg.managerId,
          password: pw,
          team: team
        })
      });
      
      const data = await response.json();
      console.log(`Upload response for team ${tid}:`, data);
      
      if (data.success) {
        uploaded.push({ 
          team_id: tid, 
          team_name: team.team_name || `Team ${tid}`,
          turn: data.turn 
        });
        
        // Update last upload timestamp
        lg.lastUpload = new Date().toLocaleString();
        await API.post('/api/league_settings', {
          manager_name: S.account?.manager_name || lg.managerName || '',
          url: lg.url,
          managerId: lg.managerId,
          managerName: lg.managerName,
          password: lg.password,
          lastUpload: lg.lastUpload,
          lastDownload: lg.lastDownload,
          lastTurnRan: lg.lastTurnRan,
        });
      } else {
        errors.push({ 
          team_id: tid, 
          team_name: team.team_name || `Team ${tid}`,
          error: data.error || 'Upload failed' 
        });
      }
    } catch (err) {
      console.error(`Upload error for team ${tid}:`, err);
      errors.push({ 
        team_id: tid, 
        team_name: team.team_name || `Team ${tid}`,
        error: err.message || 'Network error' 
      });
    }
    
    // Small delay between uploads
    await new Promise(res => setTimeout(res, 100));
  }

  // 6c. Send withdrawal requests for teams with "Run This Turn" unchecked.
  // The server reads auto_upload_enabled=false from the team payload and
  // removes any auto-carry upload file queued for the current turn.
  for (const tid of withdrawIds) {
    _showUploadProgress(steps, currentStep++, null);
    const team = S.teams[tid];
    if (!team) continue;
    try {
      const baseUrl = lg.url.replace(/\/+$/, '');
      const response = await fetch(`${baseUrl}/api/upload`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          manager_id: lg.managerId,
          password: pw,
          team: team
        })
      });
      const data = await response.json();
      autoWithdrawn.push({
        team_id: tid,
        team_name: team.team_name || `Team ${tid}`,
        success: !!data.success,
        error: data.success ? null : (data.error || 'Withdraw failed')
      });
    } catch (err) {
      autoWithdrawn.push({
        team_id: tid,
        team_name: team.team_name || `Team ${tid}`,
        success: false,
        error: err.message || 'Network error'
      });
    }
    await new Promise(res => setTimeout(res, 50));
  }

  // 7. Close progress modal and show results
  _showUploadProgress(steps, steps.length, null);
  setTimeout(() => {
    const m = document.getElementById('ul-progress-modal');
    if (m) m.remove();
  }, 400);

  // 8. Show results modal
  const old = document.getElementById('upload-results-modal');
  if (old) old.remove();
  
  const modal = document.createElement('div');
  modal.id = 'upload-results-modal';
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:8000;display:flex;align-items:center;justify-content:center;';
  
  const successRows = uploaded.map(t => 
    `<tr><td style="padding:2px 8px;">✓</td><td style="padding:2px 8px;">${esc(t.team_name)}</td><td style="padding:2px 8px; color:#060;">Uploaded${t.turn ? ` (Turn ${t.turn})` : ''}</td></tr>`
  ).join('');
  
  const errorRows = errors.map(e => 
    `<tr><td style="padding:2px 8px; color:#c00;">✗</td><td style="padding:2px 8px;">${esc(e.team_name)}</td><td style="padding:2px 8px; color:#c00;">${esc(e.error)}</td></tr>`
  ).join('');

  const withdrawRows = withdrawn.map(w =>
    `<tr>
      <td style="padding:2px 8px; font-weight:bold;">${w.success ? '✓' : '✗'}</td>
      <td style="padding:2px 8px;">${esc(w.name)}</td>
      <td style="padding:2px 8px; font-size:10px; color:${w.success ? '#666' : '#c00'};">
        ${w.success ? 'Withdrawn from Arena' : `Withdraw Failed: ${esc(w.error)}`}
      </td>
    </tr>`
  ).join('');

  const autoWithdrawRows = autoWithdrawn.map(w =>
    `<tr>
      <td style="padding:2px 8px; font-weight:bold; color:${w.success ? '#666' : '#c00'};">${w.success ? '↩' : '✗'}</td>
      <td style="padding:2px 8px;">${esc(w.team_name)}</td>
      <td style="padding:2px 8px; font-size:10px; color:${w.success ? '#666' : '#c00'};">
        ${w.success ? 'Removed from turn queue' : `Removal Failed: ${esc(w.error)}`}
      </td>
    </tr>`
  ).join('');

  const hasErrors = errors.length > 0;
  const notFound = errors.some(e => (e.error || '').toLowerCase().includes('manager not found'));
  const allSuccess = uploaded.length === ids.length && ids.length > 0;
  const onlyWithdrawals = ids.length === 0 && (autoWithdrawn.length > 0 || withdrawn.length > 0);
  
  modal.innerHTML = `
    <div style="background:var(--bg);border:2px solid ${hasErrors && !uploaded.length && !autoWithdrawn.some(w => w.success) ? '#c00' : '#080'};border-radius:6px;padding:16px;min-width:320px;max-width:500px;box-shadow:0 4px 16px rgba(0,0,0,.4);">
      <div style="font-weight:bold; font-size:13px; margin-bottom:10px; color:${onlyWithdrawals ? '#060' : (allSuccess ? '#060' : (uploaded.length ? '#c80' : '#c00'))};">
        ${onlyWithdrawals ? '✓ Turn queue updated' :
          allSuccess ? '✓ All teams uploaded successfully!' :
          uploaded.length ? `✓ ${uploaded.length} of ${ids.length} team${ids.length === 1 ? '' : 's'} uploaded` :
          '✗ No teams were uploaded'}
      </div>

      ${(uploaded.length || errors.length) ? `
      <table style="width:100%; border-collapse:collapse; font-size:11px; margin-bottom:12px;">
        ${successRows}${errorRows}
      </table>` : ''}

      ${autoWithdrawn.length ? `
      <div style="font-size:11px; color:#666; margin-bottom:4px; font-weight:bold; border-top:1px solid #ccc; padding-top:8px;">Withdrawn from Turn (Run This Turn unchecked):</div>
      <table style="width:100%; border-collapse:collapse; font-size:11px; margin-bottom:12px;">
        ${autoWithdrawRows}
      </table>` : ''}

      ${withdrawn.length ? `
      <div style="font-size:11px; color:#666; margin-bottom:4px; font-weight:bold; border-top:1px solid #ccc; padding-top:8px;">Replaced Team Cleanup:</div>
      <table style="width:100%; border-collapse:collapse; font-size:11px; margin-bottom:12px;">
        ${withdrawRows}
      </table>` : ''}

      ${notFound ? `
      <div style="font-size:11px;background:#fff0f0;border:1px solid #e08080;border-radius:4px;padding:8px 10px;margin-bottom:12px;line-height:1.6;">
        <strong>⚠️ Manager not recognized by the server.</strong><br>
        This usually happens after the league arena is reset. Open League Settings, 
        make sure your password is correct, and click <em>Re-register</em> to get a new ID, then upload again.
      </div>` : ''}
      
      ${!notFound && hasErrors ? `
      <div style="font-size:11px;background:#fff8e0;border:1px solid #e0c080;border-radius:4px;padding:8px 10px;margin-bottom:12px;line-height:1.6;">
        <strong>Some teams failed to upload.</strong><br>
        Check that each team has 5 active (non-dead) warriors and try again.
      </div>` : ''}
      
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        ${notFound ? `<button onclick="document.getElementById('upload-results-modal').remove();showLeagueSettings()">Open League Settings</button>` : ''}
        <button onclick="document.getElementById('upload-results-modal').remove()">Close</button>
      </div>
    </div>`;
  
  document.body.appendChild(modal);

  // 9. Update status message
  const autoWithdrawnOk = autoWithdrawn.filter(w => w.success).length;
  if (uploaded.length || autoWithdrawnOk) {
    const parts = [];
    if (uploaded.length) parts.push(`Uploaded ${uploaded.length} team(s)`);
    if (autoWithdrawnOk) parts.push(`Removed ${autoWithdrawnOk} from queue`);
    setMsg(`✓ ${parts.join(', ')}${hasErrors ? ` (${errors.length} failed)` : ''}`,
           hasErrors ? 'err' : 'ok');
  } else {
    setMsg('Upload failed. Check the error details above.', 'err');
  }
  
  render();
}
// Make sure the function is globally accessible
window.uploadAllTeams = uploadAllTeams;


/* ============================================================
   INITIALISATION
   ============================================================ */
async function init() {
  // Check browser compatibility for non-Electron users
  if (!window.electronAPI && !isChromiumWithFSA()) {
    renderChromiumError();
    return;
  }
  console.log('Initializing Bloodspire Client...');
  
  // ============================================================
  // STEP 1: Check for local backend server (Zero-Click Mode)
  // ============================================================
  let localCheck = { success: false };
  try {
    localCheck = await fetch('/api/local/status').then(r => r.json()).catch(() => ({ success: false }));
    
    if (!localCheck.success && (window.location.protocol === 'file:' || window.location.hostname === 'localhost')) {
      localCheck = await fetch('http://localhost:8766/api/local/status').then(r => r.json()).catch(() => ({ success: false }));
    }

    if (localCheck.success && localCheck.is_local_backend) {
      console.log('Running in local backend mode');
      S.isLocalBackend = true;
      S.folderReady = true;
      // Prefer the URL the page was actually served from so remote players
      // get the host's Tailscale/LAN IP, not a hardcoded localhost.
      const pageOrigin = (window.location.protocol !== 'file:') ? window.location.origin : null;
      S.localBaseUrl = pageOrigin || localCheck.server_url || 'http://localhost:8766';
      if (!S.serverUrl || S.serverUrl === DEFAULT_SERVER_URL) S.serverUrl = S.localBaseUrl;
      
      const localAcc = await LocalAPI.get('/api/account');
      if (localAcc.success) {
        S.savedManagerName = localAcc.account.manager_name;
        S.savedRememberMe = localAcc.account.remember !== false;
        S.savedPassword = localAcc.account.password_plaintext || '';
        S.loginTab = 'login';
      }

      // Load persisted league settings (manager_id etc.) from server-side client store
      await loadLeagueSettings();

      // Pre-load game data so Stats/Strats tab is ready immediately after login
      try {
        const gd = await API.get('/api/game_data');
        if (gd && !gd.error) S.gd = gd;
      } catch(e) {}

      S.view = 'login';
      render();
      return;
    }
  } catch(e) {
    console.debug('Local backend check skipped:', e.message);
  }

  // ============================================================
  // STEP 2: Check for saved folder path (Electron mode)
  // ============================================================

  // Load saved folders list for folder switching feature
  if (window.electronAPI) {
    try {
      await refreshSavedFolders();
      console.log('Loaded saved folders:', S.savedFolders.length);
    } catch (err) {
      console.error('Failed to load saved folders:', err);
    }
  }

  const savedPath = localStorage.getItem('bloodspire_base_dir');
  console.log('Checking for saved folder path:', savedPath || 'none found');

  if (savedPath) {
    // We have a saved folder! Use it directly.
    baseDir = savedPath;
    S.folderReady = true;
    console.log('Using saved folder:', baseDir);

    // Tell main process about this folder
    try {
      await window.electronAPI.setBaseDir(baseDir);
      console.log('Base directory sent to main process');
    } catch (err) {
      console.error('Failed to set base dir in main process:', err);
    }
    
    // Bootstrap from the folder
    await _bootstrapFromFolder();
    return;
  }
  
  // ============================================================
  // STEP 3: No saved folder - first time setup
  // ============================================================
  console.log('No saved folder found - showing folder picker');
  
  // Try to load metadata from IDB (for backward compatibility)
  const meta = await idbGet('clientMeta') || {};
  if (meta.managerName) S.savedManagerName = meta.managerName;
  if (meta.serverUrl) S.serverUrl = meta.serverUrl;
  if (meta.rememberMe !== undefined) S.savedRememberMe = meta.rememberMe;
  if (meta.password) S.savedPassword = meta.password;
  if (meta.folderName) S.savedFolderName = meta.folderName;
  
  // Show the folder picker screen
  S.view = 'folder_pick';
  render();
}

// Shared bootstrap path used by both the silent auto-resume and the explicit
// folder-pick flow. Loads settings.json, caches game_data, and lands the user
// on the login screen (or auto-login if remembered credentials are present).
async function _bootstrapFromFolder() {
  console.log('Bootstrapping from folder:', baseDir);
  
  // CRITICAL: Check if we have a folder before proceeding
  if (!baseDir) {
    console.log('No baseDir found, showing folder picker');
    S.view = 'folder_pick';
    render();
    return;
  }
  
  // Verify folder exists by trying to read something (will create if needed)
  try {
    // Try to write a test file to verify folder access
    await fsaEnsureDir('');
    console.log('Folder access verified');
  } catch (err) {
    console.error('Folder access failed:', err);
    S.view = 'folder_pick';
    S.msg = 'Could not access the saved folder. Please select it again.';
    render();
    return;
  }
  
  // Load settings from the folder
  try {
    const settings = await Store.readSettings();
    if (settings && settings.server_url) {
      S.serverUrl = settings.server_url;
      console.log('Loaded server URL from settings:', S.serverUrl);
    }
  } catch (err) {
    console.log('No settings file yet (first time with this folder)');
  }

  // Load game data (cached)
  try {
    const gd = await API.get('/api/game_data');
    if (gd && !gd.error) S.gd = gd;
  } catch (e) { 
    console.log("Offline mode: using cached data or will fetch later"); 
  }

  // Load account information
  const acc = await Store.readAccount();
  if (acc && acc.manager_name) {
    S.savedManagerName = acc.manager_name;
    S.savedPassword = acc.password_plaintext || null;
    S.savedRememberMe = acc.remember !== false;
    S.loginTab = 'login';
    console.log('Loaded account:', acc.manager_name);
  } else {
    S.loginTab = 'new';
    console.log('No account found, showing new account form');
  }

    // Load league settings
  const lg = await API.get('/api/league_settings');
  if (lg) {
    S.league.url = lg.url || S.serverUrl;
    S.league.managerId = lg.managerId || '';
    S.league.managerName = lg.managerName || '';
    S.league.password = lg.password || '';
    S.league.lastUpload = lg.lastUpload || '';
    S.league.lastDownload = lg.lastDownload || '';
    S.league.lastTurnRan = lg.lastTurnRan || 0;
    console.log('Loaded league settings, manager ID:', S.league.managerId);
    await _loadLegacyTeams();
  }

  // Show the login screen
  S.view = 'login'; 
  S.msg = '';
  render();
}

// Global one-time listener - FIXED for Name Input
document.addEventListener('click', (e) => {
  // 1. Close dropdowns
  const dd = el('action-dropdown');
  if (dd) dd.style.display = 'none';
  const pd = el('prefs-dropdown');
  if (pd) pd.style.display = 'none';

  // 2. Handle Stat Spinners
  const btn = e.target.closest('.stat-spin button');
  if (btn && btn.hasAttribute('data-attr') && btn.hasAttribute('data-delta')) {
    const attr = btn.getAttribute('data-attr');
    const delta = parseInt(btn.getAttribute('data-delta'), 10);
    ctAdjust(attr, delta);
    return;
  }

  // 3. Handle ALL clicks inside the warrior grid (including on inputs/selects)
  //    This properly switches the selected warrior row even when clicking on inputs.
  const gridRow = e.target.closest('#ct-grid tr[id^="ct-row-"]');
  if (gridRow) {
    const idx = parseInt(gridRow.id.split('-')[2], 10);
    if (!isNaN(idx) && S.ct) {
      if (S.ct.sel !== idx) {
        // Save the current warrior's editable fields before switching rows
        const ci = S.ct.sel;
        const rEl = el('ct-wrace');   if (rEl) S.ct.warriors[ci].race   = rEl.value;
        const gEl = el('ct-wgender'); if (gEl) S.ct.warriors[ci].gender = gEl.value;
        const nEl = el('ct-wname');   if (nEl) S.ct.warriors[ci].name   = nEl.value;
        // Remember which input was clicked so we can re-focus it after render
        const clickedInputId = (e.target.tagName === 'INPUT') ? e.target.id : null;
        S.ct.sel = idx;
        render();
        // Re-focus the input the user clicked (render destroys and recreates it)
        if (clickedInputId) {
          const inp = el(clickedInputId);
          if (inp) {
            // Use focusWindow to establish OS keyboard routing before focusing
            if (window.electronAPI?.focusWindow) {
              window.electronAPI.focusWindow().then(() => {
                if (inp) {
                  inp.focus();
                  const l = inp.value.length;
                  if (inp.setSelectionRange) inp.setSelectionRange(l, l);
                }
              });
            } else {
              inp.focus();
              const l = inp.value.length;
              if (inp.setSelectionRange) inp.setSelectionRange(l, l);
            }
          }
        }
      }
      // Row changed, we handled it
      return;
    }
  }

  // 4. For inputs/selects/textareas outside the grid, just let them get focus normally.
  if (e.target.tagName === 'INPUT' ||
      e.target.tagName === 'SELECT' ||
      e.target.tagName === 'TEXTAREA') {
    return;
  }
});

init();

</script>
