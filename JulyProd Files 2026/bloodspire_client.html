  return tabHtml + `<div class="tab-body" style="overflow:auto;">${body}</div>`;

function setMgrTab(tab) {
  S.mgrTab = tab;
  if (tab === 'scouting' && !S.scout.loaded) {
    loadScoutStatus();
  }
  if (tab === 'account' && S.league.managerId) {
    checkLeagueReset();
    loadLeagueSettings(); // Refresh league settings including last upload timestamp
  }
  if (tab === 'account' && S.legacyTeams === null) {
    _loadLegacyTeams().then(() => { if (S.mgrTab === 'account') refreshContent(); });
  }
  if (tab === 'newsletters') {
    // Ensure newsletter content is loaded when the tab is activated
    _ensureNewsletterContentLoadedForMgrTab().then(() => {
      if (S.mgrTab === 'newsletters') refreshContent(); // Re-render if still on this tab
    });
  }
  if (tab === 'legacy') {
    S.legacyTeams = null; // force reload each time the tab is opened
    _loadLegacyTeams().then(() => { if (S.mgrTab === 'legacy') refreshContent(); });
  }
  if (tab === 'data_facts') {
    S.dataFactsLoading = true;
    refreshContent();
    _loadManagerRecord().then(() => {
      S.dataFactsLoading = false;
      if (S.mgrTab === 'data_facts') refreshContent();
    }).catch(err => {
      console.error('Error loading manager record:', err);
      S.dataFactsLoading = false;
      S.managerRecord = { error: err.message };
      if (S.mgrTab === 'data_facts') refreshContent();
    });
  }
  refreshContent();
}

/* ============================================================
   LEGACY TAB
   ============================================================ */
async function _loadLegacyTeams() {
  const ids = await Store.listArchivedTeamIds();
  const teams = [];
  for (const tid of ids.slice().reverse()) { // newest (highest id) first
    const team = await Store.readArchivedTeam(tid);
    if (team) teams.push(team);
  }
  S.legacyTeams = teams;
}

function buildLegacyTab() {
  if (S.legacyTeams === null) {
    return '<div style="padding:20px; color:#666;">Loading legacy teams...</div>';
  }
  if (!S.legacyTeams.length) {
    return `<div style="padding:12px; color:#555;">
      <b>Legacy</b><br><br>No teams have been replaced yet.
    </div>`;
  }

  function warriorCard(w) {
    const rec  = `${w.wins||0}-${w.losses||0}-${w.kills||0}`;
    const inj  = formatInjuriesText(w.injuries).join('<br>') || '-';
    const skls = formatSkillsText(w.skills).join('<br>') || '-';
    const isDead      = w.is_dead;
    const isAscended  = w.ascended_to_monster;
    const label = isDead
      ? `<span style="color:#800;">✝ ${esc(w.name)}</span>`
      : isAscended
        ? `<span style="color:#844;">👹 ${esc(w.name)}</span>`
        : `<span style="color:#555;">⚔ ${esc(w.name)}</span>`;
    const statusLine = isDead
      ? `Slain by: <b>${esc(w.archived_killed_by||w.killed_by||'Unknown')}</b>`
      : isAscended
        ? `<b>Ascended to Monsterdom</b>`
        : `<b>Replaced</b>`;
    return `
<div class="group" style="margin:6px 4px; background:#f9f7f4;">
  <span class="group-label">${label}</span>
  <div style="display:flex; gap:20px; font-size:11px; flex-wrap:wrap; padding-top:4px;">
    <div>
      <div style="color:#666; margin-bottom:3px;">
        ${esc(w.race||'')} ${esc(w.gender||'')} &mdash; ${rec} (${w.total_fights||0} fights)<br>
        ${statusLine}
      </div>
      <table style="border-collapse:collapse; font-size:11px;">
        ${['strength','dexterity','constitution','intelligence','presence','size'].map(attr => {
          const deathVal = w[attr] != null ? w[attr] : '-';
          const baseVal  = (w.initial_stats && w.initial_stats[attr] != null) ? ` (${w.initial_stats[attr]})` : '';
          return `<tr><td style="padding:1px 6px; color:#555; width:90px;">${capitalize(attr)}</td>
               <td style="padding:1px 6px; font-weight:bold;">${deathVal}${baseVal}</td></tr>`;
        }).join('')}
      </table>
    </div>
    <div>
      <div style="color:#666; font-weight:bold; margin-bottom:3px;">Skills</div>
      <div style="color:#333; line-height:1.5;">${skls}</div>
    </div>
    <div>
      <div style="color:#666; font-weight:bold; margin-bottom:3px;">Permanent Injuries</div>
      <div style="color:#800; line-height:1.5;">${inj}</div>
    </div>
  </div>
</div>`;
  }

  let sections = '';
  S.legacyTeams.forEach(team => {
    let tw=0, tl=0, tk=0;
    const allWarriors = [...(team.warriors||[]), ...(team.archived_warriors||[])].filter(Boolean);
    allWarriors.forEach(w => { tw+=w.wins||0; tl+=w.losses||0; tk+=w.kills||0; });

    // archived_warriors (fallen before dissolution) then warriors (active at dissolution)
    const fallen   = (team.archived_warriors||[]).filter(Boolean).slice().reverse();
    const atDeath  = (team.warriors||[]).filter(Boolean);
    const warriors = [...atDeath, ...fallen];

    let warriorCards = warriors.map(w => warriorCard(w)).join('');
    if (!warriorCards) warriorCards = '<div style="padding:6px; color:#aaa;">No warrior records.</div>';

    sections += `
<div style="margin-bottom:12px;">
  <div style="font-weight:bold; font-size:12px; padding:4px 6px; background:#d4d0c8; border:1px solid #bbb; margin-bottom:2px;">
    ${esc(team.team_name)} &mdash; Career: ${tw}-${tl}-${tk}
  </div>
  ${warriorCards}
</div>`;
  });

  return `<div style="padding:6px;">
    <div style="font-weight:bold; margin-bottom:8px;">Legacy - Replaced Teams</div>
    ${sections}
  </div>`;
}

    return Promise.resolve();

  try {
    console.log('Fetching manager record for:', managerName);

    S.managerRecord = result;

    console.error('Error loading manager record:', err);

    return `<div style="padding:20px;">
      <button onclick="refreshDataFacts()" style="margin-bottom:12px;">🔄 Retry</button>
      <div style="color:#c00; font-size:12px;">Error: ${esc(record.error)}</div>
    </div>`;
  }

  if (!record.success) {
    return `<div style="padding:20px;">
      <button onclick="refreshDataFacts()" style="margin-bottom:12px;">🔄 Retry</button>
      <div style="color:#666; font-size:12px;">Failed to load manager record.</div>
    </div>`;
  }

  const records = record.records || [];
  const raceRecords = record.race_records || [];
  const totals = record.totals || {};

  if (!S.expandedDataFactsSections) S.expandedDataFactsSections = {};

  let html = '<div style="padding:12px;">';
  html += '<div style="margin-bottom:12px;"><button onclick="refreshDataFacts()" style="padding:4px 12px;">🔄 Update Stats</button></div>';

  // Manager Records Section (Collapsible)
  const managerExpanded = S.expandedDataFactsSections.managers === true;
  html += '<div style="margin-bottom:20px; border:1px solid #999; border-radius:3px; background:#f9f9f9;">';
  html += '<div style="padding:8px; cursor:pointer; background:#e0ddd6; border-radius:3px 3px 0 0; display:flex; justify-content:space-between;"';
  html += ' onclick="toggleDataFactsSection(\'managers\')">';
  html += '<span style="font-weight:bold; font-size:11px;">' + (managerExpanded ? '▼' : '▶') + ' ' + esc(managerName) + ' &mdash; Record vs Manager</span>';
  html += '</div>';

  if (managerExpanded) {
    html += '<div style="padding:12px;"><table style="border-collapse:collapse; width:100%; font-size:11px;"><thead>';
    html += '<tr style="background:#e0ddd6; border-bottom:1px solid #999;"><th style="text-align:left; padding:4px 8px; width:35%;">Opponent Manager</th>';
    html += '<th style="text-align:center; padding:4px 8px; width:12%;">W</th><th style="text-align:center; padding:4px 8px; width:3%;">-</th>';
    html += '<th style="text-align:center; padding:4px 8px; width:12%;">L</th><th style="text-align:center; padding:4px 8px; width:3%;">-</th>';
    html += '<th style="text-align:center; padding:4px 8px; width:12%;">K</th><th style="text-align:center; padding:4px 8px; width:15%;">Deaths</th></tr></thead><tbody>';

    for (const r of records) {
      html += '<tr style="border-bottom:1px solid #ddd;"><td style="padding:4px 8px;">' + esc(r.opponent) + '</td>';
      html += '<td style="text-align:center; padding:4px 8px;">' + r.wins + '</td><td style="text-align:center; padding:4px 8px;">-</td>';
      html += '<td style="text-align:center; padding:4px 8px;">' + r.losses + '</td><td style="text-align:center; padding:4px 8px;">-</td>';
      html += '<td style="text-align:center; padding:4px 8px;">' + r.kills + '</td><td style="text-align:center; padding:4px 8px;">' + r.deaths + '</td></tr>';
    }

    html += '<tr style="background:#f0ece8; border:1px solid #999; font-weight:bold;"><td style="padding:4px 8px;">TOTAL</td>';
    html += '<td style="text-align:center; padding:4px 8px;">' + (totals.wins || 0) + '</td><td style="text-align:center; padding:4px 8px;">-</td>';
    html += '<td style="text-align:center; padding:4px 8px;">' + (totals.losses || 0) + '</td><td style="text-align:center; padding:4px 8px;">-</td>';
    html += '<td style="text-align:center; padding:4px 8px;">' + (totals.kills || 0) + '</td><td style="text-align:center; padding:4px 8px;">' + (totals.deaths || 0) + '</td></tr>';
    html += '</tbody></table></div>';
  }
  html += '</div>';

  // Race Records Section (Collapsible)
  const racesExpanded = S.expandedDataFactsSections.races === true;
  html += '<div style="margin-bottom:20px; border:1px solid #999; border-radius:3px; background:#f9f9f9;">';
  html += '<div style="padding:8px; cursor:pointer; background:#e0ddd6; border-radius:3px 3px 0 0; display:flex; justify-content:space-between;"';
  html += ' onclick="toggleDataFactsSection(\'races\')">';
  html += '<span style="font-weight:bold; font-size:11px;">' + (racesExpanded ? '▼' : '▶') + ' Performance by Warrior Race</span>';
  html += '</div>';

  if (racesExpanded) {
    html += '<div style="padding:12px;">';
    if (raceRecords.length === 0) {
      html += '<div style="color:#999; font-size:11px;">No race-specific records available</div>';
    } else {
      html += buildRaceRecordsList(raceRecords);
    }
    html += '</div>';
  }
  html += '</div>';

  // Race vs Race Section (Collapsible)
  const raceVsRaceExpanded = S.expandedDataFactsSections.raceVsRace || false;
  const raceVsRaceData = record.race_vs_race || [];
  html += '<div style="margin-bottom:20px; border:1px solid #999; border-radius:3px; background:#f9f9f9;">';
  html += '<div style="padding:8px; cursor:pointer; background:#e0ddd6; border-radius:3px 3px 0 0; display:flex; justify-content:space-between;"';
  html += ' onclick="toggleDataFactsSection(\'raceVsRace\')">';
  html += '<span style="font-weight:bold; font-size:11px;">' + (raceVsRaceExpanded ? '▼' : '▶') + ' Race vs Race Performance</span>';
  html += '</div>';

  if (raceVsRaceExpanded) {
    html += '<div style="padding:12px;">';
    if (raceVsRaceData.length === 0) {
      html += '<div style="color:#999; font-size:11px;">No race vs race records available</div>';
    } else {
      html += buildRaceVsRaceList(raceVsRaceData);
    }
    html += '</div>';
  }
  html += '</div>';

  // Weapon Performance Section (Collapsible)
  const weaponExpanded = S.expandedDataFactsSections.weapons || false;
  const weaponData = record.weapon_records || [];
  const cumulativeRecord = record.cumulative_record || { wins: 0, losses: 0, kills: 0 };
  const cumulativeDisplay = cumulativeRecord.wins + '-' + cumulativeRecord.losses + '-' + cumulativeRecord.kills;
  html += '<div style="margin-bottom:20px; border:1px solid #999; border-radius:3px; background:#f9f9f9;">';
  html += '<div style="padding:8px; cursor:pointer; background:#e0ddd6; border-radius:3px 3px 0 0; display:flex; justify-content:space-between;"';
  html += ' onclick="toggleDataFactsSection(\'weapons\')">';
  html += '<span style="font-weight:bold; font-size:11px;">' + (weaponExpanded ? '▼' : '▶') + ' Weapon Performance — ' + cumulativeDisplay + ' (cumulative)</span>';
  html += '</div>';

  if (weaponExpanded) {
    html += '<div style="padding:12px;">';
    if (weaponData.length === 0) {
      html += '<div style="color:#999; font-size:11px;">No weapon records available</div>';
    } else {
      html += buildWeaponRecordsList(weaponData);
    }
    html += '</div>';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

function toggleDataFactsSection(section) {
  if (!S.expandedDataFactsSections) S.expandedDataFactsSections = {};
  S.expandedDataFactsSections[section] = !S.expandedDataFactsSections[section];
  refreshContent();
}

function buildRaceRecordsList(raceRecords) {
  let html = '';
  for (const rec of raceRecords) {
    html += '<div style="padding:8px; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; align-items:center;">';
    html += '<span style="font-weight:bold; font-size:11px;">' + esc(rec.race) + '</span>';
    html += '<span style="font-size:11px; color:#666;">' + rec.wins + '-' + rec.losses + '-' + rec.kills + ' (' + rec.slain + ' slain)</span>';
    html += '</div>';
  }
  return html;
}

function buildRaceVsRaceList(raceVsRaceData) {
  if (!S.expandedRaceVsRace) S.expandedRaceVsRace = {};

  let html = '';
  for (const raceData of raceVsRaceData) {
    const race = raceData.race;
    const isExpanded = S.expandedRaceVsRace[race] || false;

    html += '<div style="margin-bottom:8px; border:1px solid #ddd; border-radius:3px; background:#fff;">';
    html += '<div style="padding:8px; cursor:pointer; background:#f0f0f0; display:flex; justify-content:space-between; align-items:center;"';
    html += ' onclick="toggleRaceVsRace(\'' + esc(race) + '\')">';
    html += '<span style="font-weight:bold; font-size:11px;">' + (isExpanded ? '▼' : '▶') + ' ' + esc(race) + '</span>';
    html += '</div>';

    if (isExpanded) {
      html += '<div style="padding:8px; border-top:1px solid #ddd;">';
      for (const matchup of raceData.matchups) {
        html += '<div style="padding:6px 8px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center; margin-left:12px;">';
        html += '<span style="font-size:11px;">vs ' + esc(matchup.opponent_race) + '</span>';
        html += '<span style="font-size:11px; color:#666;">' + matchup.wins + '-' + matchup.losses + '-' + matchup.kills + '</span>';
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  return html;
}

function toggleRaceVsRace(race) {
  if (!S.expandedRaceVsRace) S.expandedRaceVsRace = {};
  S.expandedRaceVsRace[race] = !S.expandedRaceVsRace[race];
  refreshContent();
}

function buildWeaponRecordsList(weaponRecords) {
  if (!S.expandedWeapons) S.expandedWeapons = {};
  if (!S.expandedRaces) S.expandedRaces = {};

  let html = '';
  for (const rec of weaponRecords) {
    const isUnknown = rec.weapon === 'Unknown';
    const weaponExpanded = S.expandedWeapons[rec.weapon] || false;
    const winRate = (rec.wins + rec.losses > 0) ? ((rec.wins / (rec.wins + rec.losses)) * 100).toFixed(1) : '0.0';
    const displayName = isUnknown ? 'Total Record' : rec.weapon;

    html += '<div style="margin-bottom:8px; border:1px solid #ddd; border-radius:3px; background:#fff;">';

    if (isUnknown) {
      // Non-expandable Total Record
      html += '<div style="padding:8px; background:#f0f0f0; display:flex; justify-content:space-between; align-items:center;">';
      html += '<span style="font-weight:bold; font-size:11px;">' + displayName + '</span>';
      html += '<span style="font-size:11px; color:#666;">' + rec.wins + '-' + rec.losses + '-' + rec.kills + ' (' + winRate + '%)</span>';
      html += '</div>';
    } else {
      // Expandable weapon entry
      html += '<div style="padding:8px; cursor:pointer; background:#f0f0f0; display:flex; justify-content:space-between; align-items:center;"';
      html += ' onclick="toggleWeapon(\'' + esc(rec.weapon) + '\')">';
      html += '<span style="font-weight:bold; font-size:11px;">' + (weaponExpanded ? '▼' : '▶') + ' ' + displayName + '</span>';
      html += '<span style="font-size:11px; color:#666;">' + rec.wins + '-' + rec.losses + '-' + rec.kills + ' (' + winRate + '%)</span>';
      html += '</div>';

      if (weaponExpanded && rec.race_breakdown && rec.race_breakdown.length > 0) {
        html += '<div style="padding:8px; border-top:1px solid #ddd;">';
        for (const raceRec of rec.race_breakdown) {
          const raceKey = rec.weapon + '|' + raceRec.race;
          const raceExpanded = S.expandedRaces[raceKey] || false;
          const raceWinRate = (raceRec.wins + raceRec.losses > 0) ? ((raceRec.wins / (raceRec.wins + raceRec.losses)) * 100).toFixed(1) : '0.0';

          html += '<div style="margin-bottom:6px; border:1px solid #f0f0f0; border-radius:2px; background:#fafafa; margin-left:8px;">';
          html += '<div style="padding:6px 8px; cursor:pointer; background:#f5f5f5; display:flex; justify-content:space-between; align-items:center;"';
          html += ' onclick="toggleRaceInWeapon(\'' + esc(raceKey) + '\')">';
          html += '<span style="font-size:11px;">' + (raceExpanded ? '▼' : '▶') + ' ' + esc(raceRec.race) + '</span>';
          html += '<span style="font-size:11px; color:#666;">' + raceRec.wins + '-' + raceRec.losses + '-' + raceRec.kills + ' (' + raceWinRate + '%)</span>';
          html += '</div>';

          if (raceExpanded && raceRec.warrior_breakdown && raceRec.warrior_breakdown.length > 0) {
            html += '<div style="padding:6px 8px; border-top:1px solid #f0f0f0;">';
            for (const warriorRec of raceRec.warrior_breakdown) {
              const warriorWinRate = (warriorRec.wins + warriorRec.losses > 0) ? ((warriorRec.wins / (warriorRec.wins + warriorRec.losses)) * 100).toFixed(1) : '0.0';
              html += '<div style="padding:4px 8px; border-bottom:1px solid #efefef; display:flex; justify-content:space-between; align-items:center; margin-left:12px;">';
              html += '<span style="font-size:10px; font-style:italic;">' + esc(warriorRec.warrior) + '</span>';
              html += '<span style="font-size:10px; color:#888;">' + warriorRec.wins + '-' + warriorRec.losses + '-' + warriorRec.kills + ' (' + warriorWinRate + '%)</span>';
              html += '</div>';
            }
            html += '</div>';
          }
          html += '</div>';
        }
        html += '</div>';
      }
    }
    html += '</div>';
  }
  return html;
}

function toggleWeapon(weapon) {
  if (!S.expandedWeapons) S.expandedWeapons = {};
  S.expandedWeapons[weapon] = !S.expandedWeapons[weapon];
  refreshContent();
}

function toggleRaceInWeapon(raceKey) {
  if (!S.expandedRaces) S.expandedRaces = {};
  S.expandedRaces[raceKey] = !S.expandedRaces[raceKey];
  refreshContent();
}

function refreshDataFacts() {
  S.dataFactsLoading = true;
  refreshContent();
  _loadManagerRecord().then(() => {
    S.dataFactsLoading = false;
    if (S.mgrTab === 'data_facts') refreshContent();
  });
}

/* ============================================================
   SCOUTING TAB
   ============================================================ */
function buildScoutingTab() {
  const sc   = S.scout;
  const acc  = S.account || {};
  const mid  = acc.id || 0;

  // Show open report view instead if one is active
  if (sc.report) {
    return buildScoutReport(sc.report);
  }

  // Trigger async loads if not yet fetched
  if (!sc.loaded) {
    loadScoutStatus();
    return '<div style="padding:20px; color:#666;">Loading scouting status...</div>';
  }

  // ── Current selections ────────────────────────────────────────────────────
  let selRows = '';
  (sc.selections || []).forEach(entry => {
    const isConfirmed = entry.confirmed !== undefined ? entry.confirmed : true;
    const btn = isConfirmed
      ? `<span style="font-size:11px; color:#666; font-style:italic;">🔒 Locked</span>`
      : `<button onclick='removeScout(${jsq(entry.warrior_name)})'
                style="color:#800; font-size:11px; padding:1px 6px; border-color:#f88 #800 #800 #f88;">✕ Remove</button>`;
    
    selRows += `
    <tr style="border-bottom:1px solid #eee;">
      <td style="padding:4px 8px; font-weight:bold;">${esc(entry.warrior_name)}</td>
      <td style="padding:4px 8px; color:#555;">${esc(entry.team_name||'-')}</td>
      <td style="padding:4px 8px; display:flex; gap:4px;">
        <button onclick='viewScoutReport(${jsq(entry.warrior_name)})'
                style="font-size:11px; padding:1px 6px; margin-right:4px;">View Report</button>
        ${btn}
      </td>
    </tr>`;
  });
  if (!selRows) {
    selRows = `<tr><td colspan="3" style="padding:8px; color:#888; font-style:italic;">
      No warriors selected for scouting this turn.</td></tr>`;
  }

  const slotsLeft = sc.slotsLeft ?? (3 - (sc.selections||[]).length);

  // ── Available targets ─────────────────────────────────────────────────────
  let targetsHtml = '';
  if (sc.targets === null) {
    // Not yet loaded - trigger load
    loadScoutTargets();
    targetsHtml = '<div style="padding:8px; color:#666; font-style:italic;">Loading warriors...</div>';
  } else if (!sc.targets.length) {
    targetsHtml = '<div style="padding:8px; color:#888; font-style:italic;">No warriors from other teams available.</div>';
  } else {
    const filter  = (sc.filterText || '').toLowerCase();
    const already = new Set((sc.selections||[]).map(e => e.warrior_name));
    const visible = sc.targets.filter(w =>
      !filter ||
      w.name.toLowerCase().includes(filter) ||
      w.team_name.toLowerCase().includes(filter)
    );
    visible.sort((a, b) => b.total_fights - a.total_fights);
    let trows = '';
    visible.forEach(w => {
      const queued = already.has(w.name);
      let btn;
      if (queued) {
        btn = `<button disabled style="font-size:11px; padding:1px 6px; opacity:0.5;">Scouted</button>`;
      } else if (slotsLeft > 0) {
        btn = `<button onclick='addScout(${jsq(w.name)}, ${jsq(w.team_name)}, ${w.team_id})'
                       style="font-size:11px; padding:1px 6px;">+ Scout</button>`;
      } else {
        btn = `<button disabled style="font-size:11px; padding:1px 6px; opacity:0.5;" title="3 scouts used">Full</button>`;
      }
      trows += `
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:3px 8px;">${esc(w.name)}</td>
        <td style="padding:3px 8px; color:#555;">${esc(w.team_name)}</td>
        <td style="padding:3px 8px; color:#555;">${esc(w.manager_name||'-')}</td>
        <td style="padding:3px 8px; color:#555;">${esc(w.race)} ${esc(w.gender)}</td>
        <td style="padding:3px 8px; text-align:center;">${S.hideRecord ? '-' : `${w.wins}-${w.losses}-${w.kills}`}</td>
        <td style="padding:3px 8px; text-align:center;">${w.total_fights}</td>
        <td style="padding:3px 8px;">${btn}</td>
      </tr>`;
    });
    if (!trows) {
      trows = `<tr><td colspan="7" style="padding:8px; color:#888; font-style:italic;">
        No warriors match the search filter.</td></tr>`;
    }
    targetsHtml = `
    <div style="margin-bottom:6px; display:flex; align-items:center; gap:6px;">
      <span style="font-size:11px;">Search:</span>
      <input type="text" value="${esc(sc.filterText||'')}" oninput="scoutFilter(this.value)"
             style="width:200px; font-size:11px;" placeholder="Name or team...">
      <span style="font-size:11px; color:#666;">${visible.length} of ${sc.targets.length} warrior${sc.targets.length===1?'':'s'}</span>
    </div>
    <table style="border-collapse:collapse; width:100%; font-size:12px;">
      <thead>
        <tr style="border-bottom:2px solid #ccc; color:#666; font-size:11px;">
          <th style="padding:4px 8px; text-align:left; font-weight:600;">Name</th>
          <th style="padding:4px 8px; text-align:left; font-weight:600;">Team</th>
          <th style="padding:4px 8px; text-align:left; font-weight:600;">Manager</th>
          <th style="padding:4px 8px; text-align:left; font-weight:600;">Race</th>
          <th style="padding:4px 8px; text-align:center; font-weight:600;">Record (W-L-K)</th>
          <th style="padding:4px 8px; text-align:center; font-weight:600;">Fights</th>
          <th style="padding:4px 8px;"></th>
        </tr>
      </thead>
      <tbody>${trows}</tbody>
    </table>`;
  }

  return `
<div style="padding:12px; display:flex; flex-direction:column; gap:12px; overflow:auto; height:100%;">
  <div class="group" style="margin:0;">
    <span class="group-label">Scouting Assignments - ${slotsLeft} slot${slotsLeft===1?'':'s'} remaining this turn</span>
    <p style="font-size:11px; color:#555; margin:4px 0 8px;">
      Select up to <b>3</b> opposing warriors to scout each turn. When you select a warrior, your scout will be
      confirmed, and you'll see the scouting report. Once confirmed, scouts are locked and cannot be removed.
      Scouting resets after the turn runs.
    </p>
    <table style="border-collapse:collapse; width:100%; font-size:12px;">
      <thead>
        <tr style="border-bottom:2px solid #ccc; color:#666; font-size:11px;">
          <th style="padding:4px 8px; text-align:left; font-weight:600;">Warrior</th>
          <th style="padding:4px 8px; text-align:left; font-weight:600;">Team</th>
          <th style="padding:4px 8px;"></th>
        </tr>
      </thead>
      <tbody>${selRows}</tbody>
    </table>
  </div>
  <div style="border:2px solid var(--mid); margin:0; flex:1; overflow:auto; background:var(--bg); display:flex; flex-direction:column;">
    <div style="padding:4px 8px 4px; font-weight:bold; font-size:11px; border-bottom:1px solid var(--mid); flex-shrink:0;">Available to Scout</div>
    <div style="overflow:auto; flex:1;">
      ${targetsHtml}
    </div>
  </div>
</div>`;
}

function buildScoutReport(report) {
  const equip = [
    ['Armor',            report.armor],
    ['Helm',             report.helm],
    ['Primary Weapon',   report.primary_weapon],
    ['Secondary Weapon', report.secondary_weapon],
    ['Backup Weapon',    report.backup_weapon],
  ].map(([label, val]) =>
    `<tr><td style="padding:2px 8px; color:#555; width:130px;">${esc(label)}</td>
         <td style="padding:2px 8px; font-weight:bold;">${esc(val||'None')}</td></tr>`
  ).join('');

  // Parse the scout report text into styled sections
  const reportText = report.scout_report || '';
  const reportHtml = reportText
    ? _renderScoutReportText(reportText)
    : `<div style="padding:8px; color:#888; font-style:italic;">No scout report available for this warrior yet.</div>`;

  return `
<div style="padding:12px; overflow:auto; height:100%;">
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
    <button onclick="closeScoutReport()" style="font-size:11px; padding:2px 10px;">← Back</button>
    <b style="font-size:13px;">Scouting Report: ${esc(report.warrior_name)}</b>
    <span style="font-size:11px; color:#666;">- ${esc(report.team_name)}</span>
    <span style="font-size:11px; color:#888; margin-left:auto;">${report.wins}-${report.losses}-${report.kills} (${report.total_fights} fights)</span>
  </div>
  <div class="group" style="margin:0 0 10px;">
    <span class="group-label">Equipment Observed</span>
    <p style="font-size:11px; color:#555; margin:4px 0 6px; font-style:italic;">
      Your scout noted the following loadout on ${esc(report.warrior_name)} before the fight:
    </p>
    <table style="border-collapse:collapse; font-size:12px;">${equip}</table>
  </div>
  <div class="group" style="margin:0;">
    <span class="group-label">Scout's Field Report</span>
    ${reportHtml}
  </div>
</div>`;
}

function _renderScoutReportText(text) {
  // Split the plain-text report into styled HTML sections.
  // Section headers are ALL-CAPS lines (like "FIGHT OBSERVED", "TACTICAL RECOMMENDATION", etc.)
  const HEADER_RE = /^[A-Z][A-Z\s\-']+$/;
  const DIVIDER_RE = /^-{3,}$/;

  const lines = text.split('\n');
  let html = '<div style="font-family:\'Courier New\',monospace; font-size:11px; line-height:1.6; padding:4px 0;">';
  let inSection = false;

  for (let i = 0; i < lines.length; i++) {
    const raw  = lines[i];
    const trim = raw.trim();

    if (!trim) {
      html += '<div style="height:6px;"></div>';
      continue;
    }

    // Top-level report header lines (first 4 lines - name, filed-by, record)
    if (i < 5 && trim) {
      if (i === 0) {
        html += `<div style="font-size:13px; font-weight:bold; letter-spacing:1px; color:#3a1a00; margin-bottom:4px;">${esc(trim)}</div>`;
      } else {
        html += `<div style="font-size:11px; color:#555; margin-bottom:2px;">${esc(trim)}</div>`;
      }
      continue;
    }

    // Divider lines - skip rendering
    if (DIVIDER_RE.test(trim)) continue;

    // ALL-CAPS section headings
    if (HEADER_RE.test(trim) && trim.length > 3) {
      html += `<div style="margin-top:10px; margin-bottom:3px; font-size:11px; font-weight:bold;
                            letter-spacing:0.5px; color:#5a2800; border-bottom:1px solid #d4b896;
                            padding-bottom:2px;">${esc(trim)}</div>`;
      continue;
    }

    // "THREAT LEVEL:" keyword - highlight it
    if (trim.startsWith('THREAT LEVEL:')) {
      const isHigh = trim.includes('HIGH');
      const isMod  = trim.includes('MODERATE');
      const color  = isHigh ? '#8b0000' : isMod ? '#7a4800' : '#1a5c1a';
      html += `<div style="margin:4px 0; padding:4px 8px; background:${isHigh?'#fff0f0':isMod?'#fff8e8':'#f0fff0'};
                            border-left:3px solid ${color}; color:${color}; font-weight:bold; font-size:11px;">${esc(trim)}</div>`;
      continue;
    }

    // "Advisory:" / "Note:" / "Weapon note:" prefix lines
    if (/^(Advisory|Note|Weapon note):/i.test(trim)) {
      html += `<div style="margin:2px 0 2px 8px; color:#444; font-style:italic; font-size:11px;">${esc(trim)}</div>`;
      continue;
    }

    // Indented lines (start with spaces/2+ spaces in original)
    if (raw.startsWith('  ') || raw.startsWith('\t')) {
      html += `<div style="margin:1px 0 1px 12px; color:#333; font-size:11px;">${esc(trim)}</div>`;
      continue;
    }

    // Closing signature lines ("- Name")
    if (trim.startsWith('-') || trim.startsWith('-')) {
      html += `<div style="margin-top:8px; color:#555; font-style:italic; font-size:11px;">${esc(trim)}</div>`;
      continue;
    }

    // Default paragraph line
    html += `<div style="margin:2px 0; color:#222; font-size:11px;">${esc(trim)}</div>`;
  }

  html += '</div>';
  return html;
}

async function loadScoutStatus() {
  const mid = (S.account || {}).id || 0;
  if (!mid) return;
  try {
    const r = await API.get(`/api/scout/status?manager_id=${mid}`);
    if (r.success) {
      S.scout.loaded     = true;
      S.scout.slotsLeft  = r.slots_left;
      // selections from server now have full object structure with confirmed status
      S.scout.selections = (r.selections || []).map(sel => {
        if (typeof sel === 'string') {
          // Legacy support for string-only format
          return { warrior_name: sel, team_name: '', team_id: 0, confirmed: true };
        }
        return {
          warrior_name: sel.warrior_name || '',
          team_name: sel.team_name || '',
          team_id: sel.team_id || 0,
          confirmed: sel.confirmed !== undefined ? sel.confirmed : true
        };
      });
    }
  } catch(e) {}
  // Also load targets if not yet loaded
  if (S.scout.targets === null) {
    loadScoutTargets();
  } else {
    refreshContent();
  }
}

async function loadScoutTargets() {
  const mid = (S.account || {}).id || 0;
  if (!mid) return;
  try {
    const r = await API.get(`/api/scout/targets?manager_id=${mid}`);
    if (r.success) {
      S.scout.targets = r.warriors || [];
      // Back-fill team names on selections now that we have target data
      S.scout.selections = S.scout.selections.map(sel => {
        const found = S.scout.targets.find(t => t.name === sel.warrior_name);
        return {
          warrior_name: sel.warrior_name,
          team_name: found ? found.team_name : sel.team_name,
          team_id: found ? found.team_id : sel.team_id,
          confirmed: sel.confirmed
        };
      });
    }
  } catch(e) { S.scout.targets = []; }
  refreshContent();
}

async function loadChallengeTargets() {
  const mid    = (S.account || {}).id || 0;
  const teamId = S.sel.teamId || 0;
  try {
    const r = await API.get(`/api/challenge/targets?manager_id=${mid}&team_id=${teamId}`);
    S.challengeTargets = r.success ? (r.warriors || []) : [];
    S._eligibleChampionTiers = r.success ? (r.eligible_champion_tiers || []) : [];
  } catch(e) { S.challengeTargets = []; S._eligibleChampionTiers = []; }
  refreshContent();
}

async function addScout(warriorName, teamName, teamId) {
  const mid = (S.account || {}).id || 0;
  // Add scout with immediate confirmation
  const r = await API.post('/api/scout/select', {
    manager_id: mid,
    warrior_name: warriorName,
    team_name: teamName,
    team_id: teamId
  });
  
  if (r.success) {
    // Update selections list
    S.scout.slotsLeft = r.slots_left;
    S.scout.selections = (r.selections || []).map(sel => ({
      warrior_name: sel.warrior_name || sel,
      team_name: sel.team_name || '',
      team_id: sel.team_id || 0,
      confirmed: sel.confirmed !== undefined ? sel.confirmed : true
    }));
    
    // Now fetch and show the scout report immediately
    await viewScoutReport(warriorName);
  } else {
    alert('Could not add scout: ' + r.error);
  }
}

async function removeScout(warriorName) {
  const mid = (S.account || {}).id || 0;
  const selection = (S.scout.selections || []).find(s => s.warrior_name === warriorName);
  
  // Only allow removal of unconfirmed selections
  if (selection && selection.confirmed) {
    alert('Cannot remove a confirmed scout selection. Confirmed scouts are locked until the turn ends.');
    return;
  }
  
  const r = await API.post('/api/scout/remove', { manager_id: mid, warrior_name: warriorName });
  if (r.success) {
    S.scout.slotsLeft = r.slots_left;
    S.scout.selections = (r.selections || []).map(sel => ({
      warrior_name: sel.warrior_name || sel,
      team_name: sel.team_name || '',
      team_id: sel.team_id || 0,
      confirmed: sel.confirmed !== undefined ? sel.confirmed : true
    }));
    render();
  } else {
    alert('Could not remove scout: ' + r.error);
  }
}

async function viewScoutReport(warriorName) {
  const mid = (S.account || {}).id || 0;
  try {
    const r = await API.get(`/api/scout/report?manager_id=${mid}&warrior_name=${encodeURIComponent(warriorName)}`);
    if (r.success) {
      S.scout.report = r.report;
      render();
    } else {
      alert('Could not load scouting report: ' + (r.error || 'Unknown error'));
    }
  } catch(e) {
    alert('Error loading scouting report.');
  }
}

function closeScoutReport() {
  S.scout.report = null;
  render();
}

function scoutFilter(text) {
  S.scout.filterText = text;
  render();
}

function buildContent() {
  const { type, teamId, wIdx } = S.sel;

  if (!type) {
    return buildManagerPanel();
  }

  if (type === 'newsletter') {
    return buildNewsletterPanel();
  }

  if (type === 'team') {
    const team = S.teams[teamId];
    if (!team) return '<div style="padding:10px;">Loading...</div>';
    return buildTeamPanel(team);
  }

  if (type === 'warrior') {
    const team = S.teams[teamId];
    if (!team) return '<div style="padding:10px;">Loading...</div>';
    const w = team.warriors[wIdx];
    if (!w) return '<div style="padding:10px;">Empty slot.</div>';
    return buildWarriorPanel(team, w, wIdx);
  }

  return '';
}

/* ============================================================
   WARRIOR PANEL - TABS
   ============================================================ */
function buildWarriorPanel(team, w, wIdx) {
  const isAscended = w.ascended_to_monster || false;
  const isDead = w.is_dead || false;
  // Always show all tabs regardless of death status - don't tip off the manager
  // that the warrior died until they read the fight narrative
  const tabs = ['Stats/Strats', 'Fight Options', 'Fights', 'Challenges', 'Replacement', 'The Crypts', 'Shady Pines'];
  const tabMap = {
    'Stats/Strats':'stats', 'Fight Options':'fight', 'Fights':'fights',
    'Challenges':'challenges', 'Replacement':'replacement', 'The Crypts':'archives',
    'Shady Pines':'retired'
  };
  let tabsHtml = `<div class="tabs">`;
  tabs.forEach(t => {
    const key = tabMap[t];
    tabsHtml += `<div class="tab ${S.wTab===key?'active':''}" onclick="setWTab('${key}')">${t}</div>`;
  });
  tabsHtml += `</div>`;

  let body = '';
  if      (S.wTab === 'stats')       body = buildStatsTab(team, w, wIdx);
  else if (S.wTab === 'fight')       body = buildFightOptionsTab(w);
  else if (S.wTab === 'fights')      body = buildFightsTab(w);
  else if (S.wTab === 'challenges')  body = buildChallengesTab(team, w, wIdx);
  else if (S.wTab === 'replacement') body = buildReplacementTab(w);
  else if (S.wTab === 'archives')    body = buildArchivesTab(team);
  else if (S.wTab === 'retired')     body = buildRetiredTab(team);

  return tabsHtml + `<div class="tab-body" style="overflow:auto;">${body}</div>`;
}

/* ---- Stats / Strats tab ---- */
function buildStatsTab(team, w, wIdx) {
  // Guard: if game data hasn't loaded yet return a placeholder.
  // This prevents empty selects from firing scheduleAutoSave() on render
  // and overwriting the warrior's saved armor/weapons/trains/strategies.
  if (!S.gd) {
    if (!S._loadingGd) {
      S._loadingGd = true;
      API.get('/api/game_data').then(gd => {
        S._loadingGd = false;
        if (gd && !gd.error) { S.gd = gd; render(); }
      }).catch(() => { S._loadingGd = false; });
    }
    return '<div style="padding:20px;color:#555;">Loading game data...</div>';
  }
  const gd = S.gd;
  const { height: _hin, weight: _wlbs } = calcMeasurements(w.race, w.gender, w.size, w.training_weight_bonus);
  const ft = Math.floor(_hin / 12), ins = _hin % 12;

  // Stat rows
  const attrs = ['strength','dexterity','constitution','intelligence','presence','size'];
  let statRows = '';
  attrs.forEach(a => {
    const cur = w[a] || 0;
    const ini = (w.initial_stats && w.initial_stats[a]) ? w.initial_stats[a] : cur;
    const dv  = (cur !== ini) ? `${cur} (${ini})` : `${cur}`;
    statRows += `<tr>
      <td style="text-align:right; padding:1px 6px; min-width:90px;">${capitalize(a)}</td>
      <td style="padding:1px 4px;"><span class="stat-val">${esc(dv)}</span></td>
    </tr>`;
  });

  // Equipment dropdowns - filter server list first to avoid duplicates
  const armor_opts = [...(gd.armor||[]).filter(a => a !== 'None'), 'None'];
  const helm_opts  = [...(gd.helms||[]).filter(h => h !== 'None'), 'None'];
  const wpn_opts   = (gd.weapons||[]).filter(w => w !== 'Open Hand');
  const cur_armor  = w.armor||'None';
  const cur_helm   = w.helm||'None';
  const cur_prim   = w.primary_weapon||'Open Hand';
  const cur_sec    = w.secondary_weapon||'Open Hand';
  const cur_bkp    = w.backup_weapon||'None';

  // Build grouped train options: Attributes | Skills | Weapons
  const attrTrains  = ['Strength','Dexterity','Constitution','Intelligence','Presence'];
  const skillTrains = ['Acrobatics','Bash','Brawl','Charge','Cleave','Disarm','Dodge','Feint','Initiative','Lunge','Parry','Riposte','Slash','Strike','Sweep','Throw'];
  const gdTrains    = (gd.train_skills||[]);
  const wpnTrains   = gdTrains.filter(t => !attrTrains.includes(t) && !skillTrains.includes(t));

  const t1 = (w.trains||[])[0]||'', t2 = (w.trains||[])[1]||'', t3 = (w.trains||[])[2]||'';

  function tOpts(val) {
    // Normalise stored key (e.g. "war_flail" → "War Flail") for comparison
    const norm = v => v.replace(/_/g,' ').replace(/\b\w/g, ch => ch.toUpperCase());

    // Migration: convert old "Francisca" to "Hand Axe" for matching
    let valNorm = norm(val);
    if (valNorm === 'Francisca' || val === 'francisca' || val === 'Francisca') {
      valNorm = 'Hand Axe';
    }

    const sel = v => {
      // Direct match
      if (v === val) return ' selected';
      // Normalized match
      const vNorm = norm(v);
      if (vNorm === valNorm) return ' selected';
      // Special case: match "Francisca" (old name) to "Hand Axe" (new name)
      if ((valNorm === 'Hand Axe' || val === 'francisca') && vNorm === 'Hand Axe') return ' selected';
      return '';
    };

    let h = '<option value="">-</option>';
    h += '<optgroup label="── Attributes ──">';
    attrTrains.forEach(a => { h += `<option value="${a}"${sel(a)}>${a}</option>`; });
    h += '</optgroup><optgroup label="── Skills ──">';
    skillTrains.forEach(s => { h += `<option value="${s}"${sel(s)}>${s}</option>`; });
    h += '</optgroup><optgroup label="── Weapons ──">';
    wpnTrains.forEach(wn => { h += `<option value="${wn}"${sel(wn)}>${wn}</option>`; });
    h += '</optgroup>';
    return h;
  }

  // Strategies
  const triggers = gd.triggers||[];
  const styles   = gd.styles||[];
  const aimPts   = gd.aim_points||[];
  const OC = 'onchange="scheduleAutoSave()"';

  // Determine which strategy array to display
  const challengeMode = w.challenge_strategy_enabled || false;
  const strats = challengeMode ? (w.challenge_strategies || []) : (w.strategies || []);

  // Separate Always/default row from numbered trigger rows
  const isDefaultTrigger = t => t === 'Always' || t === 'Always (Default Loop)';

  const always   = strats.find(s => isDefaultTrigger(s.trigger)) || {trigger:'Always (Default Loop)',style:'',activity:'',aim_point:'',defense_point:''};

  // Blank-first option list - blank = row inactive
  function stratOpts(items, val) {
    let h = '<option value=""></option>';
    items.forEach(it => { h += `<option value="${esc(it)}" ${it===val?'selected':''}>${esc(it)}</option>`; });

  let stratRows = '';

    <td style="padding:2px 4px; background:#ececec; font-style:italic; color:#444;">Always (Default Loop)</td>
    <td><select data-si="D" data-sf="style" ${OC}>${stratOpts(styles, always.style)}</select></td>

    <td><select data-si="D" data-sf="aim_point" ${OC}>${stratOpts(aimPts, always.aim_point)}</select></td>
    <td><select data-si="D" data-sf="defense_point" ${OC}>${stratOpts(aimPts, always.defense_point)}</select></td>
  </tr>`;

  // Skills and injuries - built from raw dicts so post-merge data is always current
  const skillsText = formatSkillsText(w.skills).join('\n') || '(none)';
  const injText    = formatInjuriesText(w.injuries).join('\n') || '(none)';

  return `
<div style="padding:4px;">
<!-- Warrior header -->

<table style="width:100%; border-collapse:collapse; margin-bottom:4px;">
  <tr>
    <td style="width:50px; padding:2px 4px;">Name</td>
    <td><input type="text" class="ro" value="${esc(w.name)}" style="width:240px;" readonly></td>
    <td style="padding:2px 12px 2px 8px;">Race</td>
    <td><input type="text" class="ro" value="${esc(w.race)}" style="width:80px;" readonly></td>
    <td style="padding:2px 8px;">Height</td>
    <td><input type="text" class="ro" value="${ft}' ${ins}&quot;" style="width:60px;" readonly></td>
  </tr>
  <tr>
    <td style="padding:2px 4px;">Record</td>
    <td><input type="text" class="ro" value="${S.hideRecord ? '-' : esc(fmtRecord(w))}" style="width:240px;" readonly></td>
    <td style="padding:2px 12px 2px 8px;">Gender</td>
    <td><input type="text" class="ro" value="${esc(w.gender)}" style="width:80px;" readonly></td>

  ${S.league.flags.show_max_hp ? `<span>Max HP: <b>${w.max_hp || (w.constitution ? Math.floor((w.constitution + 8) * 2.5) : '?')}</b></span>` : ''}
  ${S.league.flags.show_favorite_weapon && w.favorite_weapon ? `<span>Favorite: <b>${esc(w.favorite_weapon)}</b></span>` : ''}
  <span>Popularity: <b>${w.popularity||0}</b>/100</span>

  ${(w.streak||0)!==0 ? '<span>Streak: ' + streakLabel(w.streak||0) + '</span>' : ''}

/* ---- Tier helpers (mirrors warrior.py tier system) ---- */
const TIER_ORDER = ['CHAMPION','ELITES','EXPERTS','VETERANS','ADEPTS','INITIATES','ROOKIES','RECRUITS'];
const TIER_LABELS = {
  CHAMPION:'Champion', ELITES:'Elite', EXPERTS:'Expert', VETERANS:'Veteran',
  ADEPTS:'Adept', INITIATES:'Initiate', ROOKIES:'Rookie', RECRUITS:'Recruit'
};
function warriorTier(w) {
  if (w.is_champion) return 'CHAMPION';
  const rec = w.recognition || 0;
  if (rec >= 87)  return 'ELITES';
  if (rec >= 71)  return 'EXPERTS';
  if (rec >= 56)  return 'VETERANS';
  if (rec >= 41)  return 'ADEPTS';
  if (rec >= 26)  return 'INITIATES';
  if (rec >= 13)  return 'ROOKIES';
  return 'RECRUITS';
}
function canChallengeTier(challengerTier, targetTier) {
  if (targetTier === 'CHAMPION') return false; // champion path is separate
  const ci = TIER_ORDER.indexOf(challengerTier);
  const ti = TIER_ORDER.indexOf(targetTier);
  return ci - 1 <= ti && ti <= ci;
}
function canChallengeChampion(challengerTier) {
  return true; // Server enforces top 2 tiers dynamically
}

function streakLabel(s) {
  if (s === 0)  return '<span style="color:#888">-</span>';
  if (s  >  0)  return `<b style="color:#060">W${s}</b>`;
  return `<b style="color:#800">L${Math.abs(s)}</b>`;
}

async function saveFightOption(field, value) {
  const {teamId, wIdx} = S.sel;
  if (teamId == null || wIdx == null) return;
  try {
    const r = await API.put('/api/warrior', {
      team_id: teamId, warrior_idx: wIdx,
      [field]: value,
    });
    if (r.success) {
      const w = S.teams[teamId]?.warriors?.[wIdx];
      if (w) w[field] = value;
    } else {
      alert('Could not save: ' + r.error);
    }
  } catch(e) { console.warn('saveFightOption:', e); }
}
function buildFightsTab(w) {
  const history = (w.fight_history || []).slice().reverse(); // newest first
  
  // Sort fights by type priority: champion, monster, blood_challenge, challenge, rivalry, peasant, unknown
  const typeOrder = { 'champion': 0, 'monster': 1, 'blood_challenge': 2, 'challenge': 3, 'rivalry': 4, 'peasant': 5 };
  const getTypeOrder = (type) => typeOrder[type] !== undefined ? typeOrder[type] : 999;
  
  history.sort((a, b) => {
    // Primary: newest turn first so recent fights are always visible at the top
    const turnDiff = (b.turn || 0) - (a.turn || 0);
    if (turnDiff !== 0) return turnDiff;
    // Secondary: fight type priority within the same turn (champion before rivalry)
    return getTypeOrder(a.fight_type) - getTypeOrder(b.fight_type);

  if (!history.length) {
    return `<div style="padding:10px;">

function buildChallengesTab(team, w, wIdx) {
  const myTier = warriorTier(w);

  // Current challenges queued for this warrior (stored by slot index)
  const pendingMap  = team.challenges || {};
  const myPending   = pendingMap[wIdx] || [];
  const slotsUsed   = myPending.length;
  const slotsLeft   = 3 - slotsUsed;

  // Blood challenges available for this team
  const activeBloodChallenges = (team.blood_challenges || []).filter(bc =>
    bc.status === "active" && bc.turns_remaining > 0
  );

  // Blood challenges this warrior has already been assigned to carry
  const bloodList = (team.blood_challenges || []).filter(bc =>
    bc.status === "active" && bc.challenger_name === w.name
  );

  // Collect eligible opponents from the server-provided target list (includes AI teams)
  if (S.challengeTargets === null) {
    return '<div style="padding:20px; color:#555;">Loading challenge targets...</div>';
  }
  const opponents = [];
  const eligible_champ_tiers = S._eligibleChampionTiers || [];

  for (const ow of S.challengeTargets) {
    const owTier = warriorTier(ow);

    // For Champion: only show if challenger is in the top 2 eligible tiers
    if (ow.is_champion) {
      if (eligible_champ_tiers.includes(myTier)) {
        opponents.push({
          name: ow.name, teamName: ow.team_name, managerName: ow.manager_name || '-',
          race: ow.race || '-',
          record: S.hideRecord ? '-' : `${ow.wins||0}-${ow.losses||0}-${ow.kills||0}`,
          fights: ow.total_fights || 0, tier: 'CHAMPION', isChampion: true,
          recognition: ow.recognition || 0,
        });
      }
    } else if (canChallengeTier(myTier, owTier)) {
      opponents.push({
        name: ow.name, teamName: ow.team_name, managerName: ow.manager_name || '-',
        race: ow.race || '-',
        record: S.hideRecord ? '-' : `${ow.wins||0}-${ow.losses||0}-${ow.kills||0}`,
        fights: ow.total_fights || 0, tier: owTier, isChampion: false,
        recognition: ow.recognition || 0,
      });
    }
  }
  opponents.sort((a, b) => b.fights - a.fights || a.name.localeCompare(b.name));
  const allOpponents = opponents;

  // ── Pending challenges rows ──────────────────────────────────────────────
  let pendingRows = '';
  myPending.forEach(target => {
    // Try to find target info from loaded teams
    let teamLabel = '', fightLabel = '';
    for (const t of Object.values(S.teams || {})) {
      const ow = (t.warriors || []).find(x => x && x.name === target);
      if (ow) { teamLabel = t.team_name; fightLabel = `${ow.total_fights||0} fights`; break; }
    }
    const info = teamLabel ? `${esc(teamLabel)}${fightLabel ? ', ' + fightLabel : ''}` : '-';
    pendingRows += `
    <tr>
      <td style="padding:4px 8px; font-weight:bold;">${esc(target)}</td>
      <td style="padding:4px 8px; color:#555;">${info}</td>
      <td style="padding:4px 8px;">
        <button onclick="removeChallenge(${jsq(w.name)},${jsq(target)})"
                style="color:#800; font-size:11px; padding:1px 6px; border-color:#f88 #800 #800 #f88;">
          ✕ Remove
        </button>
      </td>
    </tr>`;
  });
  bloodList.forEach(bc => {
    const bcTarget = bc.target_name || '?';
    const bcDead   = bc.dead_warrior_name || '?';
    const bcTurns  = bc.turns_remaining || 0;
    pendingRows += `
    <tr style="background:#ffe8e8;">
      <td style="padding:4px 8px; font-weight:bold;">${esc(bcTarget)}</td>
      <td style="padding:4px 8px; color:#800; font-size:11px;">
        Blood Challenge (avenge ${esc(bcDead)}) &mdash; ${bcTurns} turn${bcTurns === 1 ? '' : 's'} left
      </td>
      <td style="padding:4px 8px;">
        <button onclick="selectBloodChallengeChampion(${jsq(bcTarget)}, '')"
                style="color:#800; font-size:11px; padding:1px 6px; border-color:#f88 #800 #800 #f88;">
          ✕ Clear
        </button>
      </td>
    </tr>`;
  });

  // ── Available opponents rows ─────────────────────────────────────────────
  let oppRows = '';
  if (allOpponents.length) {
    // Apply sorting if active for this warrior, otherwise use tier-ordered default
    const displayOpponents = applyChallengeSort(allOpponents);
    displayOpponents.forEach(op => {
      const alreadyQueued = myPending.includes(op.name);
      let btn;
      if (alreadyQueued) {
        btn = `<button disabled style="font-size:11px; padding:1px 6px; opacity:0.5;">Queued</button>`;
      } else if (slotsLeft > 0) {
        btn = `<button onclick="addChallenge(${jsq(w.name)},${jsq(op.name)})"
                       style="font-size:11px; padding:1px 6px;">+ Challenge</button>`;
      } else {
        btn = `<button disabled style="font-size:11px; padding:1px 6px; opacity:0.5;" title="3 challenges already queued">Full</button>`;
      }
      const tierStyle = op.isChampion ? 'color:#c60; font-weight:bold;' : 'color:#555;';
      oppRows += `
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:3px 8px;">${esc(op.name)}</td>
        <td style="padding:3px 8px; color:#555;">${esc(op.teamName)}</td>
        <td style="padding:3px 8px; color:#555;">${esc(op.managerName)}</td>
        <td style="padding:3px 8px; color:#555;">${esc(op.race)}</td>
        <td style="padding:3px 8px; text-align:center;">${esc(op.record)}</td>
        <td style="padding:3px 8px; text-align:center; ${tierStyle}">${TIER_LABELS[op.tier] || op.tier}</td>
        <td style="padding:3px 8px; text-align:center; color:#555;">${op.recognition || 0}</td>
        <td style="padding:3px 8px;">${btn}</td>
      </tr>`;
    });
  } else {
    oppRows = `<tr><td colspan="8" style="padding:10px; color:#888; text-align:center; font-style:italic;">
      No warriors in ${esc(TIER_LABELS[myTier] || myTier)} or the tier above are available to challenge.</td></tr>`;
  }

  const tierAbove = TIER_ORDER[TIER_ORDER.indexOf(myTier) - 1];
  const tierAboveLabel = tierAbove ? TIER_LABELS[tierAbove] : null;
  const rangeDesc = tierAboveLabel
    ? `${TIER_LABELS[myTier]} and ${tierAboveLabel} tier warriors`
    : `${TIER_LABELS[myTier]} tier warriors only`;

  const pendingSection = (myPending.length || bloodList.length) ? `
  <div class="group" style="margin:0 0 12px;">
    <span class="group-label">Pending Challenges - ${slotsUsed}/3 slots used</span>
    <table style="border-collapse:collapse; width:100%; font-size:12px;">
      ${pendingRows}
    </table>
  </div>` : '';

  // Blood challenges not yet assigned - this warrior can volunteer to carry one
  const availableBloodChallenges = activeBloodChallenges.filter(bc => !bc.challenger_name);

  let bloodChallengesSection = '';
  if (availableBloodChallenges.length > 0) {
    let bcItems = '';
    availableBloodChallenges.forEach(bc => {
      const targetName = bc.target_name || '?';
      const deadName   = bc.dead_warrior_name || '?';
      const turnsLeft  = bc.turns_remaining || 0;
      bcItems += `
      <div style="display:flex; align-items:center; justify-content:space-between;
                  padding:6px 10px; border-bottom:1px solid #e8c8c8; background:#fff3f3;">
        <div>
          <span style="font-weight:bold; font-size:13px;">${esc(targetName)}</span>
          <span style="color:#800; font-size:11px; margin-left:10px;">
            killed ${esc(deadName)} &mdash; ${turnsLeft} turn${turnsLeft === 1 ? '' : 's'} left
          </span>
        </div>
        <button onclick="selectBloodChallengeChampion(${jsq(targetName)}, ${jsq(w.name)})"
                style="background:#8b0000; color:#fff; font-size:11px; font-weight:bold;
                       padding:4px 12px; border:1px solid #500; cursor:pointer; white-space:nowrap;">
          Blood Challenge
        </button>
      </div>`;
    });

    bloodChallengesSection = `
  <div class="group" style="margin:0 0 12px;">
    <span class="group-label" style="color:#8b0000;">Blood Challenges</span>
    ${bcItems}
  </div>`;
  }

  // Build avoid managers section (team-level)
  const avoidMgrs = (team.avoid_managers || []).filter(m => m != null && typeof m === 'string');
  const otherManagers = [];
  if (S.challengeTargets) {
    const seen = new Set();
    for (const ow of S.challengeTargets) {
      const mn = ow.manager_name;
      if (mn && !seen.has(mn.toLowerCase()) && !avoidMgrs.some(am => am && am.toLowerCase() === mn.toLowerCase())) {
        seen.add(mn.toLowerCase());
        otherManagers.push(mn);
      }
    }
    otherManagers.sort((a, b) => {
      const aStr = (a || '').toString();
      const bStr = (b || '').toString();
      return aStr.localeCompare(bStr);
    });
  }

  let avoidMgrRows = avoidMgrs.length > 0
    ? avoidMgrs.map(m => `
      <div style="padding:4px 8px; margin-bottom:4px; background:#fff3e0; border:1px solid #ffb74d; border-radius:2px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <span>${esc(m)}</span>
        <button onclick="removeAvoidManager(${jsq(m)})"
                style="padding:1px 6px; color:#800; border-color:#f88 #800 #800 #f88; font-size:10px;">✕ Remove</button>
      </div>`).join('')
    : '<div style="padding:4px 8px; color:#999; font-style:italic; font-size:11px;">(none set)</div>';

  let avoidMgrDropdown = '';
  if (avoidMgrs.length < 2) {
    if (otherManagers.length > 0) {
      avoidMgrDropdown = `
        <select id="avoid-mgr-sel" onchange="handleAddAvoidManager()" style="width:180px; font-size:11px;">
          <option value="">(select a manager)</option>
          ${otherManagers.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('')}
        </select>`;
    } else {
      avoidMgrDropdown = '<div style="color:#999; font-style:italic; font-size:11px;">Loading managers...</div>';
    }
  } else {
    avoidMgrDropdown = '<div style="color:#999; font-style:italic; font-size:11px;">Maximum (2) already set</div>';
  }

  const avoidManagersSection = `
  <div class="group" style="margin:0 0 12px;">
    <span class="group-label">Avoid Managers - ${avoidMgrs.length}/2 set</span>
    <p style="font-size:11px; color:#555; margin:4px 0 8px;">
      Avoid all challenges from warriors on a specific manager's team (25-30% success rate).
    </p>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <div>
        <div style="font-size:11px; color:#666; margin-bottom:4px; font-weight:bold;">Currently Avoiding</div>

      </div>
      <div>
        <div style="font-size:11px; color:#666; margin-bottom:4px; font-weight:bold;">Add Manager to Avoid</div>

  // Build avoid warriors section (per-warrior)
  const avoidWarriors = (w.avoid_warriors || []).filter(aw => aw != null && typeof aw === 'string');
  const avoidableWarriors = (S.challengeTargets || [])
    .filter(ow => {
      if (!ow || !ow.name) return true;
      return !avoidWarriors.some(aw => aw && aw.toLowerCase() === (ow.name || '').toLowerCase());
    })
    .sort((a, b) => {

// Challenge sorting state - stored per warrior
let S_challenge_sort = {}; // { "warrior_name": "column_name" }

function sortChallenges(column) {
  const teamId = S.sel.teamId;
  const wIdx = S.sel.wIdx;
  console.log('sortChallenges called with column:', column, 'teamId:', teamId, 'wIdx:', wIdx);

  if (!teamId || wIdx == null) {
    console.log('No warrior context available');
    return;
  }

  const team = S.teams[teamId];
  if (!team || !team.warriors || !team.warriors[wIdx]) {
    console.log('Could not find warrior');
    return;
  }

  const warrior = team.warriors[wIdx];
  const wName = warrior.name;

  // Get the current sort state for this warrior
  const currentSort = S_challenge_sort[wName];

  // If clicking the same column again, reset to default (tier-ordered)
  // Otherwise, set the new sort column
  if (currentSort === column) {
    delete S_challenge_sort[wName];
    console.log('Clearing sort for warrior:', wName);
  } else {
    S_challenge_sort[wName] = column;
    console.log('Setting sort for warrior:', wName, 'to column:', column);
  }

  // Re-render to apply the new sort
  render();
}

function applyChallengeSort(opponents) {
  const teamId = S.sel.teamId;
  const wIdx = S.sel.wIdx;

  if (!teamId || wIdx == null) return opponents;

  const team = S.teams[teamId];
  if (!team || !team.warriors || !team.warriors[wIdx]) return opponents;

  const warrior = team.warriors[wIdx];
  const wName = warrior.name;
  const sortColumn = S_challenge_sort[wName];

  console.log('applyChallengeSort for warrior:', wName, 'sortColumn:', sortColumn, 'opponents count:', opponents.length);

  // If no sort is active, return in original tier-ordered form
  if (!sortColumn) {
    console.log('No sort active, returning original order');
    return opponents;
  }

  // Clone the array so we don't modify the original
  const sorted = [...opponents];

  sorted.sort((a, b) => {
    let aVal, bVal;

    switch(sortColumn) {
      case 'name':
        aVal = a.name || '';
        bVal = b.name || '';
        break;
      case 'team':
        aVal = a.teamName || '';
        bVal = b.teamName || '';
        break;
      case 'manager':
        aVal = a.managerName || '';
        bVal = b.managerName || '';
        break;
      case 'race':
        aVal = a.race || '';
        bVal = b.race || '';
        break;
      case 'record':
        // Parse "W-L-K" format and sort by wins ascending
        const parseRecord = (rec) => {
          const parts = (rec || '0-0-0').split('-');
          return parseInt(parts[0]) || 0;
        };
        aVal = parseRecord(a.record);
        bVal = parseRecord(b.record);
        // Numeric sort, ascending
        return aVal - bVal;
      case 'tier':
        // Sort by tier level (by TIER_ORDER index)
        const aTierIdx = TIER_ORDER.indexOf(a.tier) >= 0 ? TIER_ORDER.indexOf(a.tier) : 999;
        const bTierIdx = TIER_ORDER.indexOf(b.tier) >= 0 ? TIER_ORDER.indexOf(b.tier) : 999;
        return aTierIdx - bTierIdx;
      case 'recognition':
        aVal = a.recognition || 0;
        bVal = b.recognition || 0;
        // Numeric sort, ascending
        return aVal - bVal;
      default:
        return 0;
    }

    // String sort, ascending
    if (typeof aVal === 'string') {
      return aVal.localeCompare(bVal);
    }
    return 0;
  });

  console.log('Sorted opponents:', sorted.map(o => o.name));
  return sorted;
}

async function initReplacement(teamId, wIdx) {
  const r = await API.get('/api/rollup_single');
  S.replacement = {
    teamId, wIdx,
    base    : r.base,
    adds    : {},
    name    : '',
    race    : 'Human',
    gender  : 'Male',
    rerolled: false,   // one-time re-roll flag
  };
  _rpPersist();
  refreshContent();
}

async function rpReroll() {
  if (!S.replacement || S.replacement.rerolled) return;
  if (!confirm('Re-roll your base stats? This is a one-time option - you will have to build from the new roll regardless of the result.')) return;
  const r = await API.get('/api/rollup_single');
  // Mark rerolled and reset everything except slot identity
  S.replacement.base     = r.base;
  S.replacement.adds     = {};
  S.replacement.rerolled = true;
  _rpSync();
  _rpPersist();
  refreshContent();
}

function rpAdj(key, delta) {
  const rs  = S.replacement;
  if (!rs)  return;
  const bv  = rs.base[key] || 8;
  const cur = rs.adds[key] || 0;
  const cap = Math.min(7, 25 - bv);
  const ptsLeft = 16 - Object.values(rs.adds).reduce((a,v) => a+v, 0);
  if (delta > 0 && (cur >= cap || ptsLeft <= 0)) return;
  if (delta < 0 && cur <= 0) return;
  rs.adds[key] = cur + delta;
  _rpSync(); _rpPersist(); refreshContent();
}

function rpReset() {
  if (!S.replacement) return;
  S.replacement.adds = {};
  _rpSync(); _rpPersist(); refreshContent();
}

function _rpSync() {
  const rs = S.replacement; if (!rs) return;
  const n = el('rp-name');   if (n)  rs.name   = n.value.trim();
  const r = el('rp-race');   if (r)  rs.race   = r.value;
  const g = el('rp-gender'); if (g)  rs.gender = g.value;
}

function _rpPersist() {
  try {
    if (S.replacement) {
      const key = _getReplacementKey(S.replacement.teamId, S.replacement.wIdx);
      localStorage.setItem(key, JSON.stringify(S.replacement));
    }
  } catch(_) {}
}

async function rpSave(teamId, wIdx) {
  _rpSync();
  const rs = S.replacement;
  if (!rs) return;
  const nm = el('rp-name')?.value?.trim() || rs.name;
  if (!nm) { alert('Enter a name for the replacement warrior.'); return; }
  const adds = rs.adds || {};
  const base = rs.base;
  const body = {
    team_id: teamId, warrior_idx: wIdx,
    name: nm.toUpperCase(), race: rs.race, gender: rs.gender,
    strength    : (base.strength     || 8) + (adds.strength     || 0),
    dexterity   : (base.dexterity    || 8) + (adds.dexterity    || 0),
    constitution: (base.constitution || 8) + (adds.constitution || 0),
    intelligence: (base.intelligence || 8) + (adds.intelligence || 0),
    presence    : (base.presence     || 8) + (adds.presence     || 0),
    size        : (base.size         || 8) + (adds.size         || 0),
  };
  try {
    const r = await API.post('/api/warrior/replace', body);
    if (r.success) {
      S.teams[teamId] = r.team;
      const key = _getReplacementKey(teamId, wIdx);
      S.replacement   = null;
      try { localStorage.removeItem(key); } catch(_) {}
      S.sel  = {type:'team', teamId};
      S.wTab = 'stats';
      setMsg('Replacement warrior saved - ' + nm + ' joins the team.', 'ok');
      render();
    } else {
      alert('Error: ' + r.error);
    }
  } catch(e) { alert('Connection error: ' + e.message); }
}

function updateWarriorName(index, value) {
  if (!S.ct) return;
  S.ct.warriors[index].name = value;
  // Keep the right-side editor input in sync if it's the same warrior, without disturbing focus
  if (S.ct.sel === index) {
    const mainInput = document.getElementById('ct-wname');
    if (mainInput && mainInput !== document.activeElement && mainInput.value !== value) {
      mainInput.value = value;
    }
  }
}

function updateCurrentWarriorName(value) {
  if (!S.ct) return;
  const i = S.ct.sel;
  S.ct.warriors[i].name = value;
  // Keep the grid input in sync without disturbing focus
  const gridInput = document.getElementById(`ct-name-${i}`);
  if (gridInput && gridInput !== document.activeElement && gridInput.value !== value) {
    gridInput.value = value;
  }
}
function updateCurrentWarriorRace(value) {
  if (!S.ct) return;
  const i = S.ct.sel;
  S.ct.warriors[i].race = value;
}

function updateCurrentWarriorGender(value) {
  if (!S.ct) return;
  const i = S.ct.sel;
  S.ct.warriors[i].gender = value;
}

const ATTR_KEYS = ['strength','dexterity','constitution','intelligence','presence','size'];
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function final(ct, i, k) { return (ct.warriors[i].base[k]||0) + (ct.adds[i]?ct.adds[i][k]||0:0); }
