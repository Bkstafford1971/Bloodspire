async function doLogin() {
  try {
    const name     = el('l-name')?.value?.trim();
    const pass     = el('l-pass')?.value;
    const remember = el('l-remember')?.checked !== false; // default true
    if (!name || !pass) { setMsg('Please enter your manager name and password.', 'err'); render(); return; }

    // Auto-restore folder access inline so the user doesn't need a separate click.
    if (!S.folderReady && !S.isLocalBackend) {
      try {
        setMsg('Restoring folder access...', ''); render();
        const h = await fsaGetOrPickFolder();
        S.folderHandle    = h;
        S.folderReady     = true;
        S.savedFolderName = h.name;
        // Reload settings from the now-accessible folder (server URL, etc.)
        try {
          const settings = await Store.readSettings();
          if (settings?.server_url) S.serverUrl = settings.server_url;
        } catch (_) {}
        S.msg = '';
      } catch (e) {
        if (e && e.name === 'AbortError') { S.msg = ''; render(); return; }
        setMsg('Could not access save folder: ' + (e.message || e), 'err'); render(); return;
      }
    }

    let r = await API.post('/api/account/login', { manager_name: name, password: pass });

    // If local auth fails and a server URL is set, try authenticating against
    // the league server so users can recover their account on a new machine.
    // Also try window.location.origin as a fallback - remote players connecting
    // via HTTP may have S.serverUrl set to localhost if it wasn't corrected.
    if (!r.success) {
      const candidateUrls = [...new Set([
        S.serverUrl,
        (window.location.protocol !== 'file:' ? window.location.origin : null),
      ].filter(Boolean))];
      if (!candidateUrls.length) { setMsg(r.error || 'Login failed.', 'err'); render(); return; }
      setMsg('No local account found - checking league server...', ''); render();
      try {
        let serverReg = null, base = '';
        for (const candidate of candidateUrls) {
          base = candidate.replace(/\/+$/, '');
          serverReg = await fetch(base + '/api/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ manager_name: name, password: pass }),
          }).then(res => res.json()).catch(() => null);
          if (serverReg?.success) { S.serverUrl = base; break; }
        }
        // /api/register returns the existing manager_id when name+password match

        if (!serverReg?.success) {
          setMsg(serverReg?.error || r.error || 'Login failed.', 'err'); render(); return;
        }

        // Credentials confirmed - download teams from server
        const teamsResp = await fetch(base + '/api/team/get_my_team', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ manager_id: serverReg.manager_id, password: pass }),
        }).then(res => res.json()).catch(() => ({ success: false, teams: [] }));

        // Bootstrap a fresh local account.json from the server data
        const salt    = randomHex(16);
        const pw_hash = await sha256Hex(salt + pass);
        const teamIds = [];
        if (teamsResp?.success && teamsResp.teams?.length) {
          for (const td of teamsResp.teams) {
            if (td.team_id == null) continue;
            await Store.writeTeam(td);
            teamIds.push(td.team_id);
          }
        }
        const account = {
          id:                 serverReg.manager_id,
          manager_name:       serverReg.manager_name || name,
          email:              '',
          salt,
          password_hash:      pw_hash,
          team_ids:           teamIds,
          run_next_turn:      {},
          remember,
          password_plaintext: remember ? pass : '',
        };
        await Store.writeAccount(account);
        S._accountCache = account;

        // Persist league connection
        const settings = await Store.readSettings();
        settings.server_url   = S.serverUrl;
        settings.manager_id   = serverReg.manager_id;
        settings.manager_name = serverReg.manager_name || name;
        settings.password     = pass;
        await Store.writeSettings(settings);
        S.league.url         = S.serverUrl;
        S.league.managerId   = serverReg.manager_id;
        S.league.managerName = serverReg.manager_name || name;
        S.league.password    = pass;
   S.league.lastTurnRan = 0; // Reset for new account

        await idbUpdateMeta({ managerName: name, serverUrl: S.serverUrl, // This will be replaced by _persistAccount
                              rememberMe: remember, password: remember ? pass : '' });

   // S.account.run_next_turn is deprecated, remove it
        S.account = { id: account.id, manager_name: account.manager_name,
                      email: '', team_ids: teamIds };
        S.savedRememberMe = remember;

        const tc = teamIds.length;
        const teamMsg = tc ? `${tc} team${tc > 1 ? 's' : ''} downloaded.`
                           : 'No teams on server yet - create your first team.';
        setMsg(`Account recovered from server. ${teamMsg}`, 'ok');
        S.view = 'main';
        await loadTeams();
        await loadLeagueSettings(); // This will refresh S.league.managerId etc.
        await processDeletedTeams(serverReg.deleted_teams, serverReg.manager_id);
        render();
        await checkLeagueResetOnLogin();
        return;
      } catch (srvErr) {
        setMsg(r.error || 'Login failed.', 'err'); render(); return;
      }
    }

    if (!r.success) { setMsg(r.error, 'err'); render(); return; }

    S.account = {
      id:           r.id,
      manager_name: r.manager_name,
      email:        r.email || '',
      team_ids:     [...new Set(r.team_ids)],
    }
    S.savedRememberMe = remember; // This will be replaced by _persistAccount

    // Persist remember-me choice to account.json
    const acc = await _ensureAccountLoaded();
    if (acc) {
      acc.remember           = remember;
      acc.password_plaintext = remember ? pass : '';
      await _persistAccount(acc);
    }
    // Update client metadata in IDB (survives browser restart) // This will be replaced by _persistAccount
    await idbUpdateMeta({
      managerName: name,
      serverUrl: S.serverUrl,
      rememberMe: remember,
      password: remember ? pass : '',
    });

    // Persist any server URL change from the login screen to settings.json
    const settings = await Store.readSettings();
    if (settings.server_url !== S.serverUrl) {
      settings.server_url = S.serverUrl;
      await Store.writeSettings(settings);
    }
    S.league.url = S.serverUrl;

    S.view = 'main'; S.msg = '';
    await loadTeams();
    await loadLeagueSettings();
    await _loadLegacyTeams();
    // Sync S.account.id with the league manager ID if they differ - the league // This will be replaced by _persistAccount
    // settings ID is server-authoritative; the local account.json may be stale.
    if (S.league.managerId && S.account && S.account.id !== S.league.managerId) {
      S.account.id = S.league.managerId;
      const _syncAcc = await _ensureAccountLoaded();
      if (_syncAcc) { _syncAcc.id = S.league.managerId; await _persistAccount(_syncAcc); }
    }
    render();
    await checkLeagueResetOnLogin(); // This will refresh S.league.managerId etc.
    // r.deleted_teams is never set by the local login handler - fetch from the
    // league server instead so admin-deleted teams are cleaned up on login.
    if (!S.league.password) S.league.password = pass;
    {
      const mid = S.league.managerId || r.id;
      let pendingDeleted = r.deleted_teams;
      if (mid && S.serverUrl && !pendingDeleted?.length) {
        try {
          const base = S.serverUrl.replace(/\/+$/, '');
          const delResp = await fetch(base + '/api/check_deleted_teams', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ manager_id: String(mid) }),
          }).then(res => res.json()).catch(() => null);
          if (delResp?.success) pendingDeleted = delResp.deleted_teams;
        } catch (_) {}
      }
      await processDeletedTeams(pendingDeleted, mid);
    }
  } catch (err) {
    setMsg('Error: ' + (err.message || err), 'err'); render();
  }
}

async function processDeletedTeams(deletedTeams, managerId) {
  if (!deletedTeams || deletedTeams.length === 0) return;

  // Only process teams that are still present in the local account.
  // If the team was already removed (e.g. handled on a previous login), skip
  // the alert but still acknowledge so the server clears its entries.
  const localIds = (S.account?.team_ids || []).map(Number);
  const pending = deletedTeams.filter(d => localIds.includes(Number(d.team_id)));

  if (!pending.length) {
    API.post('/api/acknowledge_deleted_teams', { manager_id: managerId, password: S.league.password }).catch(() => {});
    return;
  }

  let message = "The following teams have been deleted by the host:\n";
  const deletedIds = [];

  for (const deleted of pending) {
    const tid = deleted.team_id;
    const tname = deleted.team_name || `Team ${tid}`;
    message += `- ${tname} (ID: ${tid})\n`;
    deletedIds.push(tid);

    // Delete local team file
    try {
      await Store.deleteTeam(tid);
      console.log(`Client: Deleted local file for team ${tid}`);
    } catch (e) {
      console.error(`Client: Failed to delete local team file ${tid}:`, e);
    }
  }

  // Update S.account.team_ids and persist
  if (S.account && S.account.team_ids) {
    S.account.team_ids = S.account.team_ids.filter(id => !deletedIds.includes(id));
    await _persistAccount(S.account);
  }

  alert(message + "\nYour client will now be updated.");

  // Acknowledge deletion with the server
  await API.post('/api/acknowledge_deleted_teams', { manager_id: managerId, password: S.league.password });

  await loadTeams(); // This will refresh S.teams based on S.account.team_ids
  render();
}

async function doCreateAccount() {
  const name  = el('n-name')?.value?.trim()  || '';
  const email = el('n-email')?.value?.trim() || '';
  const pass  = el('n-pass')?.value          || '';
  const pass2 = el('n-pass2')?.value         || '';

  if (!name)          { setMsg('Manager name is required.', 'err'); render(); return; }
  if (!pass)          { setMsg('Password is required.', 'err'); render(); return; }
  if (pass.length < 4){ setMsg('Password must be at least 4 characters.', 'err'); render(); return; }
  if (pass !== pass2) { setMsg('Passwords do not match.', 'err'); render(); return; }

  try {
    // Step 1 - server-side uniqueness check
    const check = await API.post('/api/check_manager_name', { manager_name: name });
    if (!check || check.available === false) {
      setMsg(check?.error || 'That manager name is already taken. Pick another.', 'err');
      render(); return;
    }

    // Step 2 - register on the league server to get a unique account ID
    const reg = await API.post('/api/register', { manager_name: name, password: pass });
    if (!reg || !reg.success) {
      setMsg(reg?.error || 'Registration failed.', 'err'); render(); return;
    }

    // Step 3 - persist to FSA account.json with a locally-derived hash
    const salt = randomHex(16);
    const pw_hash = await sha256Hex(salt + pass);
    const account = {
      id:            reg.manager_id,
      manager_name:  reg.manager_name,
      email:         email,
      salt:          salt,
      password_hash: pw_hash,
      team_ids:      [],
      run_next_turn: {},
      remember:      true,
      password_plaintext: pass,
    };
    await Store.writeAccount(account);
    S._accountCache = account;
    S.account = { id: account.id, manager_name: account.manager_name, email, team_ids: [] };

    // Update client metadata
    await idbUpdateMeta({
      managerName: name,
      serverUrl: S.serverUrl,
      rememberMe: true,
      password: pass,
    });

    // Step 4 - persist league connection info so upload/download work right away
    const settings = await Store.readSettings();
    settings.server_url    = S.serverUrl;
    settings.manager_id    = reg.manager_id;
    settings.manager_name  = reg.manager_name;
    settings.password      = pass;
    settings.last_turn_ran = 0; // Reset for new account
    await Store.writeSettings(settings);
    S.league.url         = S.serverUrl;
    S.league.managerId   = reg.manager_id;
    S.league.managerName = reg.manager_name;
    S.league.password    = pass;

    S.view = 'main';
    S.msg  = '';
    render();

    // Step 5 - auto-download a fresh random team roll so the user is ready
    // to build their first team right away (matches the design the user described).
    initCreateTeam();
  } catch (err) {
    setMsg('Could not reach the league server: ' + (err.message || err), 'err'); render();
  }
}

/* ============================================================
   SAVE WARRIOR CHANGES
   ============================================================ */
async function doSaveWarrior() {
  // Use _pendingWarrior if available (handles the case where S.sel moved
  // to a different warrior before the 700ms debounce fired).
  const src = _pendingWarrior || S.sel;
  const {teamId, wIdx} = src;
  if (teamId == null || wIdx == null) return;
  // Hard gate: if the stats-tab inputs aren't in the DOM (user moved to a
  // different sub-tab like Fights/Fight Options/Archives while a 700ms
  // auto-save timer was still pending), bail. Otherwise we'd read a bunch of
  // nulls and save `trains: []`, `armor: 'None'`, etc. - wiping the warrior's
  // equipment and training. The switch-warrior path calls flushSave() *before*
  // the DOM is rebuilt, so this guard doesn't interfere with that case.
  if (!el('sel-armor')) { console.debug('[save] skipped - stats-tab DOM not present'); return; }

  // Collect strategies - numbered rows only saved if trigger is set
  const strats = [];
  for (let i = 0; i < 5; i++) {
    const trigger = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="trigger"]`);
    if (!trigger || trigger === 'None') continue;
    const style    = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="style"]`)    || 'Strike';
    const actRaw   = getInputVal(`#strat-body input[data-si="${i}"][data-sf="activity"]`);
    const activity = (actRaw !== '' && actRaw !== null) ? parseInt(actRaw) : 5;
    const aim      = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="aim_point"]`)    || 'None';
    const def      = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="defense_point"]`) || 'None';
    strats.push({trigger, style, activity, aim_point:aim, defense_point:def});
  }
  // D row - trigger is always "Always (Default Loop)" regardless of DOM
  const dStyle    = getSelectVal('#strat-body select[data-si="D"][data-sf="style"]')    || 'Strike';
  const dActRaw   = getInputVal('#strat-body input[data-si="D"][data-sf="activity"]');
  const dActivity = (dActRaw !== '' && dActRaw !== null) ? parseInt(dActRaw) : 5;
  const dAim      = getSelectVal('#strat-body select[data-si="D"][data-sf="aim_point"]')    || 'None';
  const dDef      = getSelectVal('#strat-body select[data-si="D"][data-sf="defense_point"]') || 'None';
  strats.push({trigger:'Always (Default Loop)', style:dStyle, activity:dActivity, aim_point:dAim, defense_point:dDef});

  // Training
  const trains = [
    getSelectVal('#sel-t1'), getSelectVal('#sel-t2'), getSelectVal('#sel-t3')
  ].filter(t => t && t !== '-');

  const w = S.teams[teamId] && S.teams[teamId].warriors[wIdx];
  const challengeMode = w && w.challenge_strategy_enabled || false;

  const body = {
    team_id     : teamId,
    warrior_idx : wIdx,
    armor       : el('sel-armor')?.value||'None',
    helm        : el('sel-helm')?.value||'None',
    primary_weapon   : el('sel-prim')?.value||'Open Hand',
    secondary_weapon : el('sel-sec')?.value||'Open Hand',
    backup_weapon    : el('sel-bkp')?.value||'None',
    trains,
    challenge_strategy_enabled: challengeMode,
  };

  // Save strategies to the appropriate field based on challenge mode
  if (challengeMode) {
    body.challenge_strategies = strats;
  } else {
    body.strategies = strats;
  }

  try {
    const r = await API.put('/api/warrior', body);
    if (r.success) {
      _pendingWarrior = null;  // clear after successful save
      await reloadTeam(teamId);
      refreshContent();
    } else {
      alert('Save failed: ' + r.error);
    }
  } catch (err) {
    alert('Connection error: ' + err.message);
  }
}

function getSelectVal(selector) { const e = document.querySelector(selector); return e ? e.value : null; }
function getInputVal(selector)  { const e = document.querySelector(selector); return e ? e.value : null; }

async function toggleChallengeStrategy() {
  const checkbox = el('challenge-strat-toggle');
  if (!checkbox) return;
  const enabled = checkbox.checked;
  const {teamId, wIdx} = S.sel;
  if (teamId == null || wIdx == null) return;

  // Flush any pending auto-save FIRST so it runs while the DOM is still in the
  // current mode. If we don't do this, the timer might fire during our API.put
  // yield, call reloadTeam(), and replace S.teams[teamId] with a stale disk
  // version — making our in-memory flag set a no-op on an orphaned object.
  if (_saveTimer) await flushSave();

  // Get a FRESH warrior reference after the flush (flushSave → doSaveWarrior
  // → reloadTeam may have replaced S.teams[teamId] with a new object).
  const w = S.teams[teamId] && S.teams[teamId].warriors[wIdx];
  if (!w) return;

  // Set in-memory flag on the current (non-orphaned) warrior object.
  w.challenge_strategy_enabled = enabled;

  // Persist the flag to disk.
  await API.put('/api/warrior', {
    team_id: teamId,
    warrior_idx: wIdx,
    challenge_strategy_enabled: enabled,
  });

  // Reload from disk so S.teams reflects what was just written.
  // Without this, a subsequent doSaveWarrior → reloadTeam could read the old
  // disk version and reset the flag back to false in S.teams.
  await reloadTeam(teamId);

  refreshContent();
}

// Debounced auto-save: any change schedules a save 700ms later.
// _pendingWarrior tracks which warrior the pending save belongs to,
// so navigation to a different warrior flushes the right data first.
let _saveTimer      = null;
let _pendingWarrior = null;  // {teamId, wIdx} of the pending save

function scheduleAutoSave() {
  // Record which warrior this save belongs to
  if (S.sel && S.sel.type === 'warrior') {
    _pendingWarrior = {teamId: S.sel.teamId, wIdx: S.sel.wIdx};
  }
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(doSaveWarrior, 700);
}

function fillAllTrains(slot) {
  const val = el(`sel-t${slot}`)?.value;
  if (val === null || val === undefined) return;
  ['sel-t1', 'sel-t2', 'sel-t3'].forEach(id => {
    const s = el(id);
    if (s) s.value = val;
  });
  scheduleAutoSave();
}

// Flush any pending save immediately (called before navigation)
async function flushSave() {
  if (!_saveTimer) return;
  clearTimeout(_saveTimer);
  _saveTimer = null;
  await doSaveWarrior();
}

async function doSaveTemplate() {
  const name = el('template-name-input')?.value?.trim();
  if (!name) { alert('Please enter a template name'); return; }

  const w = S.sel && S.sel.type === 'warrior' ? S.teams[S.sel.teamId].warriors[S.sel.wIdx] : null;
  if (!w) { alert('No warrior selected'); return; }

  try {
    // Ensure directory exists
    const dirRes = await window.electronAPI.ensureDir(TEMPLATES_DIR);
    if (!dirRes.success) throw new Error('Failed to create templates directory');

    // Collect strategies (same logic as doSaveWarrior)
    const strats = [];
    for (let i = 0; i < 5; i++) {
      const trigger = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="trigger"]`);
      if (!trigger || trigger === 'None') continue;
      const style    = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="style"]`) || 'Strike';
      const actRaw   = getInputVal(`#strat-body input[data-si="${i}"][data-sf="activity"]`);
      const activity = (actRaw !== '' && actRaw !== null) ? parseInt(actRaw) : 5;
      const aim      = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="aim_point"]`) || 'None';
      const def      = getSelectVal(`#strat-body select[data-si="${i}"][data-sf="defense_point"]`) || 'None';
      strats.push({trigger, style, activity, aim_point:aim, defense_point:def});
    }
    // D row
    const dStyle    = getSelectVal('#strat-body select[data-si="D"][data-sf="style"]') || 'Strike';
    const dActRaw   = getInputVal('#strat-body input[data-si="D"][data-sf="activity"]');
    const dActivity = (dActRaw !== '' && dActRaw !== null) ? parseInt(dActRaw) : 5;
    const dAim      = getSelectVal('#strat-body select[data-si="D"][data-sf="aim_point"]') || 'None';
    const dDef      = getSelectVal('#strat-body select[data-si="D"][data-sf="defense_point"]') || 'None';
    strats.push({trigger:'Always (Default Loop)', style:dStyle, activity:dActivity, aim_point:dAim, defense_point:dDef});

    // Build template object
    const template = {
      name,
      armor: el('sel-armor')?.value || 'None',
      helm: el('sel-helm')?.value || 'None',
      primary_weapon: el('sel-prim')?.value || 'Open Hand',
      secondary_weapon: el('sel-sec')?.value || 'Open Hand',
      backup_weapon: el('sel-bkp')?.value || 'None',
      strategies: strats
    };

    // Write file
    const filePath = `${TEMPLATES_DIR}/${name}.json`;
    const writeRes = await window.electronAPI.writeJson(filePath, template);
    if (!writeRes.success) throw new Error('Failed to save template');

    el('save-template-modal').remove();
    alert(`Template "${name}" saved successfully!`);

    // Refresh dropdown if it's open
    updateTemplatesDropdown();
  } catch (err) {
    alert('Error saving template: ' + err.message);
  }
}

async function showTemplatesDropdown() {
  const btn = el('templates-btn');
  const dropdownId = 'templates-dropdown';
  const existing = el(dropdownId);

  if (existing) {
    existing.remove();
    return;
  }

  try {
    // Load templates list
    const listRes = await window.electronAPI.listDir(TEMPLATES_DIR);
    const templates = (listRes.success && listRes.files)
      ? listRes.files.filter(f => f.endsWith('.json')).map(f => f.slice(0, -5))
      : [];

    if (!btn) return;
    const rect = btn.getBoundingClientRect();

    // Build dropdown panel
    const dropdown = document.createElement('div');
    dropdown.id = dropdownId;
    dropdown.style.cssText = `position:fixed;top:${rect.bottom}px;left:${rect.left}px;
      background:var(--bg);border:1px solid var(--mid);z-index:8001;
      min-width:200px;max-width:300px;box-shadow:0 2px 8px rgba(0,0,0,0.3);`;

    // Save option
    const saveDiv = document.createElement('div');
    saveDiv.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--mid);cursor:pointer;font-size:11px;display:flex;align-items:center;';
    saveDiv.innerHTML = '💾 Save as Template';
    saveDiv.onclick = () => { dropdown.remove(); saveStrategyTemplate(); };
    dropdown.appendChild(saveDiv);

    // Templates list
    if (templates.length === 0) {
      const emptyDiv = document.createElement('div');
      emptyDiv.style.cssText = 'padding:6px 8px;font-size:11px;color:#888;';
      emptyDiv.textContent = 'No templates saved';
      dropdown.appendChild(emptyDiv);
    } else {
      templates.forEach(tpl => {
        const tplDiv = document.createElement('div');
        tplDiv.style.cssText = 'padding:6px 8px;border-bottom:1px solid #e0e0e0;font-size:11px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;';
        tplDiv.innerHTML = `<span>📂 ${esc(tpl)}</span>`;

        const actionSpan = document.createElement('span');
        actionSpan.style.cssText = 'display:flex;gap:4px;';

        // Load button
        const loadBtn = document.createElement('button');
        loadBtn.style.cssText = 'min-width:0;width:50px;height:18px;font-size:10px;padding:0;background:var(--bg);border:1px solid var(--mid);cursor:pointer;';
        loadBtn.textContent = 'Load';
        loadBtn.onclick = (e) => { e.stopPropagation(); dropdown.remove(); loadTemplate(tpl); };
        actionSpan.appendChild(loadBtn);

        // Delete button
        const delBtn = document.createElement('button');
        delBtn.style.cssText = 'min-width:0;width:20px;height:18px;font-size:9px;padding:0;background:var(--bg);border:1px solid var(--mid);cursor:pointer;color:#c84;font-weight:bold;';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => { e.stopPropagation(); deleteTemplate(tpl); };
        actionSpan.appendChild(delBtn);

        tplDiv.appendChild(actionSpan);
        dropdown.appendChild(tplDiv);
      });
    }

    document.body.appendChild(dropdown);

    // Close dropdown when clicking outside
    const closeHandler = (e) => {
      if (!dropdown.contains(e.target) && e.target !== btn) {
        dropdown.remove();
        document.removeEventListener('click', closeHandler);
      }
    };
    setTimeout(() => document.addEventListener('click', closeHandler), 0);
  } catch (err) {
    alert('Error loading templates: ' + err.message);
  }
}

async function updateTemplatesDropdown() {
  // Refresh dropdown if it's open
  const dropdown = el('templates-dropdown');
  if (dropdown) {
    dropdown.remove();
    showTemplatesDropdown();
  }
}

async function applyTemplate(template) {
  if (!template || !template.strategies) {
    alert('Invalid template');
    return;
  }

  try {
    const includeGear = el('load-template-gear')?.checked ?? true;

    // Apply gear if checked
    if (includeGear) {
      const setSelect = (id, val) => {
        const elem = el(id);
        if (elem) elem.value = val || 'None';
      };
      setSelect('sel-armor', template.armor);
      setSelect('sel-helm', template.helm);
      setSelect('sel-prim', template.primary_weapon);
      setSelect('sel-sec', template.secondary_weapon);
      setSelect('sel-bkp', template.backup_weapon);
    }

    // Apply strategies - separate into numbered rows and D row
    const isDefaultTrigger = t => t === 'Always' || t === 'Always (Default Loop)';
    const dRow = template.strategies.find(s => isDefaultTrigger(s.trigger));
    const numRows = template.strategies.filter(s => !isDefaultTrigger(s.trigger));

    // Apply numbered rows (0-4)
    for (let i = 0; i < 5; i++) {
      const s = numRows[i] || { trigger:'', style:'', activity:'', aim_point:'', defense_point:'' };

      const setSelect = (selector, val) => {
        const elem = document.querySelector(selector);
        if (elem) elem.value = val || '';
      };
      const setInput = (selector, val) => {
        const elem = document.querySelector(selector);
        if (elem) elem.value = val || '';
      };

      setSelect(`#strat-body select[data-si="${i}"][data-sf="trigger"]`, s.trigger);
      setSelect(`#strat-body select[data-si="${i}"][data-sf="style"]`, s.style);
      setInput(`#strat-body input[data-si="${i}"][data-sf="activity"]`, s.activity);
      setSelect(`#strat-body select[data-si="${i}"][data-sf="aim_point"]`, s.aim_point);
      setSelect(`#strat-body select[data-si="${i}"][data-sf="defense_point"]`, s.defense_point);
    }

    // Apply D row
    if (dRow) {
      const setSelect = (selector, val) => {
        const elem = document.querySelector(selector);
        if (elem) elem.value = val || '';
      };
      const setInput = (selector, val) => {
        const elem = document.querySelector(selector);
        if (elem) elem.value = val || '';
      };

      setSelect('#strat-body select[data-si="D"][data-sf="style"]', dRow.style);
      setInput('#strat-body input[data-si="D"][data-sf="activity"]', dRow.activity);
      setSelect('#strat-body select[data-si="D"][data-sf="aim_point"]', dRow.aim_point);
      setSelect('#strat-body select[data-si="D"][data-sf="defense_point"]', dRow.defense_point);
    }

    el('load-template-modal').remove();
    scheduleAutoSave();
  } catch (err) {
    alert('Error applying template: ' + err.message);
  }
}

async function deleteTemplate(templateName) {
  if (!confirm(`Delete template "${templateName}"?`)) return;

  try {
    const delRes = await window.electronAPI.deleteFile(`${TEMPLATES_DIR}/${templateName}.json`);
    if (!delRes.success) throw new Error('Failed to delete template');
    updateTemplatesDropdown();
  } catch (err) {
    alert('Error deleting template: ' + err.message);
  }
}

async function initCreateTeam(isReplacing) {
  S.view = 'create_team';
  render();

  try {
    if (!S.gd) { 
      const r = await API.get('/api/game_data'); 
      if (r && !r.error) S.gd = r; 
    }
    // Restore from localStorage if in-memory state was lost (e.g. page reload).
    // This prevents players from refreshing the page to get a new set of stat rolls.
    if (!S.ct) {
      try {
        const stored = localStorage.getItem(_ROLLUP_KEY);
        if (stored) S.ct = JSON.parse(stored);
      } catch(_) {}
    }

    if (!S.ct) {
      const r = await API.get('/api/rollup');
      if (!r || r.error || !r.rolls) {
        setMsg('Failed to fetch warrior rollups: ' + (r?.error || 'Check server connection'), 'err');
        S.view = 'main';
        S.replacingTeam = null;
        render();
        return;
      }
      S.ct = {
        teamName : '',
        sel      : 0,
        warriors : r.rolls.map(base => ({ base, name:'', race:'Human', gender:'Male' })),
        adds     : r.rolls.map(() => ({ strength:0, dexterity:0, constitution:0, intelligence:0, presence:0, size:0 })),
        saved    : [false, false, false, false, false],
      };
      // Persist so cancel + page reload doesn't allow a fresh re-roll
      try { localStorage.setItem(_ROLLUP_KEY, JSON.stringify(S.ct)); } catch(_) {}
    }
    S.msg  = '';
  } catch (err) {
    setMsg('Network error: ' + (err.message || 'Check server connection'), 'err');
    S.view = 'main';
    S.replacingTeam = null;
  }
  render();
}

function ctAdjust(key, delta) {
  const ct  = S.ct;
  const i   = ct.sel;
  const cur = ct.adds[i][key] || 0;
  const base= ct.warriors[i].base[key];
  const cap = Math.min(7, 25 - base);
  const ptsUsed = ATTR_KEYS.reduce((a,k) => a + (ct.adds[i][k]||0), 0);
  const ptsLeft = 16 - ptsUsed;

  if (delta > 0 && (cur >= cap || ptsLeft <= 0)) return;
  if (delta < 0 && cur <= 0) return;

  ct.adds[i][key] = cur + delta;
  const nEl = el('ct-wname');
  if (nEl) ct.warriors[i].name = nEl.value;
  render();
}

function doCtReset() {
  const i = S.ct.sel;
  ATTR_KEYS.forEach(k => { S.ct.adds[i][k] = 0; });
  render();
}

function doCtSaveWarrior() {
  const ct = S.ct;
  if (!ct) return;
  const i = ct.sel;
  const rEl  = el('ct-wrace');    if (rEl)  ct.warriors[i].race   = rEl.value;
  const gEl  = el('ct-wgender'); if (gEl)  ct.warriors[i].gender = gEl.value;
  const gNEl = el(`ct-name-${i}`); if (gNEl) ct.warriors[i].name = gNEl.value;
  const nEl  = el('ct-wname');    if (nEl)  ct.warriors[i].name = nEl.value;
  
  // Validate name is not empty
  if (!ct.warriors[i].name || ct.warriors[i].name.trim() === '') {
    alert('Please enter a warrior name before saving.');
    return;
  }
  
  if (!ct.saved) ct.saved = [false,false,false,false,false];
  ct.saved[i] = true;
  render();
}

async function doSaveTeam() {
  const tNameEl = el('ct-team-name');
  if (tNameEl) S.ct.teamName = tNameEl.value.trim();

  doCtSaveWarrior(); 
  const ct = S.ct;

  for (let i = 0; i < 5; i++) {
    const gNEl = el(`ct-name-${i}`);
    if (gNEl) ct.warriors[i].name = gNEl.value.trim();
  }

  const tName = (ct.teamName || '').trim();
  if (!tName) { setMsg('Please enter a team name.', 'err'); render(); return; }
  if (tName.length > 20) { setMsg('Team name must be 20 characters or fewer.', 'err'); render(); return; }

  for (let i = 0; i < 5; i++) {
    const nm = (ct.warriors[i].name||'').trim();
    if (!nm) {
      setMsg(`Warrior ${i+1} needs a name. Click that row and enter one.`, 'err');
      S.ct.sel = i;
      render(); return;
    }
    if (nm.length > 20) {
      setMsg(`Warrior ${i+1}'s name must be 20 characters or fewer.`, 'err');
      S.ct.sel = i;
      render(); return;
    }
  }

  const warriors = ct.warriors.map((w, i) => {
    const a = ct.adds[i] || {};
    return {
      name        : w.name.toUpperCase(),
      race        : w.race,
      gender      : w.gender,
      strength    : w.base.strength    + (a.strength||0),
      dexterity   : w.base.dexterity   + (a.dexterity||0),
      constitution: w.base.constitution+ (a.constitution||0),
      intelligence: w.base.intelligence+ (a.intelligence||0),
      presence    : w.base.presence    + (a.presence||0),
      size        : w.base.size        + (a.size||0),
      armor           : w.armor || 'None',
      helm            : w.helm || 'None',
      primary_weapon  : w.primary_weapon || 'Open Hand',
      secondary_weapon: w.secondary_weapon || 'Open Hand',
      backup_weapon   : w.backup_weapon || null,
    };
  });

  try {
    const r = await API.post('/api/team/create', {
      manager_id  : S.league.managerId || S.account.id,
      password    : S.league.password || '',
      manager_name: S.account.manager_name,
      team_name   : tName,
      warriors,
    });
    
    if (!r.success) { 
        setMsg(r.error || 'Could not create team.', 'err'); 
        render(); 
        return; 
    }

    // Propagate auto-upload from the replaced team so the new team uploads next turn
    const autoUpload = S.replacingTeam ? !!S.replacingTeam.auto_upload : true;
    r.team.auto_upload_enabled = autoUpload;

    // 1. Ensure the 'teams' directory exists before writing
    // If the folder is missing, Store.writeTeam will fail
    await Store.writeTeam(r.team);

    // 2. Load and update the local account file
    let acc = await Store.readAccount();
    if (!acc || !acc.manager_name) acc = JSON.parse(JSON.stringify(S.account));
    
    acc.team_ids = acc.team_ids || [];

    if (S.replacingTeam) {
      const rt = S.replacingTeam;
      const idx = acc.team_ids.indexOf(rt.old_team_id);
      
      if (idx !== -1) acc.team_ids[idx] = r.team_id;
      else acc.team_ids.push(r.team_id);
      
      delete S.teams[rt.old_team_id];
      // Clean up the physical file[cite: 2]
      await Store.deleteTeam(rt.old_team_id);
      
      const sidx = S.account.team_ids.indexOf(rt.old_team_id);
      if (sidx !== -1) S.account.team_ids[sidx] = r.team_id;
      else S.account.team_ids.push(r.team_id);
      
      S.replacingTeam = null;
    } else {
      if (!acc.team_ids.includes(r.team_id)) acc.team_ids.push(r.team_id);
      if (!S.account.team_ids.includes(r.team_id)) S.account.team_ids.push(r.team_id);
    }

    // 3. Persist account and update Global State[cite: 2]
    await Store.writeAccount(acc);
    S.account = acc; 

    // 4. Synchronize memory for immediate strategy editing and uploading[cite: 2]
    S.teams[r.team_id] = r.team;
    S.team = r.team; 
    S.expanded[r.team_id] = true;
    S.sel = { type:'team', teamId: r.team_id };
    
    S.view = 'main';
    S.ct = null;
    try { localStorage.removeItem(_ROLLUP_KEY); } catch(_) {}

    let successMsg = 'Team created and saved locally.';
    if (S.league.managerId) {
      successMsg += ' Remember to click "Action -> Upload" to enter this team into the Arena!';
    }
    setMsg(successMsg, 'ok');
    render();
  } catch (err) {
    // If you see this, the file system failed[cite: 2]
    console.error("Critical Save Error:", err);
    setMsg('Local save failed: ' + (err.message || err), 'err'); 
    render();
  }
}

  bouts.forEach((b, i) => {
    const resColor = b.result==='WIN'  ? '#060'
                   : b.result==='LOSS' ? '#800' : '#555';

    const killedTag  = b.opponent_slain  ? ' <b style="color:#060; font-size:10px;">(KILLED)</b>'   : '';

/* ============================================================
   NARRATIVE OVERLAY
   ============================================================ */
function _damageClass(text) {
  const t = text.toLowerCase();
  // Light - superficial, grazes, nicks, barely connects
  if (/superficial|shallow|barely|minor|skim|kisses|merely|beads|sting|prick|lightly|scrapes|nicks|glances|slap|little real harm|little more than|little effect/.test(t))
    return 'nar-damage-light';
  // Heavy - horrific, savage, bone-breaking, devastating
  if (/horrific|terrible|savage|gruesome|brutal|devastating|shattering|violently|gaping|ghastly|erupts|sprays wildly|impales|skewered|ragged|bone-|nearly severing|nearly takes|wide open|ruin|pulps/.test(t))
    return 'nar-damage-heavy';
  // Default - medium
  return 'nar-damage-medium';
}

function narrativeToHtml(text) {
  // The narrative has 3 === separators:
  //   ===1 … ===2  →  matchup header  (NAME vs NAME / team / race)
  //   ===2 … ===3  →  prose + strategy table
  //   after ===3   →  blow-by-blow fight narrative
  const lines = text.split('\n');
  const out   = [];
  let sepCount    = 0;
  let matchupDone = false;
  let inStrat     = false;  // inside the strategy <table>

  // Column positions detected dynamically from the TRIGGER header line.
  // This handles both old saves (32-char trigger column) and new (42-char).
  let _cols = null;

  function detectCols(hdr) {
    const fs  = hdr.indexOf('FIGHTING STYLE');
    const lv  = hdr.indexOf('LEVEL', fs + 14); // skip past 'FIGHTING STY…'
    const aim = hdr.indexOf('AIMING POINT');
    const def = hdr.indexOf('DEFENSE POINT');
    _cols = { fs, lv, aim, def };
  }

  function parseStrat(ln) {
    if (!_cols) return { trigger: ln, style: '', level: '', aim: '', def: '' };
    const { fs, lv, aim, def } = _cols;
    return {
      trigger: ln.slice(0, fs).trim(),
      style:   ln.slice(fs, lv).trim(),
      level:   ln.slice(lv, aim - 2).trim(),  // level is 5 chars; -2 skips the 2-space gap
      aim:     ln.slice(aim, def).trim(),
      def:     ln.slice(def).trim(),
    };
  }

  function closeStrat() {
    if (inStrat) { out.push('</tbody></table>'); inStrat = false; }
  }

  for (const ln of lines) {
    // === separator ─────────────────────────────────────────────────
    if (/^={5,}/.test(ln)) {
      closeStrat();
      sepCount++;
      out.push('<div class="nar-sep"></div>');
      if (sepCount === 1) matchupDone = false;
      continue;
    }

    // ── Section 1: matchup header (===1 … ===2) ────────────────────
    if (sepCount === 1) {
      if (!matchupDone) {
        if (!ln.trim()) { matchupDone = true; out.push('<div style="height:8px"></div>'); continue; }
        const vsIdx = ln.indexOf('   vs   ');
        if (vsIdx >= 0) {
          const L = ln.slice(0, vsIdx).trim();
          const R = ln.slice(vsIdx + 8).trim();

          // Detect line type: warrior name, record, team, manager, or race
          const isRecord = /^\d+[-–]\d+[-–]\d+$/.test(L);
          const isTeam = /^TEAM:\s*/i.test(L);
          const isManager = /^MANAGER:\s*/i.test(L);

          if (isRecord) {
            // Record line - bold + larger
            out.push(`<div class="nar-row"><span class="nar-col-l"><span class="nar-wrec">${esc(L)}</span></span><span class="nar-col-vs"></span><span class="nar-col-r"><span class="nar-wrec">${esc(R)}</span></span></div>`);
          } else if (isTeam || isManager) {
            // Team/Manager lines - bold
            const fw = p => `<strong>${esc(p)}</strong>`;
            out.push(`<div class="nar-row"><span class="nar-col-l">${fw(L)}</span><span class="nar-col-vs"></span><span class="nar-col-r">${fw(R)}</span></div>`);
          } else if (/^[A-Z][A-Z\s']+$/.test(L) || L.includes("'")) {
            // Warrior name line - bold + larger
            out.push(`<div class="nar-row" style="margin:6px 0"><span class="nar-col-l"><span class="nar-wname">${esc(L)}</span></span><span class="nar-col-vs">vs</span><span class="nar-col-r"><span class="nar-wname">${esc(R)}</span></span></div>`);
          } else {
            // Race / other lines - normal formatting
            out.push(`<div class="nar-row"><span class="nar-col-l"><strong>${esc(L)}</strong></span><span class="nar-col-vs"></span><span class="nar-col-r"><strong>${esc(R)}</strong></span></div>`);
          }
        } else {
          out.push(`<div class="nar-line">${esc(ln)}</div>`);
        }
      }
      continue;
    }

    // ── Section 2: prose + strategy table (===2 … ===3) ───────────
    if (sepCount === 2) {
      if (/^-{5,}/.test(ln)) continue; // skip the --- under TRIGGER header

      if (!ln.trim()) { closeStrat(); out.push('<div style="height:6px"></div>'); continue; }

      // Strategy table header - detect column positions first, then parse
      if (/^TRIGGER\s/.test(ln.trim())) {
        detectCols(ln);
        const c = parseStrat(ln);
        inStrat = true;
        out.push(
          `<table class="nar-strat-tbl"><thead><tr>` +
          `<th class="nar-st-trig">${esc(c.trigger)}</th>` +
          `<th class="nar-st-style">${esc(c.style)}</th>` +
          `<th class="nar-st-level">${esc(c.level)}</th>` +
          `<th class="nar-st-aim">${esc(c.aim)}</th>` +
          `<th>${esc(c.def)}</th>` +
          `</tr></thead><tbody>`
        );
        continue;
      }

      // Strategy data rows
      if (inStrat) {
        const c = parseStrat(ln);
        out.push(
          `<tr>` +
          `<td class="nar-st-trig">${esc(c.trigger)}</td>` +
          `<td class="nar-st-style">${esc(c.style)}</td>` +
          `<td class="nar-st-level">${esc(c.level)}</td>` +
          `<td class="nar-st-aim">${esc(c.aim)}</td>` +
          `<td>${esc(c.def)}</td>` +
          `</tr>`
        );
        continue;
      }

      // Prose lines - bold warrior name prefix + any ALL-CAPS items (armor, weapons)
      const pm = ln.match(/^([A-Z][A-Z ']{2,}?)(\s+(?:is |weighs |Has |enters |fights |has |wears |carries |[A-Z][a-z]))/);
      if (pm) {
        const name = pm[1];
        const rest = ln.slice(name.length);
        const restHtml = esc(rest).replace(/\b([A-Z]{2,}(?:[-\s][A-Z]{2,})*)\b/g, '<strong>$1</strong>');
        out.push(`<div class="nar-prose"><strong>${esc(name)}</strong>${restHtml}</div>`);
      } else {
        out.push(`<div class="nar-prose">${esc(ln)}</div>`);
      }
      continue;
    }

    // ── Section 3: fight narrative (after ===3) ────────────────────
    if (sepCount >= 3) {
      if (/^\*\*\*.*\*\*\*$/.test(ln))                                         { out.push(`<div class="nar-event">${esc(ln)}</div>`);   continue; }
      if (/^MINUTE\s+\d+/.test(ln.trim()))                                      { out.push(`<div class="nar-minute">${esc(ln)}</div>`);  continue; }
      if (/SLAIN/.test(ln) || /collapses/i.test(ln)) { out.push(`<div class="nar-line">${esc(ln)}</div>`);   continue; }
      if (/wins/i.test(ln) && (/judge/i.test(ln) || /victory/i.test(ln)))      { out.push(`<div class="nar-win">${esc(ln)}</div>`);     continue; }
      if (/trained/i.test(ln) || /observed/i.test(ln))                         { out.push(`<div class="nar-training">${esc(ln)}</div>`); continue; }
      if (/switches to strategy/i.test(ln))                                     { out.push(`<div style="font-family:'Courier New',monospace; font-size:12px; line-height:1.5; color:#000; font-weight:bold;">${esc(ln)}</div>`); continue; }
      if (/^\s+HP/.test(ln) || /HP:/.test(ln) || /damage/i.test(ln))           { out.push(`<div class="nar-line">${esc(ln)}</div>`);      continue; }
      if (!ln.trim())                                                            { out.push('<br>');                                       continue; }
      // Damage result lines arrive with 3 leading spaces from narrative.py
      if (/^   \S/.test(ln))                                                    { out.push(`<div class="nar-damage-indent">${esc(ln.trim())}</div>`); continue; }
      out.push(`<div class="nar-line">${esc(ln)}</div>`);
    }
  }
  closeStrat();
  return out.join('');
}

async function openNarrative(fightId, turnNum) {
  // 1. Try local save first (for locally-run turns or cached downloads)
  try {
    const r = await API.get(`/api/fight/narrative?id=${fightId}&turn=${turnNum || 0}`);
    if (r.success) {
      S.narrative = { text: r.narrative, title: `Fight #${fightId}` };
      showNarrativeOverlay();
      await _unlockDeathFight(fightId);
      return;
    }
  } catch(e) {}

  // 2. Fetch from league server via API.get (uses S.serverUrl - more reliable
  //    than S.league.url which requires the manager to have logged in).
  //    Both manager_id and password are sent when available so the server can
  //    authenticate and prioritise the player's own result file (correct perspective).
  if (turnNum) {
    try {
      const lg = S.league;
      let qs = `turn=${turnNum}&fight_id=${fightId}`;
      if (lg?.managerId) qs += `&manager_id=${encodeURIComponent(lg.managerId)}`;
      if (lg?.password)  qs += `&password=${encodeURIComponent(lg.password)}`;
      const d = await API.get(`/api/fight_log?${qs}`);
      if (d.success) {
        S.narrative = { text: d.narrative, title: `Fight #${fightId} (Turn ${turnNum})` };
        showNarrativeOverlay();
        await _unlockDeathFight(fightId);
        return;
      }
    } catch(e) {}
  }

  alert('Fight log not available. The narrative may not have been saved for this fight.');
}

async function _unlockDeathFight(fightId) {
  // If this fight killed one of the player's warriors and HideRecord is on,
  // clear the gate flag now that they've read it and unlock the Replacement tab.
  const tid = S.sel?.teamId;
  const team = tid != null ? S.teams[tid] : null;
  if (!team) return;
  let changed = false;
  for (const w of team.warriors || []) {
    if (w && w.death_fight_id_unread === fightId) {
      delete w.death_fight_id_unread;
      changed = true;
    }
  }
  if (changed) {
    await Store.writeTeam(team);
    S.teams[tid] = team;
    // Switch to Replacement tab now that the gate is lifted
    S.wTab = 'replacement';
    render();
  }
}

function closeNarrative() {
  S.narrative = null;
  hideNarrativeOverlay();
}

      // Manager must manually select challenges each turn
      if (S.teams[teamId].challenges) {
        S.teams[teamId].challenges = {};
      }
      S.newsletters = null;     // invalidate newsletter cache
      S.newsletterText = null;  // force fresh load on next view
      S.turnResults = r;
      // Turn advanced - invalidate scout cache so locks clear on next view
      S.scout.loaded     = false;
      S.scout.selections = [];
      S.scout.slotsLeft  = 3;
      S.scout.targets    = null;
      S.scout.report     = null;

  }
  S.running = false;
  render();
}

// Convert ANSI escape sequences in newsletter text to HTML spans so
// bold/colored markers render properly inside a <pre> block. Everything
// outside an ANSI sequence is HTML-escaped to keep the output safe.
function renderNewsletterText(text) {
  if (text == null) return '';
  const ansiRe = /\x1b\[([0-9;]*)m/g;
  let out = '';
  let last = 0;
  let openSpan = false;
  let m;
  while ((m = ansiRe.exec(text)) !== null) {
    out += esc(text.slice(last, m.index));
    if (openSpan) { out += '</span>'; openSpan = false; }
    const codes = m[1].split(';').filter(Boolean);
    if (codes.length && !(codes.length === 1 && codes[0] === '0')) {
      const styles = [];
      if (codes.includes('1')) styles.push('font-weight:bold');
      if (codes.includes('31')) styles.push('color:#8b0000');
      else if (codes.includes('32')) styles.push('color:#060');
      else if (codes.includes('33')) styles.push('color:#a60');
      else if (codes.includes('34')) styles.push('color:#06c');
      else if (codes.includes('35')) styles.push('color:#a0a');
      else if (codes.includes('36')) styles.push('color:#088');
      // Codes 98/99/998/999 are private markers (not real ANSI colors) used
      // only for newsletter headers, so they render larger (and, for 998/999,
      // centered as a block) without affecting the same bold-red code used
      // inline for manager names in tables.
      if (codes.includes('99')) styles.push('font-size:1.15em');
      if (codes.includes('98')) styles.push('font-size:calc(1em + 6px)');
      if (codes.includes('998')) styles.push('font-size:calc(1em + 3px)', 'display:block', 'text-align:center', 'line-height:1.2');
      if (codes.includes('999')) styles.push('font-size:calc(1em + 12px)', 'display:block', 'text-align:center', 'line-height:1.2');
      if (styles.length) {
        out += `<span style="${styles.join(';')}">`;
        openSpan = true;
      }
    }
    last = ansiRe.lastIndex;
  }
  out += esc(text.slice(last));
  if (openSpan) out += '</span>';
  return out;
}

async function redownloadNewsletter() {
  console.log('redownloadNewsletter called');
  const lg = S.league;
  console.log('League settings:', { url: lg?.url, managerId: lg?.managerId });

  if (!lg.url || !lg.managerId) {
    setMsg('Configure league settings first (league URL and manager ID required).', 'err');
    return;
  }

  setMsg('Redownloading newsletter from league server...', 'ok');
  render();
  try {
    // Get the current turn from league settings/config
    console.log('Fetching league settings to get current turn...');
    const settingsResp = await API.get('/api/league_settings');
    console.log('League settings response:', settingsResp);

    // Try to get the turn from account/game state
    let latestTurn = S.league.lastTurnRan || null;
    console.log('Last turn ran from league state:', latestTurn);

    if (!latestTurn) {
      setMsg('Unable to determine current turn. Run a turn or download results first.', 'err');
      return;
    }

    console.log('Latest turn:', latestTurn);

    // Fetch the newsletter for this turn from the league server
    const nlUrl = `${lg.url}/api/newsletter?turn=${latestTurn}`;
    console.log('Fetching from:', nlUrl);
    const nlRes = await fetch(nlUrl);
    console.log('Fetch response status:', nlRes.status);
    const nlData = await nlRes.json();
    console.log('Newsletter data:', nlData);

    if (!nlData.success || !nlData.newsletter) {
      setMsg('Failed to redownload newsletter: ' + (nlData.error || 'Newsletter not available'), 'err');
      return;
    }

    // Save it locally via the API endpoint
    const saveResp = await API.post('/api/newsletter/save', {
      turn: latestTurn,
      text: nlData.newsletter
    });

    if (!saveResp.success) {
      setMsg('Failed to save newsletter: ' + (saveResp.error || 'Unknown error'), 'err');
      return;
    }

    // Clear cache and open newsletter view
    S.newsletters = null;
    S.newsletterText = null;
    S.newsletterTurn = latestTurn;
    setMsg('Newsletter redownloaded and saved successfully.', 'ok');

    // Open the newsletter panel
    await openNewsletter();
  } catch(e) {
    setMsg('Error redownloading newsletter: ' + e.message, 'err');
  }
}

async function openNewsletter() {
  S.sel = {type:'newsletter'};
  S.wTab = 'stats';
  // Always re-fetch the list so newly produced turns appear
  const prevList = S.newsletters || [];
  const r = await API.get('/api/newsletters');
  S.newsletters = r.turns || [];
  const latest = S.newsletters.length ? S.newsletters[S.newsletters.length - 1] : null;
  const prevLatest = prevList.length ? prevList[prevList.length - 1] : null;
  // If a newer turn exists, or nothing is selected, jump to latest
  if (latest && (!S.newsletterTurn || (prevLatest !== null && latest > prevLatest))) {
    S.newsletterTurn = latest;
    S.newsletterText = null;
  }
  if (S.newsletterTurn && !S.newsletterText) {
    await loadNewsletterTurn(S.newsletterTurn);
  }
  refreshContent();
}

async function loadNewsletterTurn(turn) {
  S.newsletterTurn = turn;
  S.newsletterText = null;
  refreshContent();   // show loading state
  const r = await API.get('/api/newsletter?turn=' + turn);
  if (r.success) {
    S.newsletterText = r.text;
  } else {
    S.newsletterText = '(Newsletter not available for turn ' + turn + ')';
  }
  refreshContent();
}

function buildNewsletterPanel() {
  const turns = S.newsletters || [];
  const cur   = S.newsletterTurn;
  const text  = S.newsletterText;

  // Turn selector
  const opts = turns.map(t =>
    `<option value="${t}" ${t===cur?'selected':''}>Turn ${t}</option>`
  ).join('');

  const selector = turns.length
    ? `<select onchange="loadNewsletterTurn(parseInt(this.value))" style="font-size:11px;">${opts}</select>`
    : `<span style="color:#888;font-size:11px;">No newsletters yet - run a turn first.</span>`;

  let body = '';
  if (!turns.length) {
    body = '<div style="padding:20px; color:#666; font-size:11px;">No newsletters available yet. Run a turn or download results first.</div>';
  } else if (text !== null) {
    body = `<pre style="font-family:Courier New,monospace; font-size:11px; line-height:1.5;
                   white-space:pre-wrap; word-wrap:break-word; margin:0; padding:8px;
                   background:#fff; color:#111; overflow:auto; max-height:calc(100vh - 120px);"
       >${renderNewsletterText(text)}</pre>`;
  } else {
    body = '<div style="padding:20px; color:#666; font-size:11px;">Loading...</div>';
  }

  return `
<div style="display:flex; flex-direction:column; height:100%; overflow:hidden;">
  <div style="padding:4px 8px; background:#d4d0c8; border-bottom:1px solid #808080;
              display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
    <b style="font-size:11px;">📜 Arena Newsletter</b>
    ${selector}
    <button style="margin-left:auto; font-size:11px;" onclick="openNewsletter()">↺ Refresh</button>
    <button style="font-size:11px;" onclick="S.sel={type:null};refreshContent()">✕ Close</button>
  </div>
  <div style="flex:1; overflow:auto;">
    ${body}
  </div>
</div>`;
}

async function loadLeagueSettings() {
  try {
    const r = await API.get('/api/league_settings');
    // LocalAPI returns a flat object {url, managerId, managerName, password, ...}
    // (no success/settings wrapper) - update S.league field-by-field.
    if (r) {
      if (r.url)          S.league.url         = r.url;
      if (r.managerId)    S.league.managerId   = r.managerId;
      if (r.managerName)  S.league.managerName = r.managerName;
      if (r.password)     S.league.password    = r.password;
      if (r.lastUpload)   S.league.lastUpload  = r.lastUpload;
      if (r.lastDownload) S.league.lastDownload = r.lastDownload;
      if (r.lastTurnRan)  S.league.lastTurnRan  = r.lastTurnRan;
    }
    
    // Fetch feature flags and last upload timestamp from league server if connected
    if (S.league.url && S.league.managerId) {
      // Fetch feature flags (public, no auth needed)
      try {
        const flagResp = await fetch(S.league.url + '/api/flags');
        if (flagResp.ok) {
          const flagData = await flagResp.json();
          if (flagData.success) {
            S.league.flags = {
              show_favorite_weapon: flagData.show_favorite_weapon || false,
              show_luck_factor:     flagData.show_luck_factor     || false,
              show_max_hp:          flagData.show_max_hp          || false,
            };
            refreshContent();
          }
        }
      } catch(e) { /* silent */ }

      try {
        const statusResp = await fetch(S.league.url + '/api/status');
        if (statusResp.ok) {
          const statusData = await statusResp.json();
          if (statusData.managers) {
            const mgr = statusData.managers.find(m => m.manager_id === S.league.managerId);
            if (mgr && mgr.last_upload_timestamp) {
              // Convert timestamp string (YYYY-MM-DD HH:MM:SS) to toLocaleString() format
              try {
                const uploadDate = new Date(mgr.last_upload_timestamp.replace(' ', 'T'));
                S.league.lastUpload = uploadDate.toLocaleString();
              } catch(e) {
                S.league.lastUpload = mgr.last_upload_timestamp; // fallback to raw string
              }
            }
          }
        }
      } catch(e) { /* silent - don't interrupt if status fetch fails */ }
    }
  } catch(e) {}
}

function _leagueMsg(text, cls) {

  m.textContent = text;
  m.style.display = 'block';
  m.style.background = cls === 'err' ? '#fcc' : '#cfc';

async function doSaveLeagueSettings() {
  const url  = (el('lm-url')?.value  || '').trim().replace(/\/+$/, '');
  const name = (el('lm-name')?.value || '').trim();
  const pw   = (el('lm-pw')?.value   || '').trim();
  if (!url)  { _leagueMsg('Server URL is required.', 'err'); return; }
  if (!name) { _leagueMsg('Manager name is required.', 'err'); return; }

  // First-time: auto-register with the league server before saving
  if (!S.league.managerId) {
    if (!pw) { _leagueMsg('Password is required for first-time registration.', 'err'); return; }
    _leagueMsg('Registering with league server...', 'ok');
    try {
      const r = await fetch(url + '/api/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({manager_name: name, password: pw})
      });
      const d = await r.json();
      if (!d.success) { _leagueMsg('Registration failed: ' + d.error, 'err'); return; }
      S.league.managerId   = d.manager_id;
      S.league.managerName = d.manager_name;
      S.league.password    = pw;
      S.league.url         = url;
    } catch(e) { _leagueMsg('Could not reach league server: ' + e.message, 'err'); return; }
  } else {
    S.league.url         = url;
    S.league.managerName = name;
    if (pw) S.league.password = pw;
  }

  // Save to local file so it survives page reload
  try {
    await API.post('/api/league_settings', {
      manager_name: S.account?.manager_name || S.league.managerName || '',
      url,
      managerId  : S.league.managerId,
      managerName: S.league.managerName,
      password   : S.league.password || '',
    });
    _leagueMsg(
      S.league.managerId
        ? '✓ Registered as ' + S.league.managerName + ' - settings saved.'
        : 'Settings saved.',
      'ok'
    );
    setTimeout(() => { el('league-modal')?.remove(); render(); }, 900);
  } catch(e) { _leagueMsg('Could not save settings: ' + e.message, 'err'); }
}

async function doLeagueRegister() {
  const url  = (el('lm-url')?.value  || '').trim().replace(/\/+$/, '');
  const name = (el('lm-name')?.value || '').trim();
  const pw   = (el('lm-pw')?.value   || '').trim();
  if (!url || !name || !pw) { _leagueMsg('URL, manager name and password are all required.', 'err'); return; }
  _leagueMsg('Registering...', 'ok');
  try {
    const r = await fetch(url + '/api/register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({manager_name: name, password: pw})
    });
    const d = await r.json();
    if (d.success) {
      S.league.url = url; S.league.managerId = d.manager_id;
      S.league.managerName = d.manager_name; S.league.password = pw;
      await API.post('/api/league_settings', {manager_name: S.account?.manager_name || name, url, managerId: d.manager_id, managerName: d.manager_name, password: pw});
      // Sync account.json so S.account.id matches the server-assigned manager ID
      const _acc = await _ensureAccountLoaded();
      if (_acc && _acc.id !== d.manager_id) {
        _acc.id = d.manager_id;
        await _persistAccount(_acc);
        if (S.account) S.account.id = d.manager_id;
      }
      _leagueMsg('Registered! Manager ID: ' + d.manager_id, 'ok');
      setTimeout(() => { el('league-modal')?.remove(); render(); }, 1200);
    } else { _leagueMsg('Error: ' + d.error, 'err'); }
  } catch(e) { _leagueMsg('Could not reach league server: ' + e.message, 'err'); }
}

async function doLeagueUpload(teamId) {
  // Flush any pending warrior save so challenge strategies are persisted before upload
  await flushSave();

  const lg = S.league;

  // 1. Validation: Ensure required settings exist before attempting connection
  if (!lg.url || !lg.managerId) {
    setMsg('Configure league settings first (Action → League Settings).', 'err');
    render();
    return;
  }

  // 2. Security: Ensure password is present or prompted
  const pw = lg.password || prompt('League password:');
  if (!pw) return;
  lg.password = pw;

  setMsg('Reading local team data...', 'ok'); 
  render();

  try {
    // 3. Use in-memory team state as the upload source so that fields like
    // challenge_strategy_enabled always reflect what the user configured in
    // the current session, even if an async disk write is still in flight.
    // Fall back to disk only when the team isn't loaded in memory.
    let teamData = null;
    if (S.teams && S.teams[teamId]) {
      teamData = JSON.parse(JSON.stringify(S.teams[teamId]));
    } else {
      teamData = await Store.readTeam(teamId);
    }

    if (!teamData || !teamData.warriors || teamData.warriors.length === 0) {
      setMsg('Upload aborted: No warrior data found in local file.', 'err');
      render();
      return;
    }

    setMsg('Connecting to Arena server...', 'ok'); 
    render();

    // 4. URL Sanitization: Remove trailing slashes to prevent malformed API paths
    const baseUrl = lg.url.endsWith('/') ? lg.url.slice(0, -1) : lg.url;
    
    // 5. Network Request: Send the bundle to the server
    const r = await fetch(`${baseUrl}/api/upload`, {
      method: 'POST', 
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        manager_id: lg.managerId, 
        password: pw, 
        team: teamData 
      })
    });

    if (!r.ok) throw new Error(`Server returned status ${r.status}`);

    const d = await r.json();
    
    if (d.success) {
      // 6. Update Client State: Track the successful upload locally
      lg.uploaded = true;
      lg.lastUpload = new Date().toLocaleString();
      
      await API.post('/api/league_settings', {
        manager_name: S.account?.manager_name || lg.managerName || '',
        url: lg.url, 
        managerId: lg.managerId, 
        managerName: lg.managerName, 
        password: lg.password,
        lastUpload: lg.lastUpload, 
        lastDownload: lg.lastDownload, 
        lastTurnRan: lg.lastTurnRan,
      });
      
      setMsg('✓ Success! Your roster is now live in the Arena.', 'ok');
    } else { 
      setMsg('Server Error: ' + (d.error || 'The server rejected the data.'), 'err'); 
    }
  } catch(e) { 
    setMsg('Connection Failed: Check your League URL and server status.', 'err'); 
    console.error("Upload failure details:", e);
  }
  
  render();
}

async function doLeagueDownloadAll() {
  const lg = S.league;
  if (!lg.url || !lg.managerId) { setMsg('Configure league settings first.', 'err'); return; }
  const pw = lg.password || prompt('League password:');
  if (!pw) return;
  lg.password = pw;

  _showDownloadProgress(_DL_STEPS, 0, null);
  const tick = (i) => _showDownloadProgress(_DL_STEPS, i, null);
  const fail = (msg, i) => _showDownloadProgress(_DL_STEPS, i, msg);

  try {
    // ── Step 1-2: Connect directly to league server from the browser ──────
    // This bypasses the Python proxy entirely - no urllib timeout possible.
    tick(1); await new Promise(r => setTimeout(r, 60));
    tick(2); await new Promise(r => setTimeout(r, 60));
    tick(3); // Authenticating + fetching

    const resultsUrl = `${lg.url}/api/results` +
      `?manager_id=${encodeURIComponent(lg.managerId)}` +
      `&password=${encodeURIComponent(pw)}`;

    let resultsResp;
    try {
      const ctrl = new AbortController();
      const tmo  = setTimeout(() => ctrl.abort(), 120000); // 2 min timeout
      const res  = await fetch(resultsUrl, {signal: ctrl.signal});
      clearTimeout(tmo);
      resultsResp = await res.json();
    } catch(e) {
      const msg = e.name === 'AbortError'
        ? 'League server did not respond within 2 minutes. Is the turn still running? Try again shortly.'
        : 'Could not reach league server: ' + e.message;
      fail(msg, 3); return;
    }
    if (!resultsResp.success) {
      fail(resultsResp.error || 'Server returned an error.', 3); return;
    }

    if (resultsResp.already_current) {
      _showDownloadProgress(_DL_STEPS, _DL_STEPS.length, null);
      const dlModal = document.getElementById('dl-progress-modal');
      if (dlModal) {
        const footer = dlModal.querySelector('div[style*="color:#060"]') || dlModal.querySelector('div[style*="color:#555"]');
        if (footer) footer.textContent = `Turn ${resultsResp.turn} already downloaded - nothing new to apply.`;
      }
      return;
    }

    const turnNum    = resultsResp.turn;
    const teamResults= resultsResp.results || (resultsResp.result ? [resultsResp.result] : []);
    if (!teamResults.length && !resultsResp.has_newsletter) {
      fail('No results returned from server.', 3); return;
    }

    // ── Step 4: Apply each result locally via gui_server ──────────────────
    tick(4);
    const applied = []; const missed = [];

    // Build local name→id map from known teams
    const nameToId = {};
    Object.values(S.teams || {}).forEach(t => {
      if (t && t.team_name) nameToId[t.team_name.toLowerCase()] = t.team_id;
    });

    for (const result of teamResults) {
      // Match by team_id first, then team_name
      let localTid = null;
      const serverTid = result.team_id;
      const knownIds  = S.account?.team_ids || Object.keys(S.teams||{}).map(Number);
      if (serverTid && knownIds.includes(Number(serverTid))) {
        localTid = Number(serverTid);
      } else {
        localTid = nameToId[(result.team_name||'').toLowerCase()] || null;
      }

      if (!localTid) {
        missed.push(result.team_name || 'Unknown');
        continue;
      }

      const app = await API.post('/api/apply_league_results', {
        team_id: localTid, result, rerun: !!S._pendingRerun,
      });
      if (app.success) {
        console.log(`Successfully applied results for team ${localTid}`);
        S.teams[localTid] = app.team;
        applied.push({ team_id: localTid, team_name: result.team_name || '?',
                       bouts: app.bouts, team: app.team });
      } else {
        missed.push(`${result.team_name || '?'}: ${app.error || '?'}`);
      }
    }

    tick(5); await new Promise(r => setTimeout(r, 50)); // Saving fight data

    // ── Step 6: Fetch newsletter directly from league server ──────────────
    tick(6);
    let newsletterSaved = false;
    if (resultsResp.has_newsletter && turnNum) {
      try {
        const nlUrl  = `${lg.url}/api/newsletter?turn=${turnNum}`;
        const nlRes  = await fetch(nlUrl);
        const nlData = await nlRes.json();
        if (nlData.success && nlData.newsletter) {
          await API.post('/api/newsletter/save', { turn: turnNum, text: nlData.newsletter });
          S.newsletters = null; S.newsletterText = null; S.newsletterTurn = null;
          newsletterSaved = true;
        }
      } catch(e) {
        console.warn('Newsletter fetch failed:', e.message);
      }
    }

    tick(7); await new Promise(r => setTimeout(r, 50)); // Finalising

    if (!applied.length && !resultsResp.has_newsletter) {
      fail('No results matched your local teams.' +
           (missed.length ? ' Unmatched: ' + missed.join(', ') : '') +
           '  Upload your teams first, then ask the host to run the turn.', 3);
      return;
    }

    _showDownloadProgress(_DL_STEPS, _DL_STEPS.length, null);

    // Turn downloaded - invalidate scout and challenge caches so they refresh with updated warrior records
    S.scout.loaded     = false;
    S.scout.selections = [];
    S.scout.slotsLeft  = 3;
    S.scout.targets    = null;
    S.scout.report     = null;
    S.challengeTargets = null;  // Clear challenge targets cache to show updated warrior fight records

    const names  = applied.map(a => a.team_name).join(', ');
    const warn   = missed.length ? `  (${missed.length} unmatched: ${missed.join(', ')})` : '';
    const nlNote = newsletterSaved ? '  Newsletter ready.' : '';
    setMsg(`✓ Turn ${turnNum} downloaded for ${applied.length} team(s): ${names}${warn}${nlNote}`, 'ok');

    // Record download timestamp and turn number
    const lg2 = S.league;
    lg2.lastDownload = new Date().toLocaleString();
    lg2.lastTurnRan  = turnNum;
    await API.post('/api/league_settings', {
      manager_name: S.account?.manager_name || lg2.managerName || '',
      url: lg2.url, managerId: lg2.managerId, managerName: lg2.managerName, password: lg2.password,
      lastUpload: lg2.lastUpload, lastDownload: lg2.lastDownload, lastTurnRan: lg2.lastTurnRan,
    });

    if (applied.length >= 1) {
      S.sel  = {type: 'team', teamId: applied[0].team_id};
      S.wTab = 'fights';
      await processDeletedTeams(resultsResp.deleted_teams, lg.managerId);
    }
    render();

  } catch(e) {
    fail('Unexpected error: ' + e.message, 1);
  }
}

async function setRunNextTurn(teamId, value) {
  const r = await API.post('/api/team/run_next_turn', {
    manager_id: S.account?.id, team_id: teamId, value
  });
  if (r.success && r.team) S.teams[teamId] = r.team;
  // Refresh account tab summary if visible
  if (S.mgrTab === 'account') refreshContent();
}

async function confirmReplaceTeam(teamId) {
  const team = S.teams[teamId];
  const tname = team ? team.team_name : `Team ${teamId}`;
  const wasRunning = team ? !!team.auto_upload_enabled : true;

  if (!confirm(`Replace "${tname}"?\n\nAll current warriors will be archived.\nYou will create a new team in this slot.`)) return;
  
  setMsg('Preparing replacement slot...', 'ok'); 
  render();
  S.ct = null;
  try { localStorage.removeItem(_ROLLUP_KEY); } catch(_) {} // force fresh rollups for replacement
  
  const r = await API.post('/api/team/replace', {
    manager_id: S.account.id,
    old_team_id: teamId,
  });
  
  if (!r.success) { 
    alert('Error: ' + r.error); 
    return; 
  }

  // Remove the old team from run_next_turn tracking
  if (S.runNextTurn) delete S.runNextTurn[teamId];
  
  await API.post('/api/team/run_next_turn', {
    manager_id: S.account.id, 
    team_id: teamId, 
    value: false,
  });

  // Withdraw the old team from the league server. If credentials are missing
  // or the call fails, leave the archive un-flagged so uploadAllTeams retries it later.
  if (S.league.url && S.league.managerId && S.league.password) {
    try {
      const wr = await API.post('/api/team/withdraw', {
        manager_id: Number(S.league.managerId),
        password:   S.league.password,
        team_id:    Number(teamId)
      });
      if (wr.success) {
        const arch = await Store.readArchivedTeam(teamId);
        if (arch) {
          arch.withdrawn_from_league = true;
          await Store.writeArchivedTeam(teamId, arch);
        }
      } else {
        console.warn('League withdraw failed:', wr.error);
      }
    } catch (e) { console.warn('Withdraw error:', e); }
  }

  // Store replacement context and trigger new team creation
  S.replacingTeam = { 
    old_team_id: teamId, 
    new_team_id: r.new_team_id, 
    manager_id: S.account.id,
    auto_upload: wasRunning
  };
  S.legacyTeams = null; // invalidate so Legacy tab reloads on next visit
  setMsg('', '');
  
  // Start creating a new team as replacement
  initCreateTeam();
}


async function runAllTeams() {
  const ids = (S.account?.team_ids || []).filter(tid => S.runNextTurn[tid] !== false);
  if (!ids.length) { setMsg('No teams have "Run This Turn" checked.', 'err'); return; }
  setMsg(`Running ${ids.length} team(s)...`, 'ok'); render();
  const r = await API.post('/api/run_all_turns', {
    manager_id: S.account.id,
    team_ids: ids,
  });
  if (!r.success) { setMsg('Error: ' + r.error, 'err'); return; }
  // Reload all teams
  for (const res of r.results || []) {
    if (res.success) {
      const t = await API.get('/api/team?id=' + res.team_id);
      if (t.success) {
        S.teams[res.team_id] = t.team;
        // Clear challenges after turn completes (prevents autopilot grinding)
        if (S.teams[res.team_id].challenges) {
          S.teams[res.team_id].challenges = {};
        }
      }
    }
  }
  const wins  = (r.results||[]).reduce((a,x)=>a+(x.bouts||[]).filter(b=>b.result==='WIN').length,0);
  const total = (r.results||[]).reduce((a,x)=>a+(x.bouts||[]).length,0);
  setMsg(`Turn ${r.turn_number} complete - ${wins}W/${total-wins}L across ${ids.length} team(s).`, 'ok');
  S.sel = {type: null};
  S.scout.loaded     = false;
  S.scout.selections = [];
  S.scout.slotsLeft  = 3;
  S.scout.targets    = null;
  S.scout.report     = null;
  render();
}
