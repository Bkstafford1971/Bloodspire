name: Playtest Report
description: Submit a bug or feature request for the simulation
title: "[REPORT]: "
labels: ["playtest"]
body:
  - type: input
    id: manager_name
    attributes:
      label: Manager Name
      placeholder: "Enter your manager name"
    validations:
      required: true
  - type: input
    id: team_name
    attributes:
      label: Team Name
      placeholder: "e.g., The Iron Suns"
    validations:
      required: true
  - type: input
    id: warrior_names
    attributes:
      label: Warrior Name(s)
      placeholder: "e.g., Theron, Valerius"
    validations:
      required: true
  - type: input
    id: turn_number
    attributes:
      label: "Turn #"
      placeholder: "e.g., 14"
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Submission Type
      options:
        - Bug
        - Feature Request
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened or what you would like to see added.
      placeholder: "The combat log stopped updating..."
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The warrior should have taken 5 damage and the log should show 'Hit'..."
    validations:
      required: false
  - type: textarea
    id: files
    attributes:
      label: Screenshot/File Upload
      description: You can drag and drop images here or paste them directly from your clipboard.
